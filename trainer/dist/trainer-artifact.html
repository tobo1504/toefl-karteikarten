<title>TOEFL-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: ruhige Lernspalte; im Test eine feste Kopfleiste wie im ETS-Interface, Text links, Frage rechts (breit) bzw. untereinander (Handy) */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f1ee; --ink:#1c2321; --muted:#6c7471; --faint:#9aa19e; --line:#e2e5e1;
  --accent:#2e5e57; --accent-soft:#e6eeec; --mark:#b39a5c; --good:#3f7a5a; --bad:#a5524a;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(28,35,33,.04),0 8px 24px -12px rgba(28,35,33,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:36px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1080px}
h1{font-family:var(--f-display);font-weight:500;font-size:2rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:1.35rem;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;max-width:58ch}
.label{font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Start */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);transition:border-color .15s,box-shadow .15s;min-width:0}
.tile:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.tile[disabled]{cursor:default;opacity:.5;box-shadow:none;border-color:var(--line)}
.tile b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.tile span{font-size:.84rem;color:var(--muted)}
.tile .stat{font:500 .76rem var(--f-mono);color:var(--accent);margin-top:6px}
.group{display:flex;flex-direction:column;gap:12px}
.typelist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.typerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.typerow:last-child{border-bottom:0}
.typerow:hover{background:var(--surface-2)}
.typerow[disabled]{cursor:default;opacity:.45;background:none}
.typerow .t{font-weight:500}
.typerow .d{font-size:.8rem;color:var(--muted)}
.typerow .s{font:500 .76rem var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sect{font:600 .7rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 16px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}

/* Buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 18px;font:500 .92rem var(--f-body);cursor:pointer;transition:border-color .15s,opacity .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.grow{flex:1 1 160px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Testkopf */
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.testbar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.testbar .sec{font:600 .78rem var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.testbar .pos{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.testbar .sp{flex:1}
.testbar .pos{white-space:nowrap}
.navbtns{display:flex;gap:8px}
@media (max-width:640px){
  .testbar-in{gap:8px}
  .testbar .sec{display:none}
  .navbtns{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .navbtns .btn{flex:1}
  body.testing .wrap{padding-bottom:110px}
  .task:not(.single)>.panel:first-child{max-height:46vh;overflow:auto}
}
.timer{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{color:var(--bad)}
.timer.hide{color:transparent;text-shadow:none}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

/* Aufgaben-Layout */
.task{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.task.single{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto;width:100%}
@media (max-width:820px){.task{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 24px 22px;min-width:0}
.passage{font-family:var(--f-display);font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 .9em}.passage p:last-child{margin-bottom:0}
.passage h3{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 12px}
.direction{font:500 .9rem var(--f-body);color:var(--muted);margin-bottom:12px}
.qtext{font-family:var(--f-display);font-size:1.15rem;line-height:1.45;margin:0 0 14px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 .97rem var(--f-body);cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--faint)}
.opt .k{font:600 .78rem var(--f-mono);color:var(--muted);width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{font-size:.88rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qnav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font:500 .8rem var(--f-mono);cursor:pointer}
.qnav button.on{border-color:var(--ink);color:var(--ink)}
.qnav button.done{background:var(--surface-2)}

/* Daily-Life-Texte */
.doc{font-family:var(--f-body);font-size:.95rem;line-height:1.55;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg)}
.doc .dtitle{font-weight:600;margin-bottom:8px}
.doc .mailhead{font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.doc .mailhead b{font-weight:500;color:var(--ink)}
.doc p{margin:0 0 .7em}.doc p:last-child{margin:0}
.doc table{border-collapse:collapse;width:100%;font-size:.88rem}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.doc .tw{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bubble small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}

/* Complete the Words */
.ctw{font-family:var(--f-display);font-size:1.12rem;line-height:2.25}
.gap{display:inline-flex;align-items:baseline;white-space:nowrap}
.gap input{font:500 1rem var(--f-mono);border:0;border-bottom:1.5px solid var(--faint);background:transparent;color:var(--ink);padding:0 2px;margin:0 1px;letter-spacing:.32em;border-radius:0;text-transform:lowercase}
.gap input:focus{outline:none;border-color:var(--ink);background:var(--surface-2)}
.gap input.ok{border-color:var(--good);color:var(--good)}
.gap input.no{border-color:var(--bad);color:var(--bad)}
.gap .sol{font:500 .78rem var(--f-mono);color:var(--good);margin-left:4px}

/* Build a Sentence */
.speaker{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 .8rem var(--f-body);flex:none}
.say{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-size:1.1rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:14px}
.slot{min-width:56px;height:36px;border-bottom:1.5px solid var(--faint);display:inline-flex;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:500 .95rem var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip.used{visibility:hidden}
.slots .chip{background:var(--surface-2);border-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.punct{font-family:var(--f-display);font-size:1.1rem}

/* Schreiben */
.prompt-box{font-size:.95rem}
.prompt-box ul{margin:8px 0 0;padding-left:20px}
.post{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:0}
.post .who{font-weight:600;font-size:.88rem}
.post p{margin:4px 0 0;font-size:.95rem}
textarea.write{width:100%;box-sizing:border-box;min-height:300px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:16px;font:400 1rem/1.6 var(--f-body);resize:vertical}
textarea.write:focus{outline:none;border-color:var(--ink)}
.wc{font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* Ergebnisse */
.bandrow{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bandrow>div{flex:1;padding:14px 8px;text-align:center;min-width:0}
.bandrow>div+div{border-left:1px solid var(--line)}
.big{font:500 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column}
.ritem{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:10px}
.ritem .m{font-weight:700}.ritem .m.ok{color:var(--good)}.ritem .m.no{color:var(--bad)}
.ritem .q{font-size:.92rem}.ritem .a{font-size:.85rem;color:var(--muted)}
.evalbox{display:flex;flex-direction:column;gap:12px}
.score5{display:flex;align-items:baseline;gap:10px}
.errs{display:flex;flex-direction:column}
.err{padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.err s{color:var(--bad);text-decoration-thickness:1px}
.err .fix{color:var(--good)}
.err .r{color:var(--muted);font-size:.84rem}
.improved{font-family:var(--f-display);font-size:1.02rem;line-height:1.65;background:var(--surface-2);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
table.hist{border-collapse:collapse;width:100%;font-size:.88rem}
table.hist th{font:600 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left}
table.hist th,table.hist td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist td.n,table.hist th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.code{width:100%;box-sizing:border-box;font:400 .76rem var(--f-mono);background:var(--surface-2);color:var(--ink);border:0;border-radius:10px;padding:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
<div id="app"></div>
<script>
const DATA={"reading":{"ctw":[{"id":"ctw01","level":2,"text":"Scientists have long suspected that sleep plays an important role in learning. During de{ep} sleep, t{he} brain rep{lays} information th{at} was gath{ered} during t{he} day a{nd} moves i{t} from temp{orary} to perm{anent} storage. In one experiment, students who slept after studying remembered more words than students who stayed awake. Researchers believe that certain brain waves help strengthen the connections between neurons. This may explain why students who sleep poorly often struggle in exams."},{"id":"ctw02","level":1,"text":"Public libraries offer much more than books. Many o{f} them le{nd} laptops, cam{eras}, and ev{en} musical instr{uments} to th{eir} members. So{me} libraries al{so} run fr{ee} classes o{n} topics such as cooking, coding, and personal finance. Because these services cost nothing, they are especially helpful for families with small budgets. In many towns, the library has become a meeting place where people of all ages can study, work, or simply relax."},{"id":"ctw03","level":3,"text":"Cities are often several degrees warmer than the surrounding countryside. This pheno{menon}, known a{s} the ur{ban} heat isl{and} effect, ari{ses} because asp{halt} and conc{rete} absorb so{lar} radiation dur{ing} the d{ay} and release it slowly at night. The scarcity of vegetation intensifies the problem, since plants cool their surroundings through evaporation. Municipal planners increasingly counteract the effect by installing reflective roofing materials and expanding green spaces, measures that can substantially reduce energy consumption during summer heat waves."},{"id":"ctw04","level":2,"text":"Honeybees have a remarkable way of sharing information. When a wor{ker} bee disc{overs} a go{od} source o{f} food, i{t} returns t{o} the hi{ve} and perf{orms} a spe{cial} dance. T{he} direction of the dance shows other bees which way to fly, while its length indicates how far away the flowers are. Scientists first described this behavior many decades ago, and later studies confirmed that bees can follow these instructions with surprising accuracy."},{"id":"ctw05","level":1,"text":"More people are riding bicycles to work than ever before. In ma{ny} cities, n{ew} bike la{nes} make t{he} trip sa{fer} and fas{ter}. Cycling i{s} cheap, a{nd} it al{so} helps peo{ple} stay fit without going to a gym. Some companies even pay workers a small bonus for leaving their cars at home. However, bad weather and long distances still keep many commuters from making the switch."},{"id":"ctw06","level":3,"text":"The placebo effect remains one of the most intriguing phenomena in medicine. Patients w{ho} receive a{n} inactive subs{tance} sometimes rep{ort} genuine improv{ements} in th{eir} symptoms, partic{ularly} when t{he} condition invo{lves} pain o{r} anxiety. Researchers attribute this response to expectation, which appears to trigger the release of natural chemicals in the brain. Consequently, clinical trials must compare new drugs against placebos rather than against no treatment at all, ensuring that observed benefits exceed those produced by belief alone."}],"daily":[{"id":"d01","level":2,"genre":"notice","title":"Library notice","text":"# Notice to All Library Users\nThe second floor of Hartwell Library will be closed from March 4 to March 18 while new study rooms are built.\nDuring this time, the group study area will move to Room 105 on the first floor. Printers from the second floor have been relocated next to the main desk on the first floor.\nBooks from the second-floor collection can still be requested online and picked up within 24 hours. We apologize for the inconvenience.","questions":[{"q":"What is the main purpose of the notice?","options":["To inform users about a temporary closure","To ask users to return books early","To announce new library opening hours","To advertise study rooms that can be rented"],"answer":0,"why":"Der Aushang kündigt an, dass der 2. Stock vom 4. bis 18. März geschlossen ist."},{"q":"According to the notice, how can users get books from the second floor during the closure?","options":["By waiting until March 18","By requesting them online","By asking a librarian on the second floor","By going to Room 105"],"answer":1,"why":"„Books … can still be requested online and picked up within 24 hours.“"},{"q":"The word \"relocated\" in the notice is closest in meaning to","options":["replaced","removed","moved","repaired"],"answer":2,"why":"relocate = an einen anderen Ort bringen."}]},{"id":"d02","level":2,"genre":"email","title":"Team lunch","text":"From: Dana Whitfield\nTo: All Marketing Staff\nSubject: Friday's team lunch\nHi everyone,\nJust a reminder that our team lunch is this Friday at 12:30 at Rosa's Kitchen on Elm Street. The restaurant has asked for final numbers by Wednesday, so please reply to this email if you haven't already.\nVegetarian and gluten-free options are available, but let me know about any other dietary needs. The company will cover the cost of meals, though drinks other than water and soft drinks will not be reimbursed.\nThanks,\nDana","questions":[{"q":"What does Dana ask the staff to do?","options":["Bring food to the office on Friday","Choose a restaurant for the lunch","Pay for their meals in advance","Confirm whether they are coming by Wednesday"],"answer":3,"why":"Das Restaurant braucht bis Mittwoch die finale Zahl – wer noch nicht geantwortet hat, soll antworten."},{"q":"What is indicated about drinks?","options":["Employees must pay for some drinks themselves","The company will pay for all drinks","Only water will be served","Drinks must be ordered by Wednesday"],"answer":0,"why":"Getränke außer Wasser und Softdrinks werden nicht erstattet."}]},{"id":"d03","level":2,"genre":"chat","title":"Study session","text":"Maya: Hey, are you still coming to the study session tonight?\nJordan: Yes, but I might be 15 minutes late. My lab runs until 7.\nMaya: No problem. We moved it to the third-floor lounge, by the way. The library was packed.\nJordan: Good to know. Should I bring anything?\nMaya: If you still have the practice problems from last week, bring those. Nobody else saved them.","questions":[{"q":"Why will Jordan be late?","options":["The library is too crowded.","His lab ends at 7.","He has to find the practice problems.","He forgot about the session."],"answer":1,"why":"„My lab runs until 7.“"},{"q":"Why did the group change the location of the session?","options":["The lounge has better equipment.","The library closes early.","The library was too full.","Jordan asked them to."],"answer":2,"why":"„The library was packed.“ – packed = überfüllt."},{"q":"What does Maya ask Jordan to bring?","options":["A copy of the textbook","Notes from his lab","Snacks for the group","Practice problems from the previous week"],"answer":3,"why":"„If you still have the practice problems from last week, bring those.“"}],"me":"Jordan"},{"id":"d04","level":2,"genre":"menu","title":"Café specials","text":"# Green Fork Café – Weekday Lunch Specials\nItem | Price\nSoup of the day | $4.50\nGrilled chicken wrap | $8.75\nQuinoa salad bowl | $9.25\nCombo: any half sandwich + soup | $9.00\nSpecials are served Monday through Friday from 11:00 a.m. to 2:30 p.m. Show a valid student ID to receive 10% off any combo.\nOnline orders placed before 10:30 a.m. are guaranteed to be ready by noon.","questions":[{"q":"How much would a student with a valid ID pay for the combo?","options":["$8.10","$9.90","$8.75","$9.00"],"answer":0,"why":"10 % Rabatt auf $9.00 = $8.10."},{"q":"What is true about online orders?","options":["They must be paid for in cash.","Orders placed early will be ready by midday.","They are delivered to campus.","They are only available for combos."],"answer":1,"why":"Vor 10:30 bestellt = garantiert bis 12 Uhr fertig."},{"q":"When can a customer NOT order the specials?","options":["On Friday at 11:30 a.m.","On Monday at 2:00 p.m.","On Saturday at noon","On Tuesday at 1:00 p.m."],"answer":2,"why":"Die Specials gibt es nur Montag bis Freitag."}]},{"id":"d05","level":2,"genre":"post","title":"Garden volunteers","text":"# Riverside Community Garden\nPosted by Riverside Garden Club\nVolunteers needed! This Saturday from 9 a.m. to noon we'll be preparing the beds for spring planting. No experience necessary – we'll provide gloves and tools. Just wear clothes you don't mind getting dirty.\nAnyone who volunteers three times this season will get their own small plot for free next year. Coffee and pastries will be provided by Main Street Bakery.","questions":[{"q":"What is the purpose of the post?","options":["To sell plots in a garden","To advertise a local bakery","To announce a gardening class","To find people to help in a garden"],"answer":3,"why":"„Volunteers needed!“ – es werden Helfer gesucht."},{"q":"What will people who volunteer three times receive?","options":["A garden plot at no cost","Free coffee for a year","A discount at a bakery","A set of garden tools"],"answer":0,"why":"„… will get their own small plot for free next year.“"}]},{"id":"d06","level":2,"genre":"receipt","title":"Bookstore receipt","text":"# Campus Bookstore – Receipt\nSept. 3 · Transaction #40217\nItem | Price\nIntro to Psychology (used) | $62.00\nLab notebook | $11.50\nGraphing calculator (rental, 1 semester) | $25.00\nTotal | $98.50\nUsed books may be returned for a full refund within 14 days with this receipt. Rental items must be returned by December 20, or the full purchase price will be charged.","questions":[{"q":"What will happen if the calculator is returned on December 22?","options":["The rental period will be extended.","The student will be charged the calculator's full price.","Nothing, because the semester is over.","The student will receive a partial refund."],"answer":1,"why":"Leihartikel bis 20.12. zurück, sonst wird der volle Kaufpreis berechnet."},{"q":"What is indicated about the psychology book?","options":["It was bought new.","It is a rental item.","It can be returned for a refund for two weeks.","It must be returned by December 20."],"answer":2,"why":"Gebrauchte Bücher: volle Erstattung innerhalb von 14 Tagen."}]},{"id":"d07","level":1,"genre":"notice","title":"Pool closed","text":"# Pool Closed\nThe campus swimming pool will be closed on Monday, October 14, for cleaning. It will open again on Tuesday at 6:00 a.m.\nSwim classes planned for Monday will take place on Wednesday at the same time. Thank you for your patience!","questions":[{"q":"Why is the pool closed?","options":["It is a holiday.","The weather is bad.","There is a swim competition.","It is being cleaned."],"answer":3,"why":"„… closed … for cleaning.“"},{"q":"What will happen to Monday's swim classes?","options":["They will be held on Wednesday.","They are canceled.","They will be held on Tuesday.","They will start at 6:00 a.m."],"answer":0,"why":"„… will take place on Wednesday at the same time.“"}]},{"id":"d08","level":1,"genre":"chat","title":"Movie tonight","text":"Lena: Are you going to the movie tonight?\nSam: I want to, but I have to finish my essay first.\nLena: It starts at 8. Can you make it?\nSam: Probably. Save me a seat just in case!","questions":[{"q":"What does Sam need to do before the movie?","options":["Meet a professor","Finish an essay","Buy tickets","Eat dinner"],"answer":1,"why":"„I have to finish my essay first.“"},{"q":"What does Sam ask Lena to do?","options":["Help him with his essay","Change the movie time","Keep a seat for him","Wait outside the theater"],"answer":2,"why":"„Save me a seat“ = halte mir einen Platz frei."}],"me":"Sam"},{"id":"d09","level":1,"genre":"ad","title":"Room for rent","text":"# Room for Rent\nQuiet room available in a shared apartment, 10 minutes from campus by bus. $550 per month, including electricity and internet. Shared kitchen and bathroom. No pets.\nAvailable from January 1. Contact Mark at 555-0147 after 5 p.m.","questions":[{"q":"What is included in the rent?","options":["Parking","Meals","A bus pass","Internet"],"answer":3,"why":"„$550 per month, including electricity and internet.“"},{"q":"When should people call Mark?","options":["In the evening","At lunchtime","In the morning","Only on January 1"],"answer":0,"why":"„after 5 p.m.“"},{"q":"Who would NOT be able to rent the room?","options":["Someone who cooks often","A person who has a cat","A student without a car","Someone who wants to move in in January"],"answer":1,"why":"„No pets.“"}]},{"id":"d10","level":1,"genre":"email","title":"No class","text":"From: Prof. Alvarez\nTo: BIO 101 Students\nSubject: No class on Thursday\nDear students,\nI will be at a conference this week, so there is no class on Thursday. Please read Chapter 6 instead. We will discuss it next Tuesday.\nThe quiz planned for Thursday will also take place on Tuesday.\nBest,\nProfessor Alvarez","questions":[{"q":"Why is there no class on Thursday?","options":["It is a holiday.","The professor is sick.","The professor is attending a conference.","The classroom is being repaired."],"answer":2,"why":"„I will be at a conference this week.“"},{"q":"What will students do next Tuesday?","options":["Read Chapter 6 in class","Hand in a lab report","Go to a conference","Discuss Chapter 6 and take a quiz"],"answer":3,"why":"Kapitel 6 wird besprochen, und das Quiz findet ebenfalls Dienstag statt."}]},{"id":"d11","level":1,"genre":"schedule","title":"Shuttle bus","text":"# Shuttle Bus: Campus to Downtown\nStop | Weekdays | Weekends\nMain Gate | every 15 min | every 30 min\nScience Building | every 15 min | every 30 min\nDowntown Station | every 15 min | every 30 min\nThe last bus leaves Main Gate at 11:45 p.m. Students ride free with their ID card.","questions":[{"q":"How often does the shuttle run on Saturdays?","options":["Every 30 minutes","Every 15 minutes","It does not run on Saturdays.","Every hour"],"answer":0,"why":"Wochenende: every 30 min."},{"q":"What do students need in order to ride for free?","options":["A paper ticket","Their ID card","A monthly pass","Nothing at all"],"answer":1,"why":"„Students ride free with their ID card.“"}]},{"id":"d12","level":3,"genre":"email","title":"Water outage","text":"From: Facilities Management\nTo: Residents of Whitmore Hall\nSubject: Scheduled water outage – please read\nDear residents,\nContractors will be replacing a corroded main valve in Whitmore Hall on Thursday. To complete the work safely, the water supply to the entire building will be shut off between 8:00 a.m. and approximately 2:00 p.m.\nAlthough we anticipate finishing on schedule, residents should be aware that unforeseen complications occasionally prolong such repairs. Shower facilities in the adjacent Recreation Center will remain open to Whitmore residents throughout the day.\nWe recommend filling containers with drinking water the night before.\nFacilities Management","questions":[{"q":"Why will the water be shut off?","options":["The building's water tanks are being cleaned.","The building is being connected to the Recreation Center.","A damaged part of the water system is being replaced.","A new shower system is being tested."],"answer":2,"why":"„replacing a corroded main valve“ – ein beschädigtes Ventil wird ersetzt."},{"q":"What does Facilities Management suggest about the repair?","options":["It has already been postponed several times.","It requires residents to leave the building.","It will definitely end before 2:00 p.m.","It might take longer than planned."],"answer":3,"why":"„unforeseen complications occasionally prolong such repairs“ – es kann länger dauern."},{"q":"The word \"adjacent\" in the email is closest in meaning to","options":["nearby","public","newly built","larger"],"answer":0,"why":"adjacent = angrenzend, benachbart."}]},{"id":"d13","level":3,"genre":"post","title":"Sustainability office","text":"# Campus Sustainability Office\nLast semester's \"Bring Your Own Mug\" campaign exceeded every expectation: disposable cup use in campus cafés fell by 38 percent.\nEncouraged by these results, we are extending the 25-cent discount for reusable containers to all dining halls starting next month. We are also piloting a deposit system in two cafés, in which customers pay $1 for a reusable cup and get their dollar back when the cup is returned.\nShould the pilot prove successful, it will be introduced campus-wide in the fall.","questions":[{"q":"What is the main purpose of the post?","options":["To explain why prices in dining halls are rising","To report the results of a campaign and announce next steps","To criticize students for using disposable cups","To announce that cafés will stop selling coffee"],"answer":1,"why":"Ergebnis der Kampagne (−38 %) plus Ausweitung und Pilotprojekt."},{"q":"What can be inferred about the deposit system?","options":["It is already used in all dining halls.","It costs customers 25 cents per cup.","Whether it is expanded depends on how well it works at first.","It has replaced the discount for reusable containers."],"answer":2,"why":"„Should the pilot prove successful, it will be introduced campus-wide.“"},{"q":"The phrase \"exceeded every expectation\" means that the campaign was","options":["more expensive than expected","less popular than expected","shorter than expected","more successful than expected"],"answer":3,"why":"exceed = übertreffen."}]},{"id":"d14","level":3,"genre":"chat","title":"Draft feedback","text":"Daniel: Did you get a chance to look at the draft I sent?\nPriya: I did. The data section is really strong.\nDaniel: And the introduction?\nPriya: Well… I think a reader who isn't in our field might have a hard time figuring out why the topic matters.\nDaniel: So, back to the drawing board?\nPriya: Not entirely – just a couple of paragraphs. I can go over it with you tomorrow if you want.","questions":[{"q":"What does Priya imply about the introduction?","options":["It does not clearly explain why the topic is important.","It is ready to be submitted.","It is too long.","It contains incorrect data."],"answer":0,"why":"Leser außerhalb des Fachs verstehen nicht, warum das Thema wichtig ist."},{"q":"What does Daniel mean when he says \"back to the drawing board\"?","options":["He disagrees with Priya's opinion.","He thinks he has to start over.","He plans to meet in the art room.","He wants to add some drawings."],"answer":1,"why":"back to the drawing board = noch einmal von vorn anfangen."},{"q":"What does Priya offer to do?","options":["Explain the topic to other readers","Send Daniel her own paper","Review the draft together with Daniel","Rewrite the data section"],"answer":2,"why":"„I can go over it with you tomorrow.“"}],"me":"Priya"},{"id":"d15","level":3,"genre":"webpage","title":"Extension policy","text":"# Requesting an Extension on a Final Paper\nStudents who cannot meet a final paper deadline because of circumstances beyond their control may request an extension of up to seven days.\nRequests must be submitted through the Student Portal no later than 48 hours before the original deadline and should be accompanied by supporting documentation where possible. Instructors are not obligated to grant extensions requested after this point, except in documented emergencies.\nApproved extensions do not affect a student's eligibility for honors, but papers submitted after an extended deadline will be penalized at the instructor's discretion.","questions":[{"q":"According to the page, when must most extension requests be made?","options":["At the start of the semester","On the day of the deadline","Within seven days after the deadline","At least two days before the original deadline"],"answer":3,"why":"„no later than 48 hours before the original deadline“."},{"q":"What is true about requests made later than this?","options":["Instructors may refuse them unless there is a documented emergency.","They reduce the student's chance of receiving honors.","They are always rejected.","They are usually accepted with documentation."],"answer":0,"why":"„not obligated to grant … except in documented emergencies“."},{"q":"The phrase \"at the instructor's discretion\" means that the penalty","options":["must be approved by the university","is decided by the instructor","is the same for all students","is explained in the Student Portal"],"answer":1,"why":"discretion = Ermessen."}]},{"id":"d16","level":3,"genre":"review","title":"Restaurant review","text":"# Review: The Lantern Room ★★★☆☆\nI had high hopes for this new place after reading so much praise online. The setting is undeniably charming – exposed brick, soft lighting, and a view of the harbor.\nUnfortunately, the food did not live up to the atmosphere. My grilled fish arrived lukewarm, and the much-advertised seasonal vegetables were little more than a handful of overcooked carrots.\nTo be fair, our server was attentive and apologized sincerely, even removing the fish from our bill. I might return for drinks on the terrace, but I would think twice before ordering dinner again.","questions":[{"q":"What is the reviewer's overall opinion of the restaurant?","options":["It is excellent in every way.","The service was the main problem.","The atmosphere is better than the food.","It is too expensive for what it offers."],"answer":2,"why":"„the food did not live up to the atmosphere“."},{"q":"Why does the reviewer mention the server?","options":["To complain about slow service","To recommend a specific employee for promotion","To explain why the food was cold","To give a fair, balanced picture of the visit"],"answer":3,"why":"„To be fair …“ leitet einen positiven Gegenpunkt ein."}]}],"academic":[{"id":"ac01","level":2,"title":"Mangrove Forests","text":"Mangroves are trees that grow in the salty, shallow waters along tropical coastlines. Few plants can survive in such conditions, but mangroves have developed several unusual adaptations. Some species filter salt out of seawater through their roots, while others store excess salt in older leaves that eventually fall off. Because the muddy soil contains very little oxygen, many mangroves also grow special roots that stick up out of the mud like pencils, allowing the trees to absorb air directly.\nThese forests provide important benefits to both wildlife and people. Their dense root systems act as nurseries for young fish, which hide from predators among the roots until they are large enough to survive in open water. Mangroves also protect coastal communities: during storms, the tangled roots reduce the force of waves and help prevent the erosion of shorelines.\nDespite these benefits, mangrove forests have declined significantly in recent decades. Large areas have been cleared to make room for shrimp farms and coastal development. Scientists warn that losing mangroves not only harms fish populations but also leaves coastal towns more vulnerable to storm damage.","questions":[{"q":"According to paragraph 1, why do some mangroves have roots that stick up out of the mud?","options":["To take in oxygen from the air","To collect rainwater","To store excess salt","To hold the trees in place during storms"],"answer":0,"why":"Der Schlamm enthält kaum Sauerstoff; die Wurzeln „absorb air directly“."},{"q":"The word \"dense\" in paragraph 2 is closest in meaning to","options":["shallow","thick","ancient","fragile"],"answer":1,"why":"dense = dicht."},{"q":"Why does the author mention young fish in paragraph 2?","options":["To describe a threat to mangrove forests","To compare mangroves with coral reefs","To show one way mangroves benefit wildlife","To explain how mangroves obtain nutrients"],"answer":2,"why":"Junge Fische nutzen die Wurzeln als „nurseries“ – Beispiel für Nutzen für Tiere."},{"q":"Which of the following is NOT mentioned as a way mangroves deal with salt?","options":["Filtering it out through their roots","Losing it when old leaves fall off","Storing it in older leaves","Releasing it through their flowers"],"answer":3,"why":"Blüten werden im Text nicht erwähnt."},{"q":"What can be inferred from paragraph 3?","options":["Clearing mangroves may increase storm damage to coastal towns.","Mangrove forests are expanding in most regions.","Shrimp farms help protect shorelines.","Scientists generally support coastal development."],"answer":0,"why":"Ohne Mangroven sind Küstenorte „more vulnerable to storm damage“."}]},{"id":"ac02","level":1,"title":"Why Do We Yawn?","text":"Everyone yawns, but scientists are still not sure why. For many years, people believed that yawning brings more oxygen into the body when we are tired. However, experiments have shown that breathing extra oxygen does not make people yawn less, so this explanation is probably wrong.\nA newer idea is that yawning helps cool the brain. When we yawn, we take in a large amount of air, and the jaw stretches widely. This movement increases blood flow to the head and may lower the temperature of the brain slightly. In one study, people yawned less often when they held a cold pack against their forehead.\nYawning is also contagious. Seeing, hearing, or even reading about someone yawning can make us yawn too. Interestingly, people are more likely to \"catch\" a yawn from a family member or a close friend than from a stranger. Some researchers think this shows that contagious yawning is connected to empathy, the ability to understand how others feel.","questions":[{"q":"What is the passage mainly about?","options":["The connection between sleep and body temperature","Different explanations for why people yawn","Why tired people need more oxygen","Ways to stop yawning"],"answer":1,"why":"Der Text stellt mehrere Erklärungen für das Gähnen vor."},{"q":"According to paragraph 1, why is the oxygen explanation probably wrong?","options":["Yawning lowers the amount of oxygen in the body.","Only tired people yawn.","Breathing extra oxygen does not reduce yawning.","Scientists have never tested it."],"answer":2,"why":"„breathing extra oxygen does not make people yawn less“."},{"q":"The word \"contagious\" in paragraph 3 is closest in meaning to","options":["dangerous","common in families","difficult to stop","easily passed to others"],"answer":3,"why":"contagious = ansteckend."},{"q":"What did people do in the study mentioned in paragraph 2?","options":["They held something cold against their forehead.","They breathed extra oxygen.","They read about yawning.","They watched family members yawn."],"answer":0,"why":"„held a cold pack against their forehead“."},{"q":"What can be inferred about contagious yawning?","options":["Strangers cause the most yawns.","It happens more often between people who are close.","It is a sign that a person is tired.","It only happens when people see someone yawn."],"answer":1,"why":"Man „fängt“ das Gähnen eher bei Familie und Freunden."}]},{"id":"ac03","level":3,"title":"The Paradox of Choice","text":"Conventional economic thinking holds that having more options is always beneficial: if an option is added that no one wants, people can simply ignore it. Yet a growing body of psychological research suggests that an abundance of options can, under certain conditions, undermine both decision-making and satisfaction.\nIn a widely cited field experiment, shoppers encountered a tasting booth offering either six or twenty-four varieties of jam. Although the larger display attracted more visitors, those who saw the smaller selection were roughly ten times more likely to make a purchase. The researchers proposed that comparing many similar alternatives imposes a cognitive burden that can lead people to postpone or avoid decisions altogether.\nEven when people do choose, an extensive range of options may diminish their contentment. With more alternatives available, it becomes easier to imagine that a different selection would have been superior, and this anticipated regret can reduce the pleasure derived from the chosen item.\nSubsequent studies, however, have complicated the picture. Several attempts to replicate the original findings produced weak or inconsistent effects, and analyses suggest that choice overload emerges mainly when options are difficult to compare or when decision-makers lack clear preferences. Experts in a particular domain, for instance, appear largely immune to it.","questions":[{"q":"According to paragraph 1, what does conventional economic thinking assume?","options":["Satisfaction depends mainly on price.","People generally prefer fewer options.","Additional options never make people worse off.","Unwanted options should be removed from stores."],"answer":2,"why":"„having more options is always beneficial“ – man kann Unerwünschtes ignorieren."},{"q":"What was surprising about the result of the jam experiment?","options":["Shoppers preferred jams with fewer ingredients.","Fewer people visited the smaller display.","Visitors tasted more jam at the smaller display.","The larger display led to fewer purchases even though it attracted more visitors."],"answer":3,"why":"Mehr Besucher, aber zehnmal weniger Käufe bei 24 Sorten."},{"q":"The word \"diminish\" in paragraph 3 is closest in meaning to","options":["reduce","replace","reveal","delay"],"answer":0,"why":"diminish = verringern."},{"q":"Why does the author mention experts in the final paragraph?","options":["To suggest that shoppers should consult experts","To show that choice overload does not affect everyone equally","To explain why the jam study was repeated","To argue that experts make worse decisions"],"answer":1,"why":"Experten sind „largely immune“ – der Effekt hängt von Bedingungen ab."},{"q":"Which statement best describes the author's view of the original findings?","options":["They apply to all decisions people make.","They are irrelevant to economics.","They may hold only under certain conditions.","They have been completely disproven."],"answer":2,"why":"Wiederholungen zeigten schwache Effekte; der Effekt tritt „mainly when …“ auf."}]},{"id":"ac04","level":3,"title":"Life at Hydrothermal Vents","text":"In 1977, researchers exploring the floor of the Pacific Ocean made a discovery that overturned long-standing assumptions about life on Earth. Near volcanic openings called hydrothermal vents, where water heated by magma bursts from the seafloor at temperatures exceeding 350°C, they found thriving communities of giant tube worms, clams, and crabs.\nThe finding was puzzling because sunlight never penetrates these depths, and nearly all known ecosystems ultimately depend on photosynthesis. The explanation turned out to lie in chemosynthesis. Bacteria living around the vents derive energy from chemical reactions involving hydrogen sulfide, a compound abundant in the vent fluid but toxic to most organisms. These bacteria form the base of the food web; giant tube worms, which lack both a mouth and a digestive system, host billions of them inside their bodies and absorb the nutrients they produce.\nThe implications extend beyond marine biology. Because vent ecosystems function independently of the sun, some scientists have proposed that life on Earth may have originated in similar environments. The discovery has also encouraged the search for life on moons such as Europa and Enceladus, whose ice-covered oceans may conceal comparable hydrothermal activity.","questions":[{"q":"Why was the 1977 discovery surprising?","options":["The water near the vents was colder than expected.","Clams had never been observed before.","The vents were located in the Pacific Ocean.","The animals survived without depending on sunlight."],"answer":3,"why":"Fast alle Ökosysteme hängen an Photosynthese – hier gibt es kein Licht."},{"q":"The word \"abundant\" in paragraph 2 is closest in meaning to","options":["plentiful","hidden","dangerous","rare"],"answer":0,"why":"abundant = reichlich vorhanden."},{"q":"According to paragraph 2, how do giant tube worms obtain food?","options":["Through photosynthesis in their skin","From bacteria living inside their bodies","By eating smaller animals near the vents","By filtering plankton from the water"],"answer":1,"why":"Sie beherbergen Bakterien und nehmen deren Nährstoffe auf."},{"q":"What does the author indicate about hydrogen sulfide?","options":["It is produced by the tube worms.","It is found mainly on Europa.","It is harmful to most living things.","It cools the vent fluid."],"answer":2,"why":"„toxic to most organisms“."},{"q":"Why does the author mention Europa and Enceladus?","options":["To explain where vents were first discovered","To argue that life definitely exists there","To compare their temperatures with Earth's oceans","To show that the discovery influenced the search for life elsewhere"],"answer":3,"why":"Die Entdeckung „encouraged the search for life on moons such as …“."}]},{"id":"ac05","level":2,"title":"The Origins of Paper Money","text":"Paper money first appeared in China more than a thousand years ago. Merchants during the Tang dynasty found heavy metal coins inconvenient for large transactions, so they began leaving their coins with trusted agents in exchange for paper receipts. These receipts could be traded among merchants and later exchanged back for coins.\nBy the eleventh century, the Song government had recognized the usefulness of this system and began issuing official paper notes. Government control brought both advantages and risks. On the one hand, official notes were accepted throughout the empire. On the other hand, the government could print as many notes as it wished, and during times of war it often printed far more than it could support. The result was inflation: prices rose sharply, and the notes lost much of their value.\nEuropean travelers such as Marco Polo described Chinese paper money with amazement, but the idea spread slowly. It was not until the seventeenth century that banks in Sweden and England began issuing paper notes of their own. Today, paper money is used everywhere, although electronic payments are steadily replacing it in many countries.","questions":[{"q":"Why did merchants in the Tang dynasty begin using paper receipts?","options":["Metal coins were inconvenient for large payments.","The government required them to.","Paper was cheaper to produce than metal.","Foreign traders refused to accept coins."],"answer":0,"why":"„found heavy metal coins inconvenient for large transactions“."},{"q":"The word \"issuing\" in paragraph 2 is closest in meaning to","options":["collecting","officially giving out","destroying","designing"],"answer":1,"why":"issue = (offiziell) ausgeben."},{"q":"According to paragraph 2, what was a disadvantage of government-controlled paper money?","options":["It was accepted only in a few cities.","Criminals could copy it easily.","The government sometimes printed too much, which caused prices to rise.","Merchants could not exchange it for coins."],"answer":2,"why":"Zu viel gedrucktes Geld → Inflation."},{"q":"Why does the author mention Marco Polo?","options":["To describe a famous Chinese merchant","To argue that paper money was invented in Europe","To explain how paper money quickly reached Europe","To show that Europeans found Chinese paper money remarkable"],"answer":3,"why":"Er beschrieb das Papiergeld „with amazement“."},{"q":"What can be inferred from the last sentence of the passage?","options":["Paper money may become less common in the future.","Sweden was the first country to stop using paper money.","Paper money is no longer printed.","Electronic payments are less secure than cash."],"answer":0,"why":"Elektronische Zahlungen ersetzen Papiergeld „steadily“."}]}]},"writing":{"bas":[{"id":"bas01","level":1,"prompt":"What did you think of the new library?","answer":"The study rooms on the third floor are much quieter than before.","chunks":["the study rooms","on the third floor","are","much quieter","than before"],"why":"Vergleich: Komparativ + than (much quieter than)."},{"id":"bas02","level":2,"prompt":"Why weren't you at the meeting yesterday?","answer":"I didn't know that it had been mo lem with your schedule.","Suggest how you could still spend time together."]},{"id":"em06","level":2,"situation":"Two weeks ago, you ordered a textbook from an online store for a class that starts on Monday. The store's website says the order has been shipped, but you have not received it, and the tracking number does not work.","recipient":"the store's customer service team","tasks":["Give the details of your order.","Explain why you need the book urgently.","Ask for a specific solution."]}],"discussion":[{"id":"di01","level":2,"course":"education","professor":{"name":"Dr. Lin","text":"Many universities now record their lectures and post them online. Some educators believe this helps students learn, while others worry that it reduces class attendance and engagement. Should universities record all lectures and make them available online? Why or why not?"},"students":[{"name":"Mia","text":"I think recording lectures is essential. Students who are sick or have to work can still keep up, and everyone can rewatch difficult parts before exams. Learning shouldn't depend on being in a room at a certain time."},{"name":"Lucas","text":"I disagree. When lectures are online, many students stop coming to class and fall behind because they never actually watch the recordings. Being there in person also makes it possible to ask questions and discuss ideas with classmates."}]},{"id":"di02","level":2,"course":"urban planning","professor":{"name":"Dr. Okafor","text":"City governments have limited budgets. Some people argue that money should be spent on improving public transportation, while others think it is more important to create more parks and green spaces. Which do you think should be the priority for city spending, and why?"},"students":[{"name":"Sara","text":"Public transportation should come first. Good buses and trains reduce traffic and pollution, and they help people without cars get to jobs and schools."},{"name":"Kevin","text":"I'd choose parks. People need places to r nnah","text":"Bans work better. People are busy and rarely change their habits unless they have to. After my city banned plastic bags, almost everyone started bringing reusable ones."},{"name":"Omar","text":"I prefer education. Bans can feel unfair, and they don't teach people why reducing waste matters. If people understand the problem, they'll make better choices in many areas, not just with bags."}]},{"id":"di06","level":2,"course":"psychology","professor":{"name":"Dr. Brooks","text":"Some people believe students learn best when they study one subject for a long period, while others think it is better to switch between several subjects during a study session. Which approach do you think is more effective for learning? Explain why."},"students":[{"name":"Julia","text":"Focusing on one subject for a long time works better for me. I need time to really get into a topic, and switching makes me lose concentration."},{"name":"Marcus","text":"Switching between subjects keeps me fresh. After an hour on the same thing, I stop absorbing information, so changing topics helps me stay alert."}]}]},"listening":{},"speaking":{}};

  app().innerHTML=`<div class="wrap">

    </section>

/* ---------- Testablauf ---------- */
function cur(){const p=SES.parts[SES.p];return {p,sc:p.screens[SES.i]}}
function renderRunner(){
  const {p,sc}=cur();
  const isTest=SES.kind==="test";
  const n=p.screens.length;
  const modLabel=SES.section==="reading"&&isTest?` · Modul ${p.module||1}`:"";
  const limit=p.limit;
  app().innerHTML=`<div class="testbar"><div class="testbar-in">
      <span class="sec">${esc(isTest?SES.title:"Training")}</span>
      <span class="pos">${esc(p.name!==SES.title?p.name+" · ":"")}${SES.i+1} / ${n}${modLabel}</span>
      <span class="sp"></span>
      ${limit||isTest?`<button class="timer ${S.hideTimer?"hide":""}" id="timer" title="Uhr ein-/ausblenden">${fmt((limit||0)-SES.used[SES.p])}</button>`:`<span class="timer" id="timer">${fmt(SES.used[SES.p])}</span>`}
      <button class="btn ghost" id="exit">Beenden</button>
      <div class="navbtns"><button class="btn" id="back" ${SES.i<=p.floor?"disabled":""}>Back</button>
      <button class="btn primary" id="next">Next</button></div>
    </div><div class="progress"><i style="width:${Math.round(100*(SES.i)/n)}%"></i></div></div>
    <div class="wrap wide" id="stage"></div>`;
  const stage=$("#stage");document.body.classList.add("testing");
  if(sc.t==="ctw")renderCtw(stage,sc);
  else if(sc.t==="mcq")renderMcq(stage,sc);
  else if(sc.t==="bas")renderBas(stage,sc);
  else if(sc.t==="email"||sc.t==="discussion")renderWrite(stage,sc);
  $("#next").onclick=next;
  $("#back").onclick=()=>{if(SES.i>p.floor){SES.i--;renderRunner()}};
  $("#exit").onclick=()=>confirmBox("Test beenden? Der Fortschritt dieses Durchgangs geht verloren.","Beenden",()=>{SES=null;go("home")});
  const tb=$("#timer");if(tb&&tb.tagName==="BUTTON")tb.onclick=()=>{S.hideTimer=!S.hideTimer;save();tb.classList.toggle("hide",S.hideTimer)};
  TICK=setInterval(tick,1000);
}
function tick(){
  if(!SES||view.name!=="runner")return;
  SES.used[SES.p]++;
  const p=SES.parts[SES.p],t=$("#timer");
  if(p.limit){const left=p.limit-SES.used[SES.p];if(t){t.textContent=fmt(left);t.classList.toggle("low",left<=60)}
    if(left<=0){if(SES.kind==="test")endPart(true);else if(!p.warned){p.warned=true;toast("Zeit abgelaufen. Im Test wäre die Aufgabe jetzt beendet.")}}}
  else if(t)t.textContent=fmt(SES.used[SES.p]);
}
function toast(m){const d=document.createElement("div");d.className="notice";d.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;box-shadow:var(--shadow);max-width:90vw";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
function confirmBox(msg,yes,onYes){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:grid;place-items:center;padding:20px";
  d.innerHTML=`<div class="panel stack" style="max-width:380px"><p style="margin:0">${esc(msg)}</p><div class="btns"><button class="btn" id="cb-no">Abbrechen</button><button class="btn primary" id="cb-yes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(d);d.querySelector("#cb-no").onclick=()=>d.remove();d.querySelector("#cb-yes").onclick=()=>{d.remove();onYes()};d.querySelector("#cb-yes").focus();
}
function next(){
  const p=SES.parts[SES.p];
  if(SES.i<p.screens.length-1){SES.i++;renderRunner();window.scrollTo(0,0);return}
  if(SES.kind==="test"&&SES.section==="reading"&&p.module===1){
    confirmBox("Modul 1 abschließen? Danach kannst du nicht mehr zurück.","Weiter zu Modul 2",()=>{
      const r=rawScore(SES);SES.route=r.total&&r.right/r.total>=.7?"hard":"easy";
      const m2=readingModule(SES.route==="hard"?3:1,SES.exclude);
      p.floor=p.screens.length;p.screens.push(...m2);p.module=2;SES.i=p.floor;renderRunner();window.scrollTo(0,0)});
    return;
  }
  const lastPart=SES.p===SES.parts.length-1;
  confirmBox(lastPart?(SES.kind==="test"?"Section beenden und auswerten?":"Aufgabe abgeben?"):"Diesen Teil abschließen? Danach kannst du nicht mehr zurück.",lastPart?"Abgeben":"Weiter",()=>endPart(false));
}
function endPart(timeout){
  if(timeout)toast("Die Zeit für diesen Teil ist abgelaufen.");
  if(SES.p<SES.parts.length-1){SES.p++;SES.i=0;renderRunner();window.scrollTo(0,0);return}
  finish();
}
function finish(){
  const s=SES;screensOf(s).forEach(sc=>markSeen(sc.item.id));
  /* Statistik je Aufgabentyp */
  const by={};screensOf(s).forEach(sc=>{const t=sc.t==="mcq"?sc.type:sc.t;const x=scoreScreen(sc,s.answers);if(!x.total)return;(by[t]=by[t]||{r:0,t:0,ids:new Set()});by[t].r+=x.right;by[t].t+=x.total;by[t].ids.add(sc.item.id)});
  Object.keys(by).forEach(t=>{const st=S.stats[t]||(S.stats[t]={right:0,total:0,sets:0});st.right+=by[t].r;st.total+=by[t].t;st.sets+=by[t].ids.size});
  const r=rawScore(s);
  const entry={id:"h"+Date.now(),date:today(),kind:s.kind,section:s.section,type:s.type||null,title:s.kind==="test"?s.title:"Training: "+s.title,route:s.route,
    raw:r.total?r.right:null,max:r.total||null,band:null,screens:screensOf(s).map(sc=>({t:sc.t,type:sc.type,id:sc.item.id,qi:sc.qi})),answers:s.answers,evals:{}};
  if(s.kind==="test"&&s.section==="reading")entry.band=readingBand(r.right/r.total,s.route);
  if(s.section==="writing"&&s.kind==="test"){entry.raw=r.right;entry.max=20}
  S.history.push(entry);if(S.history.length>200)S.history.shift();save();
  SES=null;go("result",{id:entry.id});
}

/* ---------- Bildschirm: Complete the Words ---------- */
function renderCtw(stage,sc){
  const it=sc.item,key=it.id,a=SES.answers[key]||(SES.answers[key]=[]);
  let gi=0;
  const html=esc(it.text).replace(/([A-Za-z’'-]*)\{([^}]+)\}/g,(m,shown,miss)=>{const i=gi++;const n=miss.length;
    return `<span class="gap">${shown}<input data-g="${i}" maxlength="${n}" style="width:calc(${n}*1.32ch + 8px)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke ${i+1}, ${n} Buchstaben" value="${esc(a[i]||"")}"></span>`});
  stage.innerHTML=`<div class="task single"><div class="panel"><div class="direction">${DIRECTIONS.ctw}</div><div class="ctw">${html}</div></div></div>`;
  const ins=$$(".gap input");
  ins.forEach((inp,i)=>{
    inp.oninput=()=>{a[i]=inp.value;if(inp.value.length>=+inp.maxLength&&ins[i+1])ins[i+1].focus()};
    inp.onkeydown=e=>{if(e.key==="Backspace"&&!inp.value&&ins[i-1]){ins[i-1].focus();e.preventDefault()}if(e.key==="Enter"){e.preventDefault();next()}};
  });
  const first=ins.find(x=>!x.value)||ins[0];if(first&&matchMedia("(pointer:fine)").matches)first.focus();
}

/* ---------- Bildschirm: Multiple Choice mit Text ---------- */
function docHtml(it){
  const lines=String(it.text).split("\n");
  if(it.genre==="chat"){return `<div class="chat">${lines.filter(Boolean).map(l=>{const m=l.match(/^([^:]{1,24}):\s*(.*)$/);const who=m?m[1]:"",tx=m?m[2]:l;
    return `<div class="bubble ${who&&it.me===who?"me":""}"><small>${esc(who)}</small>${esc(tx)}</div>`}).join("")}</div>`}
  let out="",head=[],rows=[];
  const flushRows=()=>{if(rows.length){out+=`<div class="tw"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;rows=[]}};
  lines.forEach(l=>{
    const hm=l.match(/^(From|To|Subject|Date|Sent):\s*(.*)$/);
    if(hm){head.push(hm);return}
    if(head.length){out+=`<div class="mailhead">${head.map(x=>`<span>${x[1]}:</span><b>${esc(x[2])}</b>`).join("")}</div>`;head=[]}
    if(l.includes(" | ")){rows.push(l.split(" | "));return}
    flushRows();
    if(l.startsWith("# ")){out+=`<div class="dtitle">${esc(l.slice(2))}</div>`;return}
    if(l.trim())out+=`<p>${esc(l)}</p>`;
  });
  flushRows();
  return out;
}
function renderMcq(stage,sc){

    :`<div class="direction">${DIRECTIONS.academic}</div><div class="passage"><h3>${esc(it.title)}</h3>${String(it.text).split("\n").filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
  const nav=it.questions.length>1?`<div class="qnav">${it.questions.map((x,i)=>`<button tabindex="-1" class="${i===sc.qi?"on":""} ${SES.answers[it.id+"#"+i]!=null?"done":""}" aria-label="Frage ${i+1}">${i+1}</button>`).join("")}</div>`:"";
  stage.innerHTML=`<div class="task"><div class="panel">${left}</div>

  $$(".opt").forEach(b=>b.onclick=()=>{SES.answers[key]=+b.dataset.o;$$(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));const d=$$(".qnav button")[sc.qi];if(d)d.classList.add("done")});

}
let keyHandler=null;
document.addEventListener("keydown",e=>{if(view.name!=="runner"||!keyHandler)return;if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();next();return}keyHandler(e)});

/* ---------- Bildschirm: Build a Sentence ---------- */
function renderBas(stage,sc){
  keyHandler=null;
  const it=sc.item,key=it.id;
  if(!SES.order)SES.order={};
  const order=SES.order[key]||(SES.order[key]=shuffle(it.chunks.map((c,i)=>i)));
  const a=SES.answers[key]||(SES.answers[key]=[]);
  const end=(it.answer.match(/[.?!]$/)||["."])[0];
  const draw=()=>{
    const cap=(t,i)=>i===0?t.charAt(0).toUpperCase()+t.slice(1):t;
    stage.innerHTML=`<div class="task single"><div class="panel">
      <div class="direction">${DIRECTIONS.bas}</div>
      <div class="speaker"><div class="avatar">A</div><div class="say">${esc(it.prompt)}</div></div>
      <div class="speaker"><div class="avatar" style="background:var(--surface-2);color:var(--muted)">B</div><div style="flex:1;min-width:0">
        <div class="slots" aria-label="Deine Antwort">${it.chunks.map((c,i)=>a[i]!=null?`<button class="chip" data-slot="${i}">${esc(cap(it.chunks[a[i]],i))}</button>`:`<span class="slot"></span>`).join("")}<span class="punct">${end}</span></div>
        <div class="bank">${order.map(ci=>`<button class="chip ${a.includes(ci)?"used":""}" data-chunk="${ci}">${esc(it.chunks[ci])}</button>`).join("")}</div>
        <div class="btns" style="margin-top:14px"><button class="btn ghost small" id="bas-reset">Zurücksetzen</button></div>
      </div></div></div></div>`;
    $$("[data-chunk]").forEach(b=>b.onclick=()=>{const ci=+b.dataset.chunk;if(a.includes(ci))return;const slot=[...Array(it.chunks.length).keys()].find(i=>a[i]==null);if(slot==null)return;a[slot]=ci;draw()});
    $$("[data-slot]").forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;a[i]=null;while(a.length&&a[a.length-1]==null)a.pop();draw()});
    $("#bas-reset").onclick=()=>{a.length=0;draw()};
  };
  draw();
}

/* ---------- KI-Bewertung ---------- */
const RUBRIC={
  email:`Score 5 (fully successful): effective, clearly expressed, consistent facility in language use; elaboration effectively supports the communicative purpose; effective variety of syntactic structures and precise, idiomatic word choice; consistently appropriate social conventions (politeness, register, organization) for the situation and recipient; almost no lexical or grammatical errors other than those expected of a competent writer under time.
Score 4 (generally successful): mostly effective and easily understood; adequate elaboration; variety of structures and appropriate word choice; mostly appropriate social conventions; few lexical or grammatical errors.
Score 3 (partially successful): generally accomplishes the task, but language limitations may prevent parts of the message from being clear; partially relevant elaboration; moderate range of structures and vocabulary; noticeable errors in structure, word forms or conventions.
Score 2 (mostly unsuccessful): mostly ineffective; limited or irrelevant elaboration; limited range; accumulation of errors.
Score 1 (unsuccessful): ineffective attempt; very little elaboration; telegraphic language; serious and frequent errors; mostly borrowed language.
Score 0: blank, rejects the topic, not in English, copied from the prompt, unconnected, or arbitrary keystrokes.
A response that leaves out one of the three required tasks cannot score above 3.`,
  discussion:`Score 5 (fully successful): relevant, very clearly expressed contribution to the online discussion; well-elaborated explanations, exemplifications and/or details; effective variety of syntactic structures and precise, idiomatic word choice; almost no lexical or grammatical errors other than those expected of a competent writer under time.
Score 4 (generally successful): relevant contribution, ideas easily understood; adequately elaborated; variety of syntactic structures and appropriate word choice; few lexical or grammatical errors.
Score 3 (partially successful): mostly relevant and mostly understandable; some elaboration, but parts may be missing, unclear or irrelevant; some variety of structures and range of vocabulary; noticeable lexical and grammatical errors.
Score 2 (mostly unsuccessful): ideas poorly elaborated or only partially relevant; limited range; accumulation of errors that make ideas hard to follow.
Score 1 (unsuccessful): few or no coherent ideas; severely limited range; serious and frequent errors; mostly borrowed language.
Score 0: blank, rejects the topic, not in English, copied from the prompt, unconnected, or arbitrary keystrokes.
Merely restating the classmates' ideas without an own contribution cannot score above 3.`
};
function taskText(kind,it){
  if(kind==="email")return `SITUATION: ${it.situation}\nWrite an email to ${it.recipient}. In your email, do the following:\n${it.tasks.map(t=>"- "+t).join("\n")}\n(7 minutes)`;
  return `Your professor is teaching a class on ${it.course}. Write a post responding to the professor's question (at least 100 words, 10 minutes).\n${it.professor.name}: ${it.professor.text}\n${it.students.map(s=>s.name+": "+s.text).join("\n")}`;
}
function evalPrompt(kind,it,text,human){
  const head=`You are an experienced, strict ETS-certified rater for the TOEFL iBT (format from January 2026). Score the test taker's response to the task "${kind==="email"?"Write an Email":"Write for an Academic Discussion"}" on the official 0–5 scale. Judge exactly like a real rater: do not reward length alone, and do not be generous.

OFFICIAL RUBRIC
${RUBRIC[kind]}

TASK
${taskText(kind,it)}

RESPONSE (${countWords(text)} words)
"""
${text}
"""
`;
  if(human)return head+`
Answer in German, structured like this:
1. Score (0–5) and a 2-sentence justification referring to the rubric.
2. Every language error: original → correction, plus the rule in one short line.
3. An improved version in English that keeps my ideas and would score 5.
4. At most 3 concrete tips for my next attempt.`;
  return head+`
Reply with ONLY a JSON object, no other text:
{"score": <integer 0-5>,
 "verdict_de": "<2 sentences in German: why this score, referring to the rubric>",
 "criteria_de": {"Aufgabe": "<1 sentence>", "Aufbau": "<1 sentence>", "Sprache": "<1 sentence>", "${kind==="email"?"Ton":"Eigener Beitrag"}": "<1 sentence>"},
 "errors": [{"original": "<exact words from the response>", "correction": "<corrected words>", "rule_de": "<the grammar or usage rule, max 12 words, German>"}],
 "improved": "<improved English version keeping the writer's ideas, would score 5>",
 "tips_de": ["<max 3 short concrete tips in German>"]}
List every real error (grammar, word choice, spelling, punctuation that matters), at most 15.`;
}
async function runEval(entry,kind,it,text,box){
  const ctl=new AbortController();
  box.innerHTML=`<p class="muted"><span class="spin"></span>Claude bewertet nach den ETS-Rubrics. Das dauert meist 20–60 Sekunden.</p><button class="btn ghost small" id="ev-stop">Abbrechen</button>`;
  box.querySelector("#ev-stop").onclick=()=>ctl.abort();
  try{
    const r=await SAMPLE.json(evalPrompt(kind,it,text,false),{signal:ctl.signal,modelTier:"default"});
    if(!r||typeof r.score!=="number")throw {code:"invalid_json"};
    entry.evals[kind]=r;
    if(entry.section==="writing"&&entry.kind==="test"&&entry.evals.email&&entry.evals.discussion){
      const bas=entry.screens.filter(x=>x.t==="bas").length?basRight(entry):0;
      entry.raw=bas+entry.evals.email.score+entry.evals.discussion.score;entry.band=writingBand(entry.raw);
    }
    save();render();
  }catch(e){
    const m={not_granted:"Du hast die Nutzung von Claude für diese Seite nicht erlaubt.",rate_limited:"Gerade zu viele Anfragen oder Nutzungslimit erreicht. Später nochmal versuchen.",cancelled:"Abgebrochen.",invalid_json:"Die Antwort war unvollständig. Bitte nochmal versuchen."}[e&&e.code]||"Die Bewertung hat nicht geklappt. Bitte nochmal versuchen.";
    box.innerHTML=`<p class="muted small">${esc(m)}</p>`;evalButtons(entry,kind,it,text,box);
  }
}
function basRight(entry){return entry.screens.filter(x=>x.t==="bas").reduce((n,x)=>{const it=byId(x.id);return n+scoreScreen({t:"bas",item:it},entry.answers).right},0)}
function evalButtons(entry,kind,it,text,box){
  const wrap=document.createElement("div");wrap.className="btns";
  if(SAMPLE){const b=document.createElement("button");b.className="btn primary";b.textContent="Mit Claude bewerten";b.onclick=()=>runEval(entry,kind,it,text,box);wrap.appendChild(b)}
  const c=document.createElement("button");c.className="btn";c.textContent="Bewertungs-Prompt kopieren";
  c.onclick=()=>{const p=evalPrompt(kind,it,text,true);try{navigator.clipboard.writeText(p).then(()=>{c.textContent="Kopiert – in Claude einfügen"},()=>fallbackCopy(p,box))}catch(e){fallbackCopy(p,box)}};
  wrap.appendChild(c);box.appendChild(wrap);
}
function fallbackCopy(p,box){const t=document.createElement("textarea");t.className="code";t.rows=6;t.value=p;box.appendChild(t);t.select()}
function evalHtml(r){
  const crit=r.criteria_de?Object.entries(r.criteria_de).map(([k,v])=>`<div class="err"><b>${esc(k)}:</b> ${esc(v)}</div>`).join(""):"";
  return `<div class="score5"><span class="big">${esc(r.score)}</span><span class="muted">/ 5</span></div>
    <p style="margin:0">${esc(r.verdict_de||"")}</p>
    ${crit?`<div><div class="label">Kriterien</div><div class="errs">${crit}</div></div>`:""}
    ${Array.isArray(r.errors)&&r.errors.length?`<div><div class="label">Fehler (${r.errors.length})</div><div class="errs">${r.errors.map(x=>`<div class="err"><s>${esc(x.original)}</s> → <span class="fix">${esc(x.correction)}</span><div class="r">${esc(x.rule_de||"")}</div></div>`).join("")}</div></div>`:`<p class="muted small">Keine Sprachfehler gefunden.</p>`}
    ${r.improved?`<div><div class="label">Fassung für 5/5</div><div class="improved">${esc(r.improved)}</div></div>`:""}
    ${Array.isArray(r.tips_de)&&r.tips_de.length?`<div><div class="label">Nächstes Mal</div><ul style="margin:6px 0 0;padding-left:18px">${r.tips_de.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}`;
}

/* ---------- Ergebnis ---------- */
const ALLITEMS={};Object.keys(TYPES).forEach(t=>pool(t).forEach(it=>{ALLITEMS[it.id]=it}));
const byId=id=>ALLITEMS[id];
function renderResult(){
  const e=S.history.find(h=>h.id===view.id);if(!e){go("home");return}
  const scs=e.screens.map(x=>Object.assign({},x,{item:byId(x.id)})).filter(x=>x.item);
  const reviewRows=[];
  scs.forEach(sc=>{
    if(sc.t==="mcq"){const q=sc.item.questions[sc.qi];const a=e.answers[sc.item.id+"#"+sc.qi];const ok=a===q.answer;
      reviewRows.push(`<div class="ritem"><span class="m ${ok?"ok":"no"}">${ok?"✓":"✗"}</span><div><div class="q">${esc(q.q)}</div>
      <div class="a">${a!=null?"Deine Antwort: "+LETTERS[a]+") "+esc(q.options[a])+" · ":"Keine Antwort · "}Richtig: ${LETTERS[q.answer]}) ${esc(q.options[q.answer])}</div>${q.why?`<div class="why">${esc(q.why)}</div>`:""}</div></div>`)}
    else if(sc.t==="ctw"){const x=scoreScreen(sc,e.answers);const gaps=ctwGaps(sc.item.text);const a=e.answers[sc.item.id]||[];
      reviewRows.push(`<div class="ritem"><span class="m ${x.right===x.total?"ok":"no"}">${x.right}/${x.total}</span><div><div class="q">Complete the Words</div><div class="a">${gaps.map((g,i)=>x.detail[i]?`<span style="color:var(--good)">${esc(g.shown+g.missing)}</span>`:`<span style="color:var(--bad)">${esc(g.shown)}<s>${esc(a[i]||"___")}</s></span> → ${esc(g.shown+g.missing)}`).join(" · ")}</div></div></div>`)}
    else if(sc.t==="bas"){const x=scoreScreen(sc,e.answers);const a=(e.answers[sc.item.id]||[]).filter(i=>i!=null).map(i=>sc.item.chunks[i]).join(" ");
      reviewRows.push(`<div class="ritem"><span class="m ${x.right?"ok":"no"}">${x.right?"✓":"✗"}</span><div><div class="q">${esc(sc.item.prompt)}</div><div class="a">${x.right?"":"Deine Antwort: "+esc(a||"–")+"<br>"}Richtig: ${esc(sc.item.answer)}</div>${sc.item.why&&!x.right?`<div class="why">${esc(sc.item.why)}</div>`:""}</div></div>`)}
  });
  const writes=scs.filter(sc=>sc.t==="email"||sc.t==="discussion");
  const byType={};scs.forEach(sc=>{const t=sc.t==="mcq"?sc.type:sc.t;const x=scoreScreen(sc,e.answers);if(!x.total)return;(byType[t]=byType[t]||{r:0,t:0});byType[t].r+=x.right;byType[t].t+=x.total});
  const isTest=e.kind==="test";
  let head="";
  if(isTest){
    const bandTxt=e.band!=null?fmtBand(e.band):"–";
    head=`<div class="bandrow"><div><div class="label">Band (Schätzung)</div><div class="big">${bandTxt}</div></div><div><div class="label">Rohpunkte</div><div class="big">${e.raw!=null?e.raw:"–"}<span class="muted" style="font-size:1rem"> / ${e.max}</span></div></div>${e.route?`<div><div class="label">Modul 2</div><div class="big" style="font-size:1.4rem;padding-top:10px">${e.route==="hard"?"schwer":"leicht"}</div></div>`:""}</div>
    ${e.section==="writing"&&e.band==null?`<p class="notice">Die Band-Schätzung für Writing erscheint, sobald Email und Discussion bewertet sind. Build a Sentence: ${basRight(e)}/10.</p>`:""}
    ${e.route==="easy"?`<p class="notice">Unter 70 % in Modul 1 führt zum leichten Modul 2. Damit ist die Band-Obergrenze 4,5. Für 5,5+ muss Modul 1 nahezu fehlerfrei sein.</p>`:""}`;
  }
  const typeRows=Object.keys(byType).map(t=>`<tr><td>${TYPES[t].name}</td><td class="n">${byType[t].r} / ${byType[t].t}</td><td class="n">${Math.round(100*byType[t].r/byType[t].t)} %</td></tr>`).join("");
  app().innerHTML=`<div class="wrap">
    <header><div class="label">${esc(e.date)}</div><h1>${esc(e.title)}</h1></header>
    ${head}
    ${typeRows?`<section class="group"><div class="label">Nach Aufgabentyp</div><div class="tw"><table class="hist"><tbody>${typeRows}</tbody></table></div></section>`:""}
    ${writes.map(sc=>`<section class="group panel"><div class="label">${sc.t==="email"?"Write an Email":"Academic Discussion"}</div>
      <details><summary class="muted small" style="cursor:pointer">Aufgabe und deine Antwort (${countWords(e.answers[sc.item.id]||"")} Wörter)</summary><div class="stack" style="margin-top:12px">${promptHtml(sc)}<div class="improved" style="background:var(--bg)">${esc(e.answers[sc.item.id]||"(leer)")}</div></div></details>
      <div class="evalbox" id="ev-${sc.t}">${e.evals[sc.t]?evalHtml(e.evals[sc.t]):""}</div></section>`).join("")}
    ${reviewRows.length?`<section class="group"><div class="label">Auswertung</div><div class="review">${reviewRows.join("")}</div></section>`:""}
    <div class="btns">${e.kind==="practice"&&e.type?`<button class="btn primary grow" id="again">Nächste Aufgabe</button>`:""}<button class="btn grow" id="home">Zur Übersicht</button></div>
  </div>`;
  writes.forEach(sc=>{const box=$("#ev-"+sc.t);if(!e.evals[sc.t])evalButtons(e,sc.t,sc.item,e.answers[sc.item.id]||"",box);
    else{const b=document.createElement("button");b.className="btn ghost small";b.textContent="Neu bewerten";b.onclick=()=>{delete e.evals[sc.t];save();render()};box.appendChild(b)}});
  $("#home").onclick=()=>go("home");
  const ag=$("#again");if(ag)ag.onclick=()=>startPractice(e.type);
}

/* ---------- Verlauf ---------- */
function renderHistory(){
  const rows=S.history.slice().reverse().map(h=>`<tr data-h="${h.id}" style="cursor:pointer"><td>${esc(h.date)}</td><td>${esc(h.title)}</td><td class="n">${h.raw!=null?h.raw+"/"+h.max:"–"}</td><td class="n">${fmtBand(h.band)}</td></tr>`).join("");
  app().innerHTML=`<div class="wrap"><header><h1>Verlauf</h1></header>
    <div class="tw"><table class="hist"><thead><tr><th>Datum</th><th>Durchgang</th><th class="n">Punkte</th><th class="n">Band</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btns"><button class="btn" id="home">Zur Übersicht</button></div></div>`;
  $$("[data-h]").forEach(r=>r.onclick=()=>go("result",{id:r.dataset.h}));
  $("#home").onclick=()=>go("home");
}

render();

</script>
