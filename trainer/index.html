title":"Lease renewal","text":"From: Greenway Property Management\nTo: Residents of 48 Alder Street\nSubject: Lease renewal for next year\nDear residents,\nYour current lease expires on July 31. Should you wish to remain in your apartment, please return the attached renewal form no later than May 15. Owing to rising maintenance costs, the monthly rent will increase by 4 percent for leases beginning August 1.\nResidents who do not respond by the deadline will be assumed to be moving out, and their apartments will be advertised to new tenants.","questions":[{"q":"Why is the rent going up?","options":["Demand from new tenants has risen.","Maintenance has become more expensive.","The lease period has been extended.","The apartments have been renovated."],"answer":1,"why":"„Owing to rising maintenance costs“.","skill":"detail"},{"q":"What will happen if a resident does not reply to the email?","options":["The lease will be renewed automatically.","The rent will rise by more than 4 percent.","The apartment will be offered to other people.","The resident will have to move out of the apartment on May 15."],"answer":2,"why":"Wer nicht antwortet, gilt als ausziehend; die Wohnung wird inseriert.","skill":"infer"}]},{"id":"d48","level":3,"genre":"ad","title":"Travel grant","text":"# Dalton Travel Grant – Call for Applications\nThe Dalton Foundation awards up to ten grants of $2,000 each to undergraduates conducting independent research abroad during the summer. Preference is given to projects that could not be carried out at the applicant's home institution.\nApplications must include a two-page proposal, a budget, and a letter of support from a faculty member. Incomplete applications will not be reviewed. Recipients are required to present their findings at the autumn research fair.","questions":[{"q":"Which project would most likely receive a grant?","options":["One that requires more than $2,000 in equipment","One that continues a professor's long-term study on the home campus","One that is planned for the autumn semester","One that needs an archive found only in another country"],"answer":3,"why":"Bevorzugt: Projekte, die an der Heimathochschule nicht möglich wären.","skill":"infer"},{"q":"What must grant recipients do afterward?","options":["Share their results at a university event","Submit a second two-page proposal","Return any money they did not spend","Write a letter of support for a new applicant"],"answer":0,"why":"„present their findings at the autumn research fair“.","skill":"detail"}]}],"academic":[{"id":"ac01","level":2,"title":"Mangrove Forests","text":"Mangroves are trees that grow in the salty, shallow waters along tropical coastlines. Few plants can survive in such conditions, but mangroves have developed several unusual adaptations. Some species filter salt out of seawater through their roots, while others store excess salt in older leaves that eventually fall off. Because the muddy soil contains very little oxygen, many mangroves also grow special roots that stick up out of the mud like pencils, allowing the trees to absorb air directly.\nThese forests provide important benefits to both wildlife and people. Their dense root systems act as nurseries for young fish, which hide from predators among the roots until they are large enough to survive in open water. Mangroves also protect coastal communities: during storms, the tangled roots reduce the force of waves and help prevent the erosion of shorelines.\nDespite these benefits, mangrove forests have declined significantly in recent decades. Large areas have been cleared to make room for shrimp farms and coastal development. Scientists warn that losing mangroves not only harms fish populations but also leaves coastal towns more vulnerable to storm damage.","questions":[{"q":"According to paragraph 1, why do some mangroves have roots that stick up out of the mud?","options":["To take in oxygen from the air","To collect rainwater","To store excess salt","To hold the trees in place during storms"],"answer":0,"why":"Der Schlamm enthält kaum Sauerstoff; die Wurzeln „absorb air directly“.","skill":"detail"},{"q":"The word \"dense\" in paragraph 2 is closest in meaning to","options":["shallow","thick","ancient","fragile"],"answer":1,"why":"dense = dicht.","skill":"vocab"},{"q":"Why does the author mention young fish in paragraph 2?","options":["To describe a threat to mangrove forests","To compare mangroves with coral reefs","To show one way mangroves benefit wildlife","To explain how mangroves obtain nutrients"],"answer":2,"why":"Junge Fische nutzen die Wurzeln als „nurseries“ – Beispiel für Nutzen für Tiere.","skill":"purpose"},{"q":"Which of the following is NOT mentioned as a way mangroves deal with salt?","options":["Filtering it out through their roots","Losing it when old leaves fall off","Storing it in older leaves","Releasing it through their flowers"],"answer":3,"why":"Blüten werden im Text nicht erwähnt.","skill":"neg"},{"q":"What can be inferred from paragraph 3?","options":["Clearing mangroves may increase storm damage to coastal towns.","Mangrove forests are expanding in most regions.","Shrimp farms help protect shorelines.","Scientists generally support coastal development and shrimp farming."],"answer":0,"why":"Ohne Mangroven sind Küstenorte „more vulnerable to storm damage“.","skill":"infer"}]},{"id":"ac02","level":1,"title":"Why Do We Yawn?","text":"Everyone yawns, but scientists are still not sure why. For many years, people believed that yawning brings more oxygen into the body when we are tired. However, experiments have shown that breathing extra oxygen does not make people yawn less, so this explanation is probably wrong.\nA newer idea is that yawning helps cool the brain. When we yawn, we take in a large amount of air, and the jaw stretches widely. This movement increases blood flow to the head and may lower the temperature of the brain slightly. In one study, people yawned less often when they held a cold pack against their forehead.\nYawning is also contagious. Seeing, hearing, or even reading about someone yawning can make us yawn too. Interestingly, people are more likely to \"catch\" a yawn from a family member or a close friend than from a stranger. Some researchers think this shows that contagious yawning is connected to empathy, the ability to understand how others feel.","questions":[{"q":"What is the passage mainly about?","options":["The connection between sleep and body temperature","Different explanations for why people yawn","Why tired people need more oxygen","Ways to stop yawning"],"answer":1,"why":"Der Text stellt mehrere Erklärungen für das Gähnen vor.","skill":"main"},{"q":"According to paragraph 1, why is the oxygen explanation probably wrong?","options":["Yawning lowers the amount of oxygen in the body.","Only tired people yawn.","Breathing extra oxygen does not reduce yawning.","Scientists have never tested it."],"answer":2,"why":"„breathing extra oxygen does not make people yawn less“.","skill":"detail"},{"q":"The word \"contagious\" in paragraph 3 is closest in meaning to","options":["dangerous","common in families","difficult to stop","easily passed to others"],"answer":3,"why":"contagious = ansteckend.","skill":"vocab"},{"q":"What did people do in the study mentioned in paragraph 2?","options":["They held something cold against their forehead.","They breathed extra oxygen.","They read about yawning.","They watched videos of family members yawning."],"answer":0,"why":"„held a cold pack against their forehead“.","skill":"detail"},{"q":"What can be inferred about contagious yawning?","options":["Strangers cause the most yawns.","It happens more often between people who are close.","It is a sign that a person is tired.","It only happens when people see someone yawn."],"answer":1,"why":"Man „fängt“ das Gähnen eher bei Familie und Freunden.","skill":"infer"}]},{"id":"ac03","level":3,"title":"The Paradox of Choice","text":"Conventional economic thinking holds that having more options is always beneficial: if an option is added that no one wants, people can simply ignore it. Yet a growing body of psychological research suggests that an abundance of options can, under certain conditions, undermine both decision-making and satisfaction.\nIn a widely cited field experiment, shoppers encountered a tasting booth offering either six or twenty-four varieties of jam. Although the larger display attracted more visitors, those who saw the smaller selection were roughly ten times more likely to make a purchase. The researchers proposed that comparing many similar alternatives imposes a cognitive burden that can lead people to postpone or avoid decisions altogether.\nEven when people do choose, an extensive range of options may diminish their contentment. With more alternatives available, it becomes easier to imagine that a different selection would have been superior, and this anticipated regret can reduce the pleasure derived from the chosen item.\nSubsequent studies, however, have complicated the picture. Several attempts to replicate the original findings produced weak or inconsistent effects, and analyses suggest that choice overload emerges mainly when options are difficult to compare or when decision-makers lack clear preferences. Experts in a particular domain, for instance, appear largely immune to it.","questions":[{"q":"According to paragraph 1, what does conventional economic thinking assume?","options":["Satisfaction depends mainly on price.","People generally prefer fewer options.","Additional options never make people worse off.","Unwanted options should be removed from stores."],"answer":2,"why":"„having more options is always beneficial“ – man kann Unerwünschtes ignorieren.","skill":"detail"},{"q":"What was surprising about the result of the jam experiment?","options":["Shoppers preferred jams with fewer ingredients.","Fewer people visited the smaller display.","Visitors spent more time tasting jam at the smaller display than at the larger one.","The larger display led to fewer purchases even though it attracted more visitors."],"answer":3,"why":"Mehr Besucher, aber zehnmal weniger Käufe bei 24 Sorten.","skill":"detail"},{"q":"The word \"diminish\" in paragraph 3 is closest in meaning to","options":["reduce","replace","reveal","delay"],"answer":0,"why":"diminish = verringern.","skill":"vocab"},{"q":"Why does the author mention experts in the final paragraph?","options":["To suggest that shoppers should consult experts before buying products","To show that choice overload does not affect everyone equally","To explain why the jam study was repeated","To argue that experts make worse decisions"],"answer":1,"why":"Experten sind „largely immune“ – der Effekt hängt von Bedingungen ab.","skill":"purpose"},{"q":"Which statement best describes the author's view of the original findings?","options":["They apply to all decisions people make.","They are irrelevant to economics.","They may hold only under certain conditions.","They have been completely disproven."],"answer":2,"why":"Wiederholungen zeigten schwache Effekte; der Effekt tritt „mainly when …“ auf.","skill":"attitude"}]},{"id":"ac04","level":3,"title":"Life at Hydrothermal Vents","text":"In 1977, researchers exploring the floor of the Pacific Ocean made a discovery that overturned long-standing assumptions about life on Earth. Near volcanic openings called hydrothermal vents, where water heated by magma bursts from the seafloor at temperatures exceeding 350°C, they found thriving communities of giant tube worms, clams, and crabs.\nThe finding was puzzling because sunlight never penetrates these depths, and nearly all known ecosystems ultimately depend on photosynthesis. The explanation turned out to lie in chemosynthesis. Bacteria living around the vents derive energy from chemical reactions involving hydrogen sulfide, a compound abundant in the vent fluid but toxic to most organisms. These bacteria form the base of the food web; giant tube worms, which lack both a mouth and a digestive system, host billions of them inside their bodies and absorb the nutrients they produce.\nThe implications extend beyond marine biology. Because vent ecosystems function independently of the sun, some scientists have proposed that life on Earth may have originated in similar environments. The discovery has also encouraged the search for life on moons such as Europa and Enceladus, whose ice-covered oceans may conceal comparable hydrothermal activity.","questions":[{"q":"Why was the 1977 discovery surprising?","options":["The water near the vents was colder than expected.","Clams had never been observed before.","The vents were located in the Pacific Ocean.","The animals survived without depending on sunlight."],"answer":3,"why":"Fast alle Ökosysteme hängen an Photosynthese – hier gibt es kein Licht.","skill":"detail"},{"q":"The word \"abundant\" in paragraph 2 is closest in meaning to","options":["plentiful","hidden","dangerous","rare"],"answer":0,"why":"abundant = reichlich vorhanden.","skill":"vocab"},{"q":"According to paragraph 2, how do giant tube worms obtain food?","options":["Through photosynthesis in their skin","From bacteria living inside their bodies","By eating smaller animals near the vents","By filtering plankton from the water"],"answer":1,"why":"Sie beherbergen Bakterien und nehmen deren Nährstoffe auf.","skill":"detail"},{"q":"What does the author indicate about hydrogen sulfide?","options":["It is produced by the tube worms.","It is found mainly on Europa.","It is harmful to most living things.","It cools the vent fluid."],"answer":2,"why":"„toxic to most organisms“.","skill":"detail"},{"q":"Why does the author mention Europa and Enceladus?","options":["To explain where vents were first discovered","To argue that life definitely exists there","To compare the temperatures of their oceans with those of Earth's oceans","To show that the discovery influenced the search for life elsewhere"],"answer":3,"why":"Die Entdeckung „encouraged the search for life on moons such as …“.","skill":"purpose"}]},{"id":"ac05","level":2,"title":"The Origins of Paper Money","text":"Paper money first appeared in China more than a thousand years ago. Merchants during the Tang dynasty found heavy metal coins inconvenient for large transactions, so they began leaving their coins with trusted agents in exchange for paper receipts. These receipts could be traded among merchants and later exchanged back for coins.\nBy the eleventh century, the Song government had recognized the usefulness of this system and began issuing official paper notes. Government control brought both advantages and risks. On the one hand, official notes were accepted throughout the empire. On the other hand, the government could print as many notes as it wished, and during times of war it often printed far more than it could support. The result was inflation: prices rose sharply, and the notes lost much of their value.\nEuropean travelers such as Marco Polo described Chinese paper money with amazement, but the idea spread slowly. It was not until the seventeenth century that banks in Sweden and England began issuing paper notes of their own. Today, paper money is used everywhere, although electronic payments are steadily replacing it in many countries.","questions":[{"q":"Why did merchants in the Tang dynasty begin using paper receipts?","options":["Metal coins were inconvenient for large payments.","The government required them to.","Paper was cheaper to produce than metal.","Foreign traders refused to accept coins."],"answer":0,"why":"„found heavy metal coins inconvenient for large transactions“.","skill":"detail"},{"q":"The word \"issuing\" in paragraph 2 is closest in meaning to","options":["collecting","distributing","destroying","designing"],"answer":1,"why":"issue = (offiziell) ausgeben.","skill":"vocab"},{"q":"According to paragraph 2, what was a disadvantage of government-controlled paper money?","options":["It was accepted only in a few cities.","Criminals found it far too easy to make copies of the official notes.","The government sometimes printed too much, which caused prices to rise.","Merchants could not exchange it for coins."],"answer":2,"why":"Zu viel gedrucktes Geld → Inflation.","skill":"detail"},{"q":"Why does the author mention Marco Polo?","options":["To describe a famous Chinese merchant","To argue that paper money was invented in Europe","To explain how paper money quickly reached Europe through trade","To show that Europeans found Chinese paper money remarkable"],"answer":3,"why":"Er beschrieb das Papiergeld „with amazement“.","skill":"purpose"},{"q":"What can be inferred from the last sentence of the passage?","options":["Paper money may become less common in the future.","Sweden was the first country to stop using paper money.","Paper money is no longer printed.","Electronic payments are less secure than cash."],"answer":0,"why":"Elektronische Zahlungen ersetzen Papiergeld „steadily“.","skill":"infer"}]},{"id":"ac06","level":2,"title":"The Science of Habits","text":"Psychologists define a habit as a behavior that has become automatic through repetition. According to one widely used model, every habit consists of three parts: a cue, a routine, and a reward. The cue is a trigger, such as a time of day or a feeling. The routine is the behavior itself, and the reward is the benefit the brain receives, which makes it more likely that the behavior will be repeated.\nResearch suggests that habits form gradually. In one study, participants who tried to adopt a new daily behavior, such as eating fruit at lunch, needed an average of about two months before the action felt automatic. The time varied widely, however, from less than three weeks to almost a year, depending on the person and the complexity of the behavior.\nBecause cues are so powerful, experts often recommend changing the environment rather than relying on willpower alone. Someone who wants to snack less, for example, might simply avoid keeping chips at home. Likewise, placing running shoes next to the door can serve as a cue that makes exercise easier to start.","questions":[{"q":"According to paragraph 1, what is the role of the reward?","options":["It replaces the cue that started the behavior.","It makes the behavior more likely to be repeated.","It reduces the need for repetition.","It signals the start of a routine."],"answer":1,"why":"Die Belohnung macht Wiederholung wahrscheinlicher.","skill":"detail"},{"q":"The word \"gradually\" in paragraph 2 is closest in meaning to","options":["all at once","without effort","slowly over time","only occasionally"],"answer":2,"why":"gradually = allmählich.","skill":"vocab"},{"q":"What did the study described in paragraph 2 find?","options":["Complex habits form faster than simple ones in most people.","Eating fruit is the easiest habit to form.","All habits form in exactly two months.","The time needed to form a habit differed greatly between people."],"answer":3,"why":"Von unter drei Wochen bis fast ein Jahr.","skill":"detail"},{"q":"Why does the author mention running shoes?","options":["To give an example of using the environment as a cue","To recommend a particular type of shoe","To show that exercise is an especially difficult habit to form","To compare exercise with snacking"],"answer":0,"why":"Schuhe an der Tür als Auslöser.","skill":"purpose"},{"q":"What can be inferred about willpower?","options":["It increases with repetition.","It may be less effective than changing one's surroundings.","It has no connection to habits.","It is the most important factor in forming habits."],"answer":1,"why":"„changing the environment rather than relying on willpower alone“.","skill":"infer"}]},{"id":"ac07","level":1,"title":"The Journey of Coffee","text":"Coffee is one of the most popular drinks in the world, and it has a surprisingly long history. According to a well-known story, a goat herder in Ethiopia noticed that his goats became very energetic after eating red berries from a certain bush. He tried the berries himself and felt more awake.\nWhether or not the story is true, we know that by the fifteenth century, people in Yemen were roasting coffee beans and making a drink from them. Coffee houses soon opened in cities across the Middle East. They became popular places where people met to talk, listen to music, and share news.\nIn the seventeenth century, coffee arrived in Europe. At first, some people were suspicious of the new drink, but it quickly became fashionable. Today, coffee is grown in more than fifty countries, and Brazil produces more coffee than any other nation.","questions":[{"q":"What is the passage mainly about?","options":["Coffee houses in modern cities","How to grow coffee plants","The history of coffee","Why goats like berries"],"answer":2,"why":"Der Text erzählt die Geschichte des Kaffees.","skill":"main"},{"q":"According to the story, what did the goat herder notice?","options":["The bush grew much faster than other plants nearby.","The berries tasted sweet.","His goats became sick.","His goats had more energy after eating certain berries."],"answer":3,"why":"„became very energetic after eating red berries“.","skill":"detail"},{"q":"What does the author say about the goat herder story?","options":["It might not be true.","It took place in Yemen.","It is only told in Europe.","It is definitely true."],"answer":0,"why":"„Whether or not the story is true …“","skill":"detail"},{"q":"According to paragraph 2, what did people do in coffee houses?","options":["They studied medicine.","They talked and shared news.","They roasted beans for export.","They grew coffee plants."],"answer":1,"why":"„met to talk, listen to music, and share news“.","skill":"detail"},{"q":"Which country produces the most coffee today?","options":["Italy","Ethiopia","Brazil","Yemen"],"answer":2,"why":"„Brazil produces more coffee than any other nation“.","skill":"detail"}]},{"id":"ac08","level":3,"title":"The Problem of Antibiotic Resistance","text":"Since their introduction in the 1940s, antibiotics have transformed medicine, turning once-fatal infections into routine illnesses. Yet their very success has created a formidable problem. Bacteria reproduce rapidly, and random genetic mutations occasionally render some individuals less vulnerable to a particular drug. When an antibiotic is administered, susceptible bacteria die, but resistant ones survive and multiply, gradually producing populations that the drug can no longer control.\nCompounding this process, bacteria can exchange genetic material directly, sometimes even across species, through a mechanism known as horizontal gene transfer. A resistance gene that arises in one organism may therefore spread far more quickly than inheritance alone would allow.\nHuman behavior accelerates the problem. Antibiotics are frequently prescribed for viral infections, against which they are entirely ineffective, and patients often stop treatment once symptoms subside, potentially leaving the hardiest bacteria alive. Meanwhile, pharmaceutical companies have little financial incentive to develop new antibiotics, which are typically used sparingly and for short periods, making them far less profitable than medications for chronic conditions.","questions":[{"q":"According to paragraph 1, why do resistant bacteria become more common?","options":["Antibiotics cause them to mutate.","They attack susceptible bacteria.","They reproduce more slowly than other bacteria.","They survive treatment while other bacteria die."],"answer":3,"why":"Empfindliche sterben, resistente vermehren sich.","skill":"detail"},{"q":"The word \"formidable\" in paragraph 1 is closest in meaning to","options":["daunting","temporary","unexpected","minor"],"answer":0,"why":"formidable = gewaltig, schwerwiegend.","skill":"vocab"},{"q":"What does paragraph 2 suggest about horizontal gene transfer?","options":["It makes bacteria more vulnerable to drugs.","It lets resistance spread faster than through reproduction alone.","It only occurs within a single species.","It prevents new mutations from appearing in most types of bacteria."],"answer":1,"why":"„far more quickly than inheritance alone would allow“.","skill":"infer"},{"q":"Why does the author mention viral infections?","options":["To compare the size of viruses with the size of bacteria","To show that antibiotics work against viruses","To give an example of antibiotics being used inappropriately","To explain how viruses become resistant"],"answer":2,"why":"Antibiotika wirken nicht gegen Viren, werden aber verschrieben.","skill":"purpose"},{"q":"What can be inferred about why few new antibiotics are developed?","options":["Scientists believe enough antibiotics already exist.","They are illegal in many countries.","They cannot be tested on patients.","They are not very profitable for drug companies."],"answer":3,"why":"„little financial incentive … far less profitable“.","skill":"infer"}]},{"id":"ac09","level":2,"title":"How Wolves Became Dogs","text":"Dogs were the first animals to be domesticated, long before sheep, goats, or cattle. Genetic studies indicate that they descend from an extinct population of wolves and that the split occurred at least 15,000 years ago, when humans still lived as hunter-gatherers.\nHow did a dangerous predator become a companion? One popular hypothesis suggests that wolves largely domesticated themselves. According to this view, the boldest wolves began to scavenge leftover food near human camps. Animals that were less fearful and less aggressive obtained more food and therefore raised more offspring. Over many generations, this process produced tamer animals without any deliberate plan on the part of humans.\nA famous experiment supports the idea that selecting for tameness alone can transform a species. Beginning in 1959, Soviet scientists bred only the friendliest foxes from each generation. Within a few decades, the foxes not only sought human contact but had also developed floppy ears, curled tails, and spotted coats, features typical of dogs but rare in wild animals.\nOnce dogs lived alongside people, both sides benefited. Dogs warned of danger and helped in hunting, while humans provided a reliable source of food.","questions":[{"q":"According to paragraph 1, what is true about the domestication of dogs?","options":["It involved wolves that still exist today.","It took place before people kept farm animals.","It happened later than that of goats.","It began when humans started to grow crops."],"answer":1,"why":"„long before sheep, goats, or cattle“; Menschen waren noch Jäger und Sammler.","skill":"detail"},{"q":"The word \"deliberate\" in paragraph 2 is closest in meaning to","options":["successful","complicated","intentional","dangerous"],"answer":2,"why":"deliberate = absichtlich.","skill":"vocab"},{"q":"Why does the author describe the fox experiment?","options":["To suggest that dogs are descended from wild foxes","To argue that foxes make better and safer companions than wolves ever could","To explain why Soviet scientists were interested in dogs","To show that breeding for friendliness alone can change a species"],"answer":3,"why":"Das Experiment stützt die Selbstdomestikations-Hypothese.","skill":"purpose"},{"q":"What can be inferred about wolves that stayed away from human camps?","options":["They were unlikely to become the ancestors of dogs.","They were hunted by the people in the camps.","They soon developed spotted coats as well.","They had far more offspring than the bolder wolves did."],"answer":0,"why":"Nur die zutraulichen Wölfe profitierten vom Futter und vermehrten sich in Menschennähe.","skill":"infer"},{"q":"According to paragraph 4, how did humans benefit from dogs?","options":["Dogs kept their camps free of leftover food.","Dogs alerted them to threats and assisted with hunting.","Dogs protected their sheep and goats from wolves at night.","Dogs carried supplies between distant camps."],"answer":1,"why":"„Dogs warned of danger and helped in hunting“.","skill":"detail"}]},{"id":"ac10","level":1,"title":"How Emperor Penguins Stay Warm","text":"Emperor penguins live in Antarctica, the coldest place on Earth. In winter, the temperature can fall to minus forty degrees, and strong winds make it feel even colder. How do these birds survive?\nFirst, their bodies are built for the cold. Under the skin, penguins have a thick layer of fat that keeps heat inside. Their feathers are short and very close together, so wind and water cannot reach the skin.\nSecond, penguins work as a team. Thousands of birds stand close together in a large group called a huddle. The penguins in the middle are warm, while those on the outside are cold. But the birds do not stay in one place. They slowly move, so every penguin spends some time in the warm center.\nFinally, emperor penguins can go without food for a long time. A male penguin eats nothing for about two months while he keeps the egg warm on his feet. During this time, he lives on the fat in his body.","questions":[{"q":"What is the passage mainly about?","options":["What emperor penguins eat in winter","How emperor penguins raise their young","How emperor penguins survive extreme cold","Why emperor penguins live in large groups"],"answer":2,"why":"Drei Gründe, warum die Pinguine die Kälte überstehen.","skill":"main"},{"q":"According to paragraph 2, why can't wind and water reach a penguin's skin?","options":["Its body is always turned away from the wind.","Its skin is covered with a layer of ice.","Its fat forms a layer on top of the feathers.","Its feathers are short and tightly packed."],"answer":3,"why":"„short and very close together“.","skill":"detail"},{"q":"The word \"survive\" in paragraph 1 is closest in meaning to","options":["stay alive","keep quiet","find food","move fast"],"answer":0,"why":"survive = überleben.","skill":"vocab"},{"q":"Why do the penguins in a huddle keep moving?","options":["So that the wind cannot blow them over","So that each bird gets a turn in the warm middle","So that they can look for food together","So that the eggs do not touch the ice"],"answer":1,"why":"„every penguin spends some time in the warm center“.","skill":"detail"},{"q":"What does a male penguin do for about two months?","options":["He builds a nest out of small stones.","He searches for food far out at sea.","He keeps the egg warm without eating.","He stands on the outside of the huddle."],"answer":2,"why":"Er frisst zwei Monate nichts und wärmt das Ei auf den Füßen.","skill":"detail"}]},{"id":"ac11","level":1,"title":"Why Onions Make Us Cry","text":"Almost everyone has cried while cutting an onion. But why does this happen? The answer is chemistry.\nOnions grow under the ground, where small animals might eat them. To protect itself, the onion takes in a substance called sulfur from the soil and stores it in its cells. When a knife cuts through the onion, the cells break open. The chemicals inside mix together and form a gas. This gas rises into the air and reaches our eyes. There, it mixes with the water in our eyes and makes a weak acid. The acid burns a little, so our eyes produce tears to wash it away.\nLuckily, there are simple ways to reduce the tears. A cold onion releases less gas, so you can put the onion in the refrigerator before cutting it. A sharp knife also helps because it breaks fewer cells. Some cooks even cut onions under running water.","questions":[{"q":"According to the passage, why do onions store sulfur?","options":["To grow faster under the ground","To keep water inside their cells","To make their taste sweeter","To protect themselves from animals"],"answer":3,"why":"„To protect itself, the onion takes in … sulfur“.","skill":"detail"},{"q":"What happens when an onion is cut?","options":["Its cells break, and a gas forms.","Its smell disappears after a while.","Its sulfur turns into a weak acid.","Its cells take in water from the air."],"answer":0,"why":"Zellen platzen, die Stoffe mischen sich zu einem Gas.","skill":"detail"},{"q":"The word \"reduce\" in paragraph 3 is closest in meaning to","options":["explain","lessen","notice","collect"],"answer":1,"why":"reduce = verringern.","skill":"vocab"},{"q":"Why does the author mention the refrigerator?","options":["To describe how the gas is produced","To explain where onions should be stored","To give an example of how to cry less","To show that onions go bad quickly"],"answer":2,"why":"Kalte Zwiebeln geben weniger Gas ab.","skill":"purpose"},{"q":"What can be inferred about cutting a warm onion with a dull knife?","options":["It would stop the gas from forming.","It would make the onion taste bitter.","It would take less time than usual.","It would cause more tears than usual."],"answer":3,"why":"Warm = mehr Gas, stumpfes Messer = mehr zerstörte Zellen.","skill":"infer"}]},{"id":"ac12","level":3,"title":"The Rebound Effect","text":"When a technology uses a resource more efficiently, it seems self-evident that total consumption of that resource should fall. In 1865, however, the English economist William Stanley Jevons observed precisely the opposite. Improvements to the steam engine had made the use of coal far more economical, yet Britain's coal consumption soared.\nJevons's explanation was simple. Greater efficiency lowered the effective cost of steam power, which made it profitable in industries where it had previously been too expensive. The resulting expansion in demand more than offset the savings achieved by each individual engine.\nEconomists now refer to this phenomenon as the rebound effect, and contemporary examples are not hard to find. As car engines have become more fuel-efficient, many drivers have responded by purchasing larger vehicles or traveling greater distances. Similarly, the advent of inexpensive LED lighting has encouraged people to illuminate spaces that were formerly left dark.\nThe rebound is seldom large enough to cancel out the gains entirely; most studies suggest that it erodes somewhere between ten and thirty percent of the expected savings. Nevertheless, it implies that efficiency standards alone are unlikely to deliver the reductions that policymakers anticipate. For this reason, some economists argue that such standards should be accompanied by measures, such as taxes, that keep the cost of consumption from falling.","questions":[{"q":"According to paragraph 1, what did Jevons observe?","options":["Coal use rose although engines had become more efficient.","Britain began to run out of coal in the 1860s.","Efficient engines remained too costly for most British industries.","Steam engines wasted more coal than earlier machines."],"answer":0,"why":"Effizientere Dampfmaschinen, aber stark steigender Kohleverbrauch.","skill":"detail"},{"q":"The word \"erodes\" in paragraph 4 is closest in meaning to","options":["temporarily hides","gradually reduces","greatly exceeds","accurately measures"],"answer":1,"why":"erode = nach und nach abtragen/verringern.","skill":"vocab"},{"q":"Why does the author mention LED lighting?","options":["To argue that older lamps were actually better for the environment","To show that some technologies have no rebound effect","To give a modern example of efficiency leading to greater use","To explain why electricity has become more expensive"],"answer":2,"why":"Billiges Licht → mehr Flächen werden beleuchtet.","skill":"purpose"},{"q":"What can be inferred from paragraph 4 about efficiency standards?","options":["They work only when no taxes are charged.","They usually increase total consumption.","They have been abandoned by most governments.","They save resources, but less than predicted."],"answer":3,"why":"Der Rebound frisst 10–30 % der Einsparung, nicht alles.","skill":"infer"},{"q":"According to the passage, why do some economists propose taxes?","options":["To prevent cheaper use from driving up consumption","To make efficient technology affordable for everyone","To pay for research into more efficient engines","To punish companies that ignore the standards"],"answer":0,"why":"Steuern sollen verhindern, dass die Nutzungskosten sinken.","skill":"detail"}]}]},"writing":{"bas":[{"id":"bas01","level":1,"prompt":"What did you think of the new library?","answer":"The study rooms on the third floor are much quieter than before.","chunks":["the study rooms","on the third floor","are","much quieter","than before"],"why":"Vergleich: Komparativ + than (much quieter than).","skill":"compare"},{"id":"bas02","level":2,"prompt":"Why weren't you at the meeting yesterday?","answer":"I didn't know that it had been moved to the afternoon.","chunks":["I","didn't know","that","it had been","moved","to the afternoon"],"why":"Vorvergangenheit im Passiv: had been + Partizip.","skill":"passive"},{"id":"bas03","level":2,"prompt":"Do you know when the assignment is due?","answer":"The professor said it has to be submitted by Friday.","chunks":["the professor","said","it","has to be","submitted","by Friday"],"why":"Passiv mit Modal: has to be + Partizip.","skill":"passive"},{"id":"bas04","level":2,"prompt":"Where should we meet before the concert?","answer":"Let's meet at the café where we had lunch last week.","chunks":["let's meet","at the café","where","we had","lunch","last week"],"why":"Relativsatz mit where direkt hinter dem Ort.","skill":"relative"},{"id":"bas05","level":3,"prompt":"Have you decided which course to take?","answer":"I'm still trying to figure out which one fits my schedule.","chunks":["I'm still","trying to","figure out","which one","fits","my schedule"],"why":"Indirekte Frage: which one + Verb, keine Inversion.","skill":"indirect"},{"id":"bas06","level":2,"prompt":"How was your internship this summer?","answer":"It was the most useful experience I have ever had.","chunks":["it was","the most","useful experience","I","have ever","had"],"why":"Superlativ + Relativsatz ohne that: the most … I have ever had.","skill":"compare"},{"id":"bas07","level":3,"prompt":"Can you help me move on Saturday?","answer":"I would if I didn't have to work that day.","chunks":["I would","if","I","didn't have","to work","that day"],"why":"Irrealer if-Satz: would …, if + Past.","skill":"cond"},{"id":"bas08","level":2,"prompt":"Why is the cafeteria so crowded today?","answer":"They are offering free coffee to anyone who brings a mug.","chunks":["they are offering","free coffee","to anyone","who","brings","a mug"],"why":"Relativsatz who + Verb mit -s (anyone = Singular).","skill":"relative"},{"id":"bas09","level":1,"prompt":"Did you finish the lab report?","answer":"Not yet, but I should be done by tonight.","chunks":["not yet","but","I","should be","done","by tonight"],"why":"Modal + be + Partizip: should be done.","skill":"verb"},{"id":"bas10","level":3,"prompt":"What did the advisor tell you?","answer":"She asked me whether I had thought about studying abroad.","chunks":["she asked me","whether","I","had thought","about","studying abroad"],"why":"Indirekte Frage: whether + Subjekt + Verb; Präposition + -ing.","skill":"indirect"},{"id":"bas11","level":1,"prompt":"Is the bookstore still open?","answer":"I think it closes at six on weekdays.","chunks":["I think","it","closes","at six","on weekdays"],"why":"Zeitangaben: at + Uhrzeit, on + Tage.","skill":"order"},{"id":"bas12","level":2,"prompt":"Who is giving the guest lecture?","answer":"It is a scientist who worked for NASA for twenty years.","chunks":["it is","a scientist","who","worked","for NASA","for twenty years"],"why":"Relativsatz direkt hinter dem Nomen (a scientist who …).","skill":"relative"},{"id":"bas13","level":1,"prompt":"How do you usually get to campus?","answer":"I usually ride my bike unless it is raining.","chunks":["I","usually","ride my bike","unless","it is","raining"],"why":"Häufigkeitsadverb vor dem Vollverb (I usually ride).","skill":"order"},{"id":"bas14","level":3,"prompt":"Why did you choose this university?","answer":"Its engineering program is known for its close ties to industry.","chunks":["its engineering program","is known","for","its close ties","to industry"],"why":"Feste Verbindung: be known for; ties to.","skill":"order"},{"id":"bas15","level":1,"prompt":"Can you tell me where the registrar's office is?","answer":"It is located on the second floor of the administration building.","chunks":["it is","located","on the second floor","of","the administration building"],"why":"be located on the … floor.","skill":"order"},{"id":"bas16","level":1,"prompt":"What should I bring to the job fair?","answer":"You should bring several copies of your resume.","chunks":["you should","bring","several copies","of","your resume"],"why":"Modal + Grundform: should bring.","skill":"verb"},{"id":"bas17","level":2,"prompt":"Has the professor graded our exams yet?","answer":"She said the results would be posted next Monday.","chunks":["she said","the results","would be","posted","next Monday"],"why":"Indirekte Rede: will → would; Passiv would be posted.","skill":"indirect"},{"id":"bas18","level":3,"prompt":"Why are you studying in the hallway?","answer":"The room I reserved was already being used by another group.","chunks":["the room","I reserved","was already","being used","by","another group"],"why":"Passiv Verlaufsform: was being used.","skill":"passive"},{"id":"bas19","level":3,"prompt":"Are you going to the conference in March?","answer":"Only if my department agrees to pay for the trip.","chunks":["only if","my department","agrees","to pay","for the trip"],"why":"agree + to + Grundform; Present Simple nach if.","skill":"cond"},{"id":"bas20","level":3,"prompt":"What surprised you most about the city?","answer":"What surprised me most was how friendly everyone was.","chunks":["what surprised me","most","was","how friendly","everyone","was"],"why":"Cleft Sentence What … was + indirekte Frage how friendly everyone was.","skill":"indirect"},{"id":"bas21","level":2,"prompt":"Did you enjoy the book I lent you?","answer":"I enjoyed it so much that I finished it in two days.","chunks":["I enjoyed it","so much","that","I finished it","in two days"],"why":"so … that = so sehr, dass.","skill":"compare"},{"id":"bas22","level":2,"prompt":"Should we take the train or drive?","answer":"Taking the train would be faster than driving in this traffic.","chunks":["taking the train","would be","faster","than","driving","in this traffic"],"why":"-ing-Form als Subjekt (Taking the train …).","skill":"verb"},{"id":"bas23","level":3,"prompt":"Why did the event get canceled?","answer":"Not enough people had signed up by the deadline.","chunks":["not enough","people","had signed up","by","the deadline"],"why":"by + Zeitpunkt → Past Perfect (had signed up).","skill":"verb"},{"id":"bas24","level":1,"prompt":"Do you mind if I open the window?","answer":"Not at all, as long as it doesn't get too cold.","chunks":["not at all","as long as","it","doesn't get","too cold"],"why":"as long as + Present Simple = solange.","skill":"cond"},{"id":"bas25","level":1,"prompt":"Where did you buy that jacket?","answer":"I bought it at a small shop near the station.","chunks":["I bought it","at a small shop","near","the station"],"why":"Ortsangabe: at a shop near …","skill":"order"},{"id":"bas26","level":1,"prompt":"Are you coming to dinner tonight?","answer":"I can't, because I have to study for my exam.","chunks":["I can't","because","I have to","study","for my exam"],"why":"have to + Grundform.","skill":"verb"},{"id":"bas27","level":2,"prompt":"What did the doctor tell you?","answer":"She told me to get more rest and drink more water.","chunks":["she told me","to get","more rest","and","drink more water"],"why":"tell sb to + Grundform.","skill":"verb"},{"id":"bas28","level":2,"prompt":"How long have you been learning Spanish?","answer":"I have been taking classes for almost two years.","chunks":["I have been","taking classes","for","almost","two years"],"why":"Present Perfect Continuous + for + Zeitraum.","skill":"verb"},{"id":"bas29","level":2,"prompt":"Why didn't you answer my call?","answer":"My phone was turned off while I was in the library.","chunks":["my phone","was turned off","while","I was","in the library"],"why":"Passiv Past: was turned off; while + Satz.","skill":"passive"},{"id":"bas30","level":3,"prompt":"What do you think of the new policy?","answer":"I doubt it will be as effective as the administration hopes.","chunks":["I doubt","it will be","as effective","as","the administration","hopes"],"why":"Vergleich: as + Adjektiv + as.","skill":"compare"},{"id":"bas31","level":3,"prompt":"Should I take the advanced course?","answer":"Only if you have already completed the introductory one.","chunks":["only if","you have","already completed","the introductory one"],"why":"already zwischen have und Partizip.","skill":"cond"},{"id":"bas32","level":2,"prompt":"Where can I find information about scholarships?","answer":"The financial aid office has a list of all the scholarships available.","chunks":["the financial aid office","has","a list of","all the scholarships","available"],"why":"available kann nach dem Nomen stehen.","skill":"order"},{"id":"bas33","level":1,"prompt":"When does the semester start?","answer":"Classes begin on the first Monday in September.","chunks":["classes","begin","on the first Monday","in September"],"why":"on + Tag, in + Monat.","skill":"order"},{"id":"bas34","level":3,"prompt":"Why was the experiment repeated?","answer":"The first results were too unusual to be trusted.","chunks":["the first results","were","too unusual","to be","trusted"],"why":"too + Adjektiv + to + Infinitiv (Passiv).","skill":"compare"},{"id":"bas35","level":2,"prompt":"Do you know who left these books here?","answer":"I think they belong to the student who sat by the window.","chunks":["I think","they belong to","the student","who","sat","by the window"],"why":"Relativsatz who direkt hinter dem Nomen.","skill":"relative"},{"id":"bas36","level":3,"prompt":"Has the committee made a decision?","answer":"Not yet, but they are expected to announce it next week.","chunks":["not yet","but","they are","expected to","announce it","next week"],"why":"be expected to + Grundform.","skill":"passive"},{"id":"bas37","level":1,"prompt":"What are you doing this weekend?","answer":"I am going to visit my grandparents in the country.","chunks":["I am going","to visit","my grandparents","in the country"],"why":"going to + Grundform für Pläne.","skill":"verb"},{"id":"bas38","level":2,"prompt":"Why are you moving to a new apartment?","answer":"My current one is too far from where I work.","chunks":["my current one","is","too far","from","where I work"],"why":"too far from + Nebensatz (where I work).","skill":"relative"},{"id":"bas39","level":3,"prompt":"What would you change about the course?","answer":"I would have liked more opportunities to discuss the readings.","chunks":["I would have liked","more opportunities","to discuss","the readings"],"why":"would have liked = hätte gern gehabt.","skill":"cond"},{"id":"bas40","level":2,"prompt":"Can you recommend a good place to study?","answer":"The café on the corner is quiet enough to concentrate.","chunks":["the café","on the corner","is","quiet enough","to concentrate"],"why":"Adjektiv + enough + to + Grundform.","skill":"compare"}],"email":[{"id":"em01","level":2,"situation":"You recently bought a used bicycle through your university's online marketplace. When it arrived, you discovered that the brakes do not work properly, although the listing described the bicycle as being in \"excellent condition.\"","recipient":"the seller, Chris","tasks":["Explain why you chose to buy this bicycle.","Describe the problem with the bicycle.","Suggest a way to resolve the situation."]},{"id":"em02","level":2,"situation":"You are taking an online course. The course website says that the final project can be completed alone or in pairs. You would like to work with a classmate who is enrolled in a different section of the same course.","recipient":"your instructor, Dr. Patel","tasks":["Explain your idea for the project.","Explain why you want to work with this classmate.","Ask whether this arrangement is allowed."]},{"id":"em03","level":2,"situation":"Your neighbor in your apartment building often plays loud music late at night. You have important exams next week and need to sleep well.","recipient":"your neighbor, Alex","tasks":["Introduce yourself and explain why you are writing.","Describe how the noise affects you.","Suggest a solution that would work for both of you."]},{"id":"em04","level":2,"situation":"Last week you attended a free career workshop organized by your university. You found it very helpful, but one session ran out of time before the speaker could answer questions from the audience.","recipient":"the workshop organizer, Ms. Romero","tasks":["Explain what you found most helpful.","Describe the problem with the session.","Suggest an improvement for future workshops."]},{"id":"em05","level":2,"situation":"A friend who lives in another city is visiting you next month and has asked for advice about what to do during the visit. You have just started a new part-time job and will have to work on one of the days of the visit.","recipient":"your friend, Jamie","tasks":["Recommend two things to do in your city.","Explain the problem with your schedule.","Suggest how you could still spend time together."]},{"id":"em06","level":2,"situation":"Two weeks ago, you ordered a textbook from an online store for a class that starts on Monday. The store's website says the order has been shipped, but you have not received it, and the tracking number does not work.","recipient":"the store's customer service team","tasks":["Give the details of your order.","Explain why you need the book urgently.","Ask for a specific solution."]},{"id":"em07","level":2,"situation":"You are a member of a student hiking club. The club is planning its first trip of the semester, and the organizer has asked members for ideas. You know a trail near the city that would be suitable, but you will be away on the weekend the trip is currently planned.","recipient":"the club organizer, Sam","tasks":["Describe the trail you would recommend.","Explain why it would be good for the club.","Explain your problem with the date and ask about other options."]},{"id":"em08","level":2,"situation":"You recently received your grade for a group project. The grade was lower than you expected, and the feedback says that the group did not include enough data. However, your part of the project contained a large data analysis that does not seem to have been considered.","recipient":"your professor, Dr. Moore","tasks":["Thank the professor for the feedback.","Explain what you contributed to the project.","Politely ask whether the grade could be reviewed."]},{"id":"em09","level":2,"situation":"You live in a university apartment. For two weeks, the internet in your building has been very slow, which makes it difficult to attend your online classes. You have already restarted your router several times.","recipient":"the housing office","tasks":["Describe the problem and how long it has lasted.","Explain how the problem affects your studies.","Request a specific action."]},{"id":"em10","level":2,"situation":"Your former high school teacher, Mr. Becker, helped you a lot when you were applying to universities. You have just been accepted into a competitive program, and you want to tell him the news.","recipient":"Mr. Becker","tasks":["Share your news.","Explain how his help made a difference.","Offer to help his current students in some way."]}],"discussion":[{"id":"di01","level":2,"course":"education","professor":{"name":"Dr. Lin","text":"Many universities now record their lectures and post them online. Some educators believe this helps students learn, while others worry that it reduces class attendance and engagement. Should universities record all lectures and make them available online? Why or why not?"},"students":[{"name":"Mia","text":"I think recording lectures is essential. Students who are sick or have to work can still keep up, and everyone can rewatch difficult parts before exams. Learning shouldn't depend on being in a room at a certain time."},{"name":"Lucas","text":"I disagree. When lectures are online, many students stop coming to class and fall behind because they never actually watch the recordings. Being there in person also makes it possible to ask questions and discuss ideas with classmates."}]},{"id":"di02","level":2,"course":"urban planning","professor":{"name":"Dr. Okafor","text":"City governments have limited budgets. Some people argue that money should be spent on improving public transportation, while others think it is more important to create more parks and green spaces. Which do you think should be the priority for city spending, and why?"},"students":[{"name":"Sara","text":"Public transportation should come first. Good buses and trains reduce traffic and pollution, and they help people without cars get to jobs and schools."},{"name":"Kevin","text":"I'd choose parks. People need places to relax and exercise, especially in crowded cities. Green spaces also make neighborhoods more attractive and improve mental health."}]},{"id":"di03","level":2,"course":"business management","professor":{"name":"Prof. Harris","text":"Some companies have introduced a four-day work week, in which employees work fewer hours for the same pay. Supporters say this increases productivity and well-being; critics say it is not practical for many businesses. Do you think more companies should adopt a four-day work week? Explain your view."},"students":[{"name":"Anna","text":"Yes. Studies show that people are more focused when they have more time to rest, so they get the same amount of work done in four days. Companies would also attract better employees."},{"name":"Ben","text":"I'm not convinced. Businesses like hospitals or stores need to be open every day, and fewer working days could mean customers wait longer for service."}]},{"id":"di04","level":2,"course":"sociology","professor":{"name":"Dr. Nguyen","text":"Social media allows people to stay in contact with friends and family around the world. However, some researchers argue that it actually makes people feel lonelier. In your opinion, does social media bring people closer together or push them apart? Why?"},"students":[{"name":"Emily","text":"It brings people closer. I keep in touch with friends from my hometown every day, which would be impossible without social media."},{"name":"Ryan","text":"I think it pushes people apart. People spend so much time scrolling that they have less time for real conversations with the people around them."}]},{"id":"di05","level":2,"course":"environmental science","professor":{"name":"Prof. Garcia","text":"To reduce waste, some cities have banned single-use plastic bags and require stores to charge for paper bags. Other cities prefer education campaigns that encourage people to change their habits voluntarily. Which approach is more effective in reducing waste? Why?"},"students":[{"name":"Hannah","text":"Bans work better. People are busy and rarely change their habits unless they have to. After my city banned plastic bags, almost everyone started bringing reusable ones."},{"name":"Omar","text":"I prefer education. Bans can feel unfair, and they don't teach people why reducing waste matters. If people understand the problem, they'll make better choices in many areas, not just with bags."}]},{"id":"di06","level":2,"course":"psychology","professor":{"name":"Dr. Brooks","text":"Some people believe students learn best when they study one subject for a long period, while others think it is better to switch between several subjects during a study session. Which approach do you think is more effective for learning? Explain why."},"students":[{"name":"Julia","text":"Focusing on one subject for a long time works better for me. I need time to really get into a topic, and switching makes me lose concentration."},{"name":"Marcus","text":"Switching between subjects keeps me fresh. After an hour on the same thing, I stop absorbing information, so changing topics helps me stay alert."}]},{"id":"di07","level":2,"course":"public policy","professor":{"name":"Dr. Ramirez","text":"Some cities offer free public transportation to all residents, paid for by taxes. Supporters say this reduces traffic and helps people with low incomes; critics say it is too expensive and that people don't value services they don't pay for. Should public transportation be free? Why or why not?"},"students":[{"name":"Leah","text":"Yes. If buses were free, many more people would leave their cars at home, and cities would be cleaner and less crowded."},{"name":"Daniel","text":"I don't think so. The money would be better spent improving the service. Many people don't take the bus because it's slow or unreliable, not because of the price."}]},{"id":"di08","level":2,"course":"education","professor":{"name":"Prof. Kim","text":"Many universities are considering replacing traditional final exams with projects, such as research papers or presentations. Which is a better way to assess what students have learned: final exams or projects? Explain your view."},"students":[{"name":"Chloe","text":"Projects are better. They show whether students can actually apply what they've learned, and they're closer to what we'll do in our careers."},{"name":"Ethan","text":"Exams are fairer. In group projects, some students do all the work while others get the same grade. Exams show what each person really knows."}]},{"id":"di09","level":2,"course":"technology and society","professor":{"name":"Dr. Shah","text":"Artificial intelligence tools can now write essays, summarize articles, and solve math problems. Some instructors want to ban these tools in their courses, while others want to teach students how to use them responsibly. What approach should universities take, and why?"},"students":[{"name":"Nina","text":"They should be banned for assignments. Otherwise, students won't develop their own writing and thinking skills."},{"name":"Jacob","text":"Banning them is unrealistic. Students will use these tools in their jobs, so universities should teach them to use AI critically and honestly."}]},{"id":"di10","level":2,"course":"economics","professor":{"name":"Prof. Turner","text":"Some people argue that young people should work part-time while they are still in high school or university, while others believe students should focus only on their studies. What is your opinion? Should students work while they study?"},"students":[{"name":"Sophia","text":"Working teaches responsibility and time management, and it gives students experience that employers value."},{"name":"Liam","text":"Students should focus on their studies. A job takes time and energy away from learning, and grades often suffer."}]}]},"listening":{"choose":[{"id":"c01","level":1,"voice":"W","prompt":"Do you know what time the library closes tonight?","options":["Yes, I read that book last week.","I think it's open until ten.","No, I don't have a library card.","It's on the second floor."],"answer":1,"why":"Gefragt ist nach der Uhrzeit – nur diese Antwort nennt eine Zeit.","skill":"wh"},{"id":"c02","level":1,"voice":"M","prompt":"Would you like to get lunch after class?","options":["No, the class is in Room 12.","I had a class this morning.","Sure, I'm starving.","It was a really good lunch."],"answer":2,"why":"Einladung → Zusage. starving = sehr hungrig.","skill":"request"},{"id":"c03","level":1,"voice":"W","prompt":"Where did you park your car?","options":["It's a blue car.","Yes, I parked it.","About twenty minutes ago, I think.","Right behind the science building."],"answer":3,"why":"Where → Ortsangabe.","skill":"wh"},{"id":"c04","level":1,"voice":"M","prompt":"How was your weekend?","options":["Pretty relaxing, thanks.","It's on Saturday.","I'll be away next weekend.","Two days, I think."],"answer":0,"why":"How was …? → Bewertung des vergangenen Wochenendes.","skill":"wh"},{"id":"c05","level":1,"voice":"W","prompt":"Can you lend me a pen?","options":["No, I didn't send it.","Here, you can keep it.","Yes, it's a long essay.","I wrote it yesterday."],"answer":1,"why":"Bitte um einen Stift → Stift wird gegeben.","skill":"request"},{"id":"c06","level":1,"voice":"M","prompt":"Is this seat taken?","options":["The seats are blue.","Yes, I took the class last year.","No, go ahead.","It's very comfortable."],"answer":2,"why":"Is this seat taken? = Ist hier frei? → No, go ahead.","skill":"yn"},{"id":"c07","level":1,"voice":"W","prompt":"Have you finished reading the article for tomorrow?","options":["Yes, I wrote the article.","It was published in a journal.","I'll read it to you tomorrow.","Almost. I just have a few pages left."],"answer":3,"why":"Frage nach dem Stand → fast fertig.","skill":"yn"},{"id":"c08","level":1,"voice":"M","prompt":"Why is the bus so late today?","options":["There's construction on Main Street.","It usually comes every ten minutes.","I take the bus every day.","Yes, it's very late."],"answer":0,"why":"Why → Grund (Baustelle).","skill":"wh"},{"id":"c09","level":2,"voice":"W","prompt":"Didn't you say you were going to the career fair?","options":["Yes, I said it to the professor.","I was, but my shift got moved.","The fair was held in the gym last year.","I'm planning to apply for that job."],"answer":1,"why":"Indirekt: Plan geändert, weil die Schicht verlegt wurde.","skill":"yn"},{"id":"c10","level":2,"voice":"M","prompt":"I can't believe how long this line is.","options":["The line is on the next page.","I can lend you a longer one if you really need it.","Tell me about it. We've been here for twenty minutes.","I believe it's correct."],"answer":2,"why":"Tell me about it = Das kannst du laut sagen (Zustimmung).","skill":"idiom"},{"id":"c11","level":2,"voice":"W","prompt":"Do you want me to save you a seat at the lecture?","options":["The lecture was about economics.","I saved all my notes on my laptop.","No, I don't have any money left this month.","That would be great. I'm running a bit late."],"answer":3,"why":"save a seat = Platz freihalten; die anderen spielen mit „save“ (speichern, sparen).","skill":"request"},{"id":"c12","level":2,"voice":"M","prompt":"Has anyone seen the remote for the projector?","options":["Check the drawer under the desk.","I've never been to that room.","Yes, I saw that movie.","The projector is brand new."],"answer":0,"why":"Indirekte Hilfe: Hinweis, wo sie sein könnte.","skill":"yn"},{"id":"c13","level":2,"voice":"W","prompt":"I heard the professor is giving us an extra week for the paper.","options":["She teaches on Mondays and Wednesdays.","Really? That's a relief.","I'd like to read it again.","The paper is ten pages long."],"answer":1,"why":"Reaktion auf eine gute Nachricht: relief = Erleichterung.","skill":"statement"},{"id":"c14","level":2,"voice":"M","prompt":"You're not still working on that lab report, are you?","options":["The lab is on the third floor.","No, I've never worked in a lab like that before.","I'm afraid so. The data took forever to analyze.","The report has ten pages."],"answer":2,"why":"I'm afraid so = leider ja; Grund folgt.","skill":"yn"},{"id":"c15","level":2,"voice":"W","prompt":"Why don't we split the cost of the textbook?","options":["The textbook costs about eighty dollars.","I don't know why it's so expensive.","I split it into three chapters.","Good idea. We can take turns using it."],"answer":3,"why":"Why don't we …? ist ein Vorschlag, keine Frage nach dem Grund.","skill":"request"},{"id":"c16","level":2,"voice":"M","prompt":"Would you mind proofreading my cover letter?","options":["Not at all. Send it over.","I don't mind the weather.","Yes, I'd love to write one.","I covered that topic in class."],"answer":0,"why":"Would you mind …? → Not at all = gern (ich habe nichts dagegen).","skill":"request"},{"id":"c17","level":2,"voice":"W","prompt":"Weren't you supposed to meet with your advisor today?","options":["I'm supposed to graduate in May.","She had to reschedule for Thursday.","I've had the same advisor for two years.","My advisor teaches chemistry."],"answer":1,"why":"Indirekt: Das Treffen wurde verschoben.","skill":"yn"},{"id":"c18","level":2,"voice":"M","prompt":"The printer in the computer lab is out of paper again.","options":["I printed my essay yesterday.","The lab closes at nine.","I'll let the front desk know.","Paper is cheaper online."],"answer":2,"why":"Problem gemeldet → Lösung anbieten.","skill":"statement"},{"id":"c19","level":3,"voice":"W","prompt":"I could have sworn the meeting was at three.","options":["It lasted about three hours.","I swear I'll be there at three.","The meeting room has three windows.","So could I, but the email says two."],"answer":3,"why":"I could have sworn = ich war mir ganz sicher; So could I = ich auch.","skill":"statement"},{"id":"c20","level":3,"voice":"M","prompt":"You might want to double-check those figures before you submit the report.","options":["Good point. I rushed through the last section.","I'll check out a book later.","The figures are in the appendix.","I submitted my application for the program last week."],"answer":0,"why":"Höflicher Rat (You might want to …) → Zustimmung mit Begründung.","skill":"request"},{"id":"c21","level":3,"voice":"W","prompt":"I'm thinking of dropping statistics this semester.","options":["I dropped my phone yesterday.","Are you sure? You'd have to take it eventually anyway.","This semester ends in December.","Statistics show that most students pass the course easily."],"answer":1,"why":"drop a course = einen Kurs abwählen; die Antwort hinterfragt die Entscheidung.","skill":"statement"},{"id":"c22","level":3,"voice":"M","prompt":"Do you happen to know if the gym is open on holidays?","options":["It happened last year as well.","I usually work out on weekends.","I'm not sure, but there's a schedule posted at the entrance.","Happy holidays to you and your whole family as well."],"answer":2,"why":"Nicht wissen, aber Hinweis auf eine Informationsquelle geben.","skill":"yn"},{"id":"c23","level":3,"voice":"W","prompt":"That presentation went better than I expected.","options":["I expect to finish it by Friday.","It's better to present in the morning.","The presentation is next week.","You certainly didn't look nervous."],"answer":3,"why":"Reaktion auf eine Aussage über die Vergangenheit mit passendem Kommentar.","skill":"statement"},{"id":"c24","level":3,"voice":"M","prompt":"If you're heading to the café, could you grab me a coffee?","options":["Sure. The usual?","The coffee machine was fixed yesterday.","The café has new chairs.","I grabbed the wrong bag."],"answer":0,"why":"grab sb a coffee = jemandem einen Kaffee mitbringen; The usual? = wie immer?","skill":"request"},{"id":"c25","level":3,"voice":"W","prompt":"I don't suppose you've had a chance to look at my draft yet?","options":["I suppose the draft is due soon.","Actually, I read it last night. It's really strong.","I haven't drafted anything for my own class yet.","There's a chance of rain later."],"answer":1,"why":"I don't suppose … = höfliche, zurückhaltende Frage; Actually = doch.","skill":"yn"},{"id":"c26","level":3,"voice":"M","prompt":"Isn't it about time we started on the group project?","options":["The group has four members.","We started the course in September.","Definitely. How about Monday after class?","It's about three o'clock."],"answer":2,"why":"Isn't it about time …? = Wir sollten langsam anfangen → Terminvorschlag.","skill":"request"},{"id":"c27","level":1,"voice":"M","prompt":"What time does the next train leave?","options":["I took the train yesterday.","From platform two, I think.","It's a very long train.","In about ten minutes."],"answer":3,"why":"What time → Zeitangabe.","skill":"wh"},{"id":"c28","level":1,"voice":"W","prompt":"Do you want to sit inside or outside?","options":["Outside, if it's not too cold.","I sat there the last time we came.","Yes, I do.","The inside is new."],"answer":0,"why":"Entweder-oder-Frage → eine der Optionen wählen, nicht Yes/No.","skill":"yn"},{"id":"c29","level":1,"voice":"M","prompt":"Who's teaching the history class this term?","options":["It's on Tuesdays and Thursdays.","A new professor, I think. Dr. Lewis.","History started in the morning.","I'm not taking any math classes."],"answer":1,"why":"Who → Person.","skill":"wh"},{"id":"c30","level":1,"voice":"W","prompt":"Could you turn the music down a little?","options":["Yes, it's my favorite song.","I'll turn left at the corner.","Oh, sorry. Is this better?","The music starts at eight."],"answer":2,"why":"Bitte → der Bitte nachkommen.","skill":"request"},{"id":"c31","level":1,"voice":"M","prompt":"How long have you lived in this city?","options":["It's a really big city.","I'm leaving next week.","Near the university.","About three years now."],"answer":3,"why":"How long → Zeitdauer.","skill":"wh"},{"id":"c32","level":1,"voice":"W","prompt":"Are you going to the party on Saturday?","options":["I'd like to, but I have to work.","It was a great party.","On Saturday at seven.","Yes, I went there last week."],"answer":0,"why":"Indirekte Absage mit Grund.","skill":"yn"},{"id":"c33","level":2,"voice":"M","prompt":"Haven't you already handed in the assignment?","options":["I handed out flyers yesterday.","Not yet. I'm still checking the references.","Yes, I'll hand it in tomorrow.","The assignment was easier last year, I think."],"answer":1,"why":"Negativ formulierte Frage: „Not yet“ = noch nicht; „Yes … tomorrow“ widerspricht sich.","skill":"yn"},{"id":"c34","level":2,"voice":"W","prompt":"Why don't you join us for the hike this weekend?","options":["The hike is about ten kilometers.","Because I joined the club last year.","I'd love to. What time are you leaving?","I don't know why they left."],"answer":2,"why":"Why don't you …? = Einladung, keine Frage nach dem Grund.","skill":"request"},{"id":"c35","level":2,"voice":"M","prompt":"I can't find my notes from last week's lecture.","options":["I found the lecture hall easily.","The lecture starts next week.","My notes are very long.","You can borrow mine if you want."],"answer":3,"why":"Problem → Hilfe anbieten.","skill":"statement"},{"id":"c36","level":2,"voice":"W","prompt":"Is it okay if I bring a friend to the study group?","options":["Sure, the more the merrier.","I studied with friends in high school.","Okay, I'll bring the books.","The group meets in the library."],"answer":0,"why":"the more the merrier = je mehr, desto besser (Zustimmung).","skill":"idiom"},{"id":"c37","level":2,"voice":"M","prompt":"Didn't the professor say the exam would be open-book?","options":["She's a very good professor.","Only for the second part, I think.","The exam room is closed.","I opened the book this morning."],"answer":1,"why":"Präzisierende Antwort auf eine Rückfrage.","skill":"yn"},{"id":"c38","level":2,"voice":"W","prompt":"You look exhausted. Late night?","options":["No, I'm not late at all.","I'll be there tonight.","Yeah, I was up finishing my report.","It gets dark early these days."],"answer":2,"why":"Late night? = Lange aufgeblieben? → Bestätigung mit Grund.","skill":"statement"},{"id":"c39","level":3,"voice":"M","prompt":"I was under the impression the deadline had been pushed back.","options":["The impression was very positive.","I pushed the door, but it was locked.","The deadline is printed on the back.","It was, but only for the graduate students."],"answer":3,"why":"under the impression = dachte; pushed back = verschoben.","skill":"statement"},{"id":"c40","level":3,"voice":"W","prompt":"You wouldn't happen to have a spare charger, would you?","options":["I might. What kind of phone do you have?","No, I don't charge for that.","My phone is fully charged.","I happened to see him yesterday."],"answer":0,"why":"Sehr höfliche, indirekte Bitte → Gegenfrage, um helfen zu können.","skill":"request"},{"id":"c41","level":3,"voice":"M","prompt":"If I were you, I'd ask for an extension.","options":["Yes, you were right about the extension cord.","I might, but I'd hate to fall even further behind.","The extension is on the second floor.","I asked him yesterday where you were."],"answer":1,"why":"Ratschlag → abwägende Reaktion; die anderen spielen mit „extension“.","skill":"request"},{"id":"c42","level":3,"voice":"W","prompt":"It's a shame the concert was canceled.","options":["I'll cancel my order for the new speakers tomorrow.","The tickets are still on sale.","Tell me about it. I'd been looking forward to it for weeks.","Yes, it was a great concert."],"answer":2,"why":"Tell me about it = volle Zustimmung.","skill":"idiom"},{"id":"c43","level":3,"voice":"M","prompt":"Remind me why we decided to take the scenic route?","options":["We decided to take a photo.","The route is about fifty miles from here, I believe.","I'll remind you tomorrow.","Because you said the highway would be packed."],"answer":3,"why":"Remind me why … = Warum noch mal …? → Grund.","skill":"wh"},{"id":"c44","level":3,"voice":"W","prompt":"Don't tell me you've already finished the whole novel.","options":["I couldn't put it down.","I've never read that author.","The novel has three hundred pages.","I won't tell anyone."],"answer":0,"why":"Don't tell me … drückt Erstaunen aus; couldn't put it down = konnte nicht aufhören.","skill":"idiom"},{"id":"c45","level":1,"voice":"W","skill":"wh","prompt":"When is your next class?","options":["It's my favorite class this semester.","At two, in the science building.","Yes, I have a class with Dr. Hill.","Last semester, I think, in room four."],"answer":1,"why":"When → Zeitangabe."},{"id":"c46","level":1,"voice":"M","skill":"request","prompt":"Could you hold the door for me?","options":["I'm holding a meeting.","The door is made of wood.","Of course. Go ahead.","No, it's on the left."],"answer":2,"why":"Bitte → zusagen und ausführen."},{"id":"c47","level":1,"voice":"W","skill":"wh","prompt":"How do you like your new roommate?","options":["On the third floor, next to the stairs.","I like the room. It's very bright.","Since September, when classes began.","She's great. We get along well."],"answer":3,"why":"How do you like …? fragt nach der Meinung über die Person, nicht über das Zimmer."},{"id":"c48","level":1,"voice":"M","skill":"yn","prompt":"Is the cafeteria open on Sundays?","options":["Only until two, I think.","I had pasta there last Sunday.","It's right next to the new gym.","Yes, I opened it this morning."],"answer":0,"why":"Ja/Nein-Frage → eingeschränktes Ja mit Zeitangabe."},{"id":"c49","level":1,"voice":"W","skill":"statement","prompt":"Thanks for helping me with my homework.","options":["Yes, please. That would be great.","No problem. Anytime.","I'm fine, thanks. How are you?","It's due on Friday, I think."],"answer":1,"why":"Dank → No problem / Anytime."},{"id":"c50","level":1,"voice":"M","skill":"wh","prompt":"Whose backpack is this?","options":["I bought it online.","It's blue and black.","I think it's Maria's.","It's under the table."],"answer":2,"why":"Whose → Besitzer nennen."},{"id":"c51","level":1,"voice":"W","skill":"request","prompt":"Would you like some more coffee?","options":["Yes, I like it very much there.","The coffee shop closes at five.","I made it early this morning.","No, thanks. I've had enough."],"answer":3,"why":"Angebot → höflich annehmen oder ablehnen."},{"id":"c52","level":1,"voice":"M","skill":"wh","prompt":"How far is the train station from here?","options":["About a ten-minute walk.","At nine thirty.","The train was very fast.","By bus, usually."],"answer":0,"why":"How far → Entfernung, nicht Uhrzeit oder Verkehrsmittel."},{"id":"c53","level":1,"voice":"W","skill":"statement","prompt":"I'm sorry I'm late.","options":["The late bus leaves at eleven.","That's okay. We just started.","You're welcome. Come back soon.","Yes, see you later tonight."],"answer":1,"why":"Entschuldigung → That's okay."},{"id":"c54","level":1,"voice":"M","skill":"request","prompt":"Do you have a minute to talk?","options":["No, I have two.","I talked to him yesterday.","Sure. What's up?","It takes sixty seconds."],"answer":2,"why":"Do you have a minute? = Hast du kurz Zeit? → zusagen und nachfragen."},{"id":"c55","level":1,"voice":"W","skill":"wh","prompt":"Which bus goes downtown?","options":["Downtown is busy.","Every fifteen minutes.","It's two dollars.","The number five."],"answer":3,"why":"Which bus → Linie nennen."},{"id":"c56","level":1,"voice":"M","skill":"yn","prompt":"Did you remember to bring the tickets?","options":["Yes, they're in my bag.","I remember that movie.","They cost twenty dollars.","No, I'll bring you there."],"answer":0,"why":"Ja/Nein-Frage → Bestätigung mit passendem Zusatz."},{"id":"c57","level":1,"voice":"W","skill":"request","prompt":"Let's take a short break.","options":["It broke yesterday, I'm afraid.","Good idea. I need some water.","It's too short for me, really.","I took it already this morning."],"answer":1,"why":"Let's … = Vorschlag → zustimmen."},{"id":"c58","level":1,"voice":"M","skill":"wh","prompt":"What's the weather supposed to be like tomorrow?","options":["Tomorrow is Tuesday.","Yes, I'm supposed to go.","Sunny and warm, I heard.","I like warm weather."],"answer":2,"why":"What … like? → Beschreibung; W-Frage nie mit Yes beantworten."},{"id":"c59","level":2,"voice":"W","skill":"yn","prompt":"You haven't seen my keys anywhere, have you?","options":["Yes, I've seen that movie three times.","No, I have my own key to the house.","The kitchen is very clean today, isn't it?","I think they're on the kitchen counter."],"answer":3,"why":"Frageanhängsel (have you?) → hilfreiche Auskunft statt bloßem Ja/Nein."},{"id":"c60","level":2,"voice":"M","skill":"request","prompt":"How about getting some fresh air?","options":["Sounds good. Let me grab my jacket.","The air conditioner is brand new.","About ten minutes ago, I think.","It's fresh from the bakery downtown."],"answer":0,"why":"How about + -ing = Vorschlag → zustimmen."},{"id":"c61","level":2,"voice":"W","skill":"statement","prompt":"I thought the exam was pretty tough.","options":["Yes, I think so. It's tomorrow at nine.","Really? I found it easier than the last one.","It's on the fifth of May, in the main hall.","I thought about it, too, but I can't go."],"answer":1,"why":"Meinung → eigene Einschätzung dagegenstellen."},{"id":"c62","level":2,"voice":"M","skill":"yn","prompt":"Shouldn't we let the professor know we'll be absent?","options":["She knows the subject very well.","No, we should be absent more.","I already sent her an email.","Yes, she is absent again today."],"answer":2,"why":"Verneinte Frage = Vorschlag/Erinnerung → schon erledigt."},{"id":"c63","level":2,"voice":"W","skill":"request","prompt":"Would it be all right if I left a few minutes early?","options":["Turn left at the corner, then right.","Yes, I left it there this morning.","It's right, but it's not early.","That's fine. Just sign out first."],"answer":3,"why":"Bitte um Erlaubnis → Erlaubnis mit Bedingung; left = Vergangenheit von leave."},{"id":"c64","level":2,"voice":"M","skill":"statement","prompt":"My laptop keeps freezing during video calls.","options":["Have you tried restarting it?","I'll call you by video later.","It's cold in here, too.","Keep it in the freezer."],"answer":0,"why":"Problem → Lösungsvorschlag; freeze = hängen bleiben."},{"id":"c65","level":2,"voice":"W","skill":"yn","prompt":"Do you want to drive, or should I?","options":["Yes, I do. Thanks for asking me.","I'd rather you did. I'm exhausted.","It's a long drive to the coast.","I should have, I guess. Sorry."],"answer":1,"why":"Entweder-oder-Frage → eine Möglichkeit wählen, kein Yes/No."},{"id":"c66","level":2,"voice":"M","skill":"wh","prompt":"How come you didn't sign up for the workshop?","options":["I came by bus, as I always
