do.","I signed the birthday card already.","It was already full when I checked.","The workshop is on Friday at ten."],"answer":2,"why":"How come = Warum → Grund nennen."},{"id":"c67","level":2,"voice":"W","skill":"statement","prompt":"I'll pick up the pizza on my way over.","options":["I picked it up last week.","The way is very long from here.","Yes, pick me up at the station.","Perfect. I'll set the table."],"answer":3,"why":"Ankündigung → passende eigene Handlung."},{"id":"c68","level":2,"voice":"M","skill":"yn","prompt":"That was quite a lecture, wasn't it?","options":["It was. I didn't expect it to be so interesting.","No, it's at ten. We still have plenty of time.","It was quite quiet there, so I could study.","Yes, I'll be there. Save me a seat, please."],"answer":0,"why":"Frageanhängsel → zustimmen und ergänzen; quite ≠ quiet."},{"id":"c69","level":2,"voice":"W","skill":"idiom","prompt":"Could you give me a hand with these boxes?","options":["My hand is much better, thanks.","Sure. Where do you want them?","I gave it to her yesterday.","They're made of thick cardboard."],"answer":1,"why":"give someone a hand = helfen."},{"id":"c70","level":2,"voice":"M","skill":"statement","prompt":"I'm afraid I won't be able to make it to dinner.","options":["Don't be afraid. It's perfectly safe.","I'll make it for you, if you like.","That's too bad. Maybe next time.","Dinner was delicious. Thank you."],"answer":2,"why":"I'm afraid = leider; make it = es schaffen zu kommen → Bedauern."},{"id":"c71","level":2,"voice":"W","skill":"yn","prompt":"Do you know whether the bookstore buys back used textbooks?","options":["Yes, I know the store. It's on Main Street.","I bought mine new, so they cost a lot.","The weather is fine, so let's walk there.","They do, but only at the end of the term."],"answer":3,"why":"Eingebettete Frage: gefragt ist die Auskunft, nicht „ob du es weißt“."},{"id":"c72","level":2,"voice":"M","skill":"idiom","prompt":"What do you say we order in tonight?","options":["Fine by me. I don't feel like cooking.","I said it last night, but nobody heard.","I'd say he's about seven years old.","The order is wrong. I asked for soup."],"answer":0,"why":"What do you say we …? = Vorschlag; order in = Essen liefern lassen."},{"id":"c73","level":2,"voice":"W","skill":"yn","prompt":"Is this where the line for registration starts?","options":["It starts at nine, I believe.","No, it's around the corner.","Yes, I registered last week.","The line is long but straight."],"answer":1,"why":"Gefragt ist der Ort (where … starts), nicht die Uhrzeit."},{"id":"c74","level":2,"voice":"M","skill":"statement","prompt":"I can't decide between the two apartments.","options":["I decided yesterday afternoon.","Yes, you can, if you hurry up.","Which one is closer to campus?","There are two of them upstairs."],"answer":2,"why":"Unentschlossenheit → Rückfrage, die bei der Entscheidung hilft."},{"id":"c75","level":3,"voice":"W","skill":"idiom","prompt":"I take it the interview didn't go as planned.","options":["Yes, you can take it. I don't need it anymore.","I planned it for Monday, but then it rained.","It goes on until five, so there's no hurry.","Not exactly. They asked things I hadn't prepared for."],"answer":3,"why":"I take it … = Ich nehme an, dass … → bestätigen und erklären."},{"id":"c76","level":3,"voice":"M","skill":"idiom","prompt":"Would you be up for presenting first?","options":["I'd rather not, if that's all right.","I'm up at six every single day.","The present is for her birthday.","Yes, it's on the first floor."],"answer":0,"why":"be up for = Lust haben/bereit sein → höflich ablehnen."},{"id":"c77","level":3,"voice":"W","skill":"request","prompt":"It wouldn't hurt to back up your files before the update.","options":["No, it doesn't hurt at all anymore.","You're right. I'll do it tonight.","My back is fine now, thank you.","I filed them yesterday afternoon."],"answer":1,"why":"It wouldn't hurt to … = vorsichtiger Rat → annehmen."},{"id":"c78","level":3,"voice":"M","skill":"idiom","prompt":"I can't get over how much tuition has gone up.","options":["You should get over there before it closes.","It goes up the hill and then turns left.","I know. It's almost double what my sister paid.","I'll get it tomorrow, when the bank opens."],"answer":2,"why":"can't get over = nicht fassen können → zustimmen."},{"id":"c79","level":3,"voice":"W","skill":"request","prompt":"Any chance you could cover my shift on Friday?","options":["The chances are about fifty-fifty, I'd say.","Cover it with a lid, or it will get cold.","It shifted a little, but it still works.","I wish I could, but I have an exam that day."],"answer":3,"why":"Any chance you could …? = höfliche Bitte; I wish I could = Absage."},{"id":"c80","level":3,"voice":"M","skill":"idiom","prompt":"So much for finishing the project early.","options":["I know. We really underestimated the last part.","How much was it? I'd like to pay my share.","Yes, we finished it early, as we planned.","So much the better. Let's celebrate."],"answer":0,"why":"So much for … = Das war wohl nichts mit …"},{"id":"c81","level":3,"voice":"W","skill":"yn","prompt":"Hadn't we better confirm the reservation?","options":["Yes, it's much better now, thanks.","I called this morning. We're all set.","We had it last year at the same hotel.","The reservation was very good."],"answer":1,"why":"Hadn't we better …? = Sollten wir nicht lieber …? → schon erledigt."},{"id":"c82","level":3,"voice":"M","skill":"statement","prompt":"I gather you weren't too impressed with the guest speaker.","options":["We gathered in the hall before the talk.","The speakers are too loud in that room.","He was fine, but he barely addressed the topic.","I guess he arrived at two, as scheduled."],"answer":2,"why":"I gather = Ich schließe daraus → differenzierte Einschätzung."},{"id":"c83","level":3,"voice":"W","skill":"statement","prompt":"What with the construction and the detour, I barely made it on time.","options":["The construction ends in May, they say.","What did you make? It smells wonderful.","I'll take the detour, then. Thanks.","At least you got here before they started."],"answer":3,"why":"What with … = wegen …; barely made it = gerade noch geschafft."},{"id":"c84","level":3,"voice":"M","skill":"yn","prompt":"You don't suppose they'd let us hand it in a day late?","options":["I doubt it. She's strict about deadlines.","I suppose it was yesterday, around noon.","Yes, late in the day, after the lecture.","They handed it to me at the front desk."],"answer":0,"why":"You don't suppose …? = vorsichtige Frage → Einschätzung (I doubt it)."},{"id":"c85","level":3,"voice":"W","skill":"statement","prompt":"Rumor has it the department is cutting the evening sections.","options":["I've already cut it out of the newspaper for you.","I hope not. Those are the only ones that fit my schedule.","The rumor was about him, not about the department.","It has three sections, and each one is quite long."],"answer":1,"why":"Rumor has it = Man munkelt → Reaktion auf die Neuigkeit."},{"id":"c86","level":3,"voice":"M","skill":"idiom","prompt":"Mind if I run something by you?","options":["Yes, I mind my business.","It ran out yesterday.","Go ahead. I'm all ears.","I run every morning."],"answer":2,"why":"run something by someone = jemandem etwas zur Meinung vorlegen; all ears = ganz Ohr."},{"id":"c87","level":3,"voice":"W","skill":"request","prompt":"Why bother printing the handouts if everyone has a tablet?","options":["Because the printer bothers me a lot.","The tablets are on the table by the door.","Don't bother me, please. I'm working.","Fair point. Let's just share the file."],"answer":3,"why":"Why bother …? = rhetorische Frage als Vorschlag, es zu lassen."},{"id":"c88","level":3,"voice":"M","skill":"idiom","prompt":"I was this close to missing my flight.","options":["What happened? Was there traffic?","The airport is very close to my house.","I missed you, too. It's been a while.","Which flight did you miss this time?"],"answer":0,"why":"this close to = um ein Haar; der Flug wurde nicht verpasst."}],"conversation":[{"id":"cv01","level":1,"lines":[{"who":"W","text":"Hi, I'd like to renew these two books, please."},{"who":"M","text":"Sure. Can I see your student ID?"},{"who":"W","text":"Here you go. Oh, and is it possible to renew them online next time?"},{"who":"M","text":"Yes. Just log in to the library website and click on My Account. You can renew each book up to three times."},{"who":"W","text":"Great, that'll save me a trip."}],"questions":[{"q":"What does the woman want to do?","options":["Get a new student ID","Return some books","Buy a book","Renew two library books"],"answer":3,"why":"„I'd like to renew these two books.“","skill":"detail"},{"q":"What does the man tell the woman?","options":["She can renew books online.","She needs to create a new account.","She must come to the library to renew books.","She can renew a book only once."],"answer":0,"why":"Über „My Account“ online verlängern, bis zu dreimal.","skill":"detail"}]},{"id":"cv02","level":1,"lines":[{"who":"M","text":"Do you want to go grocery shopping this afternoon?"},{"who":"W","text":"I can't. I have to work until six."},{"who":"M","text":"Okay. Do you need anything? I can pick it up for you."},{"who":"W","text":"Could you get some milk and bread? I'll pay you back tonight."},{"who":"M","text":"No problem."}],"questions":[{"q":"Why can't the woman go shopping?","options":["She is feeling sick.","She has to work.","The store is closed.","She already went this morning."],"answer":1,"why":"„I have to work until six.“","skill":"detail"},{"q":"What will the man probably do?","options":["Lend the woman some money","Cook dinner for the woman","Buy milk and bread for the woman","Wait until six to go shopping"],"answer":2,"why":"Er bietet an, etwas mitzubringen; sie bittet um Milch und Brot.","skill":"next"}]},{"id":"cv03","level":2,"lines":[{"who":"M","text":"Professor Kim, do you have a minute? It's about the research paper."},{"who":"W","text":"Of course, Daniel. What's on your mind?"},{"who":"M","text":"I've found plenty of sources on renewable energy, but my topic feels too broad. I'm not sure where to focus."},{"who":"W","text":"That's a common problem. Why not pick one country and look at how its energy policy has changed over the last ten years?"},{"who":"M","text":"That makes sense. Germany might be interesting. I've read a lot about their solar programs."},{"who":"W","text":"Good choice. Just make sure you use at least two academic journals, not only news articles."}],"questions":[{"q":"What is the man's problem?","options":["He missed the deadline.","He can't find enough sources.","He doesn't understand solar energy.","His topic is too general."],"answer":3,"why":"„my topic feels too broad“.","skill":"detail"},{"q":"What does the professor remind him to do?","options":["Include articles from academic journals","Avoid writing about Germany","Use only news articles","Write about at least two countries"],"answer":0,"why":"„use at least two academic journals, not only news articles“.","skill":"detail"}]},{"id":"cv04","level":2,"lines":[{"who":"W","text":"Hi, I submitted a maintenance request last week, but nobody has come to fix my heater yet."},{"who":"M","text":"I'm sorry about that. Let me check. It looks like your request was sent to the wrong building."},{"who":"W","text":"Oh no. It's been really cold at night."},{"who":"M","text":"I'll mark it as urgent and send it to the right team now. Someone should be there by tomorrow afternoon. In the meantime, you can pick up a portable heater at the front desk."},{"who":"W","text":"That would help a lot. Thanks."}],"questions":[{"q":"Why hasn't the heater been fixed yet?","options":["A replacement part had to be ordered.","The request was sent to the wrong building.","The woman forgot to submit a request.","The repair team was too busy."],"answer":1,"why":"„your request was sent to the wrong building“.","skill":"detail"},{"q":"What does the man suggest the woman do?","options":["Move to another room","Wait until next week","Borrow a portable heater","Submit a new request online"],"answer":2,"why":"„you can pick up a portable heater at the front desk“.","skill":"detail"}]},{"id":"cv05","level":2,"lines":[{"who":"W","text":"Are you ready for our presentation tomorrow?"},{"who":"M","text":"Mostly. I finished my slides, but I still have to practice my part."},{"who":"W","text":"Want to do a run-through tonight? We could book a study room."},{"who":"M","text":"I'd love to, but I promised to help my brother move. How about early tomorrow, before class?"},{"who":"W","text":"Hmm. I'm not really a morning person. But okay, let's meet at eight."}],"questions":[{"q":"Why can't the man practice tonight?","options":["He has a class tonight.","He hasn't finished his slides.","All the study rooms are booked.","He promised to help his brother."],"answer":3,"why":"„I promised to help my brother move.“","skill":"detail"},{"q":"What does the woman imply?","options":["She doesn't like early meetings but will agree to one.","She thinks they don't need to practice.","She would rather practice alone.","She can't meet before class because of her schedule."],"answer":0,"why":"not a morning person = kein Frühaufsteher; trotzdem „okay“.","skill":"infer"}]},{"id":"cv06","level":3,"lines":[{"who":"M","text":"So, did you hear back from the consulting firm?"},{"who":"W","text":"I did. They offered me the internship. The thing is, the bank I interviewed with last week might make an offer too, and they pay considerably more."},{"who":"M","text":"Did the bank give you a timeline?"},{"who":"W","text":"Only that they'd decide soon. Meanwhile, the consulting firm wants an answer by Friday."},{"who":"M","text":"Well, a bird in the hand. Unless you'd honestly prefer the bank, I wouldn't risk losing a sure thing."},{"who":"W","text":"That's what I'm afraid of. Although the consulting work does sound more interesting, to be honest."}],"questions":[{"q":"What is the woman's dilemma?","options":["Whether to ask the consulting firm for a considerably higher salary","Whether to accept one offer before hearing from another employer","Which of two offers pays more","Whether to cancel an interview"],"answer":1,"why":"Die Beratung will bis Freitag eine Antwort, die Bank hat noch nicht entschieden.","skill":"detail"},{"q":"What does the man mean when he says \"a bird in the hand\"?","options":["She should accept both internships.","She should ask the bank to make its decision faster.","A certain opportunity is better than an uncertain one.","Consulting work is more interesting."],"answer":2,"why":"Sprichwort: Lieber den Spatz in der Hand …","skill":"vocab"}]},{"id":"cv07","level":3,"lines":[{"who":"W","text":"Can I talk to you about the lab report? I noticed the discussion section is still empty."},{"who":"M","text":"Right. I've been swamped with midterms. I was going to get to it this weekend."},{"who":"W","text":"The thing is, it's due Monday morning, and I'd like time to read it over before we submit. Last time we lost points because the sections didn't match."},{"who":"M","text":"Fair enough. How about I send you a draft by Saturday noon?"},{"who":"W","text":"That works. And if you get stuck on the error analysis, just let me know. I've got my notes from the review session."}],"questions":[{"q":"Why is the woman concerned?","options":["The man made mistakes in the data.","She missed the review session.","The report is already later than the professor allowed.","She wants time to check the report before it is due."],"answer":3,"why":"Sie will es vor der Abgabe gegenlesen; letztes Mal gab es Punktabzug.","skill":"detail"},{"q":"What does the woman offer to do?","options":["Share her notes if the man needs help","Meet the man on Monday morning","Ask the professor for an extension","Write the discussion section herself"],"answer":0,"why":"„I've got my notes from the review session.“","skill":"detail"}]},{"id":"cv08","level":1,"lines":[{"who":"W","text":"Excuse me, do you know how the washing machines work?"},{"who":"M","text":"Sure. You pay with your student card. Just tap it here and choose the program."},{"who":"W","text":"How long does it take?"},{"who":"M","text":"About forty minutes. The dryers take another hour, so don't wait too late at night."}],"questions":[{"q":"How do students pay for the machines?","options":["At the front desk","With their student card","Online","With coins"],"answer":1,"why":"„You pay with your student card.“","skill":"detail"},{"q":"What does the man suggest?","options":["Washing clothes on weekends","Using a different machine","Not starting laundry too late","Drying clothes outside"],"answer":2,"why":"„don't wait too late at night“.","skill":"detail"}]},{"id":"cv09","level":1,"lines":[{"who":"M","text":"Hi, can I get a large coffee, please?"},{"who":"W","text":"Sure. Would you like milk or sugar?"},{"who":"M","text":"Just milk, thanks. Oh, and do you have anything without gluten?"},{"who":"W","text":"Yes, the banana bread is gluten-free. It's very popular."},{"who":"M","text":"Great, I'll take a piece."}],"questions":[{"q":"What does the man order to drink?","options":["A small tea","A hot chocolate","A coffee with sugar","A large coffee with milk"],"answer":3,"why":"„a large coffee … Just milk“.","skill":"detail"},{"q":"Why does the man ask about gluten?","options":["He is looking for food without gluten.","He wants to bake bread.","He works at the café.","He wants the most popular cake."],"answer":0,"why":"Er fragt nach etwas Glutenfreiem und nimmt das Bananenbrot.","skill":"detail"}]},{"id":"cv10","level":2,"lines":[{"who":"W","text":"Hi, I'm thinking about studying abroad next year, but I'm worried about the cost."},{"who":"M","text":"That's a common concern. Many of our exchange programs let you pay your normal tuition here, so the cost isn't much higher than staying home."},{"who":"W","text":"Really? What about housing and flights?"},{"who":"M","text":"Those you'd pay yourself, but there are travel grants. The application deadline is in March, and you'll need a short essay and a recommendation from a professor."},{"who":"W","text":"Okay, I'd better start asking a professor now, then."}],"questions":[{"q":"What is the woman's main concern?","options":["Missing her friends","How expensive studying abroad will be","Which country to choose","Whether her language skills are good enough"],"answer":1,"why":"„I'm worried about the cost.“","skill":"detail"},{"q":"What will the woman probably do next?","options":["Pay her tuition","Book a flight","Ask a professor for a recommendation","Contact the exchange university"],"answer":2,"why":"„I'd better start asking a professor now.“","skill":"next"}]},{"id":"cv11","level":3,"lines":[{"who":"M","text":"Did you end up applying for the research assistant position in Dr. Hale's lab?"},{"who":"W","text":"I did, but I'm having second thoughts. It's twelve hours a week, and with my course load, I'm not sure I can keep up."},{"who":"M","text":"Twelve hours is a lot. Still, it'd look great on your grad school applications."},{"who":"W","text":"That's exactly why I applied. I guess I could drop my elective. It doesn't count toward my major anyway."},{"who":"M","text":"That seems like a reasonable trade-off, if the position works out."}],"questions":[{"q":"Why is the woman having second thoughts?","options":["The lab is located too far from campus.","The pay is too low.","She doesn't like Dr. Hale.","She is worried she won't have enough time."],"answer":3,"why":"Zwölf Stunden pro Woche plus volles Kursprogramm.","skill":"detail"},{"q":"What does the woman consider doing?","options":["Dropping a course that is not required for her major","Asking to work fewer than twelve hours a week","Applying to a different lab","Postponing graduate school"],"answer":0,"why":"Das Wahlfach zählt nicht für ihr Hauptfach.","skill":"detail"}]},{"id":"cv12","level":3,"lines":[{"who":"W","text":"Hey, are you using your camera this weekend? I'm going to my cousin's wedding, and my phone's camera isn't great."},{"who":"M","text":"I'm not, but it's not exactly the easiest camera to figure out. Have you used one like it before?"},{"who":"W","text":"Not really. How hard can it be?"},{"who":"M","text":"Well, the automatic mode is fine, but the battery drains fast. I'd take the spare one, and maybe practice a bit tomorrow so you're not figuring it out during the ceremony."},{"who":"W","text":"Good idea. Could you show me the basics tonight?"},{"who":"M","text":"Sure. Swing by after dinner."}],"questions":[{"q":"What is the man's concern?","options":["He needs the camera himself this weekend.","The woman may have trouble using the camera.","The wedding is too far away.","The camera might get damaged."],"answer":1,"why":"„not exactly the easiest camera to figure out“.","skill":"detail"},{"q":"What does the man recommend?","options":["Using only the manual settings for better photos","Buying a new camera","Bringing an extra battery and practicing in advance","Using her phone instead"],"answer":2,"why":"Ersatzakku mitnehmen und vorher üben.","skill":"detail"}]},{"id":"cv13","level":1,"lines":[{"who":"W","text":"Hi, I'd like to sign up for a gym membership."},{"who":"M","text":"Sure. Are you a student here?"},{"who":"W","text":"Yes, I'm a first-year student."},{"who":"M","text":"Then it's free. I just need to see your student ID."},{"who":"W","text":"Here you go. Do I need to bring my own towel?"},{"who":"M","text":"Yes, and a lock for the locker. We don't provide those."},{"who":"W","text":"Okay. What time do you close?"},{"who":"M","text":"At ten on weekdays and at six on weekends."}],"questions":[{"q":"How much does the woman have to pay for the membership?","options":["Six dollars a week","Nothing","Ten dollars","The price of a lock"],"answer":1,"why":"Für Studierende ist die Mitgliedschaft kostenlos.","skill":"detail"},{"q":"What should the woman bring to the gym?","options":["Her ID and a water bottle","A towel and her own locker key","A towel and a lock","A lock and sports shoes"],"answer":2,"why":"„Yes, and a lock for the locker.“","skill":"detail"}]},{"id":"cv14","level":1,"lines":[{"who":"M","text":"Excuse me, is this the bus to the airport?"},{"who":"W","text":"No, this one goes to the city center. You need the number twelve."},{"who":"M","text":"Oh. Where does it stop?"},{"who":"W","text":"Right across the street, in front of the bank."},{"who":"M","text":"Thanks. Do you know how often it comes?"},{"who":"W","text":"Every twenty minutes. You just missed one, I'm afraid."},{"who":"M","text":"That's okay. My flight isn't until this evening."}],"questions":[{"q":"Where does the man want to go?","options":["To the bank across the street","To the city center","To the bus station","To the airport"],"answer":3,"why":"Er fragt nach dem Bus zum Flughafen.","skill":"detail"},{"q":"What can be inferred about the man?","options":["He is not in a hurry.","He has taken this bus before.","He will take a taxi instead.","He has missed his flight."],"answer":0,"why":"Sein Flug geht erst am Abend, also stört ihn das Warten nicht.","skill":"infer"}]},{"id":"cv15","level":1,"lines":[{"who":"W","text":"Are you free on Wednesday afternoon? We need to practice our presentation."},{"who":"M","text":"I have a class until three. How about three thirty?"},{"who":"W","text":"That works. Should we meet in the library?"},{"who":"M","text":"The library is too quiet for practicing. Let's use the empty classroom next to the lab."},{"who":"W","text":"Good idea. I'll bring my laptop."},{"who":"M","text":"Great. I'll print the notes."}],"questions":[{"q":"Why doesn't the man want to meet in the library?","options":["There are no free tables in the afternoon.","They could not practice speaking there.","It closes at three thirty on Wednesdays.","It is too far away from the lab."],"answer":1,"why":"„too quiet for practicing“ – dort darf man nicht laut sprechen.","skill":"infer"},{"q":"What will the man bring to the meeting?","options":["A projector","The key to the lab","Printed notes","His laptop"],"answer":2,"why":"„I'll print the notes.“","skill":"detail"}]},{"id":"cv16","level":1,"lines":[{"who":"M","text":"Hi, I'd like to return this sweater. It's too small."},{"who":"W","text":"No problem. Do you have the receipt?"},{"who":"M","text":"Yes, here it is."},{"who":"W","text":"Thanks. Would you like a larger size or your money back?"},{"who":"M","text":"A larger size, please. Do you have it in blue?"},{"who":"W","text":"Let me check. I'm sorry, we only have large in gray."},{"who":"M","text":"Hmm. Then I'll just take the refund."}],"questions":[{"q":"Why is the man returning the sweater?","options":["It has a hole in it.","He does not like the color.","He found a cheaper one.","It does not fit him."],"answer":3,"why":"„It's too small.“","skill":"detail"},{"q":"What does the man decide to do?","options":["Get his money back","Take the gray sweater","Come back another day","Order a blue one online"],"answer":0,"why":"Blau gibt es nicht in L, also nimmt er die Erstattung (refund).","skill":"detail"}]},{"id":"cv17","level":2,"lines":[{"who":"W","text":"Professor Adams, could I change the topic of my research paper?"},{"who":"M","text":"It's a bit late for that. The outline was due last week. What's the problem?"},{"who":"W","text":"I can't find enough sources on urban beekeeping. Most of the articles are just blog posts."},{"who":"M","text":"I see. Rather than starting over, why not widen the topic to urban agriculture in general? You could keep beekeeping as one example."},{"who":"W","text":"That would work. Then I can still use what I've already written."},{"who":"M","text":"Exactly. Send me a revised outline by Friday."}],"questions":[{"q":"Why does the woman want to change her topic?","options":["Her outline was returned with a low grade.","She cannot find enough reliable sources.","She has lost interest in beekeeping.","Another student is writing about the same topic."],"answer":1,"why":"Zu wenige Quellen, meist nur Blogbeiträge.","skill":"detail"},{"q":"What does the professor suggest?","options":["Starting again with a new topic","Asking for an extension until next month","Making the topic broader","Using blog posts as her main sources"],"answer":2,"why":"„widen the topic to urban agriculture in general“.","skill":"detail"}]},{"id":"cv18","level":2,"lines":[{"who":"M","text":"Hi, I'd like to ask about switching rooms. My roommate stays up really late, and I have early classes."},{"who":"W","text":"Have you talked to him about it?"},{"who":"M","text":"A few times. He's quieter for a day or two, and then it starts again."},{"who":"W","text":"Room changes are only possible after the fourth week of the semester, so you'd have to wait until next Monday. In the meantime, your resident advisor can set up a roommate agreement."},{"who":"M","text":"Does that actually help?"},{"who":"W","text":"More often than you'd think. Once the rules are in writing, most people stick to them."}],"questions":[{"q":"What is the man's problem?","options":["He missed the deadline for changing rooms.","His room is too far from his classes.","His roommate wants to move out of the room.","His roommate keeps him awake at night."],"answer":3,"why":"Der Mitbewohner bleibt lange auf, er hat früh Unterricht.","skill":"detail"},{"q":"What does the woman imply about roommate agreements?","options":["They solve this kind of problem fairly often.","They are required before any room change.","They rarely work for more than a day or two.","They can only be written after the fourth week."],"answer":0,"why":"„More often than you'd think … most people stick to them.“","skill":"infer"}]},{"id":"cv19","level":2,"lines":[{"who":"W","text":"Have you decided what you're doing this summer?"},{"who":"M","text":"I got the internship at the engineering firm, but it's unpaid."},{"who":"W","text":"Unpaid? Can you afford that?"},{"who":"M","text":"Not really. I'd have to keep my weekend job at the restaurant."},{"who":"W","text":"That sounds exhausting. Did you ask whether the university offers funding for unpaid internships?"},{"who":"M","text":"I didn't know that was a thing."},{"who":"W","text":"The career center has grants. The deadline's at the end of the month, though."},{"who":"M","text":"Then I'd better go there today."}],"questions":[{"q":"What is the man's concern about the internship?","options":["It is too far away from campus.","He would not earn any money.","He does not feel qualified for it.","It conflicts with his summer classes."],"answer":1,"why":"Das Praktikum ist unbezahlt.","skill":"detail"},{"q":"What will the man probably do next?","options":["Turn down the internship at the firm","Look for a different internship that pays","Ask about a grant at the career center","Quit his weekend job at the restaurant"],"answer":2,"why":"„Then I'd better go there today.“ – zum Career Center wegen der Förderung.","skill":"next"}]},{"id":"cv20","level":2,"lines":[{"who":"M","text":"IT help desk. How can I help?"},{"who":"W","text":"Hi, my laptop suddenly won't connect to the campus Wi-Fi. It keeps asking for a password."},{"who":"M","text":"Did you change your university password recently?"},{"who":"W","text":"Yes, on Monday."},{"who":"M","text":"That's it, then. Your laptop is still trying to use the old one. Remove the network from your saved list and sign in again."},{"who":"W","text":"Okay. It's connecting now. Thank you!"},{"who":"M","text":"You're welcome. By the way, you'll need to do the same on your phone."}],"questions":[{"q":"Why couldn't the woman connect to the Wi-Fi?","options":["She was too far from the nearest router.","The campus network was down on Monday.","Her university account had been closed.","Her laptop was using an old password."],"answer":3,"why":"Der Laptop versuchte es noch mit dem alten Passwort.","skill":"detail"},{"q":"What does the man say the woman will have to do?","options":["Sign in again on her phone as well","Change her password once more","Remove the network every Monday","Bring her laptop to the help desk"],"answer":0,"why":"„you'll need to do the same on your phone“.","skill":"detail"}]},{"id":"cv21","level":3,"lines":[{"who":"W","text":"Thanks for seeing me. I'm worried about my survey. Only forty people responded, and I was counting on at least a hundred."},{"who":"M","text":"Forty isn't ideal, but it isn't fatal either. What matters is how you frame the results."},{"who":"W","text":"So I shouldn't generalize?"},{"who":"M","text":"Right. Present it as a pilot study. Be upfront about the sample size, and suggest how a larger study could build on it."},{"who":"W","text":"I was afraid you'd tell me to start over."},{"who":"M","text":"With three weeks left? That would be far riskier than a small sample honestly described."}],"questions":[{"q":"What is the woman worried about?","options":["She has only three weeks to design a survey.","Fewer people answered her survey than she expected.","Her survey questions turned out to be unclear.","Her results contradict those of a larger, earlier study."],"answer":1,"why":"Nur 40 statt der erhofften 100 Antworten.","skill":"detail"},{"q":"What is the professor's attitude toward the small sample?","options":["It is a good reason to repeat the whole survey.","It makes the results of the study worthless.","It is acceptable as long as she is open about it.","It will not be noticed if she generalizes carefully."],"answer":2,"why":"„isn't fatal“ – als Pilotstudie darstellen und die Stichprobengröße offen nennen.","skill":"attitude"}]},{"id":"cv22","level":3,"lines":[{"who":"M","text":"Has Derek sent you his section of the report yet?"},{"who":"W","text":"Not a word. And the draft is due the day after tomorrow."},{"who":"M","text":"This is the second time. Should we just write his part ourselves?"},{"who":"W","text":"I'd rather not. If we cover for him again, nothing changes. Let's give him until tonight, and if we still hear nothing, we tell Professor Lin exactly who did what."},{"who":"M","text":"That feels a little harsh."},{"who":"W","text":"Maybe, but our grade shouldn't suffer because he can't be bothered."}],"questions":[{"q":"What are the speakers mainly discussing?","options":["Why their last report received a low grade","How to divide the remaining sections of a report fairly","Whether to ask their professor for more time","How to deal with a teammate who is not contributing"],"answer":3,"why":"Es geht um Derek, der seinen Teil wieder nicht liefert.","skill":"main"},{"q":"What does the woman imply about writing Derek's part?","options":["It would only encourage him to do the same again.","It would take longer than waiting for him.","It would probably lower the quality of the report.","It would be against the professor's rules."],"answer":0,"why":"„If we cover for him again, nothing changes.“","skill":"infer"}]},{"id":"cv23","level":3,"lines":[{"who":"W","text":"Excuse me, I'm looking for the biology textbook for Professor Grant's course, but the shelf is empty."},{"who":"M","text":"The tenth edition? We sold out on Monday. The next shipment won't arrive for ten days."},{"who":"W","text":"Ten days? We have a quiz on chapter two next week."},{"who":"M","text":"You could get the e-book today. It's cheaper, too. Or, between you and me, the ninth edition is almost identical for the first few chapters, and the library has copies."},{"who":"W","text":"I'd rather not pay twice. I'll try the library and order the print copy here."}],"questions":[{"q":"What is the woman's problem?","options":["The e-book costs more than she expected.","The book she needs is out of stock.","She bought the wrong edition of a book.","She missed a quiz on the second chapter."],"answer":1,"why":"Das Regal ist leer, die 10. Auflage ist ausverkauft.","skill":"detail"},{"q":"What will the woman probably do to prepare for the quiz?","options":["Buy the e-book and the print copy together","Ask Professor Grant to postpone the quiz","Borrow an older edition from the library","Wait ten days for the new shipment to arrive"],"answer":2,"why":"Sie will es in der Bibliothek versuchen (9. Auflage) und das gedruckte Buch bestellen.","skill":"next"}]},{"id":"cv24","level":3,"lines":[{"who":"M","text":"I heard you turned down the teaching assistant position. I'm surprised. You'd be perfect for it."},{"who":"W","text":"I was tempted. But it's fifteen hours a week, and I'm already behind on my thesis."},{"who":"M","text":"Fair enough. Though a position like that looks good when you apply for doctoral programs."},{"who":"W","text":"So does finishing on time. Besides, Professor Ortiz said there may be an opening in the spring, when my schedule is lighter."},{"who":"M","text":"Then you haven't really given up on it."},{"who":"W","text":"Let's say I've postponed it."}],"questions":[{"q":"Why did the woman turn down the position?","options":["She plans to leave the university in the spring.","She was not interested in teaching.","The position was offered to someone else.","She needs the time for her thesis."],"answer":3,"why":"15 Stunden pro Woche, und sie ist mit der Abschlussarbeit im Rückstand.","skill":"detail"},{"q":"What does the woman mean when she says, \"Let's say I've postponed it\"?","options":["She may accept a similar position later.","She regrets having turned the position down.","She has asked for a later starting date.","She no longer wants to apply for doctoral programs."],"answer":0,"why":"postponed = verschoben: im Frühjahr gibt es vielleicht wieder eine Stelle.","skill":"infer"}]}],"announcement":[{"id":"an01","level":1,"voice":"W","text":"Attention, students. The cafeteria in the Student Center will close early today, at 3 p.m., because of a staff training session. Dinner will be served as usual in the North Dining Hall from 5 to 8 p.m. We're sorry for any inconvenience.","questions":[{"q":"What is the announcement mainly about?","options":["A change in dinner prices","A cafeteria closing early","A training course for students","A new dining hall opening"],"answer":1,"why":"Die Cafeteria schließt heute früher.","skill":"main"},{"q":"Where can students eat dinner today?","options":["Nowhere on campus","In the staff room","In the North Dining Hall","In the Student Center"],"answer":2,"why":"„Dinner will be served as usual in the North Dining Hall.“","skill":"detail"}]},{"id":"an02","level":1,"voice":"M","text":"Good morning, everyone. Today's field trip to the science museum will leave from the main entrance at nine thirty, not nine o'clock as planned. Please bring your student ID for free entry, and remember that lunch is not provided, so pack a snack or bring some money.","questions":[{"q":"What has changed?","options":["The entrance fee","The date of the trip","The destination","The departure time"],"answer":3,"why":"9:30 statt 9:00.","skill":"detail"},{"q":"What should students bring?","options":["Their student ID","A packed lunch for the whole group","Their textbooks","A museum ticket"],"answer":0,"why":"„Please bring your student ID for free entry.“","skill":"detail"}]},{"id":"an03","level":2,"voice":"W","text":"Hello, this is an announcement for all residents of Maple Hall. The fire alarm system will be tested tomorrow between 10 a.m. and noon. You do not need to leave the building during the test. However, if the alarm sounds at any other time, it is a real emergency, and you must exit immediately using the nearest stairway.","questions":[{"q":"What will happen tomorrow?","options":["New stairways will be built.","The fire alarm system will be tested.","Residents will attend a safety meeting.","The building will be evacuated."],"answer":1,"why":"Test der Brandmeldeanlage zwischen 10 und 12 Uhr.","skill":"detail"},{"q":"What should residents do if they hear the alarm in the afternoon?","options":["Take the elevator to the ground floor","Wait for further instructions","Leave the building immediately","Ignore it because it is a test"],"answer":2,"why":"Außerhalb des Testfensters ist es ein echter Notfall.","skill":"detail"}]},{"id":"an04","level":2,"voice":"M","text":"Welcome to the Riverside Art Museum. Please note that the second-floor gallery is currently closed while we install our new photography exhibition, which opens next Saturday. In the meantime, visitors can enjoy a free guided tour of our sculpture garden, starting every hour at the information desk. Photography without flash is permitted in all open areas.","questions":[{"q":"Why is the second-floor gallery closed?","options":["It is reserved for a private event.","It is being repaired.","The sculptures are being cleaned.","A new exhibition is being set up."],"answer":3,"why":"„while we install our new photography exhibition“.","skill":"detail"},{"q":"What is true about taking photos?","options":["It is allowed without a flash.","It is not allowed anywhere.","It costs extra.","It is allowed only on guided tours."],"answer":0,"why":"„Photography without flash is permitted“.","skill":"detail"}]},{"id":"an05","level":2,"voice":"W","text":"This is a reminder that the Economics Department's guest lecture, The Future of Remote Work, has been moved from Room 210 to the larger auditorium in Hayes Hall because of high interest. The talk begins at 4 p.m. Students who attend can earn one point of extra credit in Economics 101 by submitting a one-page summary by Friday.","questions":[{"q":"Why has the lecture been moved?","options":["The time of the lecture has changed.","Many people want to attend.","The speaker asked for a larger room.","Room 210 is being renovated."],"answer":1,"why":"„because of high interest“.","skill":"detail"},{"q":"How can students earn extra credit?","options":["By registering online","By asking a question during the talk","By writing a short summary of the talk","By arriving early"],"answer":2,"why":"„submitting a one-page summary by Friday“.","skill":"detail"}]},{"id":"an06","level":3,"voice":"M","text":"Good afternoon. This is a message from the Office of the Registrar. Due to an unexpected technical issue with the online registration system, the registration period for spring courses has been extended by forty-eight hours and will now close on Thursday at 5 p.m. Students who encountered error messages while enrolling are advised to verify their schedules, as some selections may not have been saved. Course waitlists remain unaffected.","questions":[{"q":"Why has the registration period been extended?","options":["The office will be closed for two days.","Too few students have registered.","More courses have been added.","A technical problem affected the online system."],"answer":3,"why":"„Due to an unexpected technical issue“.","skill":"detail"},{"q":"What are some students advised to do?","options":["Check whether their course choices were saved","Register again for all their courses","Contact their professors directly","Join a course waitlist"],"answer":0,"why":"„advised to verify their schedules, as some selections may not have been saved“.","skill":"detail"}]},{"id":"an07","level":3,"voice":"W","text":"Attention, passengers. Due to signal maintenance between Central Station and Harbor Point, Blue Line trains are running every twenty minutes rather than every eight this weekend. Passengers traveling to the airport are encouraged to allow additional time or to use the express shuttle bus, which departs from Platform 3. Weekly passes will be honored on the shuttle at no additional charge.","questions":[{"q":"What is the main purpose of the announcement?","options":["To advertise a new airport bus","To inform passengers about reduced train service","To explain upcoming changes to ticket prices","To announce new train routes"],"answer":1,"why":"Züge fahren nur alle 20 statt alle 8 Minuten.","skill":"main"},{"q":"What is indicated about the shuttle bus?","options":["It costs more than taking the train to the airport.","It only goes to Harbor Point.","Passengers with weekly passes can ride it at no extra cost.","It runs every eight minutes."],"answer":2,"why":"„Weekly passes will be honored … at no additional charge.“","skill":"detail"}]},{"id":"an08","level":1,"voice":"W","text":"Hello, students. The bookstore will have a sale this Friday and Saturday. All T-shirts and sweatshirts will be twenty percent off. Textbooks are not part of the sale. The store will be open from nine in the morning until six in the evening on both days.","questions":[{"q":"What is on sale?","options":["Everything in the store","Textbooks","Notebooks","Clothing"],"answer":3,"why":"T-Shirts und Sweatshirts; Lehrbücher nicht.","skill":"detail"},{"q":"When is the sale?","options":["On Friday and Saturday","Every weekend this month","Next week","Only on Friday"],"answer":0,"why":"„this Friday and Saturday“.","skill":"detail"}]},{"id":"an09","level":1,"voice":"M","text":"Good afternoon. Please remember that the computer lab will be closed tomorrow morning for software updates. It will open again at one o'clock. If you need a computer before then, you can use the computers on the first floor of the library.","questions":[{"q":"Why will the lab be closed?","options":["For cleaning","For software updates","Because of a holiday","For a class"],"answer":1,"why":"„closed tomorrow morning for software updates“.","skill":"detail"},{"q":"Where can students use computers in the morning?","options":["In the bookstore","Nowhere on campus","In the library","In the lab"],"answer":2,"why":"„the computers on the first floor of the library“.","skill":"detail"}]},{"id":"an10","level":2,"voice":"W","text":"Attention, all first-year students. Course advising sessions will take place next week in the Student Services Building. Each session lasts about twenty minutes. Please sign up online by Friday, and bring a list of the courses you are interested in. Students who miss their session will not be able to register until the second registration period.","questions":[{"q":"What should students bring to the session?","options":["Their passport","A completed form for course registration","Their transcript","A list of courses they are interested in"],"answer":3,"why":"„bring a list of the courses you are interested in“.","skill":"detail"},{"q":"What will happen if a student misses the session?","options":["The student will have to register later.","The student will pay a fee.","The student must change majors.","The student can register online immediately."],"answer":0,"why":"Erst in der zweiten Anmeldephase.","skill":"detail"}]},{"id":"an11","level":3,"voice":"M","text":"Good evening, and thank you for attending tonight's performance. Please note that, at the request of the performers, photography and video recording are strictly prohibited throughout the concert. The performance will run for approximately two hours, including a twenty-minute intermission. Latecomers will be seated only during the intermission, and patrons who leave the hall during the first half may not re-enter until then.","questions":[{"q":"Why is recording not allowed?","options":["It disturbs other audience members.","The performers asked for it to be prohibited.","Cameras are not allowed in the building.","The hall has a strict copyright policy."],"answer":1,"why":"„at the request of the performers“.","skill":"detail"},{"q":"What can be inferred about someone who arrives thirty minutes late?","options":["They will not be admitted to the concert hall at all that night.","They will receive a refund.","They will have to wait until the intermission to be seated.","They can take their seat immediately."],"answer":2,"why":"Zuspätkommende werden nur in der Pause eingelassen.","skill":"infer"}]},{"id":"an12","level":3,"voice":"W","text":"This is a message from Campus Dining Services. Following student feedback, we will be piloting extended hours at Cedar Hall beginning Monday: the dining hall will remain open until midnight, Sunday through Thursday. Late-night service will feature a limited menu, and meal swipes will be accepted only until ten p.m. After that, purchases must be made with dining dollars or a credit card.","questions":[{"q":"What is the main purpose of the announcement?","options":["To close a dining hall","To ask students for feedback on the menu","To announce new meal prices","To introduce a trial of longer opening hours"],"answer":3,"why":"„piloting extended hours“ = Testphase.","skill":"main"},{"q":"What is true about purchases after 10 p.m.?","options":["Meal swipes cannot be used.","Only meal swipes are accepted.","Only cash is accepted.","Food is free."],"answer":0,"why":"Meal swipes nur bis 22 Uhr.","skill":"detail"}]},{"id":"an13","level":1,"voice":"W","text":"Attention, library users. The library will close in fifteen minutes. If you would like to borrow books, please bring them to the front desk now. The self-checkout machines will turn off in ten minutes. Please remember to take all your personal things with you. The library opens again tomorrow at eight a.m. Thank you.","questions":[{"q":"What should people who want to borrow books do?","options":["Leave the books on the tables","Go to the front desk now","Come back in fifteen minutes","Use the machines after closing time"],"answer":1,"why":"„please bring them to the front desk now“.","skill":"detail"},{"q":"When will the library open again?","options":["In fifteen minutes","Tomorrow at ten in the morning","Tomorrow at eight in the morning","Later this evening"],"answer":2,"why":"„opens again tomorrow at eight a.m.“","skill":"detail"}]},{"id":"an14","level":1,"voice":"M","text":"Good morning, everyone. This is your bus driver. Because of road work on Park Avenue, we will not stop at the City Museum today. If you want to visit the museum, please get off at the next stop, Green Street. From there, it is a five-minute walk. Sorry for the trouble, and have a nice day.","questions":[{"q":"Why will the bus not stop at the City Museum?","options":["The bus is running late.","The museum is closed today.","The stop has been moved for good.","There is road work."],"answer":3,"why":"„Because of road work on Park Avenue“.","skill":"detail"},{"q":"What should people who want to visit the museum do?","options":["Get off at Green Street and walk","Stay on the bus until Park Avenue","Wait for the next bus to the museum","Ask the driver for a new ticket"],"answer":0,"why":"Nächste Haltestelle Green Street, von dort fünf Minuten zu Fuß.","skill":"detail"}]},{"id":"an15","level":1,"voice":"W","text":"Hello, students. The student club fair is this Friday from eleven to three in the main hall. More than forty clubs will be there, including the hiking club, the chess club, and the film club. You can talk to members and sign up at each table. There will also be free snacks and drinks. We hope to see you there!","questions":[{"q":"What is the announcement mainly about?","options":["A hiking trip planned for this Friday","An event where students can join clubs","A meeting for the leaders of student clubs","A new film that will be shown in the main hall"],"answer":1,"why":"Club Fair: Clubs stellen sich vor, man kann sich eintragen.","skill":"main"},{"q":"What can students get at the fair?","options":["A chess set","Free tickets for a film","Free food and drinks","A map of hiking trails"],"answer":2,"why":"„free snacks and drinks“.","skill":"detail"}]},{"id":"an16","level":1,"voice":"M","text":"Attention, shoppers. The store will be closing in thirty minutes. Today only, all fresh bread and cakes are half price. You can find them at the bakery counter near the entrance. Please bring your items to the checkout before nine o'clock. Thank you for shopping with us.","questions":[{"q":"What is on sale today?","options":["Everything in the store","Coffee at the bakery counter","Fresh fruit and vegetables","Bread and cakes"],"answer":3,"why":"„all fresh bread and cakes are half price“.","skill":"detail"},{"q":"When does the store close?","options":["At nine o'clock","At eight o'clock","At half past nine","In one hour"],"answer":0,"why":"In 30 Minuten; bis neun Uhr zur Kasse.","skill":"detail"}]},{"id":"an17","level":2,"voice":"W","text":"Good afternoon. This is a reminder from the Health Center. Free stress-management workshops will be held every Wednesday in November at four p.m. in Room 210. Each session covers a different topic, such as sleep, time management, and exam anxiety, so you can attend one or all of them. Space is limited to twenty people per session. To reserve a spot, sign up on the Health Center website by noon on the day of the workshop.","questions":[{"q":"What is true about the workshops?","options":["Students must attend all of them.","Each one deals with a different topic.","They are held on the Health Center website.","They take place every day in November."],"answer":1,"why":"„Each session covers a different topic“.","skill":"detail"},{"q":"What must students do in order to attend a session?","options":["Arrive twenty minutes early","Pay a small fee in Room 210","Register online before noon that day","Call the Health Center a week before"],"answer":2,"why":"Anmeldung auf der Website bis mittags am Workshop-Tag.","skill":"detail"}]},{"id":"an18","level":2,"voice":"M","text":"Attention, residents of West Hall. Starting Monday, the main entrance will be closed for three weeks while the front steps are rebuilt. During this time, please use the side door facing the parking lot. Your room key will open it. Package deliveries will be moved to the East Hall front desk, so bring your student ID when you pick up mail. We apologize for the inconvenience.","questions":[{"q":"Why will the main entrance be closed?","options":["The door lock is being replaced.","The front desk is moving to East Hall.","The parking lot is being repaved.","The front steps are being rebuilt."],"answer":3,"why":"„while the front steps are rebuilt“.","skill":"detail"},{"q":"Where should residents pick up their packages?","options":["At the front desk of East Hall","At the main entrance after three weeks","At the office next to the parking lot","At the side door of West Hall"],"answer":0,"why":"Pakete gehen an die Rezeption von East Hall.","skill":"detail"}]},{"id":"an19","level":2,"voice":"W","text":"Hello, everyone, and welcome aboard the two fifteen ferry to Harbor Island. Our crossing will take about forty minutes. The café on the lower deck is open and accepts cards only. Because of strong winds, the outside upper deck is closed today. For your safety, please stay inside while the boat is moving. We'll let you know when we're about to arrive.","questions":[{"q":"Why is the upper deck closed?","options":["The crossing is too short.","It is very windy.","It is being cleaned.","The café has moved there."],"answer":1,"why":"„Because of strong winds“.","skill":"detail"},{"q":"What is indicated about the café?","options":["It is closed because of the weather.","It will open after forty minutes.","Customers cannot pay with cash.","It is located on the upper deck."],"answer":2,"why":"„accepts cards only“.","skill":"detail"}]},{"id":"an20","level":2,"voice":"M","text":"This is an announcement for students in Biology 101. Tomorrow's lab will not take place in the usual room because of a broken ventilation system. Instead, sections A and B will meet in Room 305 of the Chemistry Building. Section C is canceled and will be made up next Tuesday. Don't forget your lab coat and safety glasses. No one will be allowed in without them.","questions":[{"q":"Why is the lab being moved?","options":["The Chemistry Building has larger and newer rooms.","The usual room is needed for an exam.","Too many students signed up for section C.","Equipment in the usual room is not working."],"answer":3,"why":"Die Lüftung im üblichen Raum ist defekt.","skill":"detail"},{"q":"What can be inferred about a student who forgets safety glasses?","options":["The student will not be able to take part.","The student must join section C on Tuesday.","The student will lose points on the lab report.","The student can borrow a pair in Room 305."],"answer":0,"why":"„No one will be allowed in without them.“","skill":"infer"}]},{"id":"an21","level":3,"voice":"W","text":"Good evening. This is a message from the Office of the Registrar. Owing to an unexpectedly high number of requests, the processing time for official transcripts has increased from three to approximately ten business days. Students with imminent application deadlines are urged to submit their requests immediately and to select the electronic delivery option, which is not affected by the delay. Requests marked urgent will not be prioritized unless accompanied by proof of the deadline.","questions":[{"q":"What is the main purpose of the announcement?","options":["To introduce a new way of ordering transcripts","To warn students that transcripts are taking longer","To remind students of an application deadline","To explain why paper transcripts are being discontinued"],"answer":1,"why":"Die Bearbeitungszeit ist von drei auf etwa zehn Werktage gestiegen.","skill":"main"},{"q":"What can be inferred about a request marked urgent that includes no proof of a deadline?","options":["It will be rejected and sent back to the student.","It will be delivered electronically instead.","It will be handled like any other request.","It will be processed within three business days."],"answer":2,"why":"Ohne Nachweis keine Bevorzugung.","skill":"infer"}]},{"id":"an22","level":3,"voice":"M","text":"Attention, conference participants. Due to a scheduling conflict, this afternoon's keynote address has been brought forward by one hour and will now begin at two o'clock in the Grand Ballroom. As a result, the two o'clock panel on renewable energy has been postponed until tomorrow morning at nine. Those who registered for the panel need not sign up again; your registration remains valid. Updated programs are available at the information desk.","questions":[{"q":"What has changed about the keynote address?","options":["It has been moved to another room.","It has been postponed until tomorrow.","It will be an hour shorter than planned.","It will start earlier than planned."],"answer":3,"why":"brought forward by one hour = eine Stunde vorverlegt.","skill":"detail"},{"q":"What should people who registered for the panel do?","options":["Nothing, because their registration still counts","Go to the Grand Ballroom at two o'clock","Sign up again at the information desk","Request a refund for the canceled session"],"answer":0,"why":"„need not sign up again; your registration remains valid“.","skill":"detail"}]},{"id":"an23","level":3,"voice":"W","text":"May I have your attention, please. The university's emergency notification system will be tested this Thursday at noon. You will receive a text message and an email, and the outdoor sirens will sound for roughly one minute. No action is required on your part. However, if you fail to receive either message, your contact details are probably out of date, in which case you should update them through the student portal by the end of the week.","questions":[{"q":"What is the main purpose of the announcement?","options":["To warn students about an emergency on campus","To inform students about a planned test","To explain how to switch off text notifications","To ask students to leave the buildings at noon"],"answer":1,"why":"Das Warnsystem wird am Donnerstag getestet; niemand muss etwas tun.","skill":"main"},{"q":"What should students do if they do not receive the messages?","options":["Send an email to the university","Report the problem to campus security","Correct their contact information online","Wait for the sirens to sound again"],"answer":2,"why":"Kontaktdaten sind dann wohl veraltet → im Portal aktualisieren.","skill":"detail"}]},{"id":"an24","level":3,"voice":"M","text":"Good morning. Before we begin today's tour of the observatory, a few words of caution. The telescope dome is kept unheated so that the instruments remain at the outside temperature, which means it may feel considerably colder than you expect. Flash photography is prohibited throughout the building, since sudden light can interfere with ongoing measurements. Finally, the staircase to the viewing platform is steep, so anyone who would prefer the elevator should let me know now.","questions":[{"q":"Why is the telescope dome not heated?","options":["To prevent visitors from staying too long","To reduce the observatory's energy costs","To protect the building from sudden changes in light","To keep the instruments at the outdoor temperature"],"answer":3,"why":"„so that the instruments remain at the outside temperature“.","skill":"detail"},{"q":"Why does the speaker mention the staircase?","options":["To offer visitors another way up","To warn that the platform is closed today","To ask visitors to walk in a single line","To explain why the tour will take longer"],"answer":0,"why":"Die Treppe ist steil; wer möchte, kann den Aufzug nehmen.","skill":"purpose"}]}],"talk":[{"id":"tk01","level":1,"voice":"W","title":"Why Leaves Change Color","text":"Today I want to explain why leaves change color in the fall. Leaves are green during spring and summer because they contain a lot of chlorophyll. Chlorophyll is the chemical that plants use to turn sunlight into food. But leaves also contain other colors, like yellow and orange. We just can't see them in summer because there is so much green. In the fall, the days get shorter and colder. Trees stop making chlorophyll, and the green color slowly disappears. That's when the yellow and orange colors become visible. Some trees, like maples, also make a new red color in the fall. Scientists think this red color may protect the leaves from too much sunlight while the tree takes back nutrients before the leaves drop.","questions":[{"q":"What is the talk mainly about?","options":["Why some trees lose their leaves in summer","How trees grow new leaves","How plants are harmed by sunlight","Why leaves change color in the fall"],"answer":3,"why":"Das Thema wird im ersten Satz genannt.","skill":"main"},{"q":"Why are yellow and orange colors hard to see in summer?","options":["The green chlorophyll covers them.","Sunlight destroys them.","They are stored inside the branches.","They only form in winter."],"answer":0,"why":"„we can't see them in summer because there is so much green“.","skill":"detail"},{"q":"What happens to chlorophyll in the fall?","options":["It moves to the roots.","Trees stop producing it.","Trees produce more of it.","It turns red."],"answer":1,"why":"„Trees stop making chlorophyll“.","skill":"detail"},{"q":"According to the speaker, why might maple leaves turn red?","options":["To produce chlorophyll more quickly before the winter begins","To attract insects","To protect the leaves while the tree takes back nutrients","To keep the tree warm"],"answer":2,"why":"Rot schützt vermutlich vor zu viel Sonne, während Nährstoffe zurückgeholt werden.","skill":"detail"}]},{"id":"tk02","level":1,"voice":"M","title":"The First Bicycles","text":"Let's look at the history of the bicycle. The first bicycle-like machine was built in Germany in 1817. It was made of wood and had no pedals. Riders sat on it and pushed themselves along with their feet. It was called a running machine. About fifty years later, pedals were added to the front wheel. These bicycles were faster, but they were also very uncomfortable. People called them boneshakers, because the roads were rough and the wheels were made of iron. Later, some bicycles had a huge front wheel and a tiny back wheel. A bigger wheel meant more speed, but riders often fell. Finally, in the 1880s, the safety bicycle appeared. It had two wheels of the same size and a chain connected to the back wheel, very similar to the bikes we ride today.","questions":[{"q":"What was special about the first bicycle-like machine?","options":["It had a chain.","It was made of iron.","It had three wheels.","It had no pedals."],"answer":3,"why":"„It was made of wood and had no pedals.“","skill":"detail"},{"q":"Why were some early bicycles called boneshakers?","options":["They were very uncomfortable to ride.","They were extremely fast.","They were made of bones.","They were often stolen from their riders."],"answer":0,"why":"Holprige Straßen und Eisenräder.","skill":"detail"},{"q":"What was the problem with bicycles that had a huge front wheel?","options":["They were too expensive.","Riders often fell off.","They had no seats.","They were too slow."],"answer":1,"why":"„riders often fell“.","skill":"detail"},{"q":"What does the speaker say about the safety bicycle?","options":["It had no chain.","It was only used in Germany.","It was similar to modern bicycles.","It was invented in 1817."],"answer":2,"why":"„very similar to the bikes we ride today“.","skill":"detail"}]},{"id":"tk03","level":2,"voice":"W","title":"Desire Paths","text":"Have you ever noticed a narrow dirt path cutting across a lawn, even though a paved sidewalk goes around it? Urban planners call these desire paths. They form when enough people decide that the official route is inconvenient and take a shortcut instead. For a long time, many planners saw desire paths as a nuisance. They put up fences or signs to keep people on the sidewalks. More recently, though, some designers have started treating these paths as valuable information. After all, a desire path shows exactly where people actually want to walk. Some universities have even used this idea when designing new campuses. Instead of paving walkways right away, they plant grass everywhere and wait a few months. Then they pave the paths that students have worn into the ground. The result is a network of walkways that matches how people really move around the campus.","questions":[{"q":"What is the talk mainly about?","options":["How to grow grass on university campuses","The long history of paved sidewalks in modern cities and towns","Why people should stay on sidewalks","Paths created by shortcuts and how planners respond to them"],"answer":3,"why":"Trampelpfade und der Umgang der Planer damit.","skill":"main"},{"q":"How did many planners traditionally respond to desire paths?","options":["They tried to stop people from using them.","They ignored them completely.","They studied them carefully before making changes.","They paved them immediately."],"answer":0,"why":"Zäune und Schilder – „a nuisance“.","skill":"detail"},{"q":"Why does the speaker mention universities?","options":["To show where desire paths are most common in large cities","To give an example of designers using desire paths in planning","To explain who first described desire paths","To criticize students for damaging lawns"],"answer":1,"why":"Beispiel: erst Gras säen, dann die Trampelpfade pflastern.","skill":"purpose"},{"q":"What can be inferred about the walkways at those universities?","options":["They are usually fenced in.","They are mostly made of dirt.","They are likely to be convenient for students.","They were designed before the campus was built."],"answer":2,"why":"Sie folgen den Wegen, die Studierende tatsächlich gehen.","skill":"infer"}]},{"id":"tk04","level":2,"voice":"M","title":"The Tragedy of the Commons","text":"In economics, there's an idea called the tragedy of the commons. Imagine a pasture that's open to all the farmers in a village. Each farmer benefits from adding one more cow to the field, because they get the milk and the profit. But the cost, the grass that the extra cow eats, is shared by everyone. So each farmer has a reason to keep adding cows. Eventually, the pasture is overgrazed and becomes useless for everyone. The same pattern shows up in many modern situations: overfishing in the ocean, traffic on public roads, even air pollution. In each case, individuals acting in their own interest end up harming a resource they all depend on. For many years, economists thought the only solutions were government rules or private ownership. But the political scientist Elinor Ostrom found that many communities manage shared resources successfully on their own, by creating local rules and monitoring each other. Her work earned her a Nobel Prize in 2009.","questions":[{"q":"What is the main purpose of the talk?","options":["To argue that all shared resources should be privately owned","To describe the history of farming","To compare cows with fish","To explain a concept and how the problem can be addressed"],"answer":3,"why":"Begriff erklären + Lösungen (Regeln, Ostrom).","skill":"main"},{"q":"Why does each farmer keep adding cows?","options":["Each farmer gets the benefit, while the cost is shared.","Cows produce more milk in large groups.","The government pays the farmers a fee for each cow they own.","The pasture keeps growing."],"answer":0,"why":"Nutzen privat, Kosten geteilt.","skill":"detail"},{"q":"Why does the speaker mention traffic on public roads?","options":["To explain how roads are funded","As a modern example of the same problem","To show a solution to overgrazing","To describe Ostrom's research"],"answer":1,"why":"Aufzählung moderner Beispiele.","skill":"purpose"},{"q":"What did Elinor Ostrom find?","options":["Shared resources always fail.","Government rules are always necessary.","Communities can manage shared resources with their own rules.","Private ownership is the only solution that really works."],"answer":2,"why":"Lokale Regeln und gegenseitige Kontrolle funktionieren.","skill":"detail"}]},{"id":"tk05","level":2,"voice":"W","title":"How Birds Navigate","text":"How do migrating birds find their way over thousands of kilometers? Researchers have discovered that birds use several tools at once. During the day, many species navigate using the position of the sun. At night, some birds, like the indigo bunting, use the stars. In one famous experiment, young buntings were raised in a planetarium, a building where the night sky is projected onto a ceiling. When the researchers rotated the projected sky, the birds changed the direction they tried to fly. Birds also seem to sense the Earth's magnetic field. Scientists believe that special proteins in birds' eyes may allow them to see magnetic lines. And as they get closer to their destination, birds rely on familiar landmarks, like rivers, coastlines, and mountains, as well as smells. What's remarkable is that birds can switch between these tools depending on the weather. On cloudy nights, when the stars are hidden, they depend more on the magnetic field.","questions":[{"q":"What is the talk mainly about?","options":["How planetariums are built","Why birds migrate in winter","Which kinds of birds fly the longest distances","The different ways birds navigate during migration"],"answer":3,"why":"Mehrere Orientierungshilfen der Zugvögel.","skill":"main"},{"q":"What did the planetarium experiment show?","options":["The birds used the stars to choose a direction.","The birds preferred daylight.","The birds could not fly indoors.","The birds ignored the projected sky completely."],"answer":0,"why":"Gedrehter Himmel → andere Flugrichtung.","skill":"detail"},{"q":"According to the speaker, what may help birds sense the magnetic field?","options":["Landmarks such as rivers","Proteins in their eyes","The position of the sun","Their feathers"],"answer":1,"why":"„special proteins in birds' eyes“.","skill":"detail"},{"q":"What do birds do on cloudy nights?","options":["They stop flying until morning.","They follow other birds.","They rely more on the magnetic field.","They use the sun instead."],"answer":2,"why":"Sterne verdeckt → Magnetfeld.","skill":"detail"}]},{"id":"tk06","level":3,"voice":"M","title":"Anchoring","text":"I'd like to talk about a cognitive bias that affects nearly every negotiation you'll ever take part in: anchoring. Anchoring refers to our tendency to rely too heavily on the first piece of information we receive when making a judgment. In a classic study, participants spun a wheel that was rigged to stop at either ten or sixty-five. They were then asked to estimate the percentage of African countries in the United Nations. Those who'd seen sixty-five gave estimates that were, on average, almost twice as high as those who'd seen ten, even though they knew the number was random. Now, the implications for business are considerable. In salary negotiations, the first figure mentioned tends to shape the entire discussion, which is why some experts advise making the first offer yourself, provided you've done your research. Interestingly, being aware of the bias doesn't eliminate it. Even experienced real estate agents, when given different listing prices for the same house, produced valuations that were pulled toward the listed price, while insisting the price hadn't influenced them.","questions":[{"q":"What is the speaker mainly discussing?","options":["How real estate agents are trained","Strategies that help people estimate percentages correctly","The history of the United Nations","The tendency for initial information to influence judgments"],"answer":3,"why":"Anker-Effekt: erste Information prägt das Urteil.","skill":"main"},{"q":"Why does the speaker mention the wheel experiment?","options":["To show that even random numbers can affect estimates","To compare two types of negotiation","To explain how the United Nations was originally formed","To show that people are good at estimating"],"answer":0,"why":"Zufallszahl verzerrte die Schätzungen.","skill":"purpose"},{"q":"What advice does the speaker mention for salary negotiations?","options":["Never mention a specific number during the negotiation","Consider making the first offer after doing research","Accept the first figure that is offered","Always wait for the employer's offer"],"answer":1,"why":"„making the first offer yourself, provided you've done your research“.","skill":"detail"},{"q":"What does the speaker imply about the real estate agents?","options":["They refused to give valuations.","They deliberately overvalued the houses.","They were influenced by the bias without realizing it.","Their experience protected them from the bias."],"answer":2,"why":"Beeinflusst, obwohl sie es bestritten.","skill":"infer"}]},{"id":"tk07","level":3,"voice":"W","title":"Dating the Past with Tree Rings","text":"Today we're going to look at dendrochronology, the science of dating events using tree rings. Most of you know that a tree adds one ring per year. What's less obvious is that the width of each ring reflects the growing conditions that year: wet years produce wide rings, while droughts produce narrow ones. Because trees in the same region experience the same weather, they share a distinctive pattern of wide and narrow rings, a bit like a barcode. Researchers can match the pattern in a living tree with the pattern in an old wooden beam, and then overlap that with even older samples. By chaining samples together in this way, scientists in Europe have built continuous records stretching back more than twelve thousand years. The applications go well beyond biology. Archaeologists have used tree rings to determine exactly when medieval buildings were constructed, and climate scientists use them to reconstruct rainfall patterns from periods long before weather records existed. Tree rings have even helped calibrate radiocarbon dating, correcting errors in that method of up to several centuries.","questions":[{"q":"What is the main topic of the talk?","options":["Problems with the accuracy of modern weather records","The history of medieval architecture","How trees survive droughts","Using tree rings to date events and reconstruct the past"],"answer":3,"why":"Dendrochronologie und ihre Anwendungen.","skill":"main"},{"q":"Why does the speaker compare ring patterns to a barcode?","options":["To show that the patterns are distinctive and can be matched","To explain how machines count rings","To describe how wood is sold","To show that all trees have the same number of rings"],"answer":0,"why":"Unverwechselbares Muster, das man abgleichen kann.","skill":"purpose"},{"q":"How have scientists created records that go back more than 12,000 years?","options":["By finding a single very old tree","By linking overlapping samples of different ages","By using radiocarbon dating alone on old wood","By studying modern weather records"],"answer":1,"why":"„By chaining samples together“.","skill":"detail"},{"q":"What does the speaker imply about radiocarbon dating?","options":["It is more accurate than tree rings for recent periods.","It has replaced dendrochronology.","It was less accurate before tree-ring data was used.","It can only be used on trees."],"answer":2,"why":"Baumringe korrigierten Fehler von bis zu mehreren Jahrhunderten.","skill":"infer"}]},{"id":"tk08","level":1,"voice":"M","title":"Why We Have Leap Years","text":"Have you ever wondered why February sometimes has twenty-nine days? It's because of something called a leap year. The Earth takes about three hundred sixty-five and a quarter days to travel around the sun. But our calendar year has only three hundred sixty-five days. So every year, the calendar falls about six hours behind. After four years, those extra hours add up to almost one full day. To fix this, we add an extra day, February twenty-ninth, every four years. Without leap years, our seasons would slowly move. After a few hundred years, summer would start in what we now call autumn.","questions":[{"q":"What is the talk mainly about?","options":["How the seasons change","Why leap years exist","How long a day is","The history of February"],"answer":1,"why":"Thema im ersten Satz.","skill":"main"},{"q":"How long does the Earth take to travel around the sun?","options":["366 days","About 360 days","About 365¼ days","Exactly 365 days"],"answer":2,"why":"„about three hundred sixty-five and a quarter days“.","skill":"detail"},{"q":"How often is an extra day added?","options":["Every hundred years","Every two years","Every year","Every four years"],"answer":3,"why":"„every four years“.","skill":"detail"},{"q":"What would happen without leap years?","options":["The seasons would slowly shift in the calendar.","February would disappear.","The Earth would move faster.","Days would slowly get longer and longer."],"answer":0,"why":"Der Sommer würde irgendwann im heutigen Herbst beginnen.","skill":"detail"}]},{"id":"tk09","level":1,"voice":"W","title":"How Bees Make Honey","text":"Today let's talk about how bees make honey. First, worker bees fly from flower to flower and collect a sweet liquid called nectar. They store the nectar in a special stomach and carry it back to the hive. There, they pass the nectar to other bees, who chew it for about half an hour. Then the bees put it into small wax cells. The nectar is still very watery, so the bees fan it with their wings to dry it. When most of the water is gone, the nectar has become honey. Finally, the bees cover each cell with wax to keep the honey clean. One bee makes only about a twelfth of a teaspoon of honey in its whole life.","questions":[{"q":"What do bees collect from flowers?","options":["Honey","Nectar","Wax","Water"],"answer":1,"why":"„a sweet liquid called nectar“.","skill":"detail"},{"q":"Why do bees fan the nectar with their wings?","options":["To keep it warm","To move it to another hive","To remove water from it","To make it sweeter"],"answer":2,"why":"„to dry it“.","skill":"detail"},{"q":"What do the bees do last?","options":["Fly to more flowers","Fan the honey","Chew the nectar","Cover the cells with wax"],"answer":3,"why":"„Finally, the bees cover each cell with wax“.","skill":"detail"},{"q":"What does the speaker say about a single bee?","options":["It produces only a small amount of honey in its life.","It can visit every flower in one day.","It lives for many years.","It makes about a teaspoon of honey every single day."],"answer":0,"why":"Nur etwa 1/12 Teelöffel im ganzen Leben.","skill":"detail"}]},{"id":"tk10","level":2,"voice":"M","title":"The Bystander Effect","text":"In psychology, the bystander effect refers to a surprising finding: people are less likely to help someone in an emergency when other people are present. You might expect the opposite, that more witnesses would mean more help. But in a series of experiments in the 1960s, researchers found that participants who believed they were the only person hearing someone in distress helped quickly, while those who thought several others could hear often did nothing. Researchers point to two main causes. The first is diffusion of responsibility: when many people are present, each person feels less personally responsible. The second is social influence. In an unclear situation, people look at how others react, and if no one else seems worried, they assume there's no emergency. The good news is that simply knowing about the effect can reduce it. And if you ever need help in a crowd, experts suggest pointing to one specific person and asking them directly.","questions":[{"q":"What is the bystander effect?","options":["People help more quickly when others are watching them.","People are less likely to help when others are present.","People avoid crowded places.","People panic in emergencies."],"answer":1,"why":"Definition am Anfang.","skill":"detail"},{"q":"What did the experiments in the 1960s show?","options":["Most participants refused to help anyone.","Participants could not hear the person in distress.","People who thought they were alone helped more quickly.","Groups helped faster than individuals."],"answer":2,"why":"Allein → schnell geholfen; mit anderen → oft nichts.","skill":"detail"},{"q":"According to the speaker, what does diffusion of responsibility mean?","options":["People share tasks equally.","One person in the group naturally takes control of the situation.","Responsibility increases
