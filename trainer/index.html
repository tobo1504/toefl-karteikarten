<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEFL-Trainer">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>TOEFL-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: ruhige Lernspalte; im Test eine feste Kopfleiste wie im ETS-Interface, Text links, Frage rechts (breit) bzw. untereinander (Handy) */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f1ee; --ink:#1c2321; --muted:#6c7471; --faint:#9aa19e; --line:#e2e5e1;
  --accent:#2e5e57; --accent-soft:#e6eeec; --mark:#b39a5c; --good:#3f7a5a; --bad:#a5524a;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(28,35,33,.04),0 8px 24px -12px rgba(28,35,33,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:36px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1080px}
h1{font-family:var(--f-display);font-weight:500;font-size:2rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:1.35rem;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;max-width:58ch}
.label{font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Start */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);transition:border-color .15s,box-shadow .15s;min-width:0}
.tile:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.tile[disabled]{cursor:default;opacity:.5;box-shadow:none;border-color:var(--line)}
.tile b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.tile span{font-size:.84rem;color:var(--muted)}
.tile .stat{font:500 .76rem var(--f-mono);color:var(--accent);margin-top:6px}
.group{display:flex;flex-direction:column;gap:12px}
.typelist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.typerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.typerow:last-child{border-bottom:0}
.typerow:hover{background:var(--surface-2)}
.typerow[disabled]{cursor:default;opacity:.45;background:none}
.typerow .t{font-weight:500}
.typerow .d{font-size:.8rem;color:var(--muted)}
.typerow .s{font:500 .76rem var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sect{font:600 .7rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 16px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}

/* Buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 18px;font:500 .92rem var(--f-body);cursor:pointer;transition:border-color .15s,opacity .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.grow{flex:1 1 160px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Testkopf */
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.testbar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.testbar .sec{font:600 .78rem var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.testbar .pos{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.testbar .sp{flex:1}
.testbar .pos{white-space:nowrap}
.navbtns{display:flex;gap:8px}
@media (max-width:640px){
  .testbar-in{gap:8px}
  .testbar .sec,.testbar .pn{display:none}
  .navbtns{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .navbtns .btn{flex:1}
  body.testing .wrap{padding-bottom:110px}
  .task:not(.single)>.panel:first-child{max-height:46vh;overflow:auto}
}
.timer{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{color:var(--bad)}
.timer.hide{color:transparent;text-shadow:none}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

/* Aufgaben-Layout */
.task{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.task.single{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto;width:100%}
@media (max-width:820px){.task{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 24px 22px;min-width:0}
.passage{font-family:var(--f-display);font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 .9em}.passage p:last-child{margin-bottom:0}
.passage h3{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 12px}
.direction{font:500 .9rem var(--f-body);color:var(--muted);margin-bottom:12px}
.qtext{font-family:var(--f-display);font-size:1.15rem;line-height:1.45;margin:0 0 14px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 .97rem var(--f-body);cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--faint)}
.opt .k{font:600 .78rem var(--f-mono);color:var(--muted);width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{font-size:.88rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qnav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font:500 .8rem var(--f-mono);cursor:pointer}
.qnav button.on{border-color:var(--ink);color:var(--ink)}
.qnav button.done{background:var(--surface-2)}

/* Daily-Life-Texte */
.doc{font-family:var(--f-body);font-size:.95rem;line-height:1.55;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg)}
.doc .dtitle{font-weight:600;margin-bottom:8px}
.doc .mailhead{font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.doc .mailhead b{font-weight:500;color:var(--ink)}
.doc p{margin:0 0 .7em}.doc p:last-child{margin:0}
.doc table{border-collapse:collapse;width:100%;font-size:.88rem}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.doc .tw{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bubble small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}

/* Complete the Words */
.ctw{font-family:var(--f-display);font-size:1.12rem;line-height:2.25}
.gap{display:inline-flex;align-items:baseline;white-space:nowrap}
.gap input{font:500 1rem var(--f-mono);border:0;border-bottom:1.5px solid var(--faint);background:transparent;color:var(--ink);padding:0 2px;margin:0 1px;letter-spacing:.32em;border-radius:0;text-transform:lowercase}
.gap input:focus{outline:none;border-color:var(--ink);background:var(--surface-2)}
.gap input.ok{border-color:var(--good);color:var(--good)}
.gap input.no{border-color:var(--bad);color:var(--bad)}
.gap .sol{font:500 .78rem var(--f-mono);color:var(--good);margin-left:4px}

/* Build a Sentence */
.speaker{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 .8rem var(--f-body);flex:none}
.say{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-size:1.1rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:14px}
.slot{min-width:56px;height:36px;border-bottom:1.5px solid var(--faint);display:inline-flex;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:500 .95rem var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip.used{visibility:hidden}
.slots .chip{background:var(--surface-2);border-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.punct{font-family:var(--f-display);font-size:1.1rem}

/* Schreiben */
.prompt-box{font-size:.95rem}
.prompt-box ul{margin:8px 0 0;padding-left:20px}
.post{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:0}
.post .who{font-weight:600;font-size:.88rem}
.post p{margin:4px 0 0;font-size:.95rem}
textarea.write{width:100%;box-sizing:border-box;min-height:300px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:16px;font:400 1rem/1.6 var(--f-body);resize:vertical}
textarea.write:focus{outline:none;border-color:var(--ink)}
.wc{font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* Ergebnisse */
.bandrow{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bandrow>div{flex:1;padding:14px 8px;text-align:center;min-width:0}
.bandrow>div+div{border-left:1px solid var(--line)}
.big{font:500 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column}
.ritem{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:10px}
.ritem .m{font-weight:700}.ritem .m.ok{color:var(--good)}.ritem .m.no{color:var(--bad)}
.ritem .q{font-size:.92rem}.ritem .a{font-size:.85rem;color:var(--muted)}
.evalbox{display:flex;flex-direction:column;gap:12px}
.score5{display:flex;align-items:baseline;gap:10px}
.errs{display:flex;flex-direction:column}
.err{padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.err s{color:var(--bad);text-decoration-thickness:1px}
.err .fix{color:var(--good)}
.err .r{color:var(--muted);font-size:.84rem}
.improved{font-family:var(--f-display);font-size:1.02rem;line-height:1.65;background:var(--surface-2);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
table.hist{border-collapse:collapse;width:100%;font-size:.88rem}
table.hist th{font:600 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left}
table.hist th,table.hist td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist td.n,table.hist th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.code{width:100%;box-sizing:border-box;font:400 .76rem var(--f-mono);background:var(--surface-2);color:var(--ink);border:0;border-radius:10px;padding:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Listening/Speaking */
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px;text-align:center}
.wave{display:flex;gap:3px;height:40px;align-items:center}
.wave i{width:3px;height:6px;background:var(--line);border-radius:2px;transition:background .2s}
.wave.on i{background:var(--accent);animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:34px}}
select{font-family:var(--f-body)}

</style>
<div id="app"></div>
<script>
const DATA={"reading":{"ctw":[{"id":"ctw01","level":2,"text":"Scientists have long suspected that sleep plays an important role in learning. During de{ep} sleep, t{he} brain rep{lays} information th{at} was gath{ered} during t{he} day a{nd} moves i{t} from temp{orary} to perm{anent} storage. In one experiment, students who slept after studying remembered more words than students who stayed awake. Researchers believe that certain brain waves help strengthen the connections between neurons. This may explain why students who sleep poorly often struggle in exams."},{"id":"ctw02","level":1,"text":"Public libraries offer much more than books. Many o{f} them le{nd} laptops, cam{eras}, and ev{en} musical instr{uments} to th{eir} members. So{me} libraries al{so} run fr{ee} classes o{n} topics such as cooking, coding, and personal finance. Because these services cost nothing, they are especially helpful for families with small budgets. In many towns, the library has become a meeting place where people of all ages can study, work, or simply relax."},{"id":"ctw03","level":3,"text":"Cities are often several degrees warmer than the surrounding countryside. This pheno{menon}, known a{s} the ur{ban} heat isl{and} effect, ari{ses} because asp{halt} and conc{rete} absorb so{lar} radiation dur{ing} the d{ay} and release it slowly at night. The scarcity of vegetation intensifies the problem, since plants cool their surroundings through evaporation. Municipal planners increasingly counteract the effect by installing reflective roofing materials and expanding green spaces, measures that can substantially reduce energy consumption during summer heat waves."},{"id":"ctw04","level":2,"text":"Honeybees have a remarkable way of sharing information. When a wor{ker} bee disc{overs} a go{od} source o{f} food, i{t} returns t{o} the hi{ve} and perf{orms} a spe{cial} dance. T{he} direction of the dance shows other bees which way to fly, while its length indicates how far away the flowers are. Scientists first described this behavior many decades ago, and later studies confirmed that bees can follow these instructions with surprising accuracy."},{"id":"ctw05","level":1,"text":"More people are riding bicycles to work than ever before. In ma{ny} cities, n{ew} bike la{nes} make t{he} trip sa{fer} and fas{ter}. Cycling i{s} cheap, a{nd} it al{so} helps peo{ple} stay fit without going to a gym. Some companies even pay workers a small bonus for leaving their cars at home. However, bad weather and long distances still keep many commuters from making the switch."},{"id":"ctw06","level":3,"text":"The placebo effect remains one of the most intriguing phenomena in medicine. Patients w{ho} receive a{n} inactive subs{tance} sometimes rep{ort} genuine improv{ements} in th{eir} symptoms, partic{ularly} when t{he} condition invo{lves} pain o{r} anxiety. Researchers attribute this response to expectation, which appears to trigger the release of natural chemicals in the brain. Consequently, clinical trials must compare new drugs against placebos rather than against no treatment at all, ensuring that observed benefits exceed those produced by belief alone."},{"id":"ctw07","level":2,"text":"Many animals use camouflage to avoid predators. Some ins{ects} look alm{ost} exactly li{ke} leaves o{r} twigs, wh{ich} makes th{em} very diff{icult} to s{ee}. Other ani{mals} can cha{nge} their colors to match their surroundings, as octopuses and some lizards do. Camouflage is not only useful for prey, however. Predators such as tigers use their striped coats to hide in tall grass while they wait for the right moment to attack."},{"id":"ctw08","level":1,"text":"Drinking enough water is important for good health. Our bod{ies} use wa{ter} to con{trol} temperature a{nd} to ca{rry} nutrients t{o} our ce{lls}. Many peo{ple} only dr{ink} when th{ey} feel thirsty, but by then the body may already need more water. Doctors suggest keeping a bottle nearby during the day. Fruits and vegetables also contain a lot of water, so they can help too."},{"id":"ctw09","level":3,"text":"Language extinction has accelerated dramatically over the past century. Linguists esti{mate} that rou{ghly} half o{f} the wor{ld's} languages co{uld} disappear wit{hin} the ne{xt} hundred ye{ars}. When a lang{uage} vanishes, commu{nities} frequently lose irreplaceable knowledge about local ecosystems, medicinal plants, and cultural traditions. Revitalization programs, which typically combine immersive schooling with digital archives, have achieved notable success in several regions, demonstrating that the decline is not necessarily irreversible when communities receive sustained institutional support."}],"daily":[{"id":"d01","level":2,"genre":"notice","title":"Library notice","text":"# Notice to All Library Users\nThe second floor of Hartwell Library will be closed from March 4 to March 18 while new study rooms are built.\nDuring this time, the group study area will move to Room 105 on the first floor. Printers from the second floor have been relocated next to the main desk on the first floor.\nBooks from the second-floor collection can still be requested online and picked up within 24 hours. We apologize for the inconvenience.","questions":[{"q":"What is the main purpose of the notice?","options":["To inform users about a temporary closure","To ask users to return books early","To announce new library opening hours","To advertise study rooms that can be rented"],"answer":0,"why":"Der Aushang kündigt an, dass der 2. Stock vom 4. bis 18. März geschlossen ist."},{"q":"According to the notice, how can users get books from the second floor during the closure?","options":["By waiting until March 18","By requesting them online","By asking a librarian on the second floor","By going to Room 105"],"answer":1,"why":"„Books … can still be requested online and picked up within 24 hours.“"},{"q":"The word \"relocated\" in the notice is closest in meaning to","options":["replaced","removed","moved","repaired"],"answer":2,"why":"relocate = an einen anderen Ort bringen."}]},{"id":"d02","level":2,"genre":"email","title":"Team lunch","text":"From: Dana Whitfield\nTo: All Marketing Staff\nSubject: Friday's team lunch\nHi everyone,\nJust a reminder that our team lunch is this Friday at 12:30 at Rosa's Kitchen on Elm Street. The restaurant has asked for final numbers by Wednesday, so please reply to this email if you haven't already.\nVegetarian and gluten-free options are available, but let me know about any other dietary needs. The company will cover the cost of meals, though drinks other than water and soft drinks will not be reimbursed.\nThanks,\nDana","questions":[{"q":"What does Dana ask the staff to do?","options":["Bring food to the office on Friday","Suggest a different restaurant for Friday's lunch","Pay for their meals in advance","Confirm whether they are coming by Wednesday"],"answer":3,"why":"Das Restaurant braucht bis Mittwoch die finale Zahl – wer noch nicht geantwortet hat, soll antworten."},{"q":"What is indicated about drinks?","options":["Employees must pay for some drinks themselves","The company will pay for every drink that is ordered","Only water will be served at the restaurant","Drinks must be ordered by Wednesday"],"answer":0,"why":"Getränke außer Wasser und Softdrinks werden nicht erstattet."}]},{"id":"d03","level":2,"genre":"chat","title":"Study session","text":"Maya: Hey, are you still coming to the study session tonight?\nJordan: Yes, but I might be 15 minutes late. My lab runs until 7.\nMaya: No problem. We moved it to the third-floor lounge, by the way. The library was packed.\nJordan: Good to know. Should I bring anything?\nMaya: If you still have the practice problems from last week, bring those. Nobody else saved them.","questions":[{"q":"Why will Jordan be late?","options":["The library is too crowded.","His lab ends at 7.","He has to find the practice problems.","He forgot about the session."],"answer":1,"why":"„My lab runs until 7.“"},{"q":"Why did the group change the location of the session?","options":["The lounge has better equipment.","The library closes early.","The library was too full.","Jordan asked them to."],"answer":2,"why":"„The library was packed.“ – packed = überfüllt."},{"q":"What does Maya ask Jordan to bring?","options":["A copy of the textbook","Notes from his lab","Snacks and drinks for everyone in the group","Practice problems from the previous week"],"answer":3,"why":"„If you still have the practice problems from last week, bring those.“"}],"me":"Jordan"},{"id":"d04","level":2,"genre":"menu","title":"Café specials","text":"# Green Fork Café – Weekday Lunch Specials\nItem | Price\nSoup of the day | $4.50\nGrilled chicken wrap | $8.75\nQuinoa salad bowl | $9.25\nCombo: any half sandwich + soup | $9.00\nSpecials are served Monday through Friday from 11:00 a.m. to 2:30 p.m. Show a valid student ID to receive 10% off any combo.\nOnline orders placed before 10:30 a.m. are guaranteed to be ready by noon.","questions":[{"q":"How much would a student with a valid ID pay for the combo?","options":["$8.10","$9.90","$8.75","$9.00"],"answer":0,"why":"10 % Rabatt auf $9.00 = $8.10."},{"q":"What is true about online orders?","options":["They must be paid for in cash when picked up.","Orders placed early will be ready by midday.","They are delivered to campus.","They are only available for combos."],"answer":1,"why":"Vor 10:30 bestellt = garantiert bis 12 Uhr fertig."},{"q":"When can a customer NOT order the specials?","options":["On Friday at 11:30 a.m.","On Monday at 2:00 p.m.","On Saturday at noon","On Tuesday at 1:00 p.m."],"answer":2,"why":"Die Specials gibt es nur Montag bis Freitag."}]},{"id":"d05","level":2,"genre":"post","title":"Garden volunteers","text":"# Riverside Community Garden\nPosted by Riverside Garden Club\nVolunteers needed! This Saturday from 9 a.m. to noon we'll be preparing the beds for spring planting. No experience necessary – we'll provide gloves and tools. Just wear clothes you don't mind getting dirty.\nAnyone who volunteers three times this season will get their own small plot for free next year. Coffee and pastries will be provided by Main Street Bakery.","questions":[{"q":"What is the purpose of the post?","options":["To sell plots in a garden","To advertise a local bakery","To announce a gardening class","To find people to help in a garden"],"answer":3,"why":"„Volunteers needed!“ – es werden Helfer gesucht."},{"q":"What will people who volunteer three times receive?","options":["A garden plot at no cost","Free coffee for a year","A discount at a bakery","A set of garden tools"],"answer":0,"why":"„… will get their own small plot for free next year.“"}]},{"id":"d06","level":2,"genre":"receipt","title":"Bookstore receipt","text":"# Campus Bookstore – Receipt\nSept. 3 · Transaction #40217\nItem | Price\nIntro to Psychology (used) | $62.00\nLab notebook | $11.50\nGraphing calculator (rental, 1 semester) | $25.00\nTotal | $98.50\nUsed books may be returned for a full refund within 14 days with this receipt. Rental items must be returned by December 20, or the full purchase price will be charged.","questions":[{"q":"What will happen if the calculator is returned on December 22?","options":["The rental period will be extended.","The student will be charged the calculator's full price.","Nothing, because the semester is over.","The student will receive a partial refund for the rental."],"answer":1,"why":"Leihartikel bis 20.12. zurück, sonst wird der volle Kaufpreis berechnet."},{"q":"What is indicated about the psychology book?","options":["It was bought new.","It is a rental item.","It can be returned for a refund for two weeks.","It must be returned to the store by December 20."],"answer":2,"why":"Gebrauchte Bücher: volle Erstattung innerhalb von 14 Tagen."}]},{"id":"d07","level":1,"genre":"notice","title":"Pool closed","text":"# Pool Closed\nThe campus swimming pool will be closed on Monday, October 14, for cleaning. It will open again on Tuesday at 6:00 a.m.\nSwim classes planned for Monday will take place on Wednesday at the same time. Thank you for your patience!","questions":[{"q":"Why is the pool closed?","options":["It is a holiday.","The weather is bad.","There is a swim competition.","It is being cleaned."],"answer":3,"why":"„… closed … for cleaning.“"},{"q":"What will happen to Monday's swim classes?","options":["They will be held on Wednesday.","They are canceled.","They will be held on Tuesday.","They will start at 6:00 a.m."],"answer":0,"why":"„… will take place on Wednesday at the same time.“"}]},{"id":"d08","level":1,"genre":"chat","title":"Movie tonight","text":"Lena: Are you going to the movie tonight?\nSam: I want to, but I have to finish my essay first.\nLena: It starts at 8. Can you make it?\nSam: Probably. Save me a seat just in case!","questions":[{"q":"What does Sam need to do before the movie?","options":["Meet a professor","Finish an essay","Buy tickets","Eat dinner"],"answer":1,"why":"„I have to finish my essay first.“"},{"q":"What does Sam ask Lena to do?","options":["Help him with his essay","Change the movie time","Keep a seat for him","Wait outside the theater"],"answer":2,"why":"„Save me a seat“ = halte mir einen Platz frei."}],"me":"Sam"},{"id":"d09","level":1,"genre":"ad","title":"Room for rent","text":"# Room for Rent\nQuiet room available in a shared apartment, 10 minutes from campus by bus. $550 per month, including electricity and internet. Shared kitchen and bathroom. No pets.\nAvailable from January 1. Contact Mark at 555-0147 after 5 p.m.","questions":[{"q":"What is included in the rent?","options":["Parking","Meals","A bus pass","Internet"],"answer":3,"why":"„$550 per month, including electricity and internet.“"},{"q":"When should people call Mark?","options":["In the evening","At lunchtime","In the morning","Only on January 1"],"answer":0,"why":"„after 5 p.m.“"},{"q":"Who would NOT be able to rent the room?","options":["Someone who cooks often","A person who has a cat","A student without a car","Someone who wants to move in in January"],"answer":1,"why":"„No pets.“"}]},{"id":"d10","level":1,"genre":"email","title":"No class","text":"From: Prof. Alvarez\nTo: BIO 101 Students\nSubject: No class on Thursday\nDear students,\nI will be at a conference this week, so there is no class on Thursday. Please read Chapter 6 instead. We will discuss it next Tuesday.\nThe quiz planned for Thursday will also take place on Tuesday.\nBest,\nProfessor Alvarez","questions":[{"q":"Why is there no class on Thursday?","options":["It is a holiday.","The professor is sick.","The professor is attending a conference.","The classroom is being repaired."],"answer":2,"why":"„I will be at a conference this week.“"},{"q":"What will students do next Tuesday?","options":["Read Chapter 6 together during class","Hand in a lab report","Go to a conference","Discuss Chapter 6 and take a quiz"],"answer":3,"why":"Kapitel 6 wird besprochen, und das Quiz findet ebenfalls Dienstag statt."}]},{"id":"d11","level":1,"genre":"schedule","title":"Shuttle bus","text":"# Shuttle Bus: Campus to Downtown\nStop | Weekdays | Weekends\nMain Gate | every 15 min | every 30 min\nScience Building | every 15 min | every 30 min\nDowntown Station | every 15 min | every 30 min\nThe last bus leaves Main Gate at 11:45 p.m. Students ride free with their ID card.","questions":[{"q":"How often does the shuttle run on Saturdays?","options":["Every 30 minutes","Every 15 minutes","It does not run on Saturdays.","Every hour"],"answer":0,"why":"Wochenende: every 30 min."},{"q":"What do students need in order to ride for free?","options":["A paper ticket","Their ID card","A monthly pass","Nothing at all"],"answer":1,"why":"„Students ride free with their ID card.“"}]},{"id":"d12","level":3,"genre":"email","title":"Water outage","text":"From: Facilities Management\nTo: Residents of Whitmore Hall\nSubject: Scheduled water outage – please read\nDear residents,\nContractors will be replacing a corroded main valve in Whitmore Hall on Thursday. To complete the work safely, the water supply to the entire building will be shut off between 8:00 a.m. and approximately 2:00 p.m.\nAlthough we anticipate finishing on schedule, residents should be aware that unforeseen complications occasionally prolong such repairs. Shower facilities in the adjacent Recreation Center will remain open to Whitmore residents throughout the day.\nWe recommend filling containers with drinking water the night before.\nFacilities Management","questions":[{"q":"Why will the water be shut off?","options":["The building's water tanks are being cleaned.","The building is being connected to the Recreation Center.","A damaged part of the water system is being replaced.","A new shower system is being tested."],"answer":2,"why":"„replacing a corroded main valve“ – ein beschädigtes Ventil wird ersetzt."},{"q":"What does Facilities Management suggest about the repair?","options":["It has already been postponed several times.","It requires residents to leave the building.","It will definitely end before 2:00 p.m.","It might take longer than planned."],"answer":3,"why":"„unforeseen complications occasionally prolong such repairs“ – es kann länger dauern."},{"q":"The word \"adjacent\" in the email is closest in meaning to","options":["nearby","public","newly built","larger"],"answer":0,"why":"adjacent = angrenzend, benachbart."}]},{"id":"d13","level":3,"genre":"post","title":"Sustainability office","text":"# Campus Sustainability Office\nLast semester's \"Bring Your Own Mug\" campaign exceeded every expectation: disposable cup use in campus cafés fell by 38 percent.\nEncouraged by these results, we are extending the 25-cent discount for reusable containers to all dining halls starting next month. We are also piloting a deposit system in two cafés, in which customers pay $1 for a reusable cup and get their dollar back when the cup is returned.\nShould the pilot prove successful, it will be introduced campus-wide in the fall.","questions":[{"q":"What is the main purpose of the post?","options":["To explain why prices in campus dining halls are rising this year","To report the results of a campaign and announce next steps","To criticize students for using disposable cups","To announce that cafés will stop selling coffee"],"answer":1,"why":"Ergebnis der Kampagne (−38 %) plus Ausweitung und Pilotprojekt."},{"q":"What can be inferred about the deposit system?","options":["It is already used in all dining halls.","It costs customers 25 cents per cup.","Whether it is expanded depends on how well it works at first.","It has replaced the discount for reusable containers."],"answer":2,"why":"„Should the pilot prove successful, it will be introduced campus-wide.“"},{"q":"The phrase \"exceeded every expectation\" means that the campaign was","options":["more expensive than expected","less popular than expected","shorter than expected","more successful than expected"],"answer":3,"why":"exceed = übertreffen."}]},{"id":"d14","level":3,"genre":"chat","title":"Draft feedback","text":"Daniel: Did you get a chance to look at the draft I sent?\nPriya: I did. The data section is really strong.\nDaniel: And the introduction?\nPriya: Well… I think a reader who isn't in our field might have a hard time figuring out why the topic matters.\nDaniel: So, back to the drawing board?\nPriya: Not entirely – just a couple of paragraphs. I can go over it with you tomorrow if you want.","questions":[{"q":"What does Priya imply about the introduction?","options":["It does not clearly explain why the topic is important.","It is ready to be submitted.","It is much too long for a short research paper like this.","It contains incorrect data."],"answer":0,"why":"Leser außerhalb des Fachs verstehen nicht, warum das Thema wichtig ist."},{"q":"What does Daniel mean when he says \"back to the drawing board\"?","options":["He disagrees with Priya's opinion.","He thinks he has to start over.","He plans to meet in the art room.","He wants to add some drawings."],"answer":1,"why":"back to the drawing board = noch einmal von vorn anfangen."},{"q":"What does Priya offer to do?","options":["Explain the topic to other readers","Send Daniel her own paper","Review the draft together with Daniel","Rewrite the data section"],"answer":2,"why":"„I can go over it with you tomorrow.“"}],"me":"Priya"},{"id":"d15","level":3,"genre":"webpage","title":"Extension policy","text":"# Requesting an Extension on a Final Paper\nStudents who cannot meet a final paper deadline because of circumstances beyond their control may request an extension of up to seven days.\nRequests must be submitted through the Student Portal no later than 48 hours before the original deadline and should be accompanied by supporting documentation where possible. Instructors are not obligated to grant extensions requested after this point, except in documented emergencies.\nApproved extensions do not affect a student's eligibility for honors, but papers submitted after an extended deadline will be penalized at the instructor's discretion.","questions":[{"q":"According to the page, when must most extension requests be made?","options":["At the start of the semester","On the day of the deadline","Within seven days after the original deadline has passed","At least two days before the original deadline"],"answer":3,"why":"„no later than 48 hours before the original deadline“."},{"q":"What is true about requests made later than this?","options":["Instructors may refuse them unless there is a documented emergency.","They reduce the student's chance of receiving honors.","They are always rejected.","They are usually accepted if students provide documentation."],"answer":0,"why":"„not obligated to grant … except in documented emergencies“."},{"q":"The phrase \"at the instructor's discretion\" means that the penalty","options":["must be approved by the university","is decided by the instructor","is the same for all students","is explained in the Student Portal"],"answer":1,"why":"discretion = Ermessen."}]},{"id":"d16","level":3,"genre":"review","title":"Restaurant review","text":"# Review: The Lantern Room ★★★☆☆\nI had high hopes for this new place after reading so much praise online. The setting is undeniably charming – exposed brick, soft lighting, and a view of the harbor.\nUnfortunately, the food did not live up to the atmosphere. My grilled fish arrived lukewarm, and the much-advertised seasonal vegetables were little more than a handful of overcooked carrots.\nTo be fair, our server was attentive and apologized sincerely, even removing the fish from our bill. I might return for drinks on the terrace, but I would think twice before ordering dinner again.","questions":[{"q":"What is the reviewer's overall opinion of the restaurant?","options":["It is excellent in every way.","The service was the main problem.","The atmosphere is better than the food.","It is too expensive for what it offers."],"answer":2,"why":"„the food did not live up to the atmosphere“."},{"q":"Why does the reviewer mention the server?","options":["To complain about slow service","To recommend a specific employee for promotion","To explain why the food was cold","To give a fair, balanced picture of the visit"],"answer":3,"why":"„To be fair …“ leitet einen positiven Gegenpunkt ein."}]},{"id":"d17","level":2,"genre":"email","title":"Soccer schedule","text":"From: Campus Recreation\nTo: Intramural Soccer Participants\nSubject: Schedule change for Sunday\nHello players,\nBecause heavy rain is forecast for Sunday afternoon, all intramural soccer games scheduled between 1 p.m. and 5 p.m. will be moved indoors to the Field House. Please note that indoor games are shortened to two 20-minute halves, and cleats are not permitted on the indoor surface – flat-soled shoes only.\nEvening games will be played outdoors as planned unless you receive another update by noon on Sunday.\nCampus Recreation","questions":[{"q":"Why are some games being moved?","options":["Too many teams have signed up.","The Field House is closer to campus.","Heavy rain is expected.","The fields are being repaired."],"answer":2,"why":"„Because heavy rain is forecast …“"},{"q":"What must players do for indoor games?","options":["Register again online","Bring their own ball","Arrive 20 minutes early","Wear shoes without cleats"],"answer":3,"why":"„cleats are not permitted … flat-soled shoes only“."},{"q":"What can be inferred about the evening games?","options":["Their plans could still change.","They will be shortened.","They will take place in the Field House.","They have been canceled."],"answer":0,"why":"„as planned unless you receive another update“."}]},{"id":"d18","level":2,"genre":"notice","title":"Lost and found","text":"# Lost & Found – Student Union\nItems turned in at the Student Union are kept for 30 days. After that, clothing is donated to local charities, and electronics are recycled.\nTo claim an item, visit the Information Desk (Mon–Fri, 8 a.m.–6 p.m.) and describe it in detail. Phones, laptops, and wallets will only be returned after you show a photo ID.\nWe cannot hold items for other people or mail them to you.","questions":[{"q":"What happens to a jacket that nobody claims within a month?","options":["It is recycled.","It is given to a charity.","It is sold online.","It is mailed to the owner."],"answer":1,"why":"Kleidung wird nach 30 Tagen gespendet."},{"q":"What is required to claim a lost wallet?","options":["An online form","A friend's signature","A photo ID","A receipt"],"answer":2,"why":"Telefone, Laptops und Geldbörsen nur gegen Lichtbildausweis."}]},{"id":"d19","level":2,"genre":"chat","title":"Bus pass","text":"Leo: Did you see that the bus pass price is going up next semester?\nAva: Seriously? By how much?\nLeo: From $90 to $120. But if you buy before December 1, you still get the old price.\nAva: Then I'm buying mine this week. Thanks for the heads-up!\nLeo: No worries. You can do it online – it only takes a minute.","questions":[{"q":"What will happen to the price of the bus pass?","options":["It will double.","It will decrease to $90.","It will stay the same.","It will increase by $30."],"answer":3,"why":"Von $90 auf $120."},{"q":"What does Ava decide to do?","options":["Buy her pass soon to save money","Ask for a refund","Stop taking the bus","Wait until December to decide"],"answer":0,"why":"Vor dem 1. Dezember gilt noch der alte Preis."},{"q":"What does Ava mean by \"Thanks for the heads-up\"?","options":["Thanks for helping with my homework.","Thanks for the warning.","Thanks for paying for me.","Thanks for the ride."],"answer":1,"why":"heads-up = Vorwarnung, Hinweis."}],"me":"Ava"},{"id":"d20","level":2,"genre":"schedule","title":"Writing Center hours","text":"# Writing Center – Fall Hours\nDay | In person | Online\nMonday–Thursday | 10 a.m.–7 p.m. | 10 a.m.–10 p.m.\nFriday | 10 a.m.–3 p.m. | 10 a.m.–3 p.m.\nWeekend | closed | 2 p.m.–8 p.m.\nAppointments are 45 minutes long. Please bring a printed copy of your draft to in-person sessions. Students may book up to two appointments per week.","questions":[{"q":"How can a student get help from the Writing Center on a Saturday?","options":["Not at all","In person during the morning hours","Online in the afternoon or evening","In person until 3 p.m."],"answer":2,"why":"Wochenende: nur online, 14–20 Uhr."},{"q":"What should students bring to an in-person appointment?","options":["A completed booking form","Their laptop","Two copies of the assignment","A printed copy of their draft"],"answer":3,"why":"„bring a printed copy of your draft“."},{"q":"What is the maximum number of appointments a student can have in one week?","options":["Two","One","Three","As many as needed"],"answer":0,"why":"„up to two appointments per week“."}]},{"id":"d21","level":1,"genre":"notice","title":"Flu shots","text":"# Free Flu Shots\nThe Student Health Center is offering free flu shots for all students next week, Monday to Thursday, from 9 a.m. to 4 p.m.\nNo appointment is needed. Just bring your student ID. The shots take about five minutes.","questions":[{"q":"What is being offered?","options":["Free health check-ups","Free flu shots","A health class","Cheap medicine"],"answer":1,"why":"„free flu shots for all students“."},{"q":"What do students need to bring?","options":["Some money","A doctor's note","Their student ID","An appointment card"],"answer":2,"why":"„Just bring your student ID.“"}]},{"id":"d22","level":1,"genre":"chat","title":"Shopping","text":"Noah: Hey, I'm at the store. Do we need anything for dinner?\nKim: Yes, can you get some rice and onions?\nNoah: Sure. Anything else?\nKim: Maybe some apples for tomorrow. Thanks!","questions":[{"q":"Where is Noah?","options":["In a restaurant","At school","At home","At a store"],"answer":3,"why":"„I'm at the store.“"},{"q":"What does Kim want for tomorrow?","options":["Apples","Rice","Onions","Dinner"],"answer":0,"why":"„some apples for tomorrow“."}],"me":"Kim"},{"id":"d23","level":1,"genre":"ad","title":"Guitar lessons","text":"# Guitar Lessons\nLearn to play the guitar! Lessons for beginners every Tuesday and Thursday evening at the Music Building, Room 12. Each lesson is one hour.\n$15 per lesson, or $50 for four lessons. Guitars are available to borrow. Email Ms. Torres to sign up.","questions":[{"q":"How much do four lessons cost?","options":["$15","$50","$60","$45"],"answer":1,"why":"„$50 for four lessons“."},{"q":"What is true about the lessons?","options":["They last two hours.","They are on weekends.","Students can borrow a guitar.","They are for advanced players."],"answer":2,"why":"„Guitars are available to borrow.“"}]},{"id":"d24","level":1,"genre":"email","title":"Book club","text":"From: Jenna\nTo: Book Club Members\nSubject: Next meeting\nHi all,\nOur next meeting is on Friday at 6 p.m. in the café on Pine Street, not in the library this time. We will talk about the first half of the book. Please let me know if you can't come.\nSee you soon,\nJenna","questions":[{"q":"Where will the next meeting take place?","options":["In the library","Online","At Jenna's house","In a café"],"answer":3,"why":"„in the café on Pine Street, not in the library“."},{"q":"What will the club talk about?","options":["Part of the book","A new book","The whole book","The café's menu"],"answer":0,"why":"„the first half of the book“."}]},{"id":"d25","level":3,"genre":"email","title":"Graduate application","text":"From: Office of Graduate Admissions\nTo: Applicant\nSubject: Application materials\nDear applicant,\nOur records indicate that your application is complete with the exception of one letter of recommendation. Please note that applications lacking any required document by January 15 will not be forwarded to the admissions committee.\nRecommenders who experience difficulty with the online portal may email their letters directly to our office, provided the message originates from an institutional email address.\nShould you wish to replace a recommender, you may do so through your applicant dashboard at any time before the deadline.\nOffice of Graduate Admissions","questions":[{"q":"Why did the applicant receive this email?","options":["The application was rejected.","A letter of recommendation is still missing.","The online portal has been closed.","The deadline for applications has been extended."],"answer":1,"why":"„complete with the exception of one letter of recommendation“."},{"q":"What will happen if the application is still incomplete on January 15?","options":["The deadline will be extended automatically.","The applicant will be charged a fee.","It will not be reviewed by the committee.","The committee will contact the recommender."],"answer":2,"why":"„will not be forwarded to the admissions committee“."},{"q":"What condition applies to letters sent by email?","options":["They must be sent by the applicant.","They must be sent at least two weeks before January 15.","They must be signed by hand.","They must come from an institutional email address."],"answer":3,"why":"„provided the message originates from an institutional email address“."}]},{"id":"d26","level":3,"genre":"post","title":"Library hours","text":"# From the Desk of the Dean\nSeveral students have asked why the library's 24-hour schedule ends after midterms. The answer is simple: usage data show that overnight attendance drops by more than 80 percent once exams are over, and staffing the building around the clock is costly.\nThat said, we recognize that some students rely on late-night study space. Beginning this semester, the ground-floor study lounge will remain accessible with a student ID until 2 a.m. throughout the term.\nWe will continue to monitor demand and adjust hours accordingly.","questions":[{"q":"Why does the library stop opening 24 hours a day after midterms?","options":["Few students use it at night then, and staffing is expensive.","Staff members go on vacation.","The building needs repairs.","Students complained about noise in the building at night."],"answer":0,"why":"Nutzung −80 % und hohe Personalkosten."},{"q":"What change is announced?","options":["The library will be open 24 hours all term.","A study lounge will stay open late throughout the semester.","Students will need a new type of ID.","The library will close earlier than before on weeknights."],"answer":1,"why":"Lounge bis 2 Uhr mit Studierendenausweis."},{"q":"What does the dean suggest about future opening hours?","options":["They are final and will not change.","They will be decided by a vote among students next term.","They may change depending on how much the space is used.","They will be reduced next year."],"answer":2,"why":"„monitor demand and adjust hours accordingly“."}]},{"id":"d27","level":3,"genre":"chat","title":"Presentation sources","text":"Owen: Are you presenting first or second on Thursday?\nGrace: Second, thank goodness. I need every minute I can get.\nOwen: Isn't your part pretty much done?\nGrace: The slides are, but the professor wants us to cite at least five peer-reviewed sources, and I've only got three.\nOwen: Have you tried the interlibrary loan service? It's usually quicker than people think.\nGrace: I hadn't thought of that. I'll put in a request tonight.","questions":[{"q":"Why is Grace relieved to present second?","options":["She is nervous about speaking in public.","Her slides are not finished.","She wants to see Owen's presentation first.","She needs more time to prepare."],"answer":3,"why":"„I need every minute I can get.“"},{"q":"What problem does Grace have?","options":["She does not have enough academic sources.","Her partner has left the group.","She cannot open her slides.","She has already missed the deadline for her slides."],"answer":0,"why":"Fünf Fachquellen gefordert, sie hat drei."},{"q":"What does Owen imply about the interlibrary loan service?","options":["It is usually too slow to be useful.","It might solve her problem in time.","It is expensive for students.","It is only available to professors."],"answer":1,"why":"„usually quicker than people think“."}],"me":"Grace"},{"id":"d28","level":3,"genre":"instructions","title":"3D printing lab","text":"# Using the 3D Printing Lab\nBefore printing for the first time, all users must complete a 30-minute safety orientation, offered every Wednesday at noon.\nPrints longer than four hours require advance approval from lab staff and are scheduled overnight. Users are responsible for removing completed prints within 24 hours; unclaimed items will be discarded.\nMaterial costs are charged to your student account at $0.10 per gram.","questions":[{"q":"What must new users do before printing?","options":["Buy their own material","Pay a fee in advance","Attend a safety orientation","Get approval from a professor"],"answer":2,"why":"Pflicht: 30-minütige Sicherheitseinweisung."},{"q":"What happens to a print job that takes six hours?","options":["It is not allowed.","It must be printed on a Wednesday at noon.","It is free of charge.","It needs approval and is printed overnight."],"answer":3,"why":"Über vier Stunden: Genehmigung, Druck über Nacht."},{"q":"How much would a 50-gram print cost?","options":["$5.00","$0.50","$10.00","$50.00"],"answer":0,"why":"50 × $0,10 = $5,00."}]}],"academic":[{"id":"ac01","level":2,"title":"Mangrove Forests","text":"Mangroves are trees that grow in the salty, shallow waters along tropical coastlines. Few plants can survive in such conditions, but mangroves have developed several unusual adaptations. Some species filter salt out of seawater through their roots, while others store excess salt in older leaves that eventually fall off. Because the muddy soil contains very little oxygen, many mangroves also grow special roots that stick up out of the mud like pencils, allowing the trees to absorb air directly.\nThese forests provide important benefits to both wildlife and people. Their dense root systems act as nurseries for young fish, which hide from predators among the roots until they are large enough to survive in open water. Mangroves also protect coastal communities: during storms, the tangled roots reduce the force of waves and help prevent the erosion of shorelines.\nDespite these benefits, mangrove forests have declined significantly in recent decades. Large areas have been cleared to make room for shrimp farms and coastal development. Scientists warn that losing mangroves not only harms fish populations but also leaves coastal towns more vulnerable to storm damage.","questions":[{"q":"According to paragraph 1, why do some mangroves have roots that stick up out of the mud?","options":["To take in oxygen from the air","To collect rainwater","To store excess salt","To hold the trees in place during storms"],"answer":0,"why":"Der Schlamm enthält kaum Sauerstoff; die Wurzeln „absorb air directly“."},{"q":"The word \"dense\" in paragraph 2 is closest in meaning to","options":["shallow","thick","ancient","fragile"],"answer":1,"why":"dense = dicht."},{"q":"Why does the author mention young fish in paragraph 2?","options":["To describe a threat to mangrove forests","To compare mangroves with coral reefs","To show one way mangroves benefit wildlife","To explain how mangroves obtain nutrients"],"answer":2,"why":"Junge Fische nutzen die Wurzeln als „nurseries“ – Beispiel für Nutzen für Tiere."},{"q":"Which of the following is NOT mentioned as a way mangroves deal with salt?","options":["Filtering it out through their roots","Losing it when old leaves fall off","Storing it in older leaves","Releasing it through their flowers"],"answer":3,"why":"Blüten werden im Text nicht erwähnt."},{"q":"What can be inferred from paragraph 3?","options":["Clearing mangroves may increase storm damage to coastal towns.","Mangrove forests are expanding in most regions.","Shrimp farms help protect shorelines.","Scientists generally support coastal development and shrimp farming."],"answer":0,"why":"Ohne Mangroven sind Küstenorte „more vulnerable to storm damage“."}]},{"id":"ac02","level":1,"title":"Why Do We Yawn?","text":"Everyone yawns, but scientists are still not sure why. For many years, people believed that yawning brings more oxygen into the body when we are tired. However, experiments have shown that breathing extra oxygen does not make people yawn less, so this explanation is probably wrong.\nA newer idea is that yawning helps cool the brain. When we yawn, we take in a large amount of air, and the jaw stretches widely. This movement increases blood flow to the head and may lower the temperature of the brain slightly. In one study, people yawned less often when they held a cold pack against their forehead.\nYawning is also contagious. Seeing, hearing, or even reading about someone yawning can make us yawn too. Interestingly, people are more likely to \"catch\" a yawn from a family member or a close friend than from a stranger. Some researchers think this shows that contagious yawning is connected to empathy, the ability to understand how others feel.","questions":[{"q":"What is the passage mainly about?","options":["The connection between sleep and body temperature","Different explanations for why people yawn","Why tired people need more oxygen","Ways to stop yawning"],"answer":1,"why":"Der Text stellt mehrere Erklärungen für das Gähnen vor."},{"q":"According to paragraph 1, why is the oxygen explanation probably wrong?","options":["Yawning lowers the amount of oxygen in the body.","Only tired people yawn.","Breathing extra oxygen does not reduce yawning.","Scientists have never tested it."],"answer":2,"why":"„breathing extra oxygen does not make people yawn less“."},{"q":"The word \"contagious\" in paragraph 3 is closest in meaning to","options":["dangerous","common in families","difficult to stop","easily passed to others"],"answer":3,"why":"contagious = ansteckend."},{"q":"What did people do in the study mentioned in paragraph 2?","options":["They held something cold against their forehead.","They breathed extra oxygen.","They read about yawning.","They watched videos of family members yawning."],"answer":0,"why":"„held a cold pack against their forehead“."},{"q":"What can be inferred about contagious yawning?","options":["Strangers cause the most yawns.","It happens more often between people who are close.","It is a sign that a person is tired.","It only happens when people see someone yawn."],"answer":1,"why":"Man „fängt“ das Gähnen eher bei Familie und Freunden."}]},{"id":"ac03","level":3,"title":"The Paradox of Choice","text":"Conventional economic thinking holds that having more options is always beneficial: if an option is added that no one wants, people can simply ignore it. Yet a growing body of psychological research suggests that an abundance of options can, under certain conditions, undermine both decision-making and satisfaction.\nIn a widely cited field experiment, shoppers encountered a tasting booth offering either six or twenty-four varieties of jam. Although the larger display attracted more visitors, those who saw the smaller selection were roughly ten times more likely to make a purchase. The researchers proposed that comparing many similar alternatives imposes a cognitive burden that can lead people to postpone or avoid decisions altogether.\nEven when people do choose, an extensive range of options may diminish their contentment. With more alternatives available, it becomes easier to imagine that a different selection would have been superior, and this anticipated regret can reduce the pleasure derived from the chosen item.\nSubsequent studies, however, have complicated the picture. Several attempts to replicate the original findings produced weak or inconsistent effects, and analyses suggest that choice overload emerges mainly when options are difficult to compare or when decision-makers lack clear preferences. Experts in a particular domain, for instance, appear largely immune to it.","questions":[{"q":"According to paragraph 1, what does conventional economic thinking assume?","options":["Satisfaction depends mainly on price.","People generally prefer fewer options.","Additional options never make people worse off.","Unwanted options should be removed from stores."],"answer":2,"why":"„having more options is always beneficial“ – man kann Unerwünschtes ignorieren."},{"q":"What was surprising about the result of the jam experiment?","options":["Shoppers preferred jams with fewer ingredients.","Fewer people visited the smaller display.","Visitors spent more time tasting jam at the smaller display than at the larger one.","The larger display led to fewer purchases even though it attracted more visitors."],"answer":3,"why":"Mehr Besucher, aber zehnmal weniger Käufe bei 24 Sorten."},{"q":"The word \"diminish\" in paragraph 3 is closest in meaning to","options":["reduce","replace","reveal","delay"],"answer":0,"why":"diminish = verringern."},{"q":"Why does the author mention experts in the final paragraph?","options":["To suggest that shoppers should consult experts before buying products","To show that choice overload does not affect everyone equally","To explain why the jam study was repeated","To argue that experts make worse decisions"],"answer":1,"why":"Experten sind „largely immune“ – der Effekt hängt von Bedingungen ab."},{"q":"Which statement best describes the author's view of the original findings?","options":["They apply to all decisions people make.","They are irrelevant to economics.","They may hold only under certain conditions.","They have been completely disproven."],"answer":2,"why":"Wiederholungen zeigten schwache Effekte; der Effekt tritt „mainly when …“ auf."}]},{"id":"ac04","level":3,"title":"Life at Hydrothermal Vents","text":"In 1977, researchers exploring the floor of the Pacific Ocean made a discovery that overturned long-standing assumptions about life on Earth. Near volcanic openings called hydrothermal vents, where water heated by magma bursts from the seafloor at temperatures exceeding 350°C, they found thriving communities of giant tube worms, clams, and crabs.\nThe finding was puzzling because sunlight never penetrates these depths, and nearly all known ecosystems ultimately depend on photosynthesis. The explanation turned out to lie in chemosynthesis. Bacteria living around the vents derive energy from chemical reactions involving hydrogen sulfide, a compound abundant in the vent fluid but toxic to most organisms. These bacteria form the base of the food web; giant tube worms, which lack both a mouth and a digestive system, host billions of them inside their bodies and absorb the nutrients they produce.\nThe implications extend beyond marine biology. Because vent ecosystems function independently of the sun, some scientists have proposed that life on Earth may have originated in similar environments. The discovery has also encouraged the search for life on moons such as Europa and Enceladus, whose ice-covered oceans may conceal comparable hydrothermal activity.","questions":[{"q":"Why was the 1977 discovery surprising?","options":["The water near the vents was colder than expected.","Clams had never been observed before.","The vents were located in the Pacific Ocean.","The animals survived without depending on sunlight."],"answer":3,"why":"Fast alle Ökosysteme hängen an Photosynthese – hier gibt es kein Licht."},{"q":"The word \"abundant\" in paragraph 2 is closest in meaning to","options":["plentiful","hidden","dangerous","rare"],"answer":0,"why":"abundant = reichlich vorhanden."},{"q":"According to paragraph 2, how do giant tube worms obtain food?","options":["Through photosynthesis in their skin","From bacteria living inside their bodies","By eating smaller animals near the vents","By filtering plankton from the water"],"answer":1,"why":"Sie beherbergen Bakterien und nehmen deren Nährstoffe auf."},{"q":"What does the author indicate about hydrogen sulfide?","options":["It is produced by the tube worms.","It is found mainly on Europa.","It is harmful to most living things.","It cools the vent fluid."],"answer":2,"why":"„toxic to most organisms“."},{"q":"Why does the author mention Europa and Enceladus?","options":["To explain where vents were first discovered","To argue that life definitely exists there","To compare the temperatures of their oceans with those of Earth's oceans","To show that the discovery influenced the search for life elsewhere"],"answer":3,"why":"Die Entdeckung „encouraged the search for life on moons such as …“."}]},{"id":"ac05","level":2,"title":"The Origins of Paper Money","text":"Paper money first appeared in China more than a thousand years ago. Merchants during the Tang dynasty found heavy metal coins inconvenient for large transactions, so they began leaving their coins with trusted agents in exchange for paper receipts. These receipts could be traded among merchants and later exchanged back for coins.\nBy the eleventh century, the Song government had recognized the usefulness of this system and began issuing official paper notes. Government control brought both advantages and risks. On the one hand, official notes were accepted throughout the empire. On the other hand, the government could print as many notes as it wished, and during times of war it often printed far more than it could support. The result was inflation: prices rose sharply, and the notes lost much of their value.\nEuropean travelers such as Marco Polo described Chinese paper money with amazement, but the idea spread slowly. It was not until the seventeenth century that banks in Sweden and England began issuing paper notes of their own. Today, paper money is used everywhere, although electronic payments are steadily replacing it in many countries.","questions":[{"q":"Why did merchants in the Tang dynasty begin using paper receipts?","options":["Metal coins were inconvenient for large payments.","The government required them to.","Paper was cheaper to produce than metal.","Foreign traders refused to accept coins."],"answer":0,"why":"„found heavy metal coins inconvenient for large transactions“."},{"q":"The word \"issuing\" in paragraph 2 is closest in meaning to","options":["collecting","distributing","destroying","designing"],"answer":1,"why":"issue = (offiziell) ausgeben."},{"q":"According to paragraph 2, what was a disadvantage of government-controlled paper money?","options":["It was accepted only in a few cities.","Criminals found it far too easy to make copies of the official notes.","The government sometimes printed too much, which caused prices to rise.","Merchants could not exchange it for coins."],"answer":2,"why":"Zu viel gedrucktes Geld → Inflation."},{"q":"Why does the author mention Marco Polo?","options":["To describe a famous Chinese merchant","To argue that paper money was invented in Europe","To explain how paper money quickly reached Europe through trade","To show that Europeans found Chinese paper money remarkable"],"answer":3,"why":"Er beschrieb das Papiergeld „with amazement“."},{"q":"What can be inferred from the last sentence of the passage?","options":["Paper money may become less common in the future.","Sweden was the first country to stop using paper money.","Paper money is no longer printed.","Electronic payments are less secure than cash."],"answer":0,"why":"Elektronische Zahlungen ersetzen Papiergeld „steadily“."}]},{"id":"ac06","level":2,"title":"The Science of Habits","text":"Psychologists define a habit as a behavior that has become automatic through repetition. According to one widely used model, every habit consists of three parts: a cue, a routine, and a reward. The cue is a trigger, such as a time of day or a feeling. The routine is the behavior itself, and the reward is the benefit the brain receives, which makes it more likely that the behavior will be repeated.\nResearch suggests that habits form gradually. In one study, participants who tried to adopt a new daily behavior, such as eating fruit at lunch, needed an average of about two months before the action felt automatic. The time varied widely, however, from less than three weeks to almost a year, depending on the person and the complexity of the behavior.\nBecause cues are so powerful, experts often recommend changing the environment rather than relying on willpower alone. Someone who wants to snack less, for example, might simply avoid keeping chips at home. Likewise, placing running shoes next to the door can serve as a cue that makes exercise easier to start.","questions":[{"q":"According to paragraph 1, what is the role of the reward?","options":["It replaces the cue that started the behavior.","It makes the behavior more likely to be repeated.","It reduces the need for repetition.","It signals the start of a routine."],"answer":1,"why":"Die Belohnung macht Wiederholung wahrscheinlicher."},{"q":"The word \"gradually\" in paragraph 2 is closest in meaning to","options":["all at once","without effort","slowly over time","only occasionally"],"answer":2,"why":"gradually = allmählich."},{"q":"What did the study described in paragraph 2 find?","options":["Complex habits form faster than simple ones in most people.","Eating fruit is the easiest habit to form.","All habits form in exactly two months.","The time needed to form a habit differed greatly between people."],"answer":3,"why":"Von unter drei Wochen bis fast ein Jahr."},{"q":"Why does the author mention running shoes?","options":["To give an example of using the environment as a cue","To recommend a particular type of shoe","To show that exercise is an especially difficult habit to form","To compare exercise with snacking"],"answer":0,"why":"Schuhe an der Tür als Auslöser."},{"q":"What can be inferred about willpower?","options":["It increases with repetition.","It may be less effective than changing one's surroundings.","It has no connection to habits.","It is the most important factor in forming habits."],"answer":1,"why":"„changing the environment rather than relying on willpower alone“."}]},{"id":"ac07","level":1,"title":"The Journey of Coffee","text":"Coffee is one of the most popular drinks in the world, and it has a surprisingly long history. According to a well-known story, a goat herder in Ethiopia noticed that his goats became very energetic after eating red berries from a certain bush. He tried the berries himself and felt more awake.\nWhether or not the story is true, we know that by the fifteenth century, people in Yemen were roasting coffee beans and making a drink from them. Coffee houses soon opened in cities across the Middle East. They became popular places where people met to talk, listen to music, and share news.\nIn the seventeenth century, coffee arrived in Europe. At first, some people were suspicious of the new drink, but it quickly became fashionable. Today, coffee is grown in more than fifty countries, and Brazil produces more coffee than any other nation.","questions":[{"q":"What is the passage mainly about?","options":["Coffee houses in modern cities","How to grow coffee plants","The history of coffee","Why goats like berries"],"answer":2,"why":"Der Text erzählt die Geschichte des Kaffees."},{"q":"According to the story, what did the goat herder notice?","options":["The bush grew much faster than other plants nearby.","The berries tasted sweet.","His goats became sick.","His goats had more energy after eating certain berries."],"answer":3,"why":"„became very energetic after eating red berries“."},{"q":"What does the author say about the goat herder story?","options":["It might not be true.","It took place in Yemen.","It is only told in Europe.","It is definitely true."],"answer":0,"why":"„Whether or not the story is true …“"},{"q":"According to paragraph 2, what did people do in coffee houses?","options":["They studied medicine.","They talked and shared news.","They roasted beans for export.","They grew coffee plants."],"answer":1,"why":"„met to talk, listen to music, and share news“."},{"q":"Which country produces the most coffee today?","options":["Italy","Ethiopia","Brazil","Yemen"],"answer":2,"why":"„Brazil produces more coffee than any other nation“."}]},{"id":"ac08","level":3,"title":"The Problem of Antibiotic Resistance","text":"Since their introduction in the 1940s, antibiotics have transformed medicine, turning once-fatal infections into routine illnesses. Yet their very success has created a formidable problem. Bacteria reproduce rapidly, and random genetic mutations occasionally render some individuals less vulnerable to a particular drug. When an antibiotic is administered, susceptible bacteria die, but resistant ones survive and multiply, gradually producing populations that the drug can no longer control.\nCompounding this process, bacteria can exchange genetic material directly, sometimes even across species, through a mechanism known as horizontal gene transfer. A resistance gene that arises in one organism may therefore spread far more quickly than inheritance alone would allow.\nHuman behavior accelerates the problem. Antibiotics are frequently prescribed for viral infections, against which they are entirely ineffective, and patients often stop treatment once symptoms subside, potentially leaving the hardiest bacteria alive. Meanwhile, pharmaceutical companies have little financial incentive to develop new antibiotics, which are typically used sparingly and for short periods, making them far less profitable than medications for chronic conditions.","questions":[{"q":"According to paragraph 1, why do resistant bacteria become more common?","options":["Antibiotics cause them to mutate.","They attack susceptible bacteria.","They reproduce more slowly than other bacteria.","They survive treatment while other bacteria die."],"answer":3,"why":"Empfindliche sterben, resistente vermehren sich."},{"q":"The word \"formidable\" in paragraph 1 is closest in meaning to","options":["daunting","temporary","unexpected","minor"],"answer":0,"why":"formidable = gewaltig, schwerwiegend."},{"q":"What does paragraph 2 suggest about horizontal gene transfer?","options":["It makes bacteria more vulnerable to drugs.","It lets resistance spread faster than through reproduction alone.","It only occurs within a single species.","It prevents new mutations from appearing in most types of bacteria."],"answer":1,"why":"„far more quickly than inheritance alone would allow“."},{"q":"Why does the author mention viral infections?","options":["To compare the size of viruses with the size of bacteria","To show that antibiotics work against viruses","To give an example of antibiotics being used inappropriately","To explain how viruses become resistant"],"answer":2,"why":"Antibiotika wirken nicht gegen Viren, werden aber verschrieben."},{"q":"What can be inferred about why few new antibiotics are developed?","options":["Scientists believe enough antibiotics already exist.","They are illegal in many countries.","They cannot be tested on patients.","They are not very profitable for drug companies."],"answer":3,"why":"„little financial incentive … far less profitable“."}]}]},"writing":{"bas":[{"id":"bas01","level":1,"prompt":"What did you think of the new library?","answer":"The study rooms on the third floor are much quieter than before.","chunks":["the study rooms","on the third floor","are","much quieter","than before"],"why":"Vergleich: Komparativ + than (much quieter than)."},{"id":"bas02","level":2,"prompt":"Why weren't you at the meeting yesterday?","answer":"I didn't know that it had been moved to the afternoon.","chunks":["I","didn't know","that","it had been","moved","to the afternoon"],"why":"Vorvergangenheit im Passiv: had been + Partizip."},{"id":"bas03","level":2,"prompt":"Do you know when the assignment is due?","answer":"The professor said it has to be submitted by Friday.","chunks":["the professor","said","it","has to be","submitted","by Friday"],"why":"Passiv mit Modal: has to be + Partizip."},{"id":"bas04","level":2,"prompt":"Where should we meet before the concert?","answer":"Let's meet at the café where we had lunch last week.","chunks":["let's meet","at the café","where","we had","lunch","last week"],"why":"Relativsatz mit where direkt hinter dem Ort."},{"id":"bas05","level":3,"prompt":"Have you decided which course to take?","answer":"I'm still trying to figure out which one fits my schedule.","chunks":["I'm still","trying to","figure out","which one","fits","my schedule"],"why":"Indirekte Frage: which one + Verb, keine Inversion."},{"id":"bas06","level":2,"prompt":"How was your internship this summer?","answer":"It was the most useful experience I have ever had.","chunks":["it was","the most","useful experience","I","have ever","had"],"why":"Superlativ + Relativsatz ohne that: the most … I have ever had."},{"id":"bas07","level":3,"prompt":"Can you help me move on Saturday?","answer":"I would if I didn't have to work that day.","chunks":["I would","if","I","didn't have","to work","that day"],"why":"Irrealer if-Satz: would …, if + Past."},{"id":"bas08","level":2,"prompt":"Why is the cafeteria so crowded today?","answer":"They are offering free coffee to anyone who brings a mug.","chunks":["they are offering","free coffee","to anyone","who","brings","a mug"],"why":"Relativsatz who + Verb mit -s (anyone = Singular)."},{"id":"bas09","level":1,"prompt":"Did you finish the lab report?","answer":"Not yet, but I should be done by tonight.","chunks":["not yet","but","I","should be","done","by tonight"],"why":"Modal + be + Partizip: should be done."},{"id":"bas10","level":3,"prompt":"What did the advisor tell you?","answer":"She asked me whether I had thought about studying abroad.","chunks":["she asked me","whether","I","had thought","about","studying abroad"],"why":"Indirekte Frage: whether + Subjekt + Verb; Präposition + -ing."},{"id":"bas11","level":1,"prompt":"Is the bookstore still open?","answer":"I think it closes at six on weekdays.","chunks":["I think","it","closes","at six","on weekdays"],"why":"Zeitangaben: at + Uhrzeit, on + Tage."},{"id":"bas12","level":2,"prompt":"Who is giving the guest lecture?","answer":"It is a scientist who worked for NASA for twenty years.","chunks":["it is","a scientist","who","worked","for NASA","for twenty years"],"why":"Relativsatz direkt hinter dem Nomen (a scientist who …)."},{"id":"bas13","level":1,"prompt":"How do you usually get to campus?","answer":"I usually ride my bike unless it is raining.","chunks":["I","usually","ride my bike","unless","it is","raining"],"why":"Häufigkeitsadverb vor dem Vollverb (I usually ride)."},{"id":"bas14","level":3,"prompt":"Why did you choose this university?","answer":"Its engineering program is known for its close ties to industry.","chunks":["its engineering program","is known","for","its close ties","to industry"],"why":"Feste Verbindung: be known for; ties to."},{"id":"bas15","level":1,"prompt":"Can you tell me where the registrar's office is?","answer":"It is located on the second floor of the administration building.","chunks":["it is","located","on the second floor","of","the administration building"],"why":"be located on the … floor."},{"id":"bas16","level":1,"prompt":"What should I bring to the job fair?","answer":"You should bring several copies of your resume.","chunks":["you should","bring","several copies","of","your resume"],"why":"Modal + Grundform: should bring."},{"id":"bas17","level":2,"prompt":"Has the professor graded our exams yet?","answer":"She said the results would be posted next Monday.","chunks":["she said","the results","would be","posted","next Monday"],"why":"Indirekte Rede: will → would; Passiv would be posted."},{"id":"bas18","level":3,"prompt":"Why are you studying in the hallway?","answer":"The room I reserved was already being used by another group.","chunks":["the room","I reserved","was already","being used","by","another group"],"why":"Passiv Verlaufsform: was being used."},{"id":"bas19","level":3,"prompt":"Are you going to the conference in March?","answer":"Only if my department agrees to pay for the trip.","chunks":["only if","my department","agrees","to pay","for the trip"],"why":"agree + to + Grundform; Present Simple nach if."},{"id":"bas20","level":3,"prompt":"What surprised you most about the city?","answer":"What surprised me most was how friendly everyone was.","chunks":["what surprised me","most","was","how friendly","everyone","was"],"why":"Cleft Sentence What … was + indirekte Frage how friendly everyone was."},{"id":"bas21","level":2,"prompt":"Did you enjoy the book I lent you?","answer":"I enjoyed it so much that I finished it in two days.","chunks":["I enjoyed it","so much","that","I finished it","in two days"],"why":"so … that = so sehr, dass."},{"id":"bas22","level":2,"prompt":"Should we take the train or drive?","answer":"Taking the train would be faster than driving in this traffic.","chunks":["taking the train","would be","faster","than","driving","in this traffic"],"why":
