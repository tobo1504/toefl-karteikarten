"-ing-Form als Subjekt (Taking the train …)."},{"id":"bas23","level":3,"prompt":"Why did the event get canceled?","answer":"Not enough people had signed up by the deadline.","chunks":["not enough","people","had signed up","by","the deadline"],"why":"by + Zeitpunkt → Past Perfect (had signed up)."},{"id":"bas24","level":1,"prompt":"Do you mind if I open the window?","answer":"Not at all, as long as it doesn't get too cold.","chunks":["not at all","as long as","it","doesn't get","too cold"],"why":"as long as + Present Simple = solange."},{"id":"bas25","level":1,"prompt":"Where did you buy that jacket?","answer":"I bought it at a small shop near the station.","chunks":["I bought it","at a small shop","near","the station"],"why":"Ortsangabe: at a shop near …"},{"id":"bas26","level":1,"prompt":"Are you coming to dinner tonight?","answer":"I can't, because I have to study for my exam.","chunks":["I can't","because","I have to","study","for my exam"],"why":"have to + Grundform."},{"id":"bas27","level":2,"prompt":"What did the doctor tell you?","answer":"She told me to get more rest and drink more water.","chunks":["she told me","to get","more rest","and","drink more water"],"why":"tell sb to + Grundform."},{"id":"bas28","level":2,"prompt":"How long have you been learning Spanish?","answer":"I have been taking classes for almost two years.","chunks":["I have been","taking classes","for","almost","two years"],"why":"Present Perfect Continuous + for + Zeitraum."},{"id":"bas29","level":2,"prompt":"Why didn't you answer my call?","answer":"My phone was turned off while I was in the library.","chunks":["my phone","was turned off","while","I was","in the library"],"why":"Passiv Past: was turned off; while + Satz."},{"id":"bas30","level":3,"prompt":"What do you think of the new policy?","answer":"I doubt it will be as effective as the administration hopes.","chunks":["I doubt","it will be","as effective","as","the administration","hopes"],"why":"Vergleich: as + Adjektiv + as."},{"id":"bas31","level":3,"prompt":"Should I take the advanced course?","answer":"Only if you have already completed the introductory one.","chunks":["only if","you have","already completed","the introductory one"],"why":"already zwischen have und Partizip."},{"id":"bas32","level":2,"prompt":"Where can I find information about scholarships?","answer":"The financial aid office has a list of all the scholarships available.","chunks":["the financial aid office","has","a list of","all the scholarships","available"],"why":"available kann nach dem Nomen stehen."},{"id":"bas33","level":1,"prompt":"When does the semester start?","answer":"Classes begin on the first Monday in September.","chunks":["classes","begin","on the first Monday","in September"],"why":"on + Tag, in + Monat."},{"id":"bas34","level":3,"prompt":"Why was the experiment repeated?","answer":"The first results were too unusual to be trusted.","chunks":["the first results","were","too unusual","to be","trusted"],"why":"too + Adjektiv + to + Infinitiv (Passiv)."},{"id":"bas35","level":2,"prompt":"Do you know who left these books here?","answer":"I think they belong to the student who sat by the window.","chunks":["I think","they belong to","the student","who","sat","by the window"],"why":"Relativsatz who direkt hinter dem Nomen."},{"id":"bas36","level":3,"prompt":"Has the committee made a decision?","answer":"Not yet, but they are expected to announce it next week.","chunks":["not yet","but","they are","expected to","announce it","next week"],"why":"be expected to + Grundform."},{"id":"bas37","level":1,"prompt":"What are you doing this weekend?","answer":"I am going to visit my grandparents in the country.","chunks":["I am going","to visit","my grandparents","in the country"],"why":"going to + Grundform für Pläne."},{"id":"bas38","level":2,"prompt":"Why are you moving to a new apartment?","answer":"My current one is too far from where I work.","chunks":["my current one","is","too far","from","where I work"],"why":"too far from + Nebensatz (where I work)."},{"id":"bas39","level":3,"prompt":"What would you change about the course?","answer":"I would have liked more opportunities to discuss the readings.","chunks":["I would have liked","more opportunities","to discuss","the readings"],"why":"would have liked = hätte gern gehabt."},{"id":"bas40","level":2,"prompt":"Can you recommend a good place to study?","answer":"The café on the corner is quiet enough to concentrate.","chunks":["the café","on the corner","is","quiet enough","to concentrate"],"why":"Adjektiv + enough + to + Grundform."}],"email":[{"id":"em01","level":2,"situation":"You recently bought a used bicycle through your university's online marketplace. When it arrived, you discovered that the brakes do not work properly, although the listing described the bicycle as being in \"excellent condition.\"","recipient":"the seller, Chris","tasks":["Explain why you chose to buy this bicycle.","Describe the problem with the bicycle.","Suggest a way to resolve the situation."]},{"id":"em02","level":2,"situation":"You are taking an online course. The course website says that the final project can be completed alone or in pairs. You would like to work with a classmate who is enrolled in a different section of the same course.","recipient":"your instructor, Dr. Patel","tasks":["Explain your idea for the project.","Explain why you want to work with this classmate.","Ask whether this arrangement is allowed."]},{"id":"em03","level":2,"situation":"Your neighbor in your apartment building often plays loud music late at night. You have important exams next week and need to sleep well.","recipient":"your neighbor, Alex","tasks":["Introduce yourself and explain why you are writing.","Describe how the noise affects you.","Suggest a solution that would work for both of you."]},{"id":"em04","level":2,"situation":"Last week you attended a free career workshop organized by your university. You found it very helpful, but one session ran out of time before the speaker could answer questions from the audience.","recipient":"the workshop organizer, Ms. Romero","tasks":["Explain what you found most helpful.","Describe the problem with the session.","Suggest an improvement for future workshops."]},{"id":"em05","level":2,"situation":"A friend who lives in another city is visiting you next month and has asked for advice about what to do during the visit. You have just started a new part-time job and will have to work on one of the days of the visit.","recipient":"your friend, Jamie","tasks":["Recommend two things to do in your city.","Explain the problem with your schedule.","Suggest how you could still spend time together."]},{"id":"em06","level":2,"situation":"Two weeks ago, you ordered a textbook from an online store for a class that starts on Monday. The store's website says the order has been shipped, but you have not received it, and the tracking number does not work.","recipient":"the store's customer service team","tasks":["Give the details of your order.","Explain why you need the book urgently.","Ask for a specific solution."]},{"id":"em07","level":2,"situation":"You are a member of a student hiking club. The club is planning its first trip of the semester, and the organizer has asked members for ideas. You know a trail near the city that would be suitable, but you will be away on the weekend the trip is currently planned.","recipient":"the club organizer, Sam","tasks":["Describe the trail you would recommend.","Explain why it would be good for the club.","Explain your problem with the date and ask about other options."]},{"id":"em08","level":2,"situation":"You recently received your grade for a group project. The grade was lower than you expected, and the feedback says that the group did not include enough data. However, your part of the project contained a large data analysis that does not seem to have been considered.","recipient":"your professor, Dr. Moore","tasks":["Thank the professor for the feedback.","Explain what you contributed to the project.","Politely ask whether the grade could be reviewed."]},{"id":"em09","level":2,"situation":"You live in a university apartment. For two weeks, the internet in your building has been very slow, which makes it difficult to attend your online classes. You have already restarted your router several times.","recipient":"the housing office","tasks":["Describe the problem and how long it has lasted.","Explain how the problem affects your studies.","Request a specific action."]},{"id":"em10","level":2,"situation":"Your former high school teacher, Mr. Becker, helped you a lot when you were applying to universities. You have just been accepted into a competitive program, and you want to tell him the news.","recipient":"Mr. Becker","tasks":["Share your news.","Explain how his help made a difference.","Offer to help his current students in some way."]}],"discussion":[{"id":"di01","level":2,"course":"education","professor":{"name":"Dr. Lin","text":"Many universities now record their lectures and post them online. Some educators believe this helps students learn, while others worry that it reduces class attendance and engagement. Should universities record all lectures and make them available online? Why or why not?"},"students":[{"name":"Mia","text":"I think recording lectures is essential. Students who are sick or have to work can still keep up, and everyone can rewatch difficult parts before exams. Learning shouldn't depend on being in a room at a certain time."},{"name":"Lucas","text":"I disagree. When lectures are online, many students stop coming to class and fall behind because they never actually watch the recordings. Being there in person also makes it possible to ask questions and discuss ideas with classmates."}]},{"id":"di02","level":2,"course":"urban planning","professor":{"name":"Dr. Okafor","text":"City governments have limited budgets. Some people argue that money should be spent on improving public transportation, while others think it is more important to create more parks and green spaces. Which do you think should be the priority for city spending, and why?"},"students":[{"name":"Sara","text":"Public transportation should come first. Good buses and trains reduce traffic and pollution, and they help people without cars get to jobs and schools."},{"name":"Kevin","text":"I'd choose parks. People need places to relax and exercise, especially in crowded cities. Green spaces also make neighborhoods more attractive and improve mental health."}]},{"id":"di03","level":2,"course":"business management","professor":{"name":"Prof. Harris","text":"Some companies have introduced a four-day work week, in which employees work fewer hours for the same pay. Supporters say this increases productivity and well-being; critics say it is not practical for many businesses. Do you think more companies should adopt a four-day work week? Explain your view."},"students":[{"name":"Anna","text":"Yes. Studies show that people are more focused when they have more time to rest, so they get the same amount of work done in four days. Companies would also attract better employees."},{"name":"Ben","text":"I'm not convinced. Businesses like hospitals or stores need to be open every day, and fewer working days could mean customers wait longer for service."}]},{"id":"di04","level":2,"course":"sociology","professor":{"name":"Dr. Nguyen","text":"Social media allows people to stay in contact with friends and family around the world. However, some researchers argue that it actually makes people feel lonelier. In your opinion, does social media bring people closer together or push them apart? Why?"},"students":[{"name":"Emily","text":"It brings people closer. I keep in touch with friends from my hometown every day, which would be impossible without social media."},{"name":"Ryan","text":"I think it pushes people apart. People spend so much time scrolling that they have less time for real conversations with the people around them."}]},{"id":"di05","level":2,"course":"environmental science","professor":{"name":"Prof. Garcia","text":"To reduce waste, some cities have banned single-use plastic bags and require stores to charge for paper bags. Other cities prefer education campaigns that encourage people to change their habits voluntarily. Which approach is more effective in reducing waste? Why?"},"students":[{"name":"Hannah","text":"Bans work better. People are busy and rarely change their habits unless they have to. After my city banned plastic bags, almost everyone started bringing reusable ones."},{"name":"Omar","text":"I prefer education. Bans can feel unfair, and they don't teach people why reducing waste matters. If people understand the problem, they'll make better choices in many areas, not just with bags."}]},{"id":"di06","level":2,"course":"psychology","professor":{"name":"Dr. Brooks","text":"Some people believe students learn best when they study one subject for a long period, while others think it is better to switch between several subjects during a study session. Which approach do you think is more effective for learning? Explain why."},"students":[{"name":"Julia","text":"Focusing on one subject for a long time works better for me. I need time to really get into a topic, and switching makes me lose concentration."},{"name":"Marcus","text":"Switching between subjects keeps me fresh. After an hour on the same thing, I stop absorbing information, so changing topics helps me stay alert."}]},{"id":"di07","level":2,"course":"public policy","professor":{"name":"Dr. Ramirez","text":"Some cities offer free public transportation to all residents, paid for by taxes. Supporters say this reduces traffic and helps people with low incomes; critics say it is too expensive and that people don't value services they don't pay for. Should public transportation be free? Why or why not?"},"students":[{"name":"Leah","text":"Yes. If buses were free, many more people would leave their cars at home, and cities would be cleaner and less crowded."},{"name":"Daniel","text":"I don't think so. The money would be better spent improving the service. Many people don't take the bus because it's slow or unreliable, not because of the price."}]},{"id":"di08","level":2,"course":"education","professor":{"name":"Prof. Kim","text":"Many universities are considering replacing traditional final exams with projects, such as research papers or presentations. Which is a better way to assess what students have learned: final exams or projects? Explain your view."},"students":[{"name":"Chloe","text":"Projects are better. They show whether students can actually apply what they've learned, and they're closer to what we'll do in our careers."},{"name":"Ethan","text":"Exams are fairer. In group projects, some students do all the work while others get the same grade. Exams show what each person really knows."}]},{"id":"di09","level":2,"course":"technology and society","professor":{"name":"Dr. Shah","text":"Artificial intelligence tools can now write essays, summarize articles, and solve math problems. Some instructors want to ban these tools in their courses, while others want to teach students how to use them responsibly. What approach should universities take, and why?"},"students":[{"name":"Nina","text":"They should be banned for assignments. Otherwise, students won't develop their own writing and thinking skills."},{"name":"Jacob","text":"Banning them is unrealistic. Students will use these tools in their jobs, so universities should teach them to use AI critically and honestly."}]},{"id":"di10","level":2,"course":"economics","professor":{"name":"Prof. Turner","text":"Some people argue that young people should work part-time while they are still in high school or university, while others believe students should focus only on their studies. What is your opinion? Should students work while they study?"},"students":[{"name":"Sophia","text":"Working teaches responsibility and time management, and it gives students experience that employers value."},{"name":"Liam","text":"Students should focus on their studies. A job takes time and energy away from learning, and grades often suffer."}]}]},"listening":{"choose":[{"id":"c01","level":1,"voice":"W","prompt":"Do you know what time the library closes tonight?","options":["Yes, I read that book last week.","I think it's open until ten.","No, I don't have a library card.","It's on the second floor."],"answer":1,"why":"Gefragt ist nach der Uhrzeit – nur diese Antwort nennt eine Zeit."},{"id":"c02","level":1,"voice":"M","prompt":"Would you like to get lunch after class?","options":["No, the class is in Room 12.","I had a class this morning.","Sure, I'm starving.","It was a really good lunch."],"answer":2,"why":"Einladung → Zusage. starving = sehr hungrig."},{"id":"c03","level":1,"voice":"W","prompt":"Where did you park your car?","options":["It's a blue car.","Yes, I parked it.","About twenty minutes ago, I think.","Right behind the science building."],"answer":3,"why":"Where → Ortsangabe."},{"id":"c04","level":1,"voice":"M","prompt":"How was your weekend?","options":["Pretty relaxing, thanks.","It's on Saturday.","I'll be away next weekend.","Two days, I think."],"answer":0,"why":"How was …? → Bewertung des vergangenen Wochenendes."},{"id":"c05","level":1,"voice":"W","prompt":"Can you lend me a pen?","options":["No, I didn't send it.","Here, you can keep it.","Yes, it's a long essay.","I wrote it yesterday."],"answer":1,"why":"Bitte um einen Stift → Stift wird gegeben."},{"id":"c06","level":1,"voice":"M","prompt":"Is this seat taken?","options":["The seats are blue.","Yes, I took the class last year.","No, go ahead.","It's very comfortable."],"answer":2,"why":"Is this seat taken? = Ist hier frei? → No, go ahead."},{"id":"c07","level":1,"voice":"W","prompt":"Have you finished reading the article for tomorrow?","options":["Yes, I wrote the article.","It was published in a journal.","I'll read it to you tomorrow.","Almost. I just have a few pages left."],"answer":3,"why":"Frage nach dem Stand → fast fertig."},{"id":"c08","level":1,"voice":"M","prompt":"Why is the bus so late today?","options":["There's construction on Main Street.","It usually comes every ten minutes.","I take the bus every day.","Yes, it's very late."],"answer":0,"why":"Why → Grund (Baustelle)."},{"id":"c09","level":2,"voice":"W","prompt":"Didn't you say you were going to the career fair?","options":["Yes, I said it to the professor.","I was, but my shift got moved.","The fair was held in the gym last year.","I'm planning to apply for that job."],"answer":1,"why":"Indirekt: Plan geändert, weil die Schicht verlegt wurde."},{"id":"c10","level":2,"voice":"M","prompt":"I can't believe how long this line is.","options":["The line is on the next page.","I can lend you a longer one if you really need it.","Tell me about it. We've been here for twenty minutes.","I believe it's correct."],"answer":2,"why":"Tell me about it = Das kannst du laut sagen (Zustimmung)."},{"id":"c11","level":2,"voice":"W","prompt":"Do you want me to save you a seat at the lecture?","options":["The lecture was about economics.","I saved all my notes on my laptop.","No, I don't have any money left this month.","That would be great. I'm running a bit late."],"answer":3,"why":"save a seat = Platz freihalten; die anderen spielen mit „save“ (speichern, sparen)."},{"id":"c12","level":2,"voice":"M","prompt":"Has anyone seen the remote for the projector?","options":["Check the drawer under the desk.","I've never been to that room.","Yes, I saw that movie.","The projector is brand new."],"answer":0,"why":"Indirekte Hilfe: Hinweis, wo sie sein könnte."},{"id":"c13","level":2,"voice":"W","prompt":"I heard the professor is giving us an extra week for the paper.","options":["She teaches on Mondays and Wednesdays.","Really? That's a relief.","I'd like to read it again.","The paper is ten pages long."],"answer":1,"why":"Reaktion auf eine gute Nachricht: relief = Erleichterung."},{"id":"c14","level":2,"voice":"M","prompt":"You're not still working on that lab report, are you?","options":["The lab is on the third floor.","No, I've never worked in a lab like that before.","I'm afraid so. The data took forever to analyze.","The report has ten pages."],"answer":2,"why":"I'm afraid so = leider ja; Grund folgt."},{"id":"c15","level":2,"voice":"W","prompt":"Why don't we split the cost of the textbook?","options":["The textbook costs about eighty dollars.","I don't know why it's so expensive.","I split it into three chapters.","Good idea. We can take turns using it."],"answer":3,"why":"Why don't we …? ist ein Vorschlag, keine Frage nach dem Grund."},{"id":"c16","level":2,"voice":"M","prompt":"Would you mind proofreading my cover letter?","options":["Not at all. Send it over.","I don't mind the weather.","Yes, I'd love to write one.","I covered that topic in class."],"answer":0,"why":"Would you mind …? → Not at all = gern (ich habe nichts dagegen)."},{"id":"c17","level":2,"voice":"W","prompt":"Weren't you supposed to meet with your advisor today?","options":["I'm supposed to graduate in May.","She had to reschedule for Thursday.","I've had the same advisor for two years.","My advisor teaches chemistry."],"answer":1,"why":"Indirekt: Das Treffen wurde verschoben."},{"id":"c18","level":2,"voice":"M","prompt":"The printer in the computer lab is out of paper again.","options":["I printed my essay yesterday.","The lab closes at nine.","I'll let the front desk know.","Paper is cheaper online."],"answer":2,"why":"Problem gemeldet → Lösung anbieten."},{"id":"c19","level":3,"voice":"W","prompt":"I could have sworn the meeting was at three.","options":["It lasted about three hours.","I swear I'll be there at three.","The meeting room has three windows.","So could I, but the email says two."],"answer":3,"why":"I could have sworn = ich war mir ganz sicher; So could I = ich auch."},{"id":"c20","level":3,"voice":"M","prompt":"You might want to double-check those figures before you submit the report.","options":["Good point. I rushed through the last section.","I'll check out a book later.","The figures are in the appendix.","I submitted my application for the program last week."],"answer":0,"why":"Höflicher Rat (You might want to …) → Zustimmung mit Begründung."},{"id":"c21","level":3,"voice":"W","prompt":"I'm thinking of dropping statistics this semester.","options":["I dropped my phone yesterday.","Are you sure? You'd have to take it eventually anyway.","This semester ends in December.","Statistics show that most students pass the course easily."],"answer":1,"why":"drop a course = einen Kurs abwählen; die Antwort hinterfragt die Entscheidung."},{"id":"c22","level":3,"voice":"M","prompt":"Do you happen to know if the gym is open on holidays?","options":["It happened last year as well.","I usually work out on weekends.","I'm not sure, but there's a schedule posted at the entrance.","Happy holidays to you and your whole family as well."],"answer":2,"why":"Nicht wissen, aber Hinweis auf eine Informationsquelle geben."},{"id":"c23","level":3,"voice":"W","prompt":"That presentation went better than I expected.","options":["I expect to finish it by Friday.","It's better to present in the morning.","The presentation is next week.","You certainly didn't look nervous."],"answer":3,"why":"Reaktion auf eine Aussage über die Vergangenheit mit passendem Kommentar."},{"id":"c24","level":3,"voice":"M","prompt":"If you're heading to the café, could you grab me a coffee?","options":["Sure. The usual?","The coffee machine was fixed yesterday.","The café has new chairs.","I grabbed the wrong bag."],"answer":0,"why":"grab sb a coffee = jemandem einen Kaffee mitbringen; The usual? = wie immer?"},{"id":"c25","level":3,"voice":"W","prompt":"I don't suppose you've had a chance to look at my draft yet?","options":["I suppose the draft is due soon.","Actually, I read it last night. It's really strong.","I haven't drafted anything for my own class yet.","There's a chance of rain later."],"answer":1,"why":"I don't suppose … = höfliche, zurückhaltende Frage; Actually = doch."},{"id":"c26","level":3,"voice":"M","prompt":"Isn't it about time we started on the group project?","options":["The group has four members.","We started the course in September.","Definitely. How about Monday after class?","It's about three o'clock."],"answer":2,"why":"Isn't it about time …? = Wir sollten langsam anfangen → Terminvorschlag."},{"id":"c27","level":1,"voice":"M","prompt":"What time does the next train leave?","options":["I took the train yesterday.","From platform two, I think.","It's a very long train.","In about ten minutes."],"answer":3,"why":"What time → Zeitangabe."},{"id":"c28","level":1,"voice":"W","prompt":"Do you want to sit inside or outside?","options":["Outside, if it's not too cold.","I sat there the last time we came.","Yes, I do.","The inside is new."],"answer":0,"why":"Entweder-oder-Frage → eine der Optionen wählen, nicht Yes/No."},{"id":"c29","level":1,"voice":"M","prompt":"Who's teaching the history class this term?","options":["It's on Tuesdays and Thursdays.","A new professor, I think. Dr. Lewis.","History started in the morning.","I'm not taking any math classes."],"answer":1,"why":"Who → Person."},{"id":"c30","level":1,"voice":"W","prompt":"Could you turn the music down a little?","options":["Yes, it's my favorite song.","I'll turn left at the corner.","Oh, sorry. Is this better?","The music starts at eight."],"answer":2,"why":"Bitte → der Bitte nachkommen."},{"id":"c31","level":1,"voice":"M","prompt":"How long have you lived in this city?","options":["It's a really big city.","I'm leaving next week.","Near the university.","About three years now."],"answer":3,"why":"How long → Zeitdauer."},{"id":"c32","level":1,"voice":"W","prompt":"Are you going to the party on Saturday?","options":["I'd like to, but I have to work.","It was a great party.","On Saturday at seven.","Yes, "M","prompt":"I was under the impression the deadline had been pushed back.","options":["The impression was very positive.","I pushed the door, but it was locked.","The deadline is printed on the back.","It was, but only for the graduate students."],"answer":3,"why":"under the impression = dachte; pushed back = verschoben."},{"id":"c40","level":3,"voice":"W","prompt":"You wouldn't happen to have a spare charger, would you?","options":["I might. What kind of phone do you have?","No, I don't charge for that.","My phone is fully charged.","I happened to see him yesterday."],"answer":0,"why":"Sehr höfliche, indirekte Bitte → Gegenfrage, um helfen zu können."},{"id":"c41","level":3,"voice":"M","prompt":"If I were you, I'd ask for an extension.","options":["Yes, you were right about the extension cord.","I might, but I'd hate to fall even further behind.","The extension is on the second floor.","I asked him yesterday where you were."],"answer":1,"why":"Ratschlag → abwägende Reaktion; die anderen spielen mit „extension“."},{"id":"c42","level":3,"voice":"W","prompt":"It's a shame the concert was canceled.","options":["I'll cancel my order for the new speakers tomorrow.","The tickets are still on sale.","Tell me about it. I'd been looking forward to it for weeks.","Yes, it was a great concert."],"answer":2,"why":"Tell me about it = volle Zustimmung."},{"id":"c43","level":3,"voice":"M","prompt":"Remind me why we decided to take the scenic route?","options":["We decided to take a photo.","The route is about fifty miles from here, I believe.","I'll remind you tomorrow.","Because you said the highway would be packed."],"answer":3,"why":"Remind me why … = Warum noch mal …? → Grund."},{"id":"c44","level":3,"voice":"W","prompt":"Don't tell me you've already finished the whole novel.","options":["I couldn't put it down.","I've never read that author.","The novel has three hundred pages.","I won't tell anyone."],"answer":0,"why":"Don't tell me … drückt Erstaunen aus; couldn't put it down = konnte nicht aufhören."}],"conversation":[{"id":"cv01","level":1,"lines":[{"who":"W","text":"Hi, I'd like to renew these two books, please."},{"who":"M","text":"Sure. Can I see your student ID?"},{"who":"W","text":"Here you go. Oh, and is it possible to renew them online next time?"},{"who":"M","text":"Yes. Just log in to the library website and click on My Account. You can renew each book up to three times."},{"who":"W","text":"Great, that'll save me a trip."}],"questions":[{"q":"What does the woman want to do?","options":["Get a new student ID","Return some books","Buy a book","Renew two library books"],"answer":3,"why":"„I'd like to renew these two books.“"},{"q":"What does the man tell the woman?","options":["She can renew books online.","She needs to create a new account.","She must come to the library to renew books.","She can renew a book only once."],"answer":0,"why":"Über „My Account“ online verlängern, bis zu dreimal."}]},{"id":"cv02","level":1,"lines":[{"who":"M","text":"Do you want to go grocery shopping this afternoon?"},{"who":"W","text":"I can't. I have to work until six."},{"who":"M","text":"Okay. Do you need anything? I can pick it up for you."},{"who":"W","text":"Could you get some milk and bread? I'll pay you back tonight."},{"who":"M","text":"No problem."}],"questions":[{"q":"Why can't the woman go shopping?","options":["She is feeling sick.","She has to work.","The store is closed.","She already went this morning."],"answer":1,"why":"„I have to work until six.“"},{"q":"What will the man probably do?","options":["Lend the woman some money","Cook dinner for the woman","Buy milk and bread for the woman","Wait until six to go shopping"],"answer":2,"why":"Er bietet an, etwas mitzubringen; sie bittet um Milch und Brot."}]},{"id":"cv03","level":2,"lines":[{"who":"M","text":"Professor Kim, do you have a minute? It's about the research paper."},{"who":"W","text":"Of course, Daniel. What's on your mind?"},{"who":"M","text":"I've found plenty of sources on renewable energy, but my topic feels too broad. I'm not sure where to focus."},{"who":"W","text":"That's a common problem. Why not pick one country and look at how its energy policy has changed over the last ten years?"},{"who":"M","text":"That makes sense. Germany might be interesting. I've read a lot about their solar programs."},{"who":"W","text":"Good choice. Just make sure you use at least two academic journals, not only news articles."}],"questions":[{"q":"What is the man's problem?","options":["He missed the deadline.","He can't find enough sources.","He doesn't understand solar energy.","His topic is too general."],"answer":3,"why":"„my topic feels too broad“."},{"q":"What does the professor remind him to do?","options":["Include articles from academic journals","Avoid writing about Germany","Use only news articles","Write about at least two countries"],"answer":0,"why":"„use at least two academic journals, not only news articles“."}]},{"id":"cv04","level":2,"lines":[{"who":"W","text":"Hi, I submitted a maintenance request last week, but nobody has come to fix my heater yet."},{"who":"M","text":"I'm sorry about that. Let me check. It looks like your request was sent to the wrong building."},{"who":"W","text":"Oh no. It's been really cold at night."},{"who":"M","text":"I'll mark it as urgent and send it to the right team now. Someone should be there by tomorrow afternoon. In the meantime, you can pick up a portable heater at the front desk."},{"who":"W","text":"That would help a lot. Thanks."}],"questions":[{"q":"Why hasn't the heater been fixed yet?","options":["A replacement part had to be ordered.","The request was sent to the wrong building.","The woman forgot to submit a request.","The repair team was too busy."],"answer":1,"why":"„your request was sent to the wrong building“."},{"q":"What does the man suggest the woman do?","options":["Move to another room","Wait until next week","Borrow a portable heater","Submit a new request online"],"answer":2,"why":"„you can pick up a portable heater at the front desk“."}]},{"id":"cv05","level":2,"lines":[{"who":"W","text":"Are you ready for our presentation tomorrow?"},{"who":"M","text":"Mostly. I finished my slides, but I still have to practice my part."},{"who":"W","text":"Want to do a run-through tonight? We could book a study room."},{"who":"M","text":"I'd love to, but I promised to help my brother move. How about early tomorrow, before class?"},{"who":"W","text":"Hmm. I'm not really a morning person. But okay, let's meet at eight."}],"questions":[{"q":"Why can't the man practice tonight?","options":["He has a class tonight.","He hasn't finished his slides.","All the study rooms are booked.","He promised to help his brother."],"answer":3,"why":"„I promised to help my brother move.“"},{"q":"What does the woman imply?","options":["She doesn't like early meetings but will agree to one.","She thinks they don't need to practice.","She would rather practice alone.","She can't meet before class because of her schedule."],"answer":0,"why":"not a morning person = kein Frühaufsteher; trotzdem „okay“."}]},{"id":"cv06","level":3,"lines":[{"who":"M","text":"So, did you hear back from the consulting firm?"},{"who":"W","text":"I did. They offered me the internship. The thing is, the bank I interviewed with last week might make an offer too, and they pay considerably more."},{"who":"M","text":"Did the bank give you a timeline?"},{"who":"W","text":"Only that they'd decide soon. Meanwhile, the consulting firm wants an answer by Friday."},{"who":"M","text":"Well, a bird in the hand. Unless you'd honestly prefer the bank, I wouldn't risk losing a sure thing."},{"who":"W","text":"That's what I'm afraid of. Although the consulting work does sound more interesting, to be honest."}],"questions":[{"q":"What is the woman's dilemma?","options":["Whether to ask the consulting firm for a considerably higher salary","Whether to accept one offer before hearing from another employer","Which of two offers pays more","Whether to cancel an interview"],"answer":1,"why":"Die Beratung will bis Freitag eine Antwort, die Bank hat noch nicht entschieden."},{"q":"What does the man mean when he says \"a bird in the hand\"?","options":["She should accept both internships.","She should ask the bank to make its decision faster.","A certain opportunity is better than an uncertain one.","Consulting work is more interesting."],"answer":2,"why":"Sprichwort: Lieber den Spatz in der Hand …"}]},{"id":"cv07","level":3,"lines":[{"who":"W","text":"Can I talk to you about the lab report? I noticed the discussion section is still empty."},{"who":"M","text":"Right. I've been swamped with midterms. I was going to get to it this weekend."},{"who":"W","text":"The thing is, it's due Monday morning, and I'd like time to read it over before we submit. Last time we lost points because the sections didn't match."},{"who":"M","text":"Fair enough. How about I send you a draft by Saturday noon?"},{"who":"W","text":"That works. And if you get stuck on the error analysis, just let me know. I've got my notes from the review session."}],"questions":[{"q":"Why is the woman concerned?","options":["The man made mistakes in the data.","She missed the review session.","The report is already later than the professor allowed.","She wants time to check the report before it is due."],"answer":3,"why":"Sie will es vor der Abgabe gegenlesen; letztes Mal gab es Punktabzug."},{"q":"What does the woman offer to do?","options":["Share her notes if the man needs help","Meet the man on Monday morning","Ask the professor for an extension","Write the discussion section herself"],"answer":0,"why":"„I've got my notes from the review session.“"}]},{"id":"cv08","level":1,"lines":[{"who":"W","text":"Excuse me, do you know how the washing machines work?"},{"who":"M","text":"Sure. You pay with your student card. Just tap it here and choose the program."},{"who":"W","text":"How long does it take?"},{"who":"M","text":"About forty minutes. The dryers take another hour, so don't wait too late at night."}],"questions":[{"q":"How do students pay for the machines?","options":["At the front desk","With their student card","Online","With coins"],"answer":1,"why":"„You pay with your student card.“"},{"q":"What does the man suggest?","options":["Washing clothes on weekends","Using a different machine","Not starting laundry too late","Drying clothes outside"],"answer":2,"why":"„don't wait too late at night“."}]},{"id":"cv09","level":1,"lines":[{"who":"M","text":"Hi, can I get a large coffee, please?"},{"who":"W","text":"Sure. Would you like milk or sugar?"},{"who":"M","text":"Just milk, thanks. Oh, and do you have anything without gluten?"},{"who":"W","text":"Yes, the banana bread is gluten-free. It's very popular."},{"who":"M","text":"Great, I'll take a piece."}],"questions":[{"q":"What does the man order to drink?","options":["A small tea","A hot chocolate","A coffee with sugar","A large coffee with milk"],"answer":3,"why":"„a large coffee … Just milk“."},{"q":"Why does the man ask about gluten?","options":["He is looking for food without gluten.","He wants to bake bread.","He works at the café.","He wants the most popular cake."],"answer":0,"why":"Er fragt nach etwas Glutenfreiem und nimmt das Bananenbrot."}]},{"id":"cv10","level":2,"lines":[{"who":"W","text":"Hi, I'm thinking about studying abroad next year, but I'm worried about the cost."},{"who":"M","text":"That's a common concern. Many of our exchange programs let you pay your normal tuition here, so the cost isn't much higher than staying home."},{"who":"W","text":"Really? What about housing and flights?"},{"who":"M","text":"Those you'd pay yourself, but there are travel grants. The application deadline is in March, and you'll need a short essay and a recommendation from a professor."},{"who":"W","text":"Okay, I'd better start asking a professor now, then."}],"questions":[{"q":"What is the woman's main concern?","options":["Missing her friends","How expensive studying abroad will be","Which country to choose","Whether her language skills are good enough"],"answer":1,"why":"„I'm worried about the cost.“"},{"q":"What will the woman probably do next?","options":["Pay her tuition","Book a flight","Ask a professor for a recommendation","Contact the exchange university"],"answer":2,"why":"„I'd better start asking a professor now.“"}]},{"id":"cv11","level":3,"lines":[{"who":"M","text":"Did you end up applying for the research assistant position in Dr. Hale's lab?"},{"who":"W","text":"I did, but I'm having second thoughts. It's twelve hours a week, and with my course load, I'm not sure I can keep up."},{"who":"M","text":"Twelve hours is a lot. Still, it'd look great on your grad school applications."},{"who":"W","text":"That's exactly why I applied. I guess I could drop my elective. It doesn't count toward my major anyway."},{"who":"M","text":"That seems like a reasonable trade-off, if the position works out."}],"questions":[{"q":"Why is the woman having second thoughts?","options":["The lab is located too far from campus.","The pay is too low.","She doesn't like Dr. Hale.","She is worried she won't have enough time."],"answer":3,"why":"Zwölf Stunden pro Woche plus volles Kursprogramm."},{"q":"What does the woman consider doing?","options":["Dropping a course that is not required for her major","Asking to work fewer than twelve hours a week","Applying to a different lab","Postponing graduate school"],"answer":0,"why":"Das Wahlfach zählt nicht für ihr Hauptfach."}]},{"id":"cv12","level":3,"lines":[{"who":"W","text":"Hey, are you using your camera this weekend? I'm going to my cousin's wedding, and my phone's camera isn't great."},{"who":"M","text":"I'm not, but it's not exactly the easiest camera to figure out. Have you used one like it before?"},{"who":"W","text":"Not really. How hard can it be?"},{"who":"M","text":"Well, the automatic mode is fine, but the battery drains fast. I'd take the spare one, and maybe practice a bit tomorrow so you're not figuring it out during the ceremony."},{"who":"W","text":"Good idea. Could you show me the basics tonight?"},{"who":"M","text":"Sure. Swing by after dinner."}],"questions":[{"q":"What is the man's concern?","options":["He needs the camera himself this weekend.","The woman may have trouble using the camera.","The wedding is too far away.","The camera might get damaged."],"answer":1,"why":"„not exactly the easiest camera to figure out“."},{"q":"What does the man recommend?","options":["Using only the manual settings for better photos","Buying a new camera","Bringing an extra battery and practicing in advance","Using her phone instead"],"answer":2,"why":"Ersatzakku mitnehmen und vorher üben."}]}],"announcement":[{"id":"an01","level":1,"voice":"W","text":"Attention, students. The cafeteria in the Student Center will close early today, at 3 p.m., because of a staff training session. Dinner will be served as usual in the North Dining Hall from 5 to 8 p.m. We're sorry for any inconvenience.","questions":[{"q":"What is the announcement mainly about?","options":["A change in dinner prices","A cafeteria closing early","A training course for students","A new dining hall opening"],"answer":1,"why":"Die Cafeteria schließt heute früher."},{"q":"Where can students eat dinner today?","options":["Nowhere on campus","In the staff room","In the North Dining Hall","In the Student Center"],"answer":2,"why":"„Dinner will be served as usual in the North Dining Hall.“"}]},{"id":"an02","level":1,"voice":"M","text":"Good morning, everyone. Today's field trip to the science museum will leave from the main entrance at nine thirty, not nine o'clock as planned. Please bring your student ID for free entry, and remember that lunch is not provided, so pack a snack or bring some money.","questions":[{"q":"What has changed?","options":["The entrance fee","The date of the trip","The destination","The departure time"],"answer":3,"why":"9:30 statt 9:00."},{"q":"What should students bring?","options":["Their student ID","A packed lunch for the whole group","Their textbooks","A museum ticket"],"answer":0,"why":"„Please bring your student ID for free entry.“"}]},{"id":"an03","level":2,"voice":"W","text":"Hello, this is an announcement for all residents of Maple Hall. The fire alarm system will be tested tomorrow between 10 a.m. and noon. You do not need to leave the building during the test. However, if the alarm sounds at any other time, it is a real emergency, and you must exit immediately using the nearest stairway.","questions":[{"q":"What will happen tomorrow?","options":["New stairways will be built.","The fire alarm system will be tested.","Residents will attend a safety meeting.","The building will be evacuated."],"answer":1,"why":"Test der Brandmeldeanlage zwischen 10 und 12 Uhr."},{"q":"What should residents do if they hear the alarm in the afternoon?","options":["Take the elevator to the ground floor","Wait for further instructions","Leave the building immediately","Ignore it because it is a test"],"answer":2,"why":"Außerhalb des Testfensters ist es ein echter Notfall."}]},{"id":"an04","level":2,"voice":"M","text":"Welcome to the Riverside Art Museum. Please note that the second-floor gallery is currently closed while we install our new photography exhibition, which opens next Saturday. In the meantime, visitors can enjoy a free guided tour of our sculpture garden, starting every hour at the information desk. Photography without flash is permitted in all open areas.","questions":[{"q":"Why is the second-floor gallery closed?","options":["It is reserved for a private event.","It is being repaired.","The sculptures are being cleaned.","A new exhibition is being set up."],"answer":3,"why":"„while we install our new photography exhibition“."},{"q":"What is true about taking photos?","options":["It is allowed without a flash.","It is not allowed anywhere.","It costs extra.","It is allowed only on guided tours."],"answer":0,"why":"„Photography without flash is permitted“."}]},{"id":"an05","level":2,"voice":"W","text":"This is a reminder that the Economics Department's guest lecture, The Future of Remote Work, has been moved from Room 210 to the larger auditorium in Hayes Hall because of high interest. The talk begins at 4 p.m. Students who attend can earn one point of extra credit in Economics 101 by submitting a one-page summary by Friday.","questions":[{"q":"Why has the lecture been moved?","options":["The time of the lecture has changed.","Many people want to attend.","The speaker asked for a larger room.","Room 210 is being renovated."],"answer":1,"why":"„because of high interest“."},{"q":"How can students earn extra credit?","options":["By registering online","By asking a question during the talk","By writing a short summary of the talk","By arriving early"],"answer":2,"why":"„submitting a one-page summary by Friday“."}]},{"id":"an06","level":3,"voice":"M","text":"Good afternoon. This is a message from the Office of the Registrar. Due to an unexpected technical issue with the online registration system, the registration period for spring courses has been extended by forty-eight hours and will now close on Thursday at 5 p.m. Students who encountered error messages while enrolling are advised to verify their schedules, as some selections may not have been saved. Course waitlists remain unaffected.","questions":[{"q":"Why has the registration period been extended?","options":["The office will be closed for two days.","Too few students have registered.","More courses have been added.","A technical problem affected the online system."],"answer":3,"why":"„Due to an unexpected technical issue“."},{"q":"What are some students advised to do?","options":["Check whether their course choices were saved","Register again for all their courses","Contact their professors directly","Join a course waitlist"],"answer":0,"why":"„advised to verify their schedules, as some selections may not have been saved“."}]},{"id":"an07","level":3,"voice":"W","text":"Attention, passengers. Due to signal maintenance between Central Station and Harbor Point, Blue Line trains are running every twenty minutes rather than every eight this weekend. Passengers traveling to the airport are encouraged to allow additional time or to use the express shuttle bus, which departs from Platform 3. Weekly passes will be honored on the shuttle at no additional charge.","questions":[{"q":"What is the main purpose of the announcement?","options":["To advertise a new airport bus","To inform passengers about reduced train service","To explain upcoming changes to ticket prices","To announce new train routes"],"answer":1,"why":"Züge fahren nur alle 20 statt alle 8 Minuten."},{"q":"What is indicated about the shuttle bus?","options":["It costs more than taking the train to the airport.","It only goes to Harbor Point.","Passengers with weekly passes can ride it at no extra cost.","It runs every eight minutes."],"answer":2,"why":"„Weekly passes will be honored … at no additional charge.“"}]},{"id":"an08","level":1,"voice":"W","text":"Hello, students. The bookstore will have a sale this Friday and Saturday. All T-shirts and sweatshirts will be twenty percent off. Textbooks are not part of the sale. The store will be open from nine in the morning until six in the evening on both days.","questions":[{"q":"What is on sale?","options":["Everything in the store","Textbooks","Notebooks","Clothing"],"answer":3,"why":"T-Shirts und Sweatshirts; Lehrbücher nicht."},{"q":"When is the sale?","options":["On Friday and Saturday","Every weekend this month","Next week","Only on Friday"],"answer":0,"why":"„this Friday and Saturday“."}]},{"id":"an09","level":1,"voice":"M","text":"Good afternoon. Please remember that the computer lab will be closed tomorrow morning for software updates. It will open again at one o'clock. If you need a computer before then, you can use the computers on the first floor of the library.","questions":[{"q":"Why will the lab be closed?","options":["For cleaning","For software updates","Because of a holiday","For a class"],"answer":1,"why":"„closed tomorrow morning for software updates“."},{"q":"Where can students use computers in the morning?","options":["In the bookstore","Nowhere on campus","In the library","In the lab"],"answer":2,"why":"„the computers on the first floor of the library“."}]},{"id":"an10","level":2,"voice":"W","text":"Attention, all first-year students. Course advising sessions will take place next week in the Student Services Building. Each session lasts about twenty minutes. Please sign up online by Friday, and bring a list of the courses you are interested in. Students who miss their session will not be able to register until the second registration period.","questions":[{"q":"What should students bring to the session?","options":["Their passport","A completed form for course registration","Their transcript","A list of courses they are interested in"],"answer":3,"why":"„bring a list of the courses you are interested in“."},{"q":"What will happen if a student misses the session?","options":["The student will have to register later.","The student will pay a fee.","The student must change majors.","The student can register online immediately."],"answer":0,"why":"Erst in der zweiten Anmeldephase."}]},{"id":"an11","level":3,"voice":"M","text":"Good evening, and thank you for attending tonight's performance. Please note that, at the request of the performers, photography and video recording are strictly prohibited throughout the concert. The performance will run for approximately two hours, including a twenty-minute intermission. Latecomers will be seated only during the intermission, and patrons who leave the hall during the first half may not re-enter until then.","questions":[{"q":"Why is recording not allowed?","options":["It disturbs other audience members.","The performers asked for it to be prohibited.","Cameras are not allowed in the building.","The hall has a strict copyright policy."],"answer":1,"why":"„at the request of the performers“."},{"q":"What can be inferred about someone who arrives thirty minutes late?","options":["They will not be admitted to the concert hall at all that night.","They will receive a refund.","They will have to wait until the intermission to be seated.","They can take their seat immediately."],"answer":2,"why":"Zuspätkommende werden nur in der Pause eingelassen."}]},{"id":"an12","level":3,"voice":"W","text":"This is a message from Campus Dining Services. Following student feedback, we will be piloting extended hours at Cedar Hall beginning Monday: the dining hall will remain open until midnight, Sunday through Thursday. Late-night service will feature a limited menu, and meal swipes will be accepted only until ten p.m. After that, purchases must be made with dining dollars or a credit card.","questions":[{"q":"What is the main purpose of the announcement?","options":["To close a dining hall","To ask students for feedback on the menu","To announce new meal prices","To introduce a trial of longer opening hours"],"answer":3,"why":"„piloting extended hours“ = Testphase."},{"q":"What is true about purchases after 10 p.m.?","options":["Meal swipes cannot be used.","Only meal swipes are accepted.","Only cash is accepted.","Food is free."],"answer":0,"why":"Meal swipes nur bis 22 Uhr."}]}],"talk":[{"id":"tk01","level":1,"voice":"W","title":"Why Leaves Change Color","text":"Today I want to explain why leaves change color in the fall. Leaves are green during spring and summer because they contain a lot of chlorophyll. Chlorophyll is the chemical that plants use to turn sunlight into food. But leaves also contain other colors, like yellow and orange. We just can't see them in summer because there is so much green. In the fall, the days get shorter and colder. Trees stop making chlorophyll, and the green color slowly disappears. That's when the yellow and orange colors become visible. Some trees, like maples, also make a new red color in the fall. Scientists think this red color may protect the leaves from too much sunlight while the tree takes back nutrients before the leaves drop.","questions":[{"q":"What is the talk mainly about?","options":["Why some trees lose their leaves in summer","How trees grow new leaves","How plants are harmed by sunlight","Why leaves change color in the fall"],"answer":3,"why":"Das Thema wird im ersten Satz genannt."},{"q":"Why are yellow and orange colors hard to see in summer?","options":["The green chlorophyll covers them.","Sunlight destroys them.","They are stored inside the branches.","They only form in winter."],"answer":0,"why":"„we can't see them in summer because there is so much green“."},{"q":"What happens to chlorophyll in the fall?","options":["It moves to the roots.","Trees stop producing it.","Trees produce more of it.","It turns red."],"answer":1,"why":"„Trees stop making chlorophyll“."},{"q":"According to the speaker, why might maple leaves turn red?","options":["To produce chlorophyll more quickly before the winter begins","To attract insects","To protect the leaves while the tree takes back nutrients","To keep the tree warm"],"answer":2,"why":"Rot schützt vermutlich vor zu viel Sonne, während Nährstoffe zurückgeholt werden."}]},{"id":"tk02","level":1,"voice":"M","title":"The First Bicycles","text":"Let's look at the history of the bicycle. The first bicycle-like machine was built in Germany in 1817. It was made of wood and had no pedals. Riders sat on it and pushed themselves along with their feet. It was called a running machine. About fifty years later, pedals were added to the front wheel. These bicycles were faster, but they were also very uncomfortable. People called them boneshakers, because the roads were rough and the wheels were made of iron. Later, some bicycles had a huge front wheel and a tiny back wheel. A bigger wheel meant more speed, but riders often fell. Finally, in the 1880s, the safety bicycle appeared. It had two wheels of the same size and a chain connected to the back wheel, very similar to the bikes we ride today.","questions":[{"q":"What was special about the first bicycle-like machine?","options":["It had a chain.","It was made of iron.","It had three wheels.","It had no pedals."],"answer":3,"why":"„It was made of wood and had no pedals.“"},{"q":"Why were some early bicycles called boneshakers?","options":["They were very uncomfortable to ride.","They were extremely fast.","They were made of bones.","They were often stolen from their riders."],"answer":0,"why":"Holprige Straßen und Eisenräder."},{"q":"What was the problem with bicycles that had a huge front wheel?","options":["They were too expensive.","Riders often fell off.","They had no seats.","They were too slow."],"answer":1,"why":"„riders often fell“."},{"q":"What does the speaker say about the safety bicycle?","options":["It had no chain.","It was only used in Germany.","It was similar to modern bicycles.","It was invented in 1817."],"answer":2,"why":"„very similar to the bikes we ride today“."}]},{"id":"tk03","level":2,"voice":"W","title":"Desire Paths","text":"Have you ever noticed a narrow dirt path cutting across a lawn, even though a paved sidewalk goes around it? Urban planners call these desire paths. They form when enough people decide that the official route is inconvenient and take a shortcut instead. For a long time, many planners saw desire paths as a nuisance. They put up fences or signs to keep people on the sidewalks. More recently, though, some designers have started treating these paths as valuable information. After all, a desire path shows exactly where people actually want to walk. Some universities have even used this idea when designing new campuses. Instead of paving walkways right away, they plant grass everywhere and wait a few months. Then they pave the paths that students have worn into the ground. The result is a network of walkways that matches how people really move around the campus.","questions":[{"q":"What is the talk mainly about?","options":["How to grow grass on university campuses","The long history of paved sidewalks in modern cities and towns","Why people should stay on sidewalks","Paths created by shortcuts and how planners respond to them"],"answer":3,"why":"Trampelpfade und der Umgang der Planer damit."},{"q":"How did many planners traditionally respond to desire paths?","options":["They tried to stop people from using them.","They ignored them completely.","They studied them carefully before making changes.","They paved them immediately."],"answer":0,"why":"Zäune und Schilder – „a nuisance“."},{"q":"Why does the speaker mention universities?","options":["To show where desire paths are most common in large cities","To give an example of designers using desire paths in planning","To explain who first described desire paths","To criticize students for damaging lawns"],"answer":1,"why":"Beispiel: erst Gras säen, dann die Trampelpfade pflastern."},{"q":"What can be inferred about the walkways at those universities?","options":["They are usually fenced in.","They are mostly made of dirt.","They are likely to be convenient for students.","They were designed before the campus was built."],"answer":2,"why":"Sie folgen den Wegen, die Studierende tatsächlich gehen."}]},{"id":"tk04","level":2,"voice":"M","title":"The Tragedy of the Commons","text":"In economics, there's an idea called the tragedy of the commons. Imagine a pasture that's open to all the farmers in a village. Each farmer benefits from adding one more cow to the field, because they get the milk and the profit. But the cost, the grass that the extra cow eats, is shared by everyone. So each farmer has a reason to keep adding cows. Eventually, the pasture is overgrazed and becomes useless for everyone. The same pattern shows up in many modern situations: overfishing in the ocean, traffic on public roads, even air pollution. In each case, individuals acting in their own interest end up harming a resource they all depend on. For many years, economists thought the only solutions were government rules or private ownership. But the political scientist Elinor Ostrom found that many communities manage shared resources successfully on their own, by creating local rules and monitoring each other. Her work earned her a Nobel Prize in 2009.","questions":[{"q":"What is the main purpose of the talk?","options":["To argue that all shared resources should be privately owned","To describe the history of farming","To compare cows with fish","To explain a concept and how the problem can be addressed"],"answer":3,"why":"Begriff erklären + Lösungen (Regeln, Ostrom)."},{"q":"Why does each farmer keep adding cows?","options":["Each farmer gets the benefit, while the cost is shared.","Cows produce more milk in large groups.","The government pays the farmers a fee for each cow they own.","The pasture keeps growing."],"answer":0,"why":"Nutzen privat, Kosten geteilt."},{"q":"Why does the speaker mention traffic on public roads?","options":["To explain how roads are funded","As a modern example of the same problem","To show a solution to overgrazing","To describe Ostrom's research"],"answer":1,"why":"Aufzählung moderner Beispiele."},{"q":"What did Elinor Ostrom find?","options":["Shared resources always fail.","Government rules are always necessary.","Communities can manage shared resources with their own rules.","Private ownership is the only solution that really works."],"answer":2,"why":"Lokale Regeln und gegenseitige Kontrolle funktionieren."}]},{"id":"tk05","level":2,"voice":"W","title":"How Birds Navigate","text":"How do migrating birds find their way over thousands of kilometers? Researchers have discovered that birds use several tools at once. During the day, many species navigate using the position of the sun. At night, some birds, like the indigo bunting, use the stars. In one famous experiment, young buntings were raised in a planetarium, a building where the night sky is projected onto a ceiling. When the researchers rotated the projected sky, the birds changed the direction they tried to fly. Birds also seem to sense the Earth's magnetic field. Scientists believe that special proteins in birds' eyes may allow them to see magnetic lines. And as they get closer to their destination, birds rely on familiar landmarks, like rivers, coastlines, and mountains, as well as smells. What's remarkable is that birds can switch between these tools depending on the weather. On cloudy nights, when the stars are hidden, they depend more on the magnetic field.","questions":[{"q":"What is the talk mainly about?","options":["How planetariums are built","Why birds migrate in winter","Which kinds of birds fly the longest distances","The different ways birds navigate during migration"],"answer":3,"why":"Mehrere Orientierungshilfen der Zugvögel."},{"q":"What did the planetarium experiment show?","options":["The birds used the stars to choose a direction.","The birds preferred daylight.","The birds could not fly indoors.","The birds ignored the projected sky completely."],"answer":0,"why":"Gedrehter Himmel → andere Flugrichtung."},{"q":"According to the speaker, what may help birds sense the magnetic field?","options":["Landmarks such as rivers","Proteins in their eyes","The position of the sun","Their feathers"],"answer":1,"why":"„special proteins in birds' eyes“."},{"q":"What do birds do on cloudy nights?","options":["They stop flying until morning.","They follow other birds.","They rely more on the magnetic field.","They use the sun instead."],"answer":2,"why":"Sterne verdeckt → Magnetfeld."}]},{"id":"tk06","level":3,"voice":"M","title":"Anchoring","text":"I'd like to talk about a cognitive bias that affects nearly every negotiation you'll ever take part in: anchoring. Anchoring refers to our tendency to rely too heavily on the first piece of information we receive when making a judgment. In a classic study, participants spun a wheel that was rigged to stop at either ten or sixty-five. They were then asked to estimate the percentage of African countries in the United Nations. Those who'd seen sixty-five gave estimates that were, on average, almost twice as high as those who'd seen ten, even though they knew the number was random. Now, the implications for business are considerable. In salary negotiations, the first figure mentioned tends to shape the entire discussion, which is why some experts advise making the first offer yourself, provided you've done your research. Interestingly, being aware of the bias doesn't eliminate it. Even experienced real estate agents, when given different listing prices for the same house, produced valuations that were pulled toward the listed price, while insisting the price hadn't influenced them.","questions":[{"q":"What is the speaker mainly discussing?","options":["How real estate agents are trained","Strategies that help people estimate percentages correctly","The history of the United Nations","The tendency for initial information to influence judgments"],"answer":3,"why":"Anker-Effekt: erste Information prägt das Urteil."},{"q":"Why does the speaker mention the wheel experiment?","options":["To show that even random numbers can affect estimates","To compare two types of negotiation","To explain how the United Nations was originally formed","To show that people are good at estimating"],"answer":0,"why":"Zufallszahl verzerrte die Schätzungen."},{"q":"What advice does the speaker mention for salary negotiations?","options":["Never mention a specific number during the negotiation","Consider making the first offer after doing research","Accept the first figure that is offered","Always wait for the employer's offer"],"answer":1,"why":"„making the first offer yourself, provided you've done your research“."},{"q":"What does the speaker imply about the real estate agents?","options":["They refused to give valuations.","They deliberately overvalued the houses.","They were influenced by the bias without realizing it.","Their experience protected them from the bias."],"answer":2,"why":"Beeinflusst, obwohl sie es bestritten."}]},{"id":"tk07","level":3,"voice":"W","title":"Dating the Past with Tree Rings","text":"Today we're going to look at dendrochronology, the science of dating events using tree rings. Most of you know that a tree adds one ring per year. What's less obvious is that the width of each ring reflects the growing conditions that year: wet years produce wide rings, while droughts produce narrow ones. Because trees in the same region experience the same weather, they share a distinctive pattern of wide and narrow rings, a bit like a barcode. Researchers can match the pattern in a living tree with the pattern in an old wooden beam, and then overlap that with even older samples. By chaining samples together in this way, scientists in Europe have built continuous records stretching back more than twelve thousand years. The applications go well beyond biology. Archaeologists have used tree rings to determine exactly when medieval buildings were constructed, and climate scientists use them to reconstruct rainfall patterns from periods long before weather records existed. Tree rings have even helped calibrate radiocarbon dating, correcting errors in that method of up to several centuries.","questions":[{"q":"What is the main topic of the talk?","options":["Problems with the accuracy of modern weather records","The history of medieval architecture","How trees survive droughts","Using tree rings to date events and reconstruct the past"],"answer":3,"why":"Dendrochronologie und ihre Anwendungen."},{"q":"Why does the speaker compare ring patterns to a barcode?","options":["To show that the patterns are distinctive and can be matched","To explain how machines count rings","To describe how wood is sold","To show that all trees have the same number of rings"],"answer":0,"why":"Unverwechselbares Muster, das man abgleichen kann."},{"q":"How have scientists created records that go back more than 12,000 years?","options":["By finding a single very old tree","By linking overlapping samples of different ages","By using radiocarbon dating alone on old wood","By studying modern weather records"],"answer":1,"why":"„By chaining samples together“."},{"q":"What does the speaker imply about radiocarbon dating?","options":["It is more accurate than tree rings for recent periods.","It has replaced dendrochronology.","It was less accurate before tree-ring data was used.","It can only be used on trees."],"answer":2,"why":"Baumringe korrigierten Fehler von bis zu mehreren Jahrhunderten."}]},{"id":"tk08","level":1,"voice":"M","title":"Why We Have Leap Years","text":"Have you ever wondered why February sometimes has twenty-nine days? It's because of something called a leap year. The Earth takes about three hundred sixty-five and a quarter days to travel around the sun. But our calendar year has only three hundred sixty-five days. So every year, the calendar falls about six hours behind. After four years, those extra hours add up to almost one full day. To fix this, we add an extra day, February twenty-ninth, every four years. Without leap years, our seasons would slowly move. After a few hundred years, summer would start in what we now call autumn.","questions":[{"q":"What is the talk mainly about?","options":["How the seasons change","Why leap years exist","How long a day is","The history of February"],"answer":1,"why":"Thema im ersten Satz."},{"q":"How long does the Earth take to travel around the sun?","options":["366 days","About 360 days","About 365¼ days","Exactly 365 days"],"answer":2,"why":"„about three hundred sixty-five and a quarter days“."},{"q":"How often is an extra day added?","options":["Every hundred years","Every two years","Every year","Every four years"],"answer":3,"why":"„every four years“."},{"q":"What would happen without leap years?","options":["The seasons would slowly shift in the calendar.","February would disappear.","The Earth would move faster.","Days would slowly get longer and longer."],"answer":0,"why":"Der Sommer würde irgendwann im heutigen Herbst beginnen."}]},{"id":"tk09","level":1,"voice":"W","title":"How Bees Make Honey","text":"Today let's talk about how bees make honey. First, worker bees fly from flower to flower and collect a sweet liquid called nectar. They store the nectar in a special stomach and carry it back to the hive. There, they pass the nectar to other bees, who chew it for about half an hour. Then the bees put it into small wax cells. The nectar is still very watery, so the bees fan it with their wings to dry it. When most of the water is gone, the nectar has become honey. Finally, the bees cover each cell with wax to keep the honey clean. One bee makes only about a twelfth of a teaspoon of honey in its whole life.","questions":[{"q":"What do bees collect from flowers?","options":["Honey","Nectar","Wax","Water"],"answer":1,"why":"„a sweet liquid called nectar“."},{"q":"Why do bees fan the nectar with their wings?","options":["To keep it warm","To move it to another hive","To remove water from it","To make it sweeter"],"answer":2,"why":"„to dry it“."},{"q":"What do the bees do last?","options":["Fly to more flowers","Fan the honey","Chew the nectar","Cover the cells with wax"],"answer":3,"why":"„Finally, the bees cover each cell with wax“."},{"q":"What does the speaker say about a single bee?","options":["It produces only a small amount of honey in its life.","It can visit every flower in one day.","It lives for many years.","It makes about a teaspoon of honey every single day."],"answer":0,"why":"Nur etwa 1/12 Teelöffel im ganzen Leben."}]},{"id":"tk10","level":2,"voice":"M","title":"The Bystander Effect","text":"In psychology, the bystander effect refers to a surprising finding: people are less likely to help someone in an emergency when other people are present. You might expect the opposite, that more witnesses would mean more help. But in a series of experiments in the 1960s, researchers found that participants who believed they were the only person hearing someone in distress helped quickly, while those who thought several others could hear often did nothing. Researchers point to two main causes. The first is diffusion of responsibility: when many people are present, each person feels less personally responsible. The second is social influence. In an unclear situation, people look at how others react, and if no one else seems worried, they assume there's no emergency. The good news is that simply knowing about the effect can reduce it. And if you ever need help in a crowd, experts suggest pointing to one specific person and asking them directly.","questions":[{"q":"What is the bystander effect?","options":["People help more quickly when others are watching them.","People are less likely to help when others are present.","People avoid crowded places.","People panic in emergencies."],"answer":1,"why":"Definition am Anfang."},{"q":"What did the experiments in the 1960s show?","options":["Most participants refused to help anyone.","Participants could not hear the person in distress.","People who thought they were alone helped more quickly.","Groups helped faster than individuals."],"answer":2,"why":"Allein → schnell geholfen; mit anderen → oft nichts."},{"q":"According to the speaker, what does diffusion of responsibility mean?","options":["People share tasks equally.","One person in the group naturally takes control of the situation.","Responsibility increases in larger groups.","Each person feels less responsible when many people are present."],"answer":3,"why":"Verantwortung verteilt sich."},{"q":"What does the speaker recommend if you need help in a crowd?","options":["Ask one specific person directly","Shout as loudly as possible","Wait for someone to notice","Call several people at once"],"answer":0,"why":"„pointing to one specific person and asking them directly“."}]},{"id":"tk11","level":3,"voice":"W","title":"The Columbian Exchange","text":"Historians use the term Columbian Exchange to describe the massive transfer of plants, animals, and diseases between the Americas and the rest of the world that followed 1492. Its consequences are difficult to overstate. Crops native to the Americas, such as potatoes, maize, and tomatoes, eventually transformed diets across Europe, Africa, and Asia. The potato, in particular, could produce more calories per acre than traditional European grains, and some scholars argue it contributed substantially to population growth in eighteenth-century Europe. The exchange flowed in the other direction as well. Europeans introduced horses, cattle, and wheat to the Americas, reshaping indigenous economies and ways of life. Horses, for instance, enabled some Plains peoples to adopt a highly mobile, bison-hunting culture. Yet the most devastating consequence was biological. Diseases such as smallpox, to which indigenous populations had no prior exposure, spread with catastrophic speed, killing a large proportion of the population in many regions, often before the newcomers themselves had arrived in those areas.","questions":[{"q":"What is the main topic of the talk?","options":["The trade routes Europeans used to reach Asia","How the exchange after 1492 affected the world","The life of Christopher Columbus","How potatoes are grown"],"answer":1,"why":"Begriff und Folgen des Columbian Exchange."},{"q":"Why does the speaker mention the potato?","options":["To explain the origin of European grains","To describe what Plains peoples hunted","To illustrate how an American crop changed life elsewhere","To show that most Europeans rejected new foods from abroad"],"answer":2,"why":"Mehr Kalorien pro Acre → Bevölkerungswachstum."},{"q":"According to the speaker, how did horses affect some Plains peoples?","options":["They were used mainly for trading goods with Europeans.","They replaced farming in Europe.","They spread disease.","They made a mobile, bison-hunting way of life possible."],"answer":3,"why":"„enabled some Plains peoples to adopt a highly mobile, bison-hunting culture“."},{"q":"What does the speaker imply about the spread of disease?","options":["It sometimes moved faster than the Europeans themselves.","It was planned deliberately.","It had little effect on population size.","It affected Europeans more than indigenous peoples."],"answer":0,"why":"„often before the newcomers themselves had arrived“."}]},{"id":"tk12","level":3,"voice":"M","title":"Opportunity Cost","text":"One of the most useful concepts in economics is also one of the most frequently misunderstood: opportunity cost. The opportunity cost of a choice isn't the money you spend; it's the value of the best alternative you give up. Suppose you spend a Saturday working a shift that pays a hundred dollars instead of going to a friend's concert. The opportunity cost of working is the concert, and the opportunity cost of the concert is the hundred dollars you'd have earned. This framing has some counterintuitive implications. Consider a student deciding whether to attend graduate school. Tuition is obvious, but the larger cost is often invisible: the salary the student would have earned during those years. Economists argue that ignoring these hidden costs leads people to make decisions that look sensible on paper but aren't. The concept also explains why time becomes more valuable as income rises. A highly paid professional who spends an afternoon repainting her own house may, in economic terms, be paying far more than if she'd hired someone, even though no money changes hands.","questions":[{"q":"What is opportunity cost?","options":["The money spent on a purchase","The value of the best alternative that is given up","The total cost of all the options that are available","The profit gained from a decision"],"answer":1,"why":"Definition im zweiten Satz."},{"q":"Why does the speaker mention graduate school?","options":["To argue that tuition is too expensive","To recommend working for a few years before studying","To show that a major cost may be income one does not earn","To explain how salaries are calculated"],"answer":2,"why":"Das entgangene Gehalt ist der größere, unsichtbare Kostenpunkt."},{"q":"According to the speaker, what happens when people ignore hidden costs?","options":["They almost always choose the cheaper option.","They save more money.","They avoid making decisions.","They may make poor decisions that seem reasonable."],"answer":3,"why":"„decisions that look sensible on paper but aren't“."},{"q":"What does the speaker imply about the professional who paints her own house?","options":["Her time may be worth more than the cost of hiring a painter.","She saves money by doing it herself.","She probably enjoys painting more than her regular job.","She should paint more often."],"answer":0,"why":"Ökonomisch zahlt sie mehr, obwohl kein Geld fließt."}]}]},"speaking":{"repeat":[{"id":"rp01","voice":"W","scenario":"Campus tour guide","intro":"You are training to be a campus tour guide. Listen to your supervisor and repeat what she says. Repeat only once.","sentences":["Welcome to Westfield University.","Please stay together as a group.","The library is on your left.","Students can study here until midnight.","The dining hall serves breakfast starting at seven.","If you have any questions, feel free to ask me during the tour.","Our next stop is the science center, which opened just two years ago."]},{"id":"rp02","voice":"M","scenario":"Museum gift shop","intro":"You have a new job at a museum gift shop. Listen to your manager and repeat what he says. Repeat only once.","sentences":["Good morning, everyone.","The shop opens at ten.","Please check the shelves before we open.","Members receive a ten percent discount.","All returns must include the original receipt.","If a customer asks about tours, send them to the fron .","The pool is open until nine in the evening.","If you need extra towels, just call the front desk.","Guests who would like a late checkout should let us know by eight in the morning."]}],"interview":[{"id":"iv01","voice":"W","topic":"how students manage their time","intro":"A researcher is studying how students manage their time. You have agreed to take part in a short interview. Please answer the interviewer's questions.","questions":["How do you usually plan your week?","Tell me about a time when you had too many deadlines at once. What did you do?","Some people say that being busy all the time is a sign of success. Do you agree?","Should universities make time-management training a required course? Why or why not?"]},{"id":"iv02","voice":"M","topic":"how technology affects learning","intro":"A researcher is studying how technology affects learning. You have agreed to take part in a short interview. Please answer the interviewer's questions.","questions":["What technology do you use most when you study?","Describe an app or website that helped you learn something new.","Do you think students today rely too much on technology? Explain.","In the future, will online learning replace traditional classrooms? Why or why not?"]},{"id":"iv03","voice":"W","topic":"travel habits","intro":"A researcher is studying travel habits. You have agreed to take part in a short interview. Please answer the interviewer's questions.","questions":["What is the most interesting place you have ever visited?","Do you prefer to plan every detail of a trip or to be spontaneous? Why?","Some people think tourism harms local communities. What is your opinion?","Should governments limit the number of tourists in popular destinations? Explain."]},{"id":"iv04","voice":"M","topic":"attitudes toward work and careers","intro":"A researcher is studying attitudes toward work and careers. You have agreed to take part in a short interview. Please answer the interviewer's questions.","questions":["What
