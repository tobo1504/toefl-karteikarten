<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEFL-Trainer">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>TOEFL-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: ruhige Lernspalte; im Test eine feste Kopfleiste wie im ETS-Interface, Text links, Frage rechts (breit) bzw. untereinander (Handy) */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f1ee; --ink:#1c2321; --muted:#6c7471; --faint:#9aa19e; --line:#e2e5e1;
  --accent:#2e5e57; --accent-soft:#e6eeec; --mark:#b39a5c; --good:#3f7a5a; --bad:#a5524a;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(28,35,33,.04),0 8px 24px -12px rgba(28,35,33,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131716; --surface:#1b201f; --surface-2:#222827; --ink:#e7ebe9; --muted:#9aa3a0; --faint:#6f7875; --line:#2c3331;
  --accent:#8fbcb3; --accent-soft:#22302d; --mark:#cdb57a; --good:#7fbf98; --bad:#e08f86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:36px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1080px}
h1{font-family:var(--f-display);font-weight:500;font-size:2rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:1.35rem;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;max-width:58ch}
.label{font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Start */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);transition:border-color .15s,box-shadow .15s;min-width:0}
.tile:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.tile[disabled]{cursor:default;opacity:.5;box-shadow:none;border-color:var(--line)}
.tile b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.tile span{font-size:.84rem;color:var(--muted)}
.tile .stat{font:500 .76rem var(--f-mono);color:var(--accent);margin-top:6px}
.group{display:flex;flex-direction:column;gap:12px}
.typelist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.typerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.typerow:last-child{border-bottom:0}
.typerow:hover{background:var(--surface-2)}
.typerow[disabled]{cursor:default;opacity:.45;background:none}
.typerow .t{font-weight:500}
.typerow .d{font-size:.8rem;color:var(--muted)}
.typerow .s{font:500 .76rem var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sect{font:600 .7rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 16px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}

/* Buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 18px;font:500 .92rem var(--f-body);cursor:pointer;transition:border-color .15s,opacity .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.grow{flex:1 1 160px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Testkopf */
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.testbar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.testbar .sec{font:600 .78rem var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.testbar .pos{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.testbar .sp{flex:1}
.testbar .pos{white-space:nowrap}
.navbtns{display:flex;gap:8px}
@media (max-width:640px){
  .testbar-in{gap:8px}
  .testbar .sec,.testbar .pn{display:none}
  .navbtns{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .navbtns .btn{flex:1}
  body.testing .wrap{padding-bottom:110px}
  .task:not(.single)>.panel:first-child{max-height:46vh;overflow:auto}
}
.timer{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{color:var(--bad)}
.timer.hide{color:transparent;text-shadow:none}
.progress{height:2px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

/* Aufgaben-Layout */
.task{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.task.single{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto;width:100%}
@media (max-width:820px){.task{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 24px 22px;min-width:0}
.passage{font-family:var(--f-display);font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 .9em}.passage p:last-child{margin-bottom:0}
.passage h3{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 12px}
.direction{font:500 .9rem var(--f-body);color:var(--muted);margin-bottom:12px}
.qtext{font-family:var(--f-display);font-size:1.15rem;line-height:1.45;margin:0 0 14px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 .97rem var(--f-body);cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--faint)}
.opt .k{font:600 .78rem var(--f-mono);color:var(--muted);width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{font-size:.88rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qnav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font:500 .8rem var(--f-mono);cursor:pointer}
.qnav button.on{border-color:var(--ink);color:var(--ink)}
.qnav button.done{background:var(--surface-2)}

/* Daily-Life-Texte */
.doc{font-family:var(--f-body);font-size:.95rem;line-height:1.55;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg)}
.doc .dtitle{font-weight:600;margin-bottom:8px}
.doc .mailhead{font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.doc .mailhead b{font-weight:500;color:var(--ink)}
.doc p{margin:0 0 .7em}.doc p:last-child{margin:0}
.doc table{border-collapse:collapse;width:100%;font-size:.88rem}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.doc .tw{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bubble small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}

/* Complete the Words */
.ctw{font-family:var(--f-display);font-size:1.12rem;line-height:2.25}
.gap{display:inline-flex;align-items:baseline;white-space:nowrap}
.gap input{font:500 1rem var(--f-mono);border:0;border-bottom:1.5px solid var(--faint);background:transparent;color:var(--ink);padding:0 2px;margin:0 1px;letter-spacing:.32em;border-radius:0;text-transform:lowercase}
.gap input:focus{outline:none;border-color:var(--ink);background:var(--surface-2)}
.gap input.ok{border-color:var(--good);color:var(--good)}
.gap input.no{border-color:var(--bad);color:var(--bad)}
.gap .sol{font:500 .78rem var(--f-mono);color:var(--good);margin-left:4px}

/* Build a Sentence */
.speaker{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 .8rem var(--f-body);flex:none}
.say{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-size:1.1rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:14px}
.slot{min-width:56px;height:36px;border-bottom:1.5px solid var(--faint);display:inline-flex;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:500 .95rem var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip.used{visibility:hidden}
.slots .chip{background:var(--surface-2);border-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.punct{font-family:var(--f-display);font-size:1.1rem}

/* Schreiben */
.prompt-box{font-size:.95rem}
.prompt-box ul{margin:8px 0 0;padding-left:20px}
.post{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:0}
.post .who{font-weight:600;font-size:.88rem}
.post p{margin:4px 0 0;font-size:.95rem}
textarea.write{width:100%;box-sizing:border-box;min-height:300px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:16px;font:400 1rem/1.6 var(--f-body);resize:vertical}
textarea.write:focus{outline:none;border-color:var(--ink)}
.wc{font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* Ergebnisse */
.bandrow{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bandrow>div{flex:1;padding:14px 8px;text-align:center;min-width:0}
.bandrow>div+div{border-left:1px solid var(--line)}
.big{font:500 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column}
.ritem{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:10px}
.ritem .m{font-weight:700}.ritem .m.ok{color:var(--good)}.ritem .m.no{color:var(--bad)}
.ritem .q{font-size:.92rem}.ritem .a{font-size:.85rem;color:var(--muted)}
.evalbox{display:flex;flex-direction:column;gap:12px}
.score5{display:flex;align-items:baseline;gap:10px}
.errs{display:flex;flex-direction:column}
.err{padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.err s{color:var(--bad);text-decoration-thickness:1px}
.err .fix{color:var(--good)}
.err .r{color:var(--muted);font-size:.84rem}
.improved{font-family:var(--f-display);font-size:1.02rem;line-height:1.65;background:var(--surface-2);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
table.hist{border-collapse:collapse;width:100%;font-size:.88rem}
table.hist th{font:600 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left}
table.hist th,table.hist td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist td.n,table.hist th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.code{width:100%;box-sizing:border-box;font:400 .76rem var(--f-mono);background:var(--surface-2);color:var(--ink);border:0;border-radius:10px;padding:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Listening/Speaking */
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px;text-align:center}
.wave{display:flex;gap:3px;height:40px;align-items:center}
.wave i{width:3px;height:6px;background:var(--line);border-radius:2px;transition:background .2s}
.wave.on i{background:var(--accent);animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:34px}}
select{font-family:var(--f-body)}
/* Probetests (Startseite) */
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.forms{grid-template-columns:1fr}}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.formcard.next{border-color:var(--accent)}
.formcard .ft{font-family:var(--f-display);font-weight:500;font-size:1.2rem}
.formcard .stat{font:500 .74rem var(--f-mono);color:var(--muted)}
.formcard.next .stat{color:var(--accent)}
.secbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.secbtns button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;font-family:var(--f-body)}
.secbtns button:hover{border-color:var(--faint)}
.secbtns button[disabled]{opacity:.4;cursor:default}
.secbtns span{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.secbtns b{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
/* Anweisungen vor einer Section */
.intro p,.intro ul{margin:0;max-width:62ch}
.intro ul{padding-left:20px}
/* Fehleranalyse */
.insights{margin:0;padding:6px 18px 6px 38px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.insights li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.insights li:last-child{border-bottom:0}
.insights li::marker{font:500 .8rem var(--f-mono);color:var(--accent)}
.pat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px 14px}
.pat>summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 10px;cursor:pointer;list-style:none}
.pat>summary::-webkit-details-marker{display:none}
.pat:not([open]){padding-bottom:0}
.pat:not([open])>summary{padding-bottom:14px}
.pt{font-family:var(--f-display);font-weight:500;font-size:1.08rem}
.ps{font:500 .78rem var(--f-mono);color:var(--bad);white-space:nowrap;font-variant-numeric:tabular-nums}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;background:var(--accent)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:.9rem}
.kb dt{font:600 .66rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.kb dd{margin:0}
.wq{padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
.wq .q{font-weight:500}
.wq .a{color:var(--muted)}
.wq s{color:var(--bad);text-decoration-thickness:1px}
.wq .fix{color:var(--good)}
.wq .r{color:var(--muted);font-size:.84rem}
.btn.small{padding:7px 12px;font-size:.84rem}
@media (max-width:560px){
  .bandrow{flex-wrap:wrap;border-bottom:0}
  .bandrow>div{flex:1 1 50%;box-sizing:border-box;border-bottom:1px solid var(--line)}
  .bandrow>div+div{border-left:0}
  .bandrow.full>div:first-child{flex-basis:100%}
  .kb{grid-template-columns:1fr;gap:2px}
  .kb dd{margin-bottom:8px}
}

</style>
<div id="app"></div>
<script>
const DATA={"reading":{"ctw":[{"id":"ctw01","level":2,"text":"Scientists have long suspected that sleep plays an important role in learning. During de{ep} sleep, t{he} brain rep{lays} information th{at} was gath{ered} during t{he} day a{nd} moves i{t} from temp{orary} to perm{anent} storage. In one experiment, students who slept after studying remembered more words than students who stayed awake. Researchers believe that certain brain waves help strengthen the connections between neurons. This may explain why students who sleep poorly often struggle in exams."},{"id":"ctw02","level":1,"text":"Public libraries offer much more than books. Many o{f} them le{nd} laptops, cam{eras}, and ev{en} musical instr{uments} to th{eir} members. So{me} libraries al{so} run fr{ee} classes o{n} topics such as cooking, coding, and personal finance. Because these services cost nothing, they are especially helpful for families with small budgets. In many towns, the library has become a meeting place where people of all ages can study, work, or simply relax."},{"id":"ctw03","level":3,"text":"Cities are often several degrees warmer than the surrounding countryside. This pheno{menon}, known a{s} the ur{ban} heat isl{and} effect, ari{ses} because asp{halt} and conc{rete} absorb so{lar} radiation dur{ing} the d{ay} and release it slowly at night. The scarcity of vegetation intensifies the problem, since plants cool their surroundings through evaporation. Municipal planners increasingly counteract the effect by installing reflective roofing materials and expanding green spaces, measures that can substantially reduce energy consumption during summer heat waves."},{"id":"ctw04","level":2,"text":"Honeybees have a remarkable way of sharing information. When a wor{ker} bee disc{overs} a go{od} source o{f} food, i{t} returns t{o} the hi{ve} and perf{orms} a spe{cial} dance. T{he} direction of the dance shows other bees which way to fly, while its length indicates how far away the flowers are. Scientists first described this behavior many decades ago, and later studies confirmed that bees can follow these instructions with surprising accuracy."},{"id":"ctw05","level":1,"text":"More people are riding bicycles to work than ever before. In ma{ny} cities, n{ew} bike la{nes} make t{he} trip sa{fer} and fas{ter}. Cycling i{s} cheap, a{nd} it al{so} helps peo{ple} stay fit without going to a gym. Some companies even pay workers a small bonus for leaving their cars at home. However, bad weather and long distances still keep many commuters from making the switch."},{"id":"ctw06","level":3,"text":"The placebo effect remains one of the most intriguing phenomena in medicine. Patients w{ho} receive a{n} inactive subs{tance} sometimes rep{ort} genuine improv{ements} in th{eir} symptoms, partic{ularly} when t{he} condition invo{lves} pain o{r} anxiety. Researchers attribute this response to expectation, which appears to trigger the release of natural chemicals in the brain. Consequently, clinical trials must compare new drugs against placebos rather than against no treatment at all, ensuring that observed benefits exceed those produced by belief alone."},{"id":"ctw07","level":2,"text":"Many animals use camouflage to avoid predators. Some ins{ects} look alm{ost} exactly li{ke} leaves o{r} twigs, wh{ich} makes th{em} very diff{icult} to s{ee}. Other ani{mals} can cha{nge} their colors to match their surroundings, as octopuses and some lizards do. Camouflage is not only useful for prey, however. Predators such as tigers use their striped coats to hide in tall grass while they wait for the right moment to attack."},{"id":"ctw08","level":1,"text":"Drinking enough water is important for good health. Our bod{ies} use wa{ter} to con{trol} temperature a{nd} to ca{rry} nutrients t{o} our ce{lls}. Many peo{ple} only dr{ink} when th{ey} feel thirsty, but by then the body may already need more water. Doctors suggest keeping a bottle nearby during the day. Fruits and vegetables also contain a lot of water, so they can help too."},{"id":"ctw09","level":3,"text":"Language extinction has accelerated dramatically over the past century. Linguists esti{mate} that rou{ghly} half o{f} the wor{ld's} languages co{uld} disappear wit{hin} the ne{xt} hundred ye{ars}. When a lang{uage} vanishes, commu{nities} frequently lose irreplaceable knowledge about local ecosystems, medicinal plants, and cultural traditions. Revitalization programs, which typically combine immersive schooling with digital archives, have achieved notable success in several regions, demonstrating that the decline is not necessarily irreversible when communities receive sustained institutional support."},{"id":"ctw10","level":2,"text":"Coral reefs are among the most diverse ecosystems on Earth. Although th{ey} cover le{ss} than o{ne} percent o{f} the oc{ean} floor, th{ey} provide a ho{me} for ab{out} a qua{rter} of a{ll} marine species. Corals are actually tiny animals that live together in large colonies and build hard skeletons over many years. They depend on small algae inside their bodies for most of their food. When the water becomes too warm, corals lose these algae and turn white, a process known as bleaching."},{"id":"ctw11","level":1,"text":"Dogs have an amazing sense of smell. Their no{ses} are mu{ch} better th{an} ours, s{o} they c{an} find thi{ngs} that peo{ple} cannot s{ee}. For th{is} reason, do{gs} often work with the police and help to find lost people. Some dogs can even tell when a person is sick. Training these dogs takes a long time, but most of them enjoy the work because it feels like a game."},{"id":"ctw12","level":3,"text":"Urban planners increasingly recognize that transportation policy shapes public health. Neighborhoods desi{gned} primarily aro{und} automobiles te{nd} to disco{urage} walking, wh{ich} contributes t{o} higher ra{tes} of obe{sity} and cardiov{ascular} disease am{ong} residents. Conversely, districts featuring continuous sidewalks, protected bicycle lanes, and reliable transit encourage routine physical activity without requiring deliberate exercise. Critics caution, however, that such improvements frequently raise property values, potentially displacing the very communities they were intended to benefit."}],"daily":[{"id":"d01","level":2,"genre":"notice","title":"Library notice","text":"# Notice to All Library Users\nThe second floor of Hartwell Library will be closed from March 4 to March 18 while new study rooms are built.\nDuring this time, the group study area will move to Room 105 on the first floor. Printers from the second floor have been relocated next to the main desk on the first floor.\nBooks from the second-floor collection can still be requested online and picked up within 24 hours. We apologize for the inconvenience.","questions":[{"q":"What is the main purpose of the notice?","options":["To inform users about a temporary closure","To ask users to return books early","To announce new library opening hours","To advertise study rooms that can be rented"],"answer":0,"why":"Der Aushang kündigt an, dass der 2. Stock vom 4. bis 18. März geschlossen ist.","skill":"main"},{"q":"According to the notice, how can users get books from the second floor during the closure?","options":["By waiting until March 18","By requesting them online","By asking a librarian on the second floor","By going to Room 105"],"answer":1,"why":"„Books … can still be requested online and picked up within 24 hours.“","skill":"detail"},{"q":"The word \"relocated\" in the notice is closest in meaning to","options":["replaced","removed","moved","repaired"],"answer":2,"why":"relocate = an einen anderen Ort bringen.","skill":"vocab"}]},{"id":"d02","level":2,"genre":"email","title":"Team lunch","text":"From: Dana Whitfield\nTo: All Marketing Staff\nSubject: Friday's team lunch\nHi everyone,\nJust a reminder that our team lunch is this Friday at 12:30 at Rosa's Kitchen on Elm Street. The restaurant has asked for final numbers by Wednesday, so please reply to this email if you haven't already.\nVegetarian and gluten-free options are available, but let me know about any other dietary needs. The company will cover the cost of meals, though drinks other than water and soft drinks will not be reimbursed.\nThanks,\nDana","questions":[{"q":"What does Dana ask the staff to do?","options":["Bring food to the office on Friday","Suggest a different restaurant for Friday's lunch","Pay for their meals in advance","Confirm whether they are coming by Wednesday"],"answer":3,"why":"Das Restaurant braucht bis Mittwoch die finale Zahl – wer noch nicht geantwortet hat, soll antworten.","skill":"detail"},{"q":"What is indicated about drinks?","options":["Employees must pay for some drinks themselves","The company will pay for every drink that is ordered","Only water will be served at the restaurant","Drinks must be ordered by Wednesday"],"answer":0,"why":"Getränke außer Wasser und Softdrinks werden nicht erstattet.","skill":"detail"}]},{"id":"d03","level":2,"genre":"chat","title":"Study session","text":"Maya: Hey, are you still coming to the study session tonight?\nJordan: Yes, but I might be 15 minutes late. My lab runs until 7.\nMaya: No problem. We moved it to the third-floor lounge, by the way. The library was packed.\nJordan: Good to know. Should I bring anything?\nMaya: If you still have the practice problems from last week, bring those. Nobody else saved them.","questions":[{"q":"Why will Jordan be late?","options":["The library is too crowded.","His lab ends at 7.","He has to find the practice problems.","He forgot about the session."],"answer":1,"why":"„My lab runs until 7.“","skill":"detail"},{"q":"Why did the group change the location of the session?","options":["The lounge has better equipment.","The library closes early.","The library was too full.","Jordan asked them to."],"answer":2,"why":"„The library was packed.“ – packed = überfüllt.","skill":"detail"},{"q":"What does Maya ask Jordan to bring?","options":["A copy of the textbook","Notes from his lab","Snacks and drinks for everyone in the group","Practice problems from the previous week"],"answer":3,"why":"„If you still have the practice problems from last week, bring those.“","skill":"detail"}],"me":"Jordan"},{"id":"d04","level":2,"genre":"menu","title":"Café specials","text":"# Green Fork Café – Weekday Lunch Specials\nItem | Price\nSoup of the day | $4.50\nGrilled chicken wrap | $8.75\nQuinoa salad bowl | $9.25\nCombo: any half sandwich + soup | $9.00\nSpecials are served Monday through Friday from 11:00 a.m. to 2:30 p.m. Show a valid student ID to receive 10% off any combo.\nOnline orders placed before 10:30 a.m. are guaranteed to be ready by noon.","questions":[{"q":"How much would a student with a valid ID pay for the combo?","options":["$8.10","$9.90","$8.75","$9.00"],"answer":0,"why":"10 % Rabatt auf $9.00 = $8.10.","skill":"detail"},{"q":"What is true about online orders?","options":["They must be paid for in cash when picked up.","Orders placed early will be ready by midday.","They are delivered to campus.","They are only available for combos."],"answer":1,"why":"Vor 10:30 bestellt = garantiert bis 12 Uhr fertig.","skill":"detail"},{"q":"When can a customer NOT order the specials?","options":["On Friday at 11:30 a.m.","On Monday at 2:00 p.m.","On Saturday at noon","On Tuesday at 1:00 p.m."],"answer":2,"why":"Die Specials gibt es nur Montag bis Freitag.","skill":"neg"}]},{"id":"d05","level":2,"genre":"post","title":"Garden volunteers","text":"# Riverside Community Garden\nPosted by Riverside Garden Club\nVolunteers needed! This Saturday from 9 a.m. to noon we'll be preparing the beds for spring planting. No experience necessary – we'll provide gloves and tools. Just wear clothes you don't mind getting dirty.\nAnyone who volunteers three times this season will get their own small plot for free next year. Coffee and pastries will be provided by Main Street Bakery.","questions":[{"q":"What is the purpose of the post?","options":["To sell plots in a garden","To advertise a local bakery","To announce a gardening class","To find people to help in a garden"],"answer":3,"why":"„Volunteers needed!“ – es werden Helfer gesucht.","skill":"main"},{"q":"What will people who volunteer three times receive?","options":["A garden plot at no cost","Free coffee for a year","A discount at a bakery","A set of garden tools"],"answer":0,"why":"„… will get their own small plot for free next year.“","skill":"detail"}]},{"id":"d06","level":2,"genre":"receipt","title":"Bookstore receipt","text":"# Campus Bookstore – Receipt\nSept. 3 · Transaction #40217\nItem | Price\nIntro to Psychology (used) | $62.00\nLab notebook | $11.50\nGraphing calculator (rental, 1 semester) | $25.00\nTotal | $98.50\nUsed books may be returned for a full refund within 14 days with this receipt. Rental items must be returned by December 20, or the full purchase price will be charged.","questions":[{"q":"What will happen if the calculator is returned on December 22?","options":["The rental period will be extended.","The student will be charged the calculator's full price.","Nothing, because the semester is over.","The student will receive a partial refund for the rental."],"answer":1,"why":"Leihartikel bis 20.12. zurück, sonst wird der volle Kaufpreis berechnet.","skill":"detail"},{"q":"What is indicated about the psychology book?","options":["It was bought new.","It is a rental item.","It can be returned for a refund for two weeks.","It must be returned to the store by December 20."],"answer":2,"why":"Gebrauchte Bücher: volle Erstattung innerhalb von 14 Tagen.","skill":"detail"}]},{"id":"d07","level":1,"genre":"notice","title":"Pool closed","text":"# Pool Closed\nThe campus swimming pool will be closed on Monday, October 14, for cleaning. It will open again on Tuesday at 6:00 a.m.\nSwim classes planned for Monday will take place on Wednesday at the same time. Thank you for your patience!","questions":[{"q":"Why is the pool closed?","options":["It is a holiday.","The weather is bad.","There is a swim competition.","It is being cleaned."],"answer":3,"why":"„… closed … for cleaning.“","skill":"detail"},{"q":"What will happen to Monday's swim classes?","options":["They will be held on Wednesday.","They are canceled.","They will be held on Tuesday.","They will start at 6:00 a.m."],"answer":0,"why":"„… will take place on Wednesday at the same time.“","skill":"detail"}]},{"id":"d08","level":1,"genre":"chat","title":"Movie tonight","text":"Lena: Are you going to the movie tonight?\nSam: I want to, but I have to finish my essay first.\nLena: It starts at 8. Can you make it?\nSam: Probably. Save me a seat just in case!","questions":[{"q":"What does Sam need to do before the movie?","options":["Meet a professor","Finish an essay","Buy tickets","Eat dinner"],"answer":1,"why":"„I have to finish my essay first.“","skill":"detail"},{"q":"What does Sam ask Lena to do?","options":["Help him with his essay","Change the movie time","Keep a seat for him","Wait outside the theater"],"answer":2,"why":"„Save me a seat“ = halte mir einen Platz frei.","skill":"detail"}],"me":"Sam"},{"id":"d09","level":1,"genre":"ad","title":"Room for rent","text":"# Room for Rent\nQuiet room available in a shared apartment, 10 minutes from campus by bus. $550 per month, including electricity and internet. Shared kitchen and bathroom. No pets.\nAvailable from January 1. Contact Mark at 555-0147 after 5 p.m.","questions":[{"q":"What is included in the rent?","options":["Parking","Meals","A bus pass","Internet"],"answer":3,"why":"„$550 per month, including electricity and internet.“","skill":"detail"},{"q":"When should people call Mark?","options":["In the evening","At lunchtime","In the morning","Only on January 1"],"answer":0,"why":"„after 5 p.m.“","skill":"detail"},{"q":"Who would NOT be able to rent the room?","options":["Someone who cooks often","A person who has a cat","A student without a car","Someone who wants to move in in January"],"answer":1,"why":"„No pets.“","skill":"neg"}]},{"id":"d10","level":1,"genre":"email","title":"No class","text":"From: Prof. Alvarez\nTo: BIO 101 Students\nSubject: No class on Thursday\nDear students,\nI will be at a conference this week, so there is no class on Thursday. Please read Chapter 6 instead. We will discuss it next Tuesday.\nThe quiz planned for Thursday will also take place on Tuesday.\nBest,\nProfessor Alvarez","questions":[{"q":"Why is there no class on Thursday?","options":["It is a holiday.","The professor is sick.","The professor is attending a conference.","The classroom is being repaired."],"answer":2,"why":"„I will be at a conference this week.“","skill":"detail"},{"q":"What will students do next Tuesday?","options":["Read Chapter 6 together during class","Hand in a lab report","Go to a conference","Discuss Chapter 6 and take a quiz"],"answer":3,"why":"Kapitel 6 wird besprochen, und das Quiz findet ebenfalls Dienstag statt.","skill":"detail"}]},{"id":"d11","level":1,"genre":"schedule","title":"Shuttle bus","text":"# Shuttle Bus: Campus to Downtown\nStop | Weekdays | Weekends\nMain Gate | every 15 min | every 30 min\nScience Building | every 15 min | every 30 min\nDowntown Station | every 15 min | every 30 min\nThe last bus leaves Main Gate at 11:45 p.m. Students ride free with their ID card.","questions":[{"q":"How often does the shuttle run on Saturdays?","options":["Every 30 minutes","Every 15 minutes","It does not run on Saturdays.","Every hour"],"answer":0,"why":"Wochenende: every 30 min.","skill":"detail"},{"q":"What do students need in order to ride for free?","options":["A paper ticket","Their ID card","A monthly pass","Nothing at all"],"answer":1,"why":"„Students ride free with their ID card.“","skill":"detail"}]},{"id":"d12","level":3,"genre":"email","title":"Water outage","text":"From: Facilities Management\nTo: Residents of Whitmore Hall\nSubject: Scheduled water outage – please read\nDear residents,\nContractors will be replacing a corroded main valve in Whitmore Hall on Thursday. To complete the work safely, the water supply to the entire building will be shut off between 8:00 a.m. and approximately 2:00 p.m.\nAlthough we anticipate finishing on schedule, residents should be aware that unforeseen complications occasionally prolong such repairs. Shower facilities in the adjacent Recreation Center will remain open to Whitmore residents throughout the day.\nWe recommend filling containers with drinking water the night before.\nFacilities Management","questions":[{"q":"Why will the water be shut off?","options":["The building's water tanks are being cleaned.","The building is being connected to the Recreation Center.","A damaged part of the water system is being replaced.","A new shower system is being tested."],"answer":2,"why":"„replacing a corroded main valve“ – ein beschädigtes Ventil wird ersetzt.","skill":"detail"},{"q":"What does Facilities Management suggest about the repair?","options":["It has already been postponed several times.","It requires residents to leave the building.","It will definitely end before 2:00 p.m.","It might take longer than planned."],"answer":3,"why":"„unforeseen complications occasionally prolong such repairs“ – es kann länger dauern.","skill":"infer"},{"q":"The word \"adjacent\" in the email is closest in meaning to","options":["nearby","public","newly built","larger"],"answer":0,"why":"adjacent = angrenzend, benachbart.","skill":"vocab"}]},{"id":"d13","level":3,"genre":"post","title":"Sustainability office","text":"# Campus Sustainability Office\nLast semester's \"Bring Your Own Mug\" campaign exceeded every expectation: disposable cup use in campus cafés fell by 38 percent.\nEncouraged by these results, we are extending the 25-cent discount for reusable containers to all dining halls starting next month. We are also piloting a deposit system in two cafés, in which customers pay $1 for a reusable cup and get their dollar back when the cup is returned.\nShould the pilot prove successful, it will be introduced campus-wide in the fall.","questions":[{"q":"What is the main purpose of the post?","options":["To explain why prices in campus dining halls are rising this year","To report the results of a campaign and announce next steps","To criticize students for using disposable cups","To announce that cafés will stop selling coffee"],"answer":1,"why":"Ergebnis der Kampagne (−38 %) plus Ausweitung und Pilotprojekt.","skill":"main"},{"q":"What can be inferred about the deposit system?","options":["It is already used in all dining halls.","It costs customers 25 cents per cup.","Whether it is expanded depends on how well it works at first.","It has replaced the discount for reusable containers."],"answer":2,"why":"„Should the pilot prove successful, it will be introduced campus-wide.“","skill":"infer"},{"q":"The phrase \"exceeded every expectation\" means that the campaign was","options":["more expensive than expected","less popular than expected","shorter than expected","more successful than expected"],"answer":3,"why":"exceed = übertreffen.","skill":"vocab"}]},{"id":"d14","level":3,"genre":"chat","title":"Draft feedback","text":"Daniel: Did you get a chance to look at the draft I sent?\nPriya: I did. The data section is really strong.\nDaniel: And the introduction?\nPriya: Well… I think a reader who isn't in our field might have a hard time figuring out why the topic matters.\nDaniel: So, back to the drawing board?\nPriya: Not entirely – just a couple of paragraphs. I can go over it with you tomorrow if you want.","questions":[{"q":"What does Priya imply about the introduction?","options":["It does not clearly explain why the topic is important.","It is ready to be submitted.","It is much too long for a short research paper like this.","It contains incorrect data."],"answer":0,"why":"Leser außerhalb des Fachs verstehen nicht, warum das Thema wichtig ist.","skill":"infer"},{"q":"What does Daniel mean when he says \"back to the drawing board\"?","options":["He disagrees with Priya's opinion.","He thinks he has to start over.","He plans to meet in the art room.","He wants to add some drawings."],"answer":1,"why":"back to the drawing board = noch einmal von vorn anfangen.","skill":"vocab"},{"q":"What does Priya offer to do?","options":["Explain the topic to other readers","Send Daniel her own paper","Review the draft together with Daniel","Rewrite the data section"],"answer":2,"why":"„I can go over it with you tomorrow.“","skill":"detail"}],"me":"Priya"},{"id":"d15","level":3,"genre":"webpage","title":"Extension policy","text":"# Requesting an Extension on a Final Paper\nStudents who cannot meet a final paper deadline because of circumstances beyond their control may request an extension of up to seven days.\nRequests must be submitted through the Student Portal no later than 48 hours before the original deadline and should be accompanied by supporting documentation where possible. Instructors are not obligated to grant extensions requested after this point, except in documented emergencies.\nApproved extensions do not affect a student's eligibility for honors, but papers submitted after an extended deadline will be penalized at the instructor's discretion.","questions":[{"q":"According to the page, when must most extension requests be made?","options":["At the start of the semester","On the day of the deadline","Within seven days after the original deadline has passed","At least two days before the original deadline"],"answer":3,"why":"„no later than 48 hours before the original deadline“.","skill":"detail"},{"q":"What is true about requests made later than this?","options":["Instructors may refuse them unless there is a documented emergency.","They reduce the student's chance of receiving honors.","They are always rejected.","They are usually accepted if students provide documentation."],"answer":0,"why":"„not obligated to grant … except in documented emergencies“.","skill":"detail"},{"q":"The phrase \"at the instructor's discretion\" means that the penalty","options":["must be approved by the university","is decided by the instructor","is the same for all students","is explained in the Student Portal"],"answer":1,"why":"discretion = Ermessen.","skill":"vocab"}]},{"id":"d16","level":3,"genre":"review","title":"Restaurant review","text":"# Review: The Lantern Room ★★★☆☆\nI had high hopes for this new place after reading so much praise online. The setting is undeniably charming – exposed brick, soft lighting, and a view of the harbor.\nUnfortunately, the food did not live up to the atmosphere. My grilled fish arrived lukewarm, and the much-advertised seasonal vegetables were little more than a handful of overcooked carrots.\nTo be fair, our server was attentive and apologized sincerely, even removing the fish from our bill. I might return for drinks on the terrace, but I would think twice before ordering dinner again.","questions":[{"q":"What is the reviewer's overall opinion of the restaurant?","options":["It is excellent in every way.","The service was the main problem.","The atmosphere is better than the food.","It is too expensive for what it offers."],"answer":2,"why":"„the food did not live up to the atmosphere“.","skill":"attitude"},{"q":"Why does the reviewer mention the server?","options":["To complain about slow service","To recommend a specific employee for promotion","To explain why the food was cold","To give a fair, balanced picture of the visit"],"answer":3,"why":"„To be fair …“ leitet einen positiven Gegenpunkt ein.","skill":"purpose"}]},{"id":"d17","level":2,"genre":"email","title":"Soccer schedule","text":"From: Campus Recreation\nTo: Intramural Soccer Participants\nSubject: Schedule change for Sunday\nHello players,\nBecause heavy rain is forecast for Sunday afternoon, all intramural soccer games scheduled between 1 p.m. and 5 p.m. will be moved indoors to the Field House. Please note that indoor games are shortened to two 20-minute halves, and cleats are not permitted on the indoor surface – flat-soled shoes only.\nEvening games will be played outdoors as planned unless you receive another update by noon on Sunday.\nCampus Recreation","questions":[{"q":"Why are some games being moved?","options":["Too many teams have signed up.","The Field House is closer to campus.","Heavy rain is expected.","The fields are being repaired."],"answer":2,"why":"„Because heavy rain is forecast …“","skill":"detail"},{"q":"What must players do for indoor games?","options":["Register again online","Bring their own ball","Arrive 20 minutes early","Wear shoes without cleats"],"answer":3,"why":"„cleats are not permitted … flat-soled shoes only“.","skill":"detail"},{"q":"What can be inferred about the evening games?","options":["Their plans could still change.","They will be shortened.","They will take place in the Field House.","They have been canceled."],"answer":0,"why":"„as planned unless you receive another update“.","skill":"infer"}]},{"id":"d18","level":2,"genre":"notice","title":"Lost and found","text":"# Lost & Found – Student Union\nItems turned in at the Student Union are kept for 30 days. After that, clothing is donated to local charities, and electronics are recycled.\nTo claim an item, visit the Information Desk (Mon–Fri, 8 a.m.–6 p.m.) and describe it in detail. Phones, laptops, and wallets will only be returned after you show a photo ID.\nWe cannot hold items for other people or mail them to you.","questions":[{"q":"What happens to a jacket that nobody claims within a month?","options":["It is recycled.","It is given to a charity.","It is sold online.","It is mailed to the owner."],"answer":1,"why":"Kleidung wird nach 30 Tagen gespendet.","skill":"detail"},{"q":"What is required to claim a lost wallet?","options":["An online form","A friend's signature","A photo ID","A receipt"],"answer":2,"why":"Telefone, Laptops und Geldbörsen nur gegen Lichtbildausweis.","skill":"detail"}]},{"id":"d19","level":2,"genre":"chat","title":"Bus pass","text":"Leo: Did you see that the bus pass price is going up next semester?\nAva: Seriously? By how much?\nLeo: From $90 to $120. But if you buy before December 1, you still get the old price.\nAva: Then I'm buying mine this week. Thanks for the heads-up!\nLeo: No worries. You can do it online – it only takes a minute.","questions":[{"q":"What will happen to the price of the bus pass?","options":["It will double.","It will decrease to $90.","It will stay the same.","It will increase by $30."],"answer":3,"why":"Von $90 auf $120.","skill":"detail"},{"q":"What does Ava decide to do?","options":["Buy her pass soon to save money","Ask for a refund","Stop taking the bus","Wait until December to decide"],"answer":0,"why":"Vor dem 1. Dezember gilt noch der alte Preis.","skill":"detail"},{"q":"What does Ava mean by \"Thanks for the heads-up\"?","options":["Thanks for helping with my homework.","Thanks for the warning.","Thanks for paying for me.","Thanks for the ride."],"answer":1,"why":"heads-up = Vorwarnung, Hinweis.","skill":"vocab"}],"me":"Ava"},{"id":"d20","level":2,"genre":"schedule","title":"Writing Center hours","text":"# Writing Center – Fall Hours\nDay | In person | Online\nMonday–Thursday | 10 a.m.–7 p.m. | 10 a.m.–10 p.m.\nFriday | 10 a.m.–3 p.m. | 10 a.m.–3 p.m.\nWeekend | closed | 2 p.m.–8 p.m.\nAppointments are 45 minutes long. Please bring a printed copy of your draft to in-person sessions. Students may book up to two appointments per week.","questions":[{"q":"How can a student get help from the Writing Center on a Saturday?","options":["Not at all","In person during the morning hours","Online in the afternoon or evening","In person until 3 p.m."],"answer":2,"why":"Wochenende: nur online, 14–20 Uhr.","skill":"detail"},{"q":"What should students bring to an in-person appointment?","options":["A completed booking form","Their laptop","Two copies of the assignment","A printed copy of their draft"],"answer":3,"why":"„bring a printed copy of your draft“.","skill":"detail"},{"q":"What is the maximum number of appointments a student can have in one week?","options":["Two","One","Three","As many as needed"],"answer":0,"why":"„up to two appointments per week“.","skill":"detail"}]},{"id":"d21","level":1,"genre":"notice","title":"Flu shots","text":"# Free Flu Shots\nThe Student Health Center is offering free flu shots for all students next week, Monday to Thursday, from 9 a.m. to 4 p.m.\nNo appointment is needed. Just bring your student ID. The shots take about five minutes.","questions":[{"q":"What is being offered?","options":["Free health check-ups","Free flu shots","A health class","Cheap medicine"],"answer":1,"why":"„free flu shots for all students“.","skill":"detail"},{"q":"What do students need to bring?","options":["Some money","A doctor's note","Their student ID","An appointment card"],"answer":2,"why":"„Just bring your student ID.“","skill":"detail"}]},{"id":"d22","level":1,"genre":"chat","title":"Shopping","text":"Noah: Hey, I'm at the store. Do we need anything for dinner?\nKim: Yes, can you get some rice and onions?\nNoah: Sure. Anything else?\nKim: Maybe some apples for tomorrow. Thanks!","questions":[{"q":"Where is Noah?","options":["In a restaurant","At school","At home","At a store"],"answer":3,"why":"„I'm at the store.“","skill":"detail"},{"q":"What does Kim want for tomorrow?","options":["Apples","Rice","Onions","Dinner"],"answer":0,"why":"„some apples for tomorrow“.","skill":"detail"}],"me":"Kim"},{"id":"d23","level":1,"genre":"ad","title":"Guitar lessons","text":"# Guitar Lessons\nLearn to play the guitar! Lessons for beginners every Tuesday and Thursday evening at the Music Building, Room 12. Each lesson is one hour.\n$15 per lesson, or $50 for four lessons. Guitars are available to borrow. Email Ms. Torres to sign up.","questions":[{"q":"How much do four lessons cost?","options":["$15","$50","$60","$45"],"answer":1,"why":"„$50 for four lessons“.","skill":"detail"},{"q":"What is true about the lessons?","options":["They last two hours.","They are on weekends.","Students can borrow a guitar.","They are for advanced players."],"answer":2,"why":"„Guitars are available to borrow.“","skill":"detail"}]},{"id":"d24","level":1,"genre":"email","title":"Book club","text":"From: Jenna\nTo: Book Club Members\nSubject: Next meeting\nHi all,\nOur next meeting is on Friday at 6 p.m. in the café on Pine Street, not in the library this time. We will talk about the first half of the book. Please let me know if you can't come.\nSee you soon,\nJenna","questions":[{"q":"Where will the next meeting take place?","options":["In the library","Online","At Jenna's house","In a café"],"answer":3,"why":"„in the café on Pine Street, not in the library“.","skill":"detail"},{"q":"What will the club talk about?","options":["Part of the book","A new book","The whole book","The café's menu"],"answer":0,"why":"„the first half of the book“.","skill":"detail"}]},{"id":"d25","level":3,"genre":"email","title":"Graduate application","text":"From: Office of Graduate Admissions\nTo: Applicant\nSubject: Application materials\nDear applicant,\nOur records indicate that your application is complete with the exception of one letter of recommendation. Please note that applications lacking any required document by January 15 will not be forwarded to the admissions committee.\nRecommenders who experience difficulty with the online portal may email their letters directly to our office, provided the message originates from an institutional email address.\nShould you wish to replace a recommender, you may do so through your applicant dashboard at any time before the deadline.\nOffice of Graduate Admissions","questions":[{"q":"Why did the applicant receive this email?","options":["The application was rejected.","A letter of recommendation is still missing.","The online portal has been closed.","The deadline for applications has been extended."],"answer":1,"why":"„complete with the exception of one letter of recommendation“.","skill":"detail"},{"q":"What will happen if the application is still incomplete on January 15?","options":["The deadline will be extended automatically.","The applicant will be charged a fee.","It will not be reviewed by the committee.","The committee will contact the recommender."],"answer":2,"why":"„will not be forwarded to the admissions committee“.","skill":"detail"},{"q":"What condition applies to letters sent by email?","options":["They must be sent by the applicant.","They must be sent at least two weeks before January 15.","They must be signed by hand.","They must come from an institutional email address."],"answer":3,"why":"„provided the message originates from an institutional email address“.","skill":"detail"}]},{"id":"d26","level":3,"genre":"post","title":"Library hours","text":"# From the Desk of the Dean\nSeveral students have asked why the library's 24-hour schedule ends after midterms. The answer is simple: usage data show that overnight attendance drops by more than 80 percent once exams are over, and staffing the building around the clock is costly.\nThat said, we recognize that some students rely on late-night study space. Beginning this semester, the ground-floor study lounge will remain accessible with a student ID until 2 a.m. throughout the term.\nWe will continue to monitor demand and adjust hours accordingly.","questions":[{"q":"Why does the library stop opening 24 hours a day after midterms?","options":["Few students use it at night then, and staffing is expensive.","Staff members go on vacation.","The building needs repairs.","Students complained about noise in the building at night."],"answer":0,"why":"Nutzung −80 % und hohe Personalkosten.","skill":"detail"},{"q":"What change is announced?","options":["The library will be open 24 hours all term.","A study lounge will stay open late throughout the semester.","Students will need a new type of ID.","The library will close earlier than before on weeknights."],"answer":1,"why":"Lounge bis 2 Uhr mit Studierendenausweis.","skill":"detail"},{"q":"What does the dean suggest about future opening hours?","options":["They are final and will not change.","They will be decided by a vote among students next term.","They may change depending on how much the space is used.","They will be reduced next year."],"answer":2,"why":"„monitor demand and adjust hours accordingly“.","skill":"infer"}]},{"id":"d27","level":3,"genre":"chat","title":"Presentation sources","text":"Owen: Are you presenting first or second on Thursday?\nGrace: Second, thank goodness. I need every minute I can get.\nOwen: Isn't your part pretty much done?\nGrace: The slides are, but the professor wants us to cite at least five peer-reviewed sources, and I've only got three.\nOwen: Have you tried the interlibrary loan service? It's usually quicker than people think.\nGrace: I hadn't thought of that. I'll put in a request tonight.","questions":[{"q":"Why is Grace relieved to present second?","options":["She is nervous about speaking in public.","Her slides are not finished.","She wants to see Owen's presentation first.","She needs more time to prepare."],"answer":3,"why":"„I need every minute I can get.“","skill":"detail"},{"q":"What problem does Grace have?","options":["She does not have enough academic sources.","Her partner has left the group.","She cannot open her slides.","She has already missed the deadline for her slides."],"answer":0,"why":"Fünf Fachquellen gefordert, sie hat drei.","skill":"detail"},{"q":"What does Owen imply about the interlibrary loan service?","options":["It is usually too slow to be useful.","It might solve her problem in time.","It is expensive for students.","It is only available to professors."],"answer":1,"why":"„usually quicker than people think“.","skill":"infer"}],"me":"Grace"},{"id":"d28","level":3,"genre":"instructions","title":"3D printing lab","text":"# Using the 3D Printing Lab\nBefore printing for the first time, all users must complete a 30-minute safety orientation, offered every Wednesday at noon.\nPrints longer than four hours require advance approval from lab staff and are scheduled overnight. Users are responsible for removing completed prints within 24 hours; unclaimed items will be discarded.\nMaterial costs are charged to your student account at $0.10 per gram.","questions":[{"q":"What must new users do before printing?","options":["Buy their own material","Pay a fee in advance","Attend a safety orientation","Get approval from a professor"],"answer":2,"why":"Pflicht: 30-minütige Sicherheitseinweisung.","skill":"detail"},{"q":"What happens to a print job that takes six hours?","options":["It is not allowed.","It must be printed on a Wednesday at noon.","It is free of charge.","It needs approval and is printed overnight."],"answer":3,"why":"Über vier Stunden: Genehmigung, Druck über Nacht.","skill":"detail"},{"q":"How much would a 50-gram print cost?","options":["$5.00","$0.50","$10.00","$50.00"],"answer":0,"why":"50 × $0,10 = $5,00.","skill":"detail"}]},{"id":"d29","level":1,"genre":"flyer","title":"Yoga in the park","text":"# Free Yoga in the Park\nEvery Saturday in June · 9:00–10:00 a.m.\nMeet at the big fountain in Riverside Park.\nAll levels are welcome. Please bring your own mat and a bottle of water.\nIf it rains, the class moves to the Community Center on Oak Street.\nQuestions? Call Nina at 555-0142.","questions":[{"q":"When does the class take place?","options":["On Saturday mornings in June","On the first Saturday of each month","On Saturday evenings all summer","Every morning in June"],"answer":0,"why":"„Every Saturday in June · 9:00–10:00 a.m.“","skill":"detail"},{"q":"What should people bring?","options":["A towel and sports shoes","A mat and some water","Money for the teacher","An umbrella and a mat"],"answer":1,"why":"„bring your own mat and a bottle of water“.","skill":"detail"},{"q":"What happens if it rains?","options":["The class starts an hour later.","The class is canceled.","The class is held indoors.","The class moves to Sunday."],"answer":2,"why":"Bei Regen im Community Center.","skill":"detail"}]},{"id":"d30","level":1,"genre":"chat","title":"Birthday gift","text":"Emma: Hi Ben! Tom's birthday is on Friday. Do you have a gift yet?\nBen: Not yet. Any ideas?\nEmma: He loves cooking. Maybe a cookbook?\nBen: Good idea. We could buy it together.\nEmma: Sure! The bookstore on King Street has a sale this week.\nBen: Great. Let's go tomorrow after class. I finish at 3.\nEmma: Perfect. See you at the front gate.","questions":[{"q":"What are Emma and Ben planning to do?","options":["Sell their old books at a store","Cook dinner for Tom's birthday","Study together after class","Buy a present for a friend"],"answer":3,"why":"Sie wollen gemeinsam ein Geschenk für Tom kaufen.","skill":"main"},{"q":"Why does Emma suggest a cookbook?","options":["Tom enjoys cooking.","Ben has one already.","Cookbooks are on sale.","Tom asked for one."],"answer":0,"why":"„He loves cooking.“","skill":"detail"},{"q":"Where will Emma and Ben meet tomorrow?","options":["At the bookstore","At the front gate","In their classroom","On King Street"],"answer":1,"why":"„See you at the front gate.“","skill":"detail"}],"me":"Ben"},{"id":"d31","level":1,"genre":"menu","title":"Pizza lunch","text":"# Tony's Pizza – Lunch Menu\nItem | Small | Large\nCheese pizza | $7 | $11\nVegetable pizza | $8 | $12\nChicken pizza | $9 | $13\nLunch deal (11 a.m.–2 p.m.): any small pizza + a drink for $9.\nFree delivery for orders over $20.","questions":[{"q":"How much is a large vegetable pizza?","options":["$11","$8","$12","$13"],"answer":2,"why":"Zeile Vegetable pizza, Spalte Large.","skill":"detail"},{"q":"What is included in the lunch deal?","options":["Two small pizzas","A large pizza and a drink","A small pizza and free delivery","A small pizza and a drink"],"answer":3,"why":"„any small pizza + a drink for $9“.","skill":"detail"},{"q":"Which order would be delivered for free?","options":["Two large chicken pizzas","One lunch deal","Two small cheese pizzas","One large cheese pizza"],"answer":0,"why":"Nur 2 × $13 = $26 liegt über $20.","skill":"infer"}]},{"id":"d32","level":1,"genre":"notice","title":"Elevator repair","text":"# Notice: Elevator Repair\nThe elevator in Baker Hall will be out of service on Tuesday, May 6, from 8 a.m. to 4 p.m.\nPlease use the stairs on that day.\nIf you need help carrying heavy things, ask at the front desk. Staff will be happy to help you.\nThank you for your patience.","questions":[{"q":"What is the notice about?","options":["A new elevator that will open at the beginning of May","An elevator that cannot be used for a day","Stairs that are closed for repair work","A front desk that is moving upstairs"],"answer":1,"why":"Der Aufzug ist am 6. Mai außer Betrieb.","skill":"main"},{"q":"How long will the elevator be out of service?","options":["One week","Two days","Eight hours","Four hours"],"answer":2,"why":"Von 8 bis 16 Uhr.","skill":"detail"},{"q":"What can people do at the front desk?","options":["Report a broken stair or a broken light","Get a key for the elevator","Leave their bags for the day","Ask for help with heavy things"],"answer":3,"why":"„If you need help carrying heavy things, ask at the front desk.“","skill":"detail"}]},{"id":"d33","level":1,"genre":"email","title":"Dentist appointment","text":"From: Bright Smile Dental\nTo: Alex Moreno\nSubject: Your appointment\nDear Alex,\nThis is a reminder of your appointment with Dr. Lee on Monday, April 14, at 10:30 a.m.\nPlease arrive ten minutes early to fill out a form. If you cannot come, call us at least one day before. Our office is on the second floor, above the pharmacy.\nSee you soon!","questions":[{"q":"Why was this email sent?","options":["To remind Alex of an appointment","To tell Alex about a new office","To cancel a visit to the dentist","To ask Alex to pay a bill"],"answer":0,"why":"„This is a reminder of your appointment“.","skill":"main"},{"q":"When should Alex arrive?","options":["At 10:30 a.m.","At 10:20 a.m.","At 10:40 a.m.","At 10:00 a.m."],"answer":1,"why":"Zehn Minuten vor 10:30 Uhr.","skill":"detail"},{"q":"Where is the dentist's office?","options":["Inside a hospital","Next to a pharmacy","Over a pharmacy","On the first floor"],"answer":2,"why":"„on the second floor, above the pharmacy“.","skill":"detail"}]},{"id":"d34","level":1,"genre":"ad","title":"Bike for sale","text":"# For Sale: Mountain Bike – $120\nBlue mountain bike, three years old, in good condition. New tires and brakes last month.\nI am selling it because I am moving to another city.\nA helmet and a lock are included in the price.\nYou can see the bike any evening after 6 p.m. Text Carla: 555-0199","questions":[{"q":"Why is Carla selling the bike?","options":["She bought a new one.","She needs the money.","It needs new brakes.","She is moving away."],"answer":3,"why":"„because I am moving to another city“.","skill":"detail"},{"q":"What does the buyer get together with the bike?","options":["A helmet and a lock","Two extra tires","A lock and new lights","A helmet and a pump"],"answer":0,"why":"„A helmet and a lock are included“.","skill":"detail"},{"q":"What is NOT true about the bike?","options":["It is blue.","It is one year old.","It costs $120.","It has new tires."],"answer":1,"why":"Das Rad ist drei Jahre alt.","skill":"neg"}]},{"id":"d35","level":1,"genre":"schedule","title":"City pool","text":"# City Pool – Opening Hours\nDay | Hours | Notes\nMonday–Friday | 6 a.m.–9 p.m. | Lanes for fast swimmers until 8 a.m.\nSaturday | 8 a.m.–8 p.m. | Children's lessons 9–11 a.m.\nSunday | 10 a.m.–6 p.m. | Family day\nTickets: adults $5, students $3. Children under 6 swim free.","questions":[{"q":"When does the pool open on Saturdays?","options":["At 9 a.m.","At 10 a.m.","At 8 a.m.","At 6 a.m."],"answer":2,"why":"Zeile Saturday.","skill":"detail"},{"q":"How much does a student pay?","options":["$6","$5","Nothing","$3"],"answer":3,"why":"„students $3“.","skill":"detail"},{"q":"When are the children's lessons?","options":["On Saturday mornings","On Saturday afternoons","On weekday mornings","On Sunday mornings"],"answer":0,"why":"Saturday, 9–11 a.m.","skill":"detail"}]},{"id":"d36","level":2,"genre":"email","title":"Internship interview","text":"From: Rachel Kim, Human Resources\nTo: Daniel Ortega\nSubject: Interview for summer internship\nDear Mr. Ortega,\nThank you for applying for the marketing internship at Northline Media. We would like to invite you to an interview on Thursday, March 12, at 2:00 p.m. The interview will be held online and will last about 30 minutes; a link will be sent the day before.\nPlease prepare a short presentation (no more than five minutes) about a social media campaign you admire. If the time does not suit you, reply by Monday so that we can arrange an alternative.\nBest regards,\nRachel Kim","questions":[{"q":"What is the purpose of the email?","options":["To offer an applicant a summer job","To invite an applicant to an interview","To confirm that an application has arrived","To ask an applicant for more documents"],"answer":1,"why":"„We would like to invite you to an interview“.","skill":"main"},{"q":"What is Daniel asked to prepare?","options":["A link for the online interview","A five-page report about Northline Media's history","A brief talk about a campaign he likes","A list of his social media accounts"],"answer":2,"why":"Kurze Präsentation über eine Kampagne, die er bewundert.","skill":"detail"},{"q":"What should Daniel do if he is not available on Thursday?","options":["Wait for a link on Wednesday","Call the office on Thursday morning","Send his presentation in writing","Answer the email by Monday"],"answer":3,"why":"„reply by Monday so that we can arrange an alternative“.","skill":"detail"}]},{"id":"d37","level":2,"genre":"webpage","title":"Bike sharing","text":"# CityCycle – How It Works\n1. Download the app and create an account.\n2. Scan the code on any bike to unlock it.\n3. Ride! The first 30 minutes of every trip are free for members.\n4. Return the bike to any CityCycle station and wait for the green light.\nAfter 30 minutes, trips cost $1 for each additional 15 minutes. Bikes left outside a station are subject to a $25 fee. Monthly membership: $12; students: $8.","questions":[{"q":"How much would a member pay for a 45-minute trip?","options":["$1","$3","Nothing","$2"],"answer":0,"why":"30 Minuten frei, weitere 15 Minuten kosten $1.","skill":"detail"},{"q":"What happens if a rider leaves a bike outside a station?","options":["The bike locks after 30 minutes.","The rider has to pay $25.","The rider pays $1 every 15 minutes.","The membership is canceled."],"answer":1,"why":"„subject to a $25 fee“.","skill":"detail"},{"q":"What can be inferred about the green light?","options":["It shows that the bike needs to be repaired.","It shows that the free 30 minutes of the trip are now over.","It shows that the bike has been returned correctly.","It shows that the station has no space left."],"answer":2,"why":"Man soll nach dem Abstellen auf das grüne Licht warten.","skill":"infer"}]},{"id":"d38","level":2,"genre":"chat","title":"Apartment viewing","text":"Mia: I just saw the apartment on Cedar Street. It's bright, and it's only ten minutes from campus.\nJonas: Sounds great. What's the catch?\nMia: The rent is $150 more than we planned, and there's no washing machine.\nJonas: Hmm. Is there a laundromat nearby?\nMia: Right across the street. The landlord needs an answer by Friday.\nJonas: Let's look at the one on Hill Road tomorrow first, then decide.","questions":[{"q":"What does Jonas mean when he asks, \"What's the catch?\"","options":["He wants to know when they can move in.","He wants to know who the landlord is.","He wants to know how Mia found the place.","He wants to know the disadvantages."],"answer":3,"why":"the catch = der Haken.","skill":"vocab"},{"q":"What will Mia and Jonas probably do before Friday?","options":["Visit another apartment","Sign the contract for Cedar Street","Ask the landlord for a lower rent","Buy a washing machine"],"answer":0,"why":"Erst die Wohnung in der Hill Road ansehen, dann entscheiden.","skill":"next"}],"me":"Jonas"},{"id":"d39","level":2,"genre":"instructions","title":"Printing","text":"# How to Print from Your Laptop\n1. Connect to the campus Wi-Fi network.\n2. Go to print.westfield.edu and log in with your student account.\n3. Upload your file and choose black-and-white or color.\n4. Walk to any library printer and tap your student card to release the job.\nJobs that are not released within 12 hours are deleted automatically. Printing costs 5 cents per page (color: 20 cents) and is charged to your card only when the job is released.","questions":[{"q":"What must students do at the printer?","options":["Connect their laptop with a cable","Tap their student card","Log in to the website again","Choose between color and black-and-white"],"answer":1,"why":"„tap your student card to release the job“.","skill":"detail"},{"q":"What can be inferred about a job that is uploaded but never released?","options":["It is printed in black-and-white.","The student is charged after 12 hours.","The student does not pay for it.","It stays in the system until the end of term."],"answer":2,"why":"Abgerechnet wird erst bei der Freigabe; nach 12 Stunden wird gelöscht.","skill":"infer"}]},{"id":"d40","level":2,"genre":"post","title":"Campus radio","text":"# Campus Radio 91.3 is looking for hosts!\nDo you love music, sports, or talking about campus life? We have three open slots for weekly one-hour shows next semester. No experience is necessary – we offer training in the first two weeks of the term.\nTo apply, send us a two-minute audio sample and a short description of your show idea by December 5. Shows that feature local artists will be given priority.","questions":[{"q":"What do applicants have to send?","options":["Proof of earlier experience in radio","A list of their favorite local artists","A one-hour sample of a complete show with music and talk","A short recording and a description of their idea"],"answer":3,"why":"„a two-minute audio sample and a short description of your show idea“.","skill":"detail"},{"q":"Which applicant would most likely be chosen?","options":["Someone who plans to play music by bands from the area","Someone who can start before the semester begins","Someone who wants to report on national sports","Someone who has already hosted a show at another radio station"],"answer":0,"why":"„Shows that feature local artists will be given priority.“","skill":"infer"}]},{"id":"d41","level":2,"genre":"notice","title":"Parking changes","text":"# Parking Changes – Lot C\nBeginning October 1, Lot C will be reserved for vehicles with a commuter permit on weekdays between 7 a.m. and 5 p.m. Outside these hours, the lot remains open to all permit holders.\nVisitors should use the parking garage on College Avenue, where the first hour is free. Vehicles parked without the correct permit will be ticketed.","questions":[{"q":"Who may park in Lot C on a Tuesday at 10 a.m.?","options":["Nobody, because the lot is closed","Drivers with a commuter permit","Anyone with a campus permit","Visitors staying under an hour"],"answer":1,"why":"Werktags 7–17 Uhr nur mit commuter permit.","skill":"detail"},{"q":"What is true about the parking garage?","options":["It requires a visitor permit.","It is reserved for commuters.","The first hour costs nothing.","It closes at 5 p.m. on weekdays."],"answer":2,"why":"„where the first hour is free“.","skill":"detail"}]},{"id":"d42","level":3,"genre":"email","title":"Conference abstract","text":"From: Program Committee, Regional Linguistics Conference\nTo: Hannah Fischer\nSubject: Decision on your abstract\nDear Ms. Fischer,\nWe are pleased to inform you that your abstract has been accepted for a poster presentation rather than the oral presentation you requested. The number of submissions far exceeded the available speaking slots, and the committee felt your data would lend itself particularly well to a visual format.\nPlease confirm your participation by May 2. Presenters who have not registered by that date will be removed from the program.","questions":[{"q":"Why was the abstract not accepted as an oral presentation?","options":["The committee found the data in the abstract unconvincing.","Ms. Fischer had not registered in time.","The abstract arrived after the deadline.","There were more submissions than speaking slots."],"answer":3,"why":"„The number of submissions far exceeded the available speaking slots“.","skill":"detail"},{"q":"The phrase \"lend itself particularly well to\" is closest in meaning to","options":["be especially suitable for","be easily confused with","be less important than","be borrowed from"],"answer":0,"why":"lend itself to = sich eignen für.","skill":"vocab"}]},{"id":"d43","level":3,"genre":"review","title":"Laptop review","text":"# Review: AeroBook 14 ★★★☆☆\nI wanted to love this laptop. It weighs next to nothing, and the screen is gorgeous. The battery, however, is another story: the advertised twelve hours turned out to be closer to six with ordinary use. The keyboard also takes some getting used to, since the keys barely move. For the price, I expected fewer compromises. If you mostly work near a power outlet, it may still be worth considering.","questions":[{"q":"What is the reviewer's overall opinion of the laptop?","options":["It is too heavy to carry around every day.","It is disappointing despite some strengths.","It is poorly designed in every respect.","It is the best laptop available at this price."],"answer":1,"why":"Lob für Gewicht und Bildschirm, aber Akku und Tastatur enttäuschen.","skill":"attitude"},{"q":"For whom might the laptop still be suitable, according to the reviewer?","options":["People who often travel on very long flights","People who type for many hours a day","People who rarely depend on the battery","People who want the lowest price"],"answer":2,"why":"„If you mostly work near a power outlet“.","skill":"infer"}]},{"id":"d44","level":3,"genre":"webpage","title":"AI tools policy","text":"# Use of AI Tools in Coursework\nUnless an instructor states otherwise, students may use AI tools to brainstorm ideas and to check grammar. Submitting text generated by such tools as one's own work, however, constitutes academic misconduct.\nWhenever an AI tool has been used, students must disclose this in a brief note at the end of the assignment. Failure to do so will be treated in the same way as plagiarism, regardless of how the tool was used.","questions":[{"q":"According to the policy, what are students generally allowed to do?","options":["Submit AI-generated text if they add a note","Use AI tools only when an instructor asks them to","Leave out the note for small assignments","Use AI tools to come up with ideas"],"answer":3,"why":"„may use AI tools to brainstorm ideas and to check grammar“.","skill":"detail"},{"q":"What can be inferred about a student who uses an AI tool only to check grammar but does not mention it?","options":["The student could be penalized as if for plagiarism.","The student will only receive a warning.","The student has followed the policy correctly.","The student must rewrite the whole assignment without any tools."],"answer":0,"why":"Fehlende Angabe gilt wie Plagiat, „regardless of how the tool was used“.","skill":"infer"}]},{"id":"d45","level":3,"genre":"chat","title":"Proposal feedback","text":"Lucas: Did you read the professor's comments on our proposal?\nSofia: Just now. She thinks the research question is too broad to be answered in ten pages.\nLucas: She has a point. We're basically trying to cover the entire history of the minimum wage.\nSofia: What if we limited it to one state over the last decade?\nLucas: That would make the data far more manageable. Though we'd have to scrap most of section two.\nSofia: Better now than the night before the deadline.","questions":[{"q":"How does Lucas react to the professor's criticism?","options":["He does not understand it.","He agrees with it.","He is offended by it.","He decides to ignore it."],"answer":1,"why":"She has a point = Sie hat recht.","skill":"attitude"},{"q":"What does Sofia imply in her last message?","options":["They should have limited the topic before writing the first section.","The deadline should be moved to a later date.","Major changes are easier to make early than at the last minute.","Section two is the strongest part of the proposal."],"answer":2,"why":"„Better now than the night before the deadline.“","skill":"infer"}],"me":"Sofia"},{"id":"d46","level":3,"genre":"notice","title":"Sleep study","text":"# Participants Needed: Sleep and Memory Study\nThe Department of Psychology is recruiting volunteers aged 18–30 for a two-session study. Participants will complete memory tasks in the evening and again the following morning after wearing a sleep-tracking wristband overnight.\nCompensation is $40, paid upon completion of both sessions. Individuals who regularly work night shifts or have traveled across more than two time zones in the past month are ineligible.","questions":[{"q":"Who would NOT be able to take part in the study?","options":["A 22-year-old who usually goes to bed after midnight","A 30-year-old who works in an office during the day","A 19-year-old who has never taken part in a research study before","A 25-year-old who flew from New York to London last week"],"answer":3,"why":"New York–London sind fünf Zeitzonen; mehr als zwei schließen aus.","skill":"neg"},{"q":"When do participants receive the payment?","options":["After they have finished the second session","As soon as they return the wristband","Before the first evening session begins at the lab","Half after each of the two sessions"],"answer":0,"why":"„paid upon completion of both sessions“.","skill":"detail"}]},{"id":"d47","level":3,"genre":"email","
