in larger groups.","Each person feels less responsible when many people are present."],"answer":3,"why":"Verantwortung verteilt sich.","skill":"vocab"},{"q":"What does the speaker recommend if you need help in a crowd?","options":["Ask one specific person directly","Shout as loudly as possible","Wait for someone to notice","Call several people at once"],"answer":0,"why":"„pointing to one specific person and asking them directly“.","skill":"detail"}]},{"id":"tk11","level":3,"voice":"W","title":"The Columbian Exchange","text":"Historians use the term Columbian Exchange to describe the massive transfer of plants, animals, and diseases between the Americas and the rest of the world that followed 1492. Its consequences are difficult to overstate. Crops native to the Americas, such as potatoes, maize, and tomatoes, eventually transformed diets across Europe, Africa, and Asia. The potato, in particular, could produce more calories per acre than traditional European grains, and some scholars argue it contributed substantially to population growth in eighteenth-century Europe. The exchange flowed in the other direction as well. Europeans introduced horses, cattle, and wheat to the Americas, reshaping indigenous economies and ways of life. Horses, for instance, enabled some Plains peoples to adopt a highly mobile, bison-hunting culture. Yet the most devastating consequence was biological. Diseases such as smallpox, to which indigenous populations had no prior exposure, spread with catastrophic speed, killing a large proportion of the population in many regions, often before the newcomers themselves had arrived in those areas.","questions":[{"q":"What is the main topic of the talk?","options":["The trade routes Europeans used to reach Asia","How the exchange after 1492 affected the world","The life of Christopher Columbus","How potatoes are grown"],"answer":1,"why":"Begriff und Folgen des Columbian Exchange.","skill":"main"},{"q":"Why does the speaker mention the potato?","options":["To explain the origin of European grains","To describe what Plains peoples hunted","To illustrate how an American crop changed life elsewhere","To show that most Europeans rejected new foods from abroad"],"answer":2,"why":"Mehr Kalorien pro Acre → Bevölkerungswachstum.","skill":"purpose"},{"q":"According to the speaker, how did horses affect some Plains peoples?","options":["They were used mainly for trading goods with Europeans.","They replaced farming in Europe.","They spread disease.","They made a mobile, bison-hunting way of life possible."],"answer":3,"why":"„enabled some Plains peoples to adopt a highly mobile, bison-hunting culture“.","skill":"detail"},{"q":"What does the speaker imply about the spread of disease?","options":["It sometimes moved faster than the Europeans themselves.","It was planned deliberately.","It had little effect on population size.","It affected Europeans more than indigenous peoples."],"answer":0,"why":"„often before the newcomers themselves had arrived“.","skill":"infer"}]},{"id":"tk12","level":3,"voice":"M","title":"Opportunity Cost","text":"One of the most useful concepts in economics is also one of the most frequently misunderstood: opportunity cost. The opportunity cost of a choice isn't the money you spend; it's the value of the best alternative you give up. Suppose you spend a Saturday working a shift that pays a hundred dollars instead of going to a friend's concert. The opportunity cost of working is the concert, and the opportunity cost of the concert is the hundred dollars you'd have earned. This framing has some counterintuitive implications. Consider a student deciding whether to attend graduate school. Tuition is obvious, but the larger cost is often invisible: the salary the student would have earned during those years. Economists argue that ignoring these hidden costs leads people to make decisions that look sensible on paper but aren't. The concept also explains why time becomes more valuable as income rises. A highly paid professional who spends an afternoon repainting her own house may, in economic terms, be paying far more than if she'd hired someone, even though no money changes hands.","questions":[{"q":"What is opportunity cost?","options":["The money spent on a purchase","The value of the best alternative that is given up","The total cost of all the options that are available","The profit gained from a decision"],"answer":1,"why":"Definition im zweiten Satz.","skill":"detail"},{"q":"Why does the speaker mention graduate school?","options":["To argue that tuition is too expensive","To recommend working for a few years before studying","To show that a major cost may be income one does not earn","To explain how salaries are calculated"],"answer":2,"why":"Das entgangene Gehalt ist der größere, unsichtbare Kostenpunkt.","skill":"purpose"},{"q":"According to the speaker, what happens when people ignore hidden costs?","options":["They almost always choose the cheaper option.","They save more money.","They avoid making decisions.","They may make poor decisions that seem reasonable."],"answer":3,"why":"„decisions that look sensible on paper but aren't“.","skill":"detail"},{"q":"What does the speaker imply about the professional who paints her own house?","options":["Her time may be worth more than the cost of hiring a painter.","She saves money by doing it herself.","She probably enjoys painting more than her regular job.","She should paint more often."],"answer":0,"why":"Ökonomisch zahlt sie mehr, obwohl kein Geld fließt.","skill":"infer"}]},{"id":"tk13","level":1,"voice":"W","title":"Why the Sea Is Salty","text":"Have you ever wondered why the sea is salty while rivers are not? Today I'll explain. The story begins with rain. Rainwater is slightly acidic, so when it falls on rocks, it slowly breaks them down. This releases tiny amounts of minerals, including salt. Rivers then carry these minerals to the ocean. Now, river water does contain a little salt, but so little that we cannot taste it. So why is the ocean so much saltier? The answer is the sun. The sun heats the ocean, and water evaporates, which means it rises into the air. But the salt cannot evaporate. It stays behind. This has been happening for billions of years, so the salt has slowly built up. Today, about three and a half percent of sea water is salt. That is why drinking it makes you even thirstier.","questions":[{"q":"What is the talk mainly about?","options":["Why people should not drink river water","How the sun affects the weather at sea","Why ocean water contains so much salt","How rain turns into river water"],"answer":2,"why":"Thema: Warum das Meer salzig ist und Flüsse nicht.","skill":"main"},{"q":"Where does the salt in the ocean originally come from?","options":["From plants that grow in rivers","From the bottom of the deep sea","From the air above the ocean","From rocks that rain breaks down"],"answer":3,"why":"Regen löst Mineralien aus Gestein, Flüsse tragen sie ins Meer.","skill":"detail"},{"q":"Why can't we taste the salt in river water?","options":["There is too little of it.","It sinks to the bottom.","Rain washes it away.","It evaporates in the sun."],"answer":0,"why":"„so little that we cannot taste it“.","skill":"detail"},{"q":"What happens to the salt when sea water evaporates?","options":["It rises into the air.","It remains in the ocean.","It falls back as rain.","It is carried into rivers."],"answer":1,"why":"„the salt cannot evaporate. It stays behind.“","skill":"detail"}]},{"id":"tk14","level":1,"voice":"M","title":"The First Postage Stamp","text":"Today, sending a letter is simple. You buy a stamp, put it on the envelope, and drop it in a mailbox. But it wasn't always like this. In Britain before 1840, the person who received a letter had to pay for it, not the person who sent it. And the price depended on how far the letter had traveled. This caused problems. Postage was expensive, and many people simply refused to accept their letters, so the post office lost money. A teacher named Rowland Hill suggested a better idea. The sender should pay in advance, and the price should be the same for any distance within the country. To show that the sender had paid, a small piece of paper was stuck on the letter. This was the first postage stamp, called the Penny Black, because it cost one penny and was printed in black. The idea was so successful that other countries soon copied it.","questions":[{"q":"What is the talk mainly about?","options":["How letters were carried across Britain","Why people stopped writing letters by hand","How a new way of paying for mail began","Why sending letters is expensive today"],"answer":2,"why":"Es geht um die Einführung der Briefmarke und der Vorauszahlung.","skill":"main"},{"q":"Before 1840, who usually paid for a letter in Britain?","options":["The local post office","The teacher of the town","The person who wrote it","The person who received it"],"answer":3,"why":"Der Empfänger zahlte, nicht der Absender.","skill":"detail"},{"q":"What did Rowland Hill suggest?","options":["One price, paid in advance by the sender","Lower prices for letters sent a long way","A fine for people who refused their letters","Free delivery of letters within each city"],"answer":0,"why":"Absender zahlt vorab, gleicher Preis für jede Entfernung.","skill":"detail"},{"q":"Why was the first stamp called the Penny Black?","options":["Because of the city where it was printed","Because of its price and its color","Because of the name of its inventor","Because it was used on dark envelopes"],"answer":1,"why":"Ein Penny, schwarz gedruckt.","skill":"detail"}]},{"id":"tk15","level":1,"voice":"W","title":"How Owls Hunt at Night","text":"Most birds hunt during the day, but owls are different. They hunt at night, and their bodies are perfectly built for it. First, owls have very large eyes that collect a lot of light, so they can see well even when it is almost dark. However, their eyes cannot move. To look around, an owl must turn its whole head, and it can turn it much farther than we can. Second, owls have excellent hearing. In many owls, one ear is a little higher than the other. Because of this, a sound reaches each ear at a slightly different time, and the owl can tell exactly where a mouse is, even under snow. Finally, owls fly almost silently. The edges of their feathers are soft, which breaks up the air and reduces noise. So the mouse doesn't hear the owl coming until it is too late.","questions":[{"q":"What is the talk mainly about?","options":["Differences between owls and other night animals","Reasons why owls sleep during the day","Body features that help owls hunt in the dark","The kinds of animals that owls like to eat"],"answer":2,"why":"Augen, Gehör und leiser Flug als Anpassungen an die Nachtjagd.","skill":"main"},{"q":"Why must an owl turn its head to look around?","options":["Its ears are in the way.","Its eyes are too small.","Its neck is very short.","Its eyes cannot move."],"answer":3,"why":"„their eyes cannot move“.","skill":"detail"},{"q":"How does having one ear higher than the other help an owl?","options":["It can find the exact place a sound comes from.","It can hear sounds from much farther away.","It can keep its balance while turning its head.","It can fly without making any noise at all."],"answer":0,"why":"Der Schall erreicht die Ohren zeitversetzt → genaue Ortung.","skill":"detail"},{"q":"Why can owls fly so quietly?","options":["Their wings are smaller than those of other birds.","The edges of their feathers are soft.","They fly very slowly and close to the ground.","They only hunt when it is snowing."],"answer":1,"why":"Weiche Federkanten brechen den Luftstrom.","skill":"detail"}]},{"id":"tk16","level":1,"voice":"M","title":"How Glass Is Recycled","text":"Let's talk about what happens to a glass bottle after you put it in a recycling bin. First, trucks take the glass to a recycling center. There, workers and machines remove things that are not glass, like metal caps and plastic. Next, the glass is sorted by color: clear, green, and brown. This step is important because mixing colors would produce glass of poor quality. After that, the glass is crushed into small pieces and washed. These pieces are then melted in a very hot oven and shaped into new bottles and jars. Here is the best part. Glass can be recycled again and again without losing quality. Also, melting old glass needs less energy than making new glass from sand. So when you recycle one bottle, you save energy and reduce waste at the same time.","questions":[{"q":"What is the speaker mainly describing?","options":["The cost of collecting waste","The history of glass bottles","The steps of recycling glass","The best way to wash bottles at home"],"answer":2,"why":"Der Weg der Flasche von der Tonne bis zur neuen Flasche.","skill":"main"},{"q":"Why is glass sorted by color?","options":["Green glass melts at a lower heat.","Brown glass cannot be recycled.","Clear glass is worth more money.","Mixed colors would lower the quality."],"answer":3,"why":"„mixing colors would produce glass of poor quality“.","skill":"detail"},{"q":"What does the speaker call \"the best part\"?","options":["Glass can be recycled many times without getting worse.","Glass pieces can be melted in a normal oven.","New bottles are much cheaper than bottles made from sand.","Recycling centers no longer need any workers."],"answer":0,"why":"„again and again without losing quality“.","skill":"detail"},{"q":"Why does recycling glass save energy?","options":["Sorting by color is done by hand.","Melting old glass takes less energy than making new glass.","Crushed glass does not need to be heated.","Recycling trucks use far less fuel than other kinds of trucks."],"answer":1,"why":"„needs less energy than making new glass from sand“.","skill":"detail"}]},{"id":"tk17","level":2,"voice":"W","title":"Keystone Species","text":"In ecology, some species matter far more than their numbers would suggest. We call them keystone species. The name comes from architecture: the keystone is the stone at the top of an arch, and if you remove it, the whole arch collapses. A classic example is the sea otter on the Pacific coast of North America. Sea otters eat sea urchins, and sea urchins eat kelp, a kind of giant seaweed. Kelp forests provide food and shelter for hundreds of species of fish and other animals. In the nineteenth century, otters were hunted for their fur until very few remained. Without otters, the number of urchins exploded, and they ate entire kelp forests, leaving bare rock behind. The fish disappeared as well. When otters were later protected and returned, the kelp recovered surprisingly quickly. So the lesson is this: protecting one species sometimes protects a whole ecosystem. And the opposite is true, too. Losing a single keystone species can set off a chain reaction that nobody predicted.","questions":[{"q":"What is the talk mainly about?","options":["The reasons why sea otters were hunted in the past","Different methods of protecting forests under the sea","Species that have an unusually large effect on their ecosystem","Animals that are far more numerous than scientists once expected"],"answer":2,"why":"Schlüsselarten: großer Einfluss trotz geringer Zahl.","skill":"main"},{"q":"Why does the speaker mention an arch?","options":["To describe the shape of a kelp forest","To show how otters build their homes","To compare ecology with engineering jobs","To explain where the term comes from"],"answer":3,"why":"Der Schlussstein (keystone) hält den Bogen zusammen – daher der Name.","skill":"purpose"},{"q":"What happened after sea otters were nearly wiped out?","options":["Sea urchins multiplied and destroyed the kelp.","Sea urchins disappeared along with the otters.","Fish began to eat the kelp instead of urchins.","Kelp forests spread to new parts of the coast."],"answer":0,"why":"Ohne Otter explodierte die Zahl der Seeigel, sie fraßen die Kelpwälder.","skill":"detail"},{"q":"What can be inferred about the areas where otters returned?","options":["The kelp there had to be planted by people.","The number of sea urchins there went down.","The fish there never came back.","The otters there were hunted once again."],"answer":1,"why":"Der Kelp erholte sich – also wurden die Seeigel wieder von Ottern gefressen.","skill":"infer"}]},{"id":"tk18","level":2,"voice":"M","title":"Jet Lag and the Body Clock","text":"Almost everything in your body follows a daily rhythm of roughly twenty-four hours: when you feel sleepy, when you get hungry, even your body temperature. This internal clock is called the circadian rhythm, and it's controlled by a small region of the brain that responds mainly to light. Normally, the clock stays in step with the sun. But when you fly across several time zones, your clock is still set to the place you left. That mismatch is jet lag. You're wide awake at three in the morning and exhausted at lunchtime. Interestingly, most people find flying east harder than flying west. Why? Flying west makes your day longer, and it's easier for the body to stay up late than to fall asleep early. As a rule of thumb, the body adjusts by about one hour per day. You can speed this up by getting sunlight at the right time. After an eastward flight, for example, morning light helps move your clock forward. Eating meals on local time seems to help as well.","questions":[{"q":"What is the talk mainly about?","options":["Why the sun rises at different times","Why long flights make people hungry","How the body's internal clock causes jet lag","How pilots avoid becoming tired"],"answer":2,"why":"Innere Uhr und ihr Missverhältnis zur Ortszeit.","skill":"main"},{"q":"According to the speaker, what mainly controls the body clock?","options":["Exercise","Meals","Temperature","Light"],"answer":3,"why":"Die Hirnregion reagiert „mainly to light“.","skill":"detail"},{"q":"Why is flying east usually harder than flying west?","options":["Falling asleep early is harder than staying up late.","Flights to the east usually take much longer.","The body clock runs faster on eastward flights.","There is far less sunlight in the east in the morning."],"answer":0,"why":"Nach Westen wird der Tag länger; länger wach bleiben fällt leichter.","skill":"detail"},{"q":"About how long would a traveler probably need to adjust after crossing six time zones?","options":["Three days","Six days","Twelve days","One day"],"answer":1,"why":"Faustregel: etwa eine Stunde pro Tag.","skill":"infer"}]},{"id":"tk19","level":2,"voice":"W","title":"The Printing Press","text":"Before the middle of the fifteenth century, books in Europe were copied by hand. A single book could take months to finish, so books were rare and extremely expensive. Most people never owned one. Then, around 1450, Johannes Gutenberg developed a printing press that used movable metal type. That means each letter was a separate piece of metal that could be arranged, used, and then rearranged for the next page. Suddenly a workshop could produce hundreds of copies in the time a scribe needed for one. The effects went far beyond cheaper books. As prices fell, more people had a reason to learn to read. Scientists could share their results with colleagues in other countries and check each other's work. And ideas that challenged those in power spread faster than authorities could stop them. Now, Gutenberg didn't invent printing itself. Printing with movable type had been used in China and Korea centuries earlier. What made his press so influential in Europe was partly the alphabet: with only a few dozen letters, movable type was far more practical.","questions":[{"q":"Why were books rare in Europe before 1450?","options":["Authorities destroyed books they disliked.","Most people were not allowed to own books.","Every copy had to be written by hand.","Paper had not yet been invented."],"answer":2,"why":"„copied by hand“ – ein Buch dauerte Monate.","skill":"detail"},{"q":"According to the speaker, what is movable type?","options":["Handwriting that imitates printed letters","Pages that are carved from one piece of metal","A machine that moves paper through a press","Separate letters that can be arranged and used again"],"answer":3,"why":"Jeder Buchstabe ist ein eigenes Metallstück, das neu angeordnet wird.","skill":"detail"},{"q":"Why does the speaker mention China and Korea?","options":["To point out that Gutenberg was not the first to print this way","To explain where Gutenberg bought his metal","To describe how the printing press later reached other continents","To show that books were cheaper in Asia"],"answer":0,"why":"Druck mit beweglichen Lettern gab es dort Jahrhunderte früher.","skill":"purpose"},{"q":"What does the speaker imply about the alphabet?","options":["It changed a great deal after the press was introduced.","A small number of characters made movable type efficient.","It was invented in order to make printing possible.","It was much harder to print than Chinese or Korean writing."],"answer":1,"why":"„with only a few dozen letters, movable type was far more practical“.","skill":"infer"}]},{"id":"tk20","level":2,"voice":"M","title":"Why Prices End in Ninety-Nine","text":"Why do so many prices end in ninety-nine? A jacket costs forty-nine ninety-nine, not fifty dollars. Stores have done this for more than a century, and research suggests it really works. The main explanation is called the left-digit effect. We read numbers from left to right, and our brains form a judgment as soon as we see the first digit. So forty-nine ninety-nine feels like forty-something, even though it's only one cent less than fifty. In one well-known experiment, a dress was offered at thirty-four, thirty-nine, and forty-four dollars. Surprisingly, it sold best at thirty-nine, even though thirty-four was cheaper. There's a second effect as well. Prices ending in nine signal a bargain, so shoppers assume the item is a good deal. But that signal can backfire. Luxury brands tend to avoid such prices and use round numbers instead, because a round price suggests quality. So the next time you see a price tag, think about what the store is trying to tell you.","questions":[{"q":"What is the talk mainly about?","options":["Why luxury products cost more than they used to","How people learn to read numbers from left to right","Why prices ending in nine influence shoppers","How stores decide which products to put on sale"],"answer":2,"why":"Es geht um die Wirkung von 99er-Preisen.","skill":"main"},{"q":"What is the left-digit effect?","options":["People add up prices from left to right.","People prefer prices that are written on the left.","People forget the last digits of a price quickly.","People judge a price mostly by its first digit."],"answer":3,"why":"Das Urteil entsteht, sobald man die erste Ziffer sieht.","skill":"detail"},{"q":"Why does the speaker mention the experiment with the dress?","options":["To show that a price ending in nine can beat a lower price","To prove that most shoppers simply choose the cheapest item","To suggest that experiments on prices are unreliable","To explain why clothing stores use round prices"],"answer":0,"why":"Für 39 Dollar verkaufte sich das Kleid besser als für 34.","skill":"purpose"},{"q":"What can be inferred about luxury brands?","options":["They sell more when their prices end in nine.","They do not want their products to look like bargains.","They believe shoppers ignore the first digit.","They change their prices more often than other brands."],"answer":1,"why":"Runde Preise signalisieren Qualität; 9er-Preise signalisieren Schnäppchen.","skill":"infer"}]},{"id":"tk21","level":3,"voice":"W","title":"The Sunk Cost Fallacy","text":"Imagine you've paid eighty dollars for a concert ticket, and on the night of the show you feel ill and it's pouring rain. Many of us would drag ourselves there anyway, reasoning that otherwise the money would be wasted. Economists call this the sunk cost fallacy. A sunk cost is money, time, or effort that has already been spent and cannot be recovered. Rationally, it should have no bearing on what we do next, since the eighty dollars is gone whether we attend or not. The only relevant question is which option will make us better off from this point on. Yet people routinely let past investments dictate future choices. Companies pour additional funds into failing projects because abandoning them would mean admitting the earlier spending was a mistake. Psychologists attribute this partly to loss aversion, our tendency to feel losses more intensely than equivalent gains, and partly to a desire to appear consistent. Interestingly, some studies suggest that young children and even animals are less prone to this error than adults, presumably because adults have absorbed the rule 'don't be wasteful' and apply it where it doesn't belong. I'm not saying persistence is always irrational. But the justification for continuing should lie in future benefits, never in what has already been spent.","questions":[{"q":"What is the main purpose of the talk?","options":["To compare how companies and individuals save money","To describe the best way to recover money that has already been spent","To explain why past spending wrongly influences decisions","To argue that people should never give up on a project"],"answer":2,"why":"Thema: versunkene Kosten bestimmen fälschlich künftige Entscheidungen.","skill":"main"},{"q":"Why does the speaker mention the concert ticket?","options":["To suggest that people should plan for bad weather","To give an example of a sensible financial choice","To show that concerts have become too expensive","To illustrate the fallacy with an everyday situation"],"answer":3,"why":"Alltagsbeispiel zum Einstieg.","skill":"purpose"},{"q":"According to the speaker, why do companies keep funding failing projects?","options":["Stopping would mean admitting that earlier spending was a mistake.","Their managers are unaware of how much has been spent.","They are legally required to complete every project they start.","They expect that the losses will be covered by insurance."],"answer":0,"why":"„abandoning them would mean admitting the earlier spending was a mistake“.","skill":"detail"},{"q":"What does the speaker imply about adults?","options":["They are less affected by losses than animals are.","A rule they have learned leads them into the error.","They make better financial decisions than children do.","They usually recognize the fallacy as soon as it occurs."],"answer":1,"why":"Erwachsene wenden „don't be wasteful“ an, wo es nicht passt.","skill":"infer"}]},{"id":"tk22","level":3,"voice":"M","title":"Wegener and Continental Drift","text":"In 1912, a German meteorologist named Alfred Wegener proposed that the continents had once been joined in a single landmass, which he called Pangaea, and had since drifted apart. His evidence was considerable. The coastlines of South America and Africa fit together like puzzle pieces. Fossils of the same reptiles turned up on both sides of the Atlantic, although these animals could not possibly have crossed an ocean. And rock formations in Scotland matched those in eastern North America. Nevertheless, most geologists dismissed the idea, some of them with open hostility. Part of the resistance was that Wegener was an outsider to the field. But the more serious objection was that he could offer no convincing mechanism. What force could possibly push continents through solid ocean floor? Wegener's own suggestions were easily shown to be far too weak. The answer emerged only in the 1950s and 60s, when surveys of the sea floor revealed that new crust forms along mid-ocean ridges and spreads outward. Continents don't plow through the ocean floor; they ride on enormous plates that move with it. Wegener had died in 1930 on an expedition in Greenland, decades before his central claim was vindicated. His story is a reminder that being right about what happens is not enough if you cannot explain how.","questions":[{"q":"What is the talk mainly about?","options":["An expedition that proved the continents are still moving","A disagreement about the age of rocks on two continents","A theory that was rejected until its mechanism was discovered","A scientist who changed his field in order to study reptile fossils"],"answer":2,"why":"Wegeners Kontinentaldrift wurde erst anerkannt, als der Mechanismus bekannt war.","skill":"main"},{"q":"What was the most serious objection to Wegener's idea?","options":["He had collected his evidence from only one continent.","His fossils turned out to belong to different animals.","He had no training in the study of the weather.","He could not explain what moves the continents."],"answer":3,"why":"„he could offer no convincing mechanism“.","skill":"detail"},{"q":"What did surveys of the sea floor reveal?","options":["New crust forms at ocean ridges and spreads outward.","Reptile fossils are also found under the Atlantic.","The continents plow slowly through the ocean floor.","The ocean floor is older than the continents."],"answer":0,"why":"Meeresbodenspreizung an den mittelozeanischen Rücken.","skill":"detail"},{"q":"What point does the speaker make at the end of the talk?","options":["Wegener would certainly have been believed if he had only lived a few more years, until the 1950s.","Evidence that something happens may not convince people without an explanation of how.","Scientists from outside a field usually turn out to be right in the end.","Theories should be accepted as soon as some supporting evidence exists."],"answer":1,"why":"„being right about what happens is not enough if you cannot explain how“.","skill":"infer"}]},{"id":"tk23","level":3,"voice":"W","title":"Language and Color","text":"Does the language you speak shape the way you see the world? A strong version of this idea, that language determines thought, has largely been abandoned. But a weaker version has gained experimental support, and color is the best-studied example. Languages divide the color spectrum differently. English has a single basic word, blue, covering shades from pale to dark. Russian, by contrast, has two separate basic terms: one for light blue and one for dark blue. Speakers must choose between them every time they mention the color. In one experiment, researchers showed Russian and English speakers three blue squares and asked which of the bottom two matched the top one. When the two candidate squares fell on opposite sides of the Russian boundary, Russian speakers answered faster. English speakers showed no such advantage. Here's the telling detail. When the Russian speakers had to silently repeat a string of numbers during the task, which keeps the language system busy, their advantage vanished. That suggests language wasn't changing what their eyes detected. Rather, it was offering a quick label that helped them decide. So the sensible conclusion is a modest one: language doesn't imprison thought, but it can nudge perception in measurable ways.","questions":[{"q":"What is the main idea of the talk?","options":["Speakers of different languages have different eyesight.","Experiments on color have so far failed to produce any clear results.","Language has a limited but measurable influence on perception.","Russian is better suited than English for describing colors."],"answer":2,"why":"Fazit: Sprache bestimmt das Denken nicht, kann die Wahrnehmung aber leicht beeinflussen.","skill":"main"},{"q":"According to the speaker, how does Russian differ from English?","options":["It has no word for dark colors.","It uses the same word for blue and green.","It names colors after objects.","It has two basic words for blue."],"answer":3,"why":"Je ein Grundwort für Hellblau und Dunkelblau.","skill":"detail"},{"q":"Why does the speaker mention that participants repeated numbers?","options":["To show that the advantage depended on language being available","To suggest that the task was too difficult for most of the people","To explain how the researchers measured reaction time","To prove that Russian speakers are better at arithmetic"],"answer":0,"why":"War das Sprachsystem beschäftigt, verschwand der Vorteil.","skill":"purpose"},{"q":"What is the speaker's view of the claim that language determines thought?","options":["It applies only to color.","It goes too far.","It has never been tested.","It is finally being proven."],"answer":1,"why":"„has largely been abandoned“; nur die schwache Version ist belegt.","skill":"attitude"}]},{"id":"tk24","level":3,"voice":"M","title":"Cane Toads in Australia","text":"Today's case study is a cautionary tale from Australia. In the 1930s, sugarcane farmers in Queensland were losing crops to beetles whose larvae feed on the roots of the cane. Pesticides of the day were ineffective, so in 1935 the government imported about a hundred cane toads from Hawaii, where they were believed to control similar pests. The scheme failed almost at once. The beetles lived high on the cane stalks, well out of reach of a toad that cannot climb, and the larvae were buried underground. Meanwhile the toads thrived. They breed rapidly, eat nearly anything, and, crucially, carry a poison in glands behind the head. Native predators such as snakes and large lizards had never encountered this poison and died after attacking them. With little to hold them back, the toads have spread across more than a million square kilometers and now number in the hundreds of millions. There are, admittedly, small signs of adaptation. Some snake populations appear to have evolved smaller mouths, which prevents them from swallowing the larger, more poisonous toads, and certain birds have learned to eat only the safe parts. Still, the broader lesson stands: introducing a species to solve a problem demands rigorous testing in advance, which in this case was almost entirely skipped.","questions":[{"q":"Why were cane /* Auswahl: wenig gesehene zuerst, passendes Level bevorzugt */
function pick(type,n,level,exclude){
  exclude=exclude||new Set();
  const all=pool(type).filter(x=>!exclude.has(x.id));
  const sec=TYPES[type].sec;
  const hold=x=>{const fo=FORM_OF[x.id];return fo==null?0:formDone(fo,sec)?2:60-fo*6};
  const score=x=>hold(x)+(S.seen[x.id]||0)*10+(level&&x.level!==level?5:0)+Math.random();
  const r=all.slice().sort((a,b)=>score(a)-score(b)).slice(0,n);
  r.forEach(x=>exclude.add(x.id));return r;
}

/* ---------- Session-Aufbau ---------- */
let view={name:"home"};

function setScreens(type,item){
  const T=TYPES[type],sec=T.sec;
  if(T.kind==="ctw")return [{t:"ctw",sec,type,item}];
  if(T.kind==="mcq")return item.questions.map((q,qi)=>({t:"mcq",sec,type,item,qi}));
  if(T.kind==="choose")return [{t:"choose",sec,type,item}];
  if(T.kind==="laudio")return [{t:"laudio",sec,type,item},...item.questions.map((q,qi)=>({t:"lq",sec,type,item,qi}))];
  if(T.kind==="bas")return [{t:"bas",sec,type,item}];
  if(T.kind==="repeat")return item.sentences.map((s,si)=>({t:"repeat",sec,type,item,si}));
  if(T.kind==="interview")return item.questions.map((q,qi)=>({t:"interview",sec,type,item,qi}));
  return [{t:T.kind,sec,type,item}];
}
const formScreens=ids=>ids.flatMap(id=>setScreens(TYPE_OF[id],ALLITEMS[id]));
function sectionParts(sec,fi){
  const F=FORMS[fi];
  if(sec==="reading")return [{name:"Reading",sec,limit:30*60,screens:formScreens(F.reading.m1),floor:0,adaptive:true,module:1,intro:true}];
  if(sec==="listening")return [{name:"Listening",sec,limit:29*60,screens:formScreens(F.listening.m1),floor:0,adaptive:true,module:1,noBack:true,intro:true}];
  if(sec==="writing")return [
    {name:"Build a Sentence",sec,limit:6*60,screens:formScreens(F.writing.bas),floor:0,intro:true},
    {name:"Write an Email",sec,limit:7*60,screens:formScreens([F.writing.email]),floor:0},
    {name:"Academic Discussion",sec,limit:10*60,screens:formScreens([F.writing.discussion]),floor:0}];
  if(sec==="speaking")return [
    {name:"Listen and Repeat",sec,limit:null,screens:formScreens([F.speaking.repeat]),floor:0,noBack:true,selfTimed:true,intro:true},
    {name:"Take an Interview",sec,limit:null,screens:formScreens([F.speaking.interview]),floor:0,noBack:true,selfTimed:true}];
}
function newSession(o){const s=Object.assign({answers:{},times:{},changes:{},p:0,i:0,started:Date.now()},o);s.used=s.parts.map(()=>0);return s}
function startSectionTest(sec,fi){

function startPractice(type){
  const T=TYPES[type];

  if(!items.length)return;

  SES=newSession({kind:"practice",type,section:T.sec,title:T.name,parts:[{name:T.name,sec:T.sec,limit,screens,floor:0,noBack:!!T.audio,selfTimed:T.kind==="repeat"||T.kind==="interview"}]});

/* Bildschirme für ausgewählte Fragen: bei Listening zuerst das Audio */
function screensFor(id,qis){
  const t=TYPE_OF[id],it=ALLITEMS[id];if(!it)return [];

}
function startCustom(title,screens,extra){

/* Schwächen-Training: Fragen eines Fragetyps, wenig gesehene zuerst */
function startSkillPractice(k){
  const [g,sk]=k.split(".");
  if(g==="w"){startPractice("ctw");return}
  if(g==="s"){startPractice("repeat");return}
  const types=g==="r"?["daily","academic"]:g==="l"?["conversation","announcement","talk"]:g==="c"?["choose"]:["bas"];
  const cand=[];
  types.forEach(t=>pool(t).forEach(it=>{
    const qis=it.questions?it.questions.map((q,i)=>q.skill===sk?i:-1).filter(i=>i>=0):(it.skill===sk?[0]:[]);
    if(qis.length)cand.push({it,t,qis})}));
  const sec=TYPES[types[0]].sec;
  const hold=x=>{const fo=FORM_OF[x.it.id];return fo==null?0:formDone(fo,sec)?2:60-fo*6};
  cand.sort((a,b)=>(hold(a)+(S.seen[a.it.id]||0)*10+Math.random())-(hold(b)+(S.seen[b.it.id]||0)*10+Math.random()));
  const screens=[];let n=0;const max=g==="l"?6:8;
  for(const c of cand){if(n>=max)break;screens.push(...screensFor(c.it.id,c.it.questions?c.qis:null));n+=c.qis.length}
  startCustom("Training: "+skillName(k),screens,{skill:k});
}
/* Fehlerheft: früher falsch beantwortete Fragen erneut */
function wrongKeys(){return Object.keys(S.wrong||{}).filter(k=>ALLITEMS[k.split("#")[0]]).sort((a,b)=>(S.wrong[a].d||0)-(S.wrong[b].d||0))}
function startRedo(keys){
  keys=(keys||wrongKeys()).slice(0,12);const by={};
  keys.forEach(k=>{const [id,qi]=k.split("#");(by[id]=by[id]||[]).push(qi==null?null:+qi)});
  const screens=Object.keys(by).flatMap(id=>screensFor(id,by[id][0]==null?null:by[id]));

/* ---------- Bewertung von Antworten ---------- */
const ctwGaps=text=>{const g=[];text.replace(/([A-Za-z’'-]*)\{([^}]+)\}/g,(m,a,b)=>{g.push({shown:a,missing:b})});return g};
const norm=s=>String(s).toLowerCase().replace(/[’]/g,"'").replace(/\s+/g," ").trim();
const STOP=new Set("a an the to of in on at for and or but is are was were be been it its this that these those you your we our they their he she his her i my me us them with by from as if so do does did have has had not no".split(" "));
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","let's":"let us","don't":"do not","doesn't":"does not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","i'll":"i will","you'll":"you will","there's":"there is","what's":"what is","i've":"i have","we've":"we have","shouldn't":"should not","wouldn't":"would not"};
const toks=s=>String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(" "));
function tokLev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* Listen and Repeat: Abgleich nach ETS-Rubric (5 exakt … 0 leer) */
function repeatScore(target,said){
  const t=toks(target),s=toks(said);if(!s.length)return 0;
  const d=tokLev(t,s);if(d===0)return 5;
  const ratio=d/t.length;const content=t.filter(w=>!STOP.has(w));const missC=content.filter(w=>!s.includes(w)).length;
  if(missC===0&&ratio<=.25)return 4;
  if(missC<=Math.max(1,Math.round(content.length*.25))&&ratio<=.5)return 3;
  const overlap=t.filter(w=>s.includes(w)).length/t.length;
  if(overlap>=.35)return 2;
  return overlap>0?1:0;
}
function scoreScreen(sc,ans){
  if(sc.t==="ctw"){const gaps=ctwGaps(sc.item.text);const a=ans[sc.item.id]||[];
    const r=gaps.map((g,i)=>((a[i]||"").trim().toLowerCase().replace(/’/g,"'")===g.missing.toLowerCase().replace(/’/g,"'")));
    return {right:r.filter(Boolean).length,total:gaps.length,detail:r};}
  if(sc.t==="mcq"||sc.t==="lq"){const a=ans[sc.item.id+"#"+sc.qi];return {right:a===sc.item.questions[sc.qi].answer?1:0,total:1}}
  if(sc.t==="choose"){return {right:ans[sc.item.id]===sc.item.answer?1:0,total:1}}
  if(sc.t==="bas"){const a=ans[sc.item.id]||[];const built=a.map(i=>sc.item.chunks[i]).join(" ");
    const ok=a.length===sc.item.chunks.length&&a.every(x=>x!=null)&&norm(built)===norm(sc.item.chunks.join(" "));return {right:ok?1:0,total:1}}
  if(sc.t==="repeat"){return {right:repeatScore(sc.item.sentences[sc.si],ans[sc.item.id+"#"+sc.si]||""),total:5}}
  return {right:0,total:0};
}
function tally(screens,answers,filter){let r=0,t=0;screens.filter(x=>!filter||filter(x)).forEach(sc=>{const x=scoreScreen(sc,answers);r+=x.right;t+=x.total});return {right:r,total:t}}

/* Band-Schätzung (Annahmen, siehe CLAUDE.md) */
function adaptiveBand(pct,route){
  if(route==="hard"){if(pct>=.94)return 6;if(pct>=.86)return 5.5;if(pct>=.76)return 5;if(pct>=.66)return 4.5;if(pct>=.56)return 4;return 3.5}
  if(pct>=.9)return 4.5;if(pct>=.78)return 4;if(pct>=.64)return 3.5;if(pct>=.5)return 3;if(pct>=.36)return 2.5;if(pct>=.24)return 2;if(pct>=.12)return 1.5;return 1;
}
const table=(raw,t)=>{for(const [m,b] of t)if(raw>=m)return b;return 1};
const writingBand=raw=>table(raw,[[20,6],[18,5.5],[16,5],[14,4.5],[12,4],[10,3.5],[8,3],[6,2.5],[4,2],[2,1.5]]);
const speakingBand=raw=>table(raw,[[52,6],[47,5.5],[42,5],[37,4.5],[32,4],[27,3.5],[22,3],[17,2.5],[12,2],[6,1.5]]);
const roundHalf=x=>Math.round(x*2)/2;
const fmtBand=b=>b==null?"–":(Number.isInteger(b)?b+".0":String(b)).replace(".",",");

function bandSeries(sec){return S.history.filter(h=>h.kind!=="practice"&&h.sections&&h.sections[sec]&&h.sections[sec].band!=null).map(h=>h.sections[sec].band).slice(-8)}
function spark(vals){
  const W=150,H=40,pad=4,x=i=>vals.length<2?W/2:pad+i*(W-2*pad)/(vals.length-1),y=v=>H-pad-(v-1)/5*(H-2*pad);
  const pts=vals.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${y(5.5)}" y2="${y(5.5)}" stroke="var(--mark)" stroke-dasharray="3 3" stroke-width="1"/>${vals.length>1?`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`:""}${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?3:2}" fill="var(--accent)"/>`).join("")}</svg>`;
}

}

function openCount(p){

function next(){

function startModule2(p){
  const m1=tally(p.screens,SES.answers);p.m1=m1.right;p.m1max=m1.total;
  p.route=m1.total&&m1.right/m1.total>=.7?"hard":"easy";

function endPart(timeout){
  if(timeout)toast(tx("Time is up for this part.","Die Zeit für diesen Teil ist abgelaufen."));

  if(timeout)p.limitWas=p.limit,p.limit=null;
  if(p.adaptive&&p.module===1){/* Zeit in Modul 1 abgelaufen: Modul 2 entfällt */const m1=tally(p.screens,SES.answers);p.m1=m1.right;p.m1max=m1.total;p.route=p.route||"easy"}
  if(SES.p<SES.parts.length-1){SES.p++;SES.i=0;renderRunner();window.scrollTo(0,0);return}

function sectionSummary(sec,screens,answers,ap){
  const r=tally(screens,answers);
  if(sec==="reading"||sec==="listening"){const route=ap&&ap.route||null;
    return {raw:r.right,max:r.total,route,m1:ap?ap.m1:null,m1max:ap?ap.m1max:null,band:r.total?adaptiveBand(r.right/r.total,route||"easy"):null}}
  if(sec==="writing"){const bas=tally(screens,answers,x=>x.t==="bas");return {raw:null,max:20,bas:bas.right,band:null}}
  if(sec==="speaking"){const rp=tally(screens,answers,x=>x.t==="repeat");return {raw:null,max:55,repeat:rp.right,band:null}}
}
function finish(){
  const s=SES;const all=s.parts.flatMap(p=>p.screens);
  all.forEach(sc=>markSeen(sc.item.id));
  /* Statistik je Aufgabentyp (Interview/Email/Discussion ohne Punkte) */
  const by={};all.forEach(sc=>{const t=typeOf(sc);const x=scoreScreen(sc,s.answers);if(!x.total)return;(by[t]=by[t]||{r:0,t:0,ids:new Set()});by[t].r+=x.right;by[t].t+=x.total;by[t].ids.add(sc.item.id)});
  Object.keys(by).forEach(t=>{const st=S.stats[t]||(S.stats[t]={right:0,total:0,sets:0});st.right+=by[t].r;st.total+=by[t].t;st.sets+=by[t].ids.size});
  /* Fehlerprofil je Fragetyp und Fehlerheft */
  S.skills=S.skills||{};S.wrong=S.wrong||{};
  all.forEach(sc=>{
    skillParts(sc,s.answers).forEach(x=>{const k=S.skills[x.k]||(S.skills[x.k]={r:0,t:0});k.r+=x.r;k.t+=x.t});
    if(isBinary(sc)){const key=scKey(sc),ok=scoreScreen(sc,s.answers).right===1;
      if(ok)delete S.wrong[key];else S.wrong[key]={n:((S.wrong[key]||{}).n||0)+1,d:Date.now()}}});
  const secs={};
  [...new Set(s.parts.map(p=>p.sec))].forEach(sec=>{const ps=s.parts.filter(p=>p.sec===sec);if(s.kind==="practice"&&!s.type)return;secs[sec]=sectionSummary(sec,ps.flatMap(p=>p.screens),s.answers,ps.find(p=>p.adaptive))});
  const entry={id:"h"+Date.now(),date:today(),kind:s.kind,section:s.section,type:s.type||null,form:s.form!=null?s.form+1:null,skill:s.skill||null,redo:!!s.redo,
    title:s.kind==="practice"?(s.type?"Training: ":"")+s.title:s.title,
    screens:all.map(sc=>({t:sc.t,type:sc.type,sec:sc.sec,id:sc.item.id,qi:sc.qi,si:sc.si})),answers:s.answers,times:s.times,changes:s.changes,
    parts:s.parts.map((p,i)=>({name:p.name,sec:p.sec,used:s.used[i],limit:p.limit||p.limitWas||null})),evals:{},sections:secs,band:null};

}
function updateBands(e){
  const secs=e.sections||{};
  if(secs.writing){const w=secs.writing;if(e.evals.email&&e.evals.discussion){w.raw=w.bas+e.evals.email.score+e.evals.discussion.score;w.band=writingBand(w.raw)}}
  if(secs.speaking){const sp=secs.speaking;if(e.evals.interview&&Array.isArray(e.evals.interview.scores)){const iv=e.evals.interview.scores.reduce((a,b)=>a+(+b||0),0);sp.raw=sp.repeat+iv;sp.band=speakingBand(sp.raw)}}
  if(e.kind==="full"){const bs=SEC_ORDER.map(k=>secs[k]&&secs[k].band);e.band=bs.every(b=>b!=null)?roundHalf(bs.reduce((a,b)=>a+b,0)/4):null}
  else if(e.kind==="test"){e.band=(secs[e.section]||{}).band??null}

    return `<span class="gap">${shown}<input data-g="${i}" maxlength="${n}" style="width:calc(${n}*1.32ch + 8px)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke ${i+1}, ${n} Buchstaben" value="${esc(a[i]||"")}"></span>`});

/* ---------- Bildschirm: Multiple Choice (Reading-Text oder Listening-Frage) ---------- */
function docHtml(it){
  const lines=String(it.text).split("\n");
  if(it.genre==="chat"){return `<div class="chat">${lines.filter(Boolean).map(l=>{const m=l.match(/^([^:]{1,24}):\s*(.*)$/);const who=m?m[1]:"",tx=m?m[2]:l;
    return `<div class="bubble ${who&&it.me===who?"me":""}"><small>${esc(who)}</small>${esc(tx)}</div>`}).join("")}</div>`}
  let out="",head=[],rows=[];
  const flushRows=()=>{if(rows.length){out+=`<div class="tw"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;rows=[]}};
  lines.forEach(l=>{
    const hm=l.match(/^(From|To|Subject|Date|Sent):\s*(.*)$/);
    if(hm){head.push(hm);return}
    if(head.length){out+=`<div class="mailhead">${head.map(x=>`<span>${x[1]}:</span><b>${esc(x[2])}</b>`).join("")}</div>`;head=[]}
    if(l.includes(" | ")){rows.push(l.split(" | "));return}
    flushRows();
    if(l.startsWith("# ")){out+=`<div class="dtitle">${esc(l.slice(2))}</div>`;return}
    if(l.trim())out+=`<p>${esc(l)}</p>`;
  });
  flushRows();
  return out;
}
function transcriptOf(sc){
  const it=sc.item;
  if(sc.type==="conversation")return it.lines.map(l=>(l.who==="W"?"Woman: ":"Man: ")+l.text).join("\n");
  if(sc.type==="choose")return it.prompt;
  return it.text;
}
function audioParts(sc){
  const it=sc.item;
  if(sc.type==="conversation")return it.lines.map(l=>({text:l.text,g:l.who}));
  if(sc.type==="choose")return [{text:it.prompt,g:it.voice||"W"}];

      <div class="direction">${DIRECTIONS.bas}</div>

        <div class="bank">${order.map(ci=>`<button class="chip ${a.includes(ci)?"used":""}" data-chunk="${ci}">${esc(it.chunks[ci])}</button>`).join("")}</div>
        <div class="btns" style="margin-top:14px"><button class="btn ghost small" id="bas-reset">${tx("Reset","Zurücksetzen")}</button></div>
      </div></div></div></div>`;
    $$("[data-chunk]").forEach(b=>b.onclick=()=>{const ci=+b.dataset.chunk;if(a.includes(ci))return;const slot=[...Array(it.chunks.length).keys()].find(i=>a[i]==null);if(slot==null)return;a[slot]=ci;draw()});
    $$("[data-slot]").forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;a[i]=null;while(a.length&&a[a.length-1]==null)a.pop();draw()});

function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=beep.c||(beep.c=new C());const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
function answerBox(key,seconds,label,onDone){
  const box=$("#resp");
  box.innerHTML=`<div class="row"><div class="label">${esc(label)}</div><span class="timer" id="rt">${fmt(seconds)}</span></div>
    <textarea class="write" id="say" style="min-height:120px" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="${canRecognize?tx("Speak now.","Sprich jetzt – dein Text erscheint hier."):"Tippe auf das Mikrofon deiner Tastatur und sprich, oder tippe, was du gesagt hast."}">${esc(SES.answers[key]||"")}</textarea>
    <p class="muted small" style="margin:0">${canRecognize?tx("Recording …","Spracherkennung läuft."):"Diktierfunktion: auf dem Handy das Mikrofon-Symbol der Tastatur, am Mac zweimal die Fn-Taste, unter Windows Win + H."}</p>`;
  const ta=$("#say");ta.oninput=()=>{SES.answers[key]=ta.value};ta.focus();beep();
  const rec=startRecognition(txt=>{ta.value=txt;SES.answers[key]=txt});
  let left=seconds;const grace=rec?2:8;
  const t=setInterval(()=>{
    if(!document.body.contains(ta)){clearInterval(t);stopRecognition();return}
    left--;const rt=$("#rt");
    if(left>0){rt.textContent=fmt(left);rt.classList.toggle("low",left<=5)}
    else if(left>-grace){rt.textContent=tx("Saving …","Eingabe abschließen …");rt.classList.add("low");stopRecognition()}
    else{clearInterval(t);stopRecognition();ta.disabled=true;SES.answers[key]=ta.value;rt.textContent=tx("Time is up","Zeit vorbei");onDone&&onDone()}
  },1000/(window.__TT_SPEED||1));
}
